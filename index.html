    const playNekoSound = (type = 'click') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === 'split') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.09);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'success') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.setValueAtTime(680, now + 0.08);
          osc.frequency.setValueAtTime(980, now + 0.16);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(900, now);
          osc.frequency.exponentialRampToValueAtTime(350, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        }
      } catch (e) {}
    };

      const m = Math.floor(s / 60);

    const getExactVideoDuration = (videoUrl) => {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.src = videoUrl;
        v.onloadedmetadata = () => resolve(v.duration && !isNaN(v.duration) && v.duration !== Infinity ? v.duration : 15);
        v.onerror = () => resolve(15);
        setTimeout(() => resolve(15), 3000);
      });
    };

          isScoreClip: false // Khởi tạo bình thường, không phải MatrixAuto
        };

        setProjectTitle(newName.replace(/\.[^/.]+$/, ""));
        setVideoClips([newClip]);
        setActiveClipId(newClip.id);
        activeClipIdRef.current = newClip.id;
        setCurrentTime(0);
        currentTimeRef.current = 0;
        setSubtitles([]);
        setAudioClips([]);
        previewZoomRef.current = 1.0;
        previewPanRef.current = { x: 0, y: 0 };
        setCurrentPage('editor');

        const vid = hiddenVideoRef.current;
        if (vid) {
          vid.pause();
          vid.src = newUrl;
          vid.load();
        }
        const vid2 = hiddenVideoRef2.current;
        if (vid2) {
          vid2.pause();
          vid2.src = newUrl;
          vid2.load();
        }

        if (timelineScrollRef.current) timelineScrollRef.current.scrollLeft = 0;
        showToast(`Đã mở dự án: ${newDur.toFixed(1)}s`);
      };

      const handleBackToHome = () => {
        pauseVideo();
        playNekoSound('click');
        setCurrentPage('home');
        showToast('Đã trở về sảnh chính Neko');
      };

      const totalDuration = useMemo(() => {
        const sum = videoClips.reduce((acc, c) => acc + (c.duration / (c.speed || 1.0)), 0);
        return Math.max(1, sum);
      }, [videoClips]);

      const activeClip = useMemo(() => {
        return videoClips.find((c) => c.id === activeClipId) || videoClips[0] || null;
      }, [videoClips, activeClipId]);

      const activeSub = useMemo(() => {
        return subtitles.find((s) => s.id === activeSubId) || null;
      }, [subtitles, activeSubId]);

      const getCurrentClipInfo = useCallback(
        (time) => {
          let acc = 0;
          for (let i = 0; i < videoClips.length; i++) {
            const c = videoClips[i];
            const spd = c.speed || 1.0;
            const effectiveDur = c.duration / spd;

            if (time >= acc && time < acc + effectiveDur) {
              const timelineOffset = time - acc;
              const sourceOffset = timelineOffset * spd;

              let prevClipData = null;
              const transDur = c.transitionDuration || 0.45;

              if (i > 0 && timelineOffset < transDur && c.transition !== 'none') {
                const prevC = videoClips[i - 1];
                const prevSpd = prevC.speed || 1.0;
                const prevEffDur = prevC.duration / prevSpd;
                const prevTimelineOffset = Math.max(0, prevEffDur - (transDur - timelineOffset));
                prevClipData = {
                  clip: prevC,
                  clipIndex: i - 1,
                  mediaSourceTime: prevC.trimStart + (prevTimelineOffset * prevSpd),
                  speed: prevSpd
                };
              }

              return {
                clip: c,
                clipIndex: i,
                clipStartTime: acc,
                clipOffsetTime: timelineOffset,
                effectiveDuration: effectiveDur,
                mediaSourceTime: c.trimStart + sourceOffset,
                prevClipData
              };
            }
            acc += effectiveDur;
          }

          if (videoClips.length > 0) {
            const last = videoClips[videoClips.length - 1];
            const spd = last.speed || 1.0;
            const effDur = last.duration / spd;
            const lastStart = Math.max(0, acc - effDur);
            const timelineOffset = Math.min(effDur, Math.max(0, time - lastStart));
            return {
              clip: last,
              clipIndex: videoClips.length - 1,
              clipStartTime: lastStart,
              clipOffsetTime: timelineOffset,
              effectiveDuration: effDur,
              mediaSourceTime: last.trimStart + (timelineOffset * spd),
              prevClipData: null
            };
          }
          return null;
        },
        [videoClips]
      );

      const getDrawDimensions = (vidEl, targetW, targetH, currentFitMode, zoom = 1, pan = { x: 0, y: 0 }) => {
        if (!vidEl || !vidEl.videoWidth) return { x: 0, y: 0, w: targetW, h: targetH };
        const sFactor = currentFitMode === 'cover'
          ? Math.max(targetW / vidEl.videoWidth, targetH / vidEl.videoHeight)
          : Math.min(targetW / vidEl.videoWidth, targetH / vidEl.videoHeight);

        const drawW = vidEl.videoWidth * sFactor * zoom;
        const drawH = vidEl.videoHeight * sFactor * zoom;
        const drawX = ((targetW - drawW) / 2) + pan.x;
        const drawY = ((targetH - drawH) / 2) + pan.y;
        return { x: drawX, y: drawY, w: drawW, h: drawH };
      };

      const drawFrameToContext = useCallback(
        (ctx, targetW, targetH, time) => {
          const vid = hiddenVideoRef.current;
          const vid2 = hiddenVideoRef2.current;
          const clipInfo = getCurrentClipInfo(time);

          ctx.fillStyle = '#050508';
          ctx.fillRect(0, 0, targetW, targetH);

          if (!clipInfo || !vid || vid.readyState < 2) return;

          const { clip, clipOffsetTime, effectiveDuration, prevClipData } = clipInfo;
          const transDur = clip.transitionDuration || 0.45;
          const inDur = clip.animInDur || 0.5;
          const outDur = clip.animOutDur || 0.5;
          const timeLeft = Math.max(0, effectiveDuration - clipOffsetTime);

          const isTransitioning = prevClipData && clipOffsetTime < transDur && clip.transition !== 'none';
          const rawProgress = isTransitioning ? Math.max(0, Math.min(1, clipOffsetTime / transDur)) : 1;
          const easeProgress = easeInOutCubic(rawProgress);

          const zoom = previewZoomRef.current || 1.0;
          const pan = previewPanRef.current || { x: 0, y: 0 };
          const panScaleX = targetW / (selectedRatio.w || 1);
          const panScaleY = targetH / (selectedRatio.h || 1);
          const basePan = { x: pan.x * panScaleX, y: pan.y * panScaleY };

          // 1. Layer Clip Liền Trước
          if (isTransitioning && vid2 && vid2.readyState >= 2) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, targetW, targetH);
            ctx.clip();

            let prevAlpha = 1.0;
            let prevScale = 1.0;
            let prevTransX = 0;
            let prevTransY = 0;

            if (clip.transition === 'fade') {
              prevAlpha = 1.0 - easeProgress;
            } else if (clip.transition === 'zoom') {
              prevScale = 1.0 + easeProgress * 0.35;
              prevAlpha = 1.0 - easeProgress;
            } else if (clip.transition === 'slide') {
              prevTransX = -easeProgress * targetW;
            } else if (clip.transition === 'slide_up') {
              prevTransY = -easeProgress * targetH;
            } else if (clip.transition === 'black_fade') {
              prevAlpha = rawProgress < 0.5 ? (1.0 - rawProgress * 2) : 0;
            }

            ctx.globalAlpha = Math.max(0, Math.min(1, prevAlpha));
            const filterPrev = FILTERS.find((f) => f.id === prevClipData.clip.colorFilter) || FILTERS[0];
            ctx.filter = (filterPrev && filterPrev.css && filterPrev.css !== 'none') ? filterPrev.css : 'none';

            const dimsPrev = getDrawDimensions(
              vid2,
              targetW,
              targetH,
              fitMode,
              zoom * prevScale,
              { x: basePan.x + prevTransX, y: basePan.y + prevTransY }
            );
            ctx.drawImage(vid2, dimsPrev.x, dimsPrev.y, dimsPrev.w, dimsPrev.h);
            ctx.restore();
          }

          // 2. Layer Clip Hiện Tại
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, targetW, targetH);
          ctx.clip();

          const filterDef = FILTERS.find((f) => f.id === clip.colorFilter) || FILTERS[0];
          ctx.filter = (filterDef && filterDef.css && filterDef.css !== 'none') ? filterDef.css : 'none';

          let curAlpha = 1.0;
          let curScale = 1.0;
          let curTransX = 0;
          let curTransY = 0;

          if (isTransitioning) {
            if (clip.transition === 'fade') {
              curAlpha = easeProgress;
            } else if (clip.transition === 'zoom') {
              curScale = 0.7 + easeProgress * 0.3;
              curAlpha = easeProgress;
            } else if (clip.transition === 'slide') {
              curTransX = (1.0 - easeProgress) * targetW;
            } else if (clip.transition === 'slide_up') {
              curTransY = (1.0 - easeProgress) * targetH;
            } else if (clip.transition === 'black_fade') {
              curAlpha = rawProgress < 0.5 ? 0 : (rawProgress - 0.5) * 2;
            } else if (clip.transition === 'glitch') {
              curTransX = (Math.random() - 0.5) * 22 * (1.0 - easeProgress);
              curTransY = (Math.random() - 0.5) * 14 * (1.0 - easeProgress);
            }
          }

          if (!isTransitioning && clip.animIn && clip.animIn !== 'none' && clipOffsetTime < inDur) {
            const pIn = easeInOutCubic(clipOffsetTime / inDur);
            if (clip.animIn === 'fade_in') curAlpha = Math.min(curAlpha, pIn);
            else if (clip.animIn === 'zoom_in') curScale *= (0.4 + pIn * 0.6);
            else if (clip.animIn === 'slide_in_left') curTransX -= (1.0 - pIn) * targetW * 0.6;
            else if (clip.animIn === 'slide_in_right') curTransX += (1.0 - pIn) * targetW * 0.6;
            else if (clip.animIn === 'slide_in_up') curTransY += (1.0 - pIn) * targetH * 0.6;
          }

          if (clip.animOut && clip.animOut !== 'none' && timeLeft < outDur) {
            const pOut = easeInOutCubic(timeLeft / outDur);
            if (clip.animOut === 'fade_out') curAlpha = Math.min(curAlpha, pOut);
            else if (clip.animOut === 'zoom_out') curScale *= (0.4 + pOut * 0.6);
            else if (clip.animOut === 'slide_out_left') curTransX -= (1.0 - pOut) * targetW * 0.6;
            else if (clip.animOut === 'slide_out_right') curTransX += (1.0 - pOut) * targetW * 0.6;
            else if (clip.animOut === 'slide_out_down') curTransY += (1.0 - pOut) * targetH * 0.6;
            else if (clip.animOut === 'black_out') curAlpha = Math.min(curAlpha, pOut);
          }

          ctx.globalAlpha = Math.max(0, Math.min(1, curAlpha));
          const dimsCur = getDrawDimensions(
            vid,
            targetW,
            targetH,
            fitMode,
            zoom * curScale,
            { x: basePan.x + curTransX, y: basePan.y + curTransY }
          );
          ctx.drawImage(vid, dimsCur.x, dimsCur.y, dimsCur.w, dimsCur.h);

          if (isTransitioning && clip.transition === 'flash') {
            ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 1.0 - rawProgress * 1.5)})`;
            ctx.fillRect(0, 0, targetW, targetH);
          }
          if (clip.animIn === 'flash_in' && !isTransitioning && clipOffsetTime < inDur) {
            ctx.fillStyle = `rgba(255,255,255,${Math.max(0, (1.0 - clipOffsetTime / inDur) * 0.85)})`;
            ctx.fillRect(0, 0, targetW, targetH);
          }

          ctx.restore();

          // 3. Phụ đề & Chữ
          textBoxesRef.current.clear();

          subtitles.forEach((sub) => {
            if (time >= sub.start && time <= sub.end) {
              ctx.save();
              const tmpl = TEXT_TEMPLATES.find((t) => t.id === sub.templateId) || TEXT_TEMPLATES[0];
              const fFamily = tmpl.font || 'Montserrat';
              const fSize = sub.fontSize || Math.round(targetW * 0.045);
              ctx.font = `bold ${fSize}px '${fFamily}', sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';

              const subX = (sub.x !== undefined ? sub.x : 0.5) * targetW;
              const subY = (sub.y !== undefined ? sub.y : 0.82) * targetH;

              let textToDraw = sub.text;
              let scaleX = 1.0;
              let scaleY = 1.0;
              let textAlpha = 1.0;
              let offsetX = 0;
              let offsetY = 0;

              const elapsedInSub = time - sub.start;
              const animType = sub.anim || 'none';

              if (animType === 'bounce') {
                if (elapsedInSub < 0.4) {
                  const p = elapsedInSub / 0.4;
                  const bounceVal = Math.sin(p * Math.PI) * 0.35 + (0.5 + p * 0.5);
                  scaleX = bounceVal;
                  scaleY = bounceVal;
                }
              } else if (animType === 'typewriter') {
                const chars = Math.floor(elapsedInSub * 14);
                textToDraw = sub.text.substring(0, Math.max(1, chars));
              } else if (animType === 'fade_up') {
                if (elapsedInSub < 0.35) {
                  const p = elapsedInSub / 0.35;
                  textAlpha = p;
                  offsetY = (1.0 - p) * 20;
                }
              } else if (animType === 'glitch') {
                offsetX = (Math.random() - 0.5) * 6;
                offsetY = (Math.random() - 0.5) * 4;
              }

              const pX = subX + offsetX;
              const pY = subY + offsetY;

              ctx.translate(pX, pY);
              ctx.scale(scaleX, scaleY);
              ctx.globalAlpha = textAlpha;

              const metrics = ctx.measureText(textToDraw);
              const textW = metrics.width;
              const boxW = textW + 28;
              const boxH = fSize * 1.55;

              textBoxesRef.current.set(sub.id, {
                subId: sub.id,
                x: pX - boxW / 2,
                y: pY - boxH / 2,
                w: boxW,
                h: boxH
              });

              if (tmpl.isBox) {
                ctx.fillStyle = tmpl.boxBg || 'rgba(0, 0, 0, 0.75)';
                ctx.beginPath();
                ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 8);
                ctx.fill();
              }

              if (tmpl.shadow) {
                ctx.shadowColor = tmpl.shadow;
                ctx.shadowBlur = 12;
              }

              const strokeColor = sub.stroke || tmpl.stroke;
              const strokeW = sub.strokeWidth !== undefined ? sub.strokeWidth : tmpl.strokeWidth;
              if (strokeW && strokeColor) {
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = strokeW;
                ctx.strokeText(textToDraw, 0, 0);
              }

              ctx.fillStyle = sub.color || tmpl.color || '#ff2a7a';
              ctx.fillText(textToDraw, 0, 0);

              if (activeSubId === sub.id) {
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ff2a7a';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([6, 4]);
                ctx.strokeRect(-boxW / 2 - 6, -boxH / 2 - 6, boxW + 12, boxH + 12);
                ctx.setLineDash([]);

                ctx.fillStyle = '#ff2a7a';
                ctx.beginPath();
                ctx.arc(boxW / 2 + 6, -boxH / 2 - 6, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9px Arial';
                ctx.fillText('✕', boxW / 2 + 6, -boxH / 2 - 6);
              }

              ctx.restore();
            }
          });
        },
        [getCurrentClipInfo, subtitles, fitMode, selectedRatio, activeSubId]
      );

      const renderCanvasFrame = useCallback(
        (time) => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d', { alpha: false });
          if (!ctx) return;
          drawFrameToContext(ctx, canvas.width, canvas.height, time);
        },
        [drawFrameToContext]
      );

      const seekTo = useCallback(
        (targetTime, forceRender = false) => {
          const clamped = Math.max(0, Math.min(totalDuration, targetTime));
          currentTimeRef.current = clamped;
          setCurrentTime(clamped);

          const info = getCurrentClipInfo(clamped);
          const vid = hiddenVideoRef.current;
          const vid2 = hiddenVideoRef2.current;

          if (info && vid) {
            activeClipIdRef.current = info.clip.id;
            setActiveClipId(info.clip.id);

            if (vid.src !== info.clip.url) {
              vid.src = info.clip.url;
              vid.load();
            }
            vid.playbackRate = info.clip.speed || 1.0;
            vid.volume = isMuted ? 0 : (info.clip.volume ?? 1.0);

            if (info.prevClipData && vid2) {
              if (vid2.src !== info.prevClipData.clip.url) {
                vid2.src = info.prevClipData.clip.url;
                vid2.load();
              }
              if (Math.abs(vid2.currentTime - info.prevClipData.mediaSourceTime) > 0.08) {
                vid2.currentTime = info.prevClipData.mediaSourceTime;
              }
            }

            if (Math.abs(vid.currentTime - info.mediaSourceTime) > 0.04 || forceRender) {
              vid.currentTime = info.mediaSourceTime;
              const onSeek = () => {
                renderCanvasFrame(clamped);
                vid.removeEventListener('seeked', onSeek);
              };
              vid.addEventListener('seeked', onSeek);
              renderCanvasFrame(clamped);
            } else {
              renderCanvasFrame(clamped);
            }
          } else {
            renderCanvasFrame(clamped);
          }
        },
        [totalDuration, getCurrentClipInfo, renderCanvasFrame, isMuted]
      );

      const playVideo = () => {
        if (videoClips.length === 0) return;
        playNekoSound('click');
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;

        if (currentTimeRef.current >= totalDuration - 0.08) {
          seekTo(0, true);
        }

        const info = getCurrentClipInfo(currentTimeRef.current);
        if (info && vid) {
          if (vid.src !== info.clip.url) {
            vid.src = info.clip.url;
            vid.load();
          }
          vid.playbackRate = info.clip.speed || 1.0;
          vid.currentTime = info.mediaSourceTime;
          vid.volume = isMuted ? 0 : (info.clip.volume ?? 1.0);
          vid.play().catch(() => {});
        }

        if (bgm && audioClips.length > 0) {
          bgm.play().catch(() => {});
        }

        vid2SyncLockRef.current = { isSynced: false, targetClipId: null };
        isPlayingRef.current = true;
        setIsPlaying(true);
      };

      const pauseVideo = () => {
        isPlayingRef.current = false;
        setIsPlaying(false);
        if (hiddenVideoRef.current) hiddenVideoRef.current.pause();
        if (hiddenVideoRef2.current) hiddenVideoRef2.current.pause();
        if (bgmAudioRef.current) bgmAudioRef.current.pause();
      };

      const togglePlay = () => {
        if (isPlayingRef.current) pauseVideo();
        else playVideo();
      };

      useEffect(() => {
        if (currentPage !== 'editor') return;

        const loop = (now) => {
          if (isPlayingRef.current) {
            const vid = hiddenVideoRef.current;
            const vid2 = hiddenVideoRef2.current;
            const currentClipId = activeClipIdRef.current;
            const curIdx = videoClips.findIndex((c) => c.id === currentClipId);
            const activeIdx = curIdx >= 0 ? curIdx : 0;
            const curClip = videoClips[activeIdx];

            if (vid && curClip) {
              const spd = curClip.speed || 1.0;
              const clipSourceEnd = curClip.trimStart + curClip.duration;
              const curSourceTime = vid.currentTime;

              if (curSourceTime >= clipSourceEnd - 0.03) {
                if (activeIdx < videoClips.length - 1) {
                  const nextClip = videoClips[activeIdx + 1];
                  const nextSpd = nextClip.speed || 1.0;

                  activeClipIdRef.current = nextClip.id;
                  setActiveClipId(nextClip.id);

                  if (vid.src !== nextClip.url) {
                    vid.src = nextClip.url;
                    vid.load();
                  }
                  vid.playbackRate = nextSpd;
                  vid.currentTime = nextClip.trimStart;
                  vid.play().catch(() => {});
                  vid2SyncLockRef.current = { isSynced: false, targetClipId: null };
                } else {
                  pauseVideo();
                  seekTo(totalDuration, true);
                }
              } else {
                let clipStartTime = 0;
                for (let i = 0; i < activeIdx; i++) {
                  clipStartTime += videoClips[i].duration / (videoClips[i].speed || 1.0);
                }

                const elapsedSourceInClip = Math.max(0, curSourceTime - curClip.trimStart);
                const exactTimelineTime = Math.min(totalDuration, clipStartTime + elapsedSourceInClip / spd);

                currentTimeRef.current = exactTimelineTime;

                const info = getCurrentClipInfo(exactTimelineTime);
                if (info && info.prevClipData && vid2) {
                  if (vid2.src !== info.prevClipData.clip.url) {
                    vid2.src = info.prevClipData.clip.url;
                    vid2.load();
                  }
                  
                  if (!vid2SyncLockRef.current.isSynced || vid2SyncLockRef.current.targetClipId !== info.prevClipData.clip.id) {
                    vid2.playbackRate = info.prevClipData.speed || 1.0;
                    vid2.currentTime = info.prevClipData.mediaSourceTime;
                    vid2.play().catch(() => {});
                    vid2SyncLockRef.current = { isSynced: true, targetClipId: info.prevClipData.clip.id };
                  } else {
                    if (Math.abs(vid2.currentTime - info.prevClipData.mediaSourceTime) > 0.25) {
                      vid2.currentTime = info.prevClipData.mediaSourceTime;
                    }
                  }
                } else {
                  if (vid2 && !vid2.paused) {
                    vid2.pause();
                  }
                  vid2SyncLockRef.current = { isSynced: false, targetClipId: null };
                }

                if (timelineScrollRef.current) {
                  isSystemScrolling.current = true;
                  timelineScrollRef.current.scrollLeft = exactTimelineTime * timelineZoom;
                  isSystemScrolling.current = false;
                }

                if (now - lastUiUpdateRef.current > 35) {
                  setCurrentTime(exactTimelineTime);
                  lastUiUpdateRef.current = now;
                }
                renderCanvasFrame(exactTimelineTime);
              }
            } else {
              pauseVideo();
            }
          }
          animationFrameRef.current = requestAnimationFrame(loop);
        };

        animationFrameRef.current = requestAnimationFrame(loop);
        return () => {
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };
      }, [currentPage, videoClips, totalDuration, timelineZoom, renderCanvasFrame, seekTo, getCurrentClipInfo]);

      // Tương tác chạm & kéo thả chữ
      const handlePreviewPointerDown = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX;
        const clientY = e.clientY;

        const canvasX = ((clientX - rect.left) / rect.width) * canvas.width;
        const canvasY = ((clientY - rect.top) / rect.height) * canvas.height;

        let hitSubId = null;
        for (const [subId, box] of textBoxesRef.current.entries()) {
          if (
            canvasX >= box.x &&
            canvasX <= box.x + box.w &&
            canvasY >= box.y &&
            canvasY <= box.y + box.h
          ) {
            hitSubId = subId;
            break;
          }
        }

        if (hitSubId) {
          isDraggingTextRef.current = true;
          setActiveSubId(hitSubId);
          const found = subtitles.find((s) => s.id === hitSubId);
          textDragStartRef.current = {
            x: clientX,
            y: clientY,
            initialSubX: found?.x !== undefined ? found.x : 0.5,
            initialSubY: found?.y !== undefined ? found.y : 0.82
          };
          renderCanvasFrame(currentTimeRef.current);
          return;
        }

        activePointersRef.current.set(e.pointerId, { x: clientX, y: clientY });
        const pointers = Array.from(activePointersRef.current.values());

        if (pointers.length === 1) {
          const now = Date.now();
          if (now - lastTapTimeRef.current < 280) {
            previewZoomRef.current = 1.0;
            previewPanRef.current = { x: 0, y: 0 };
            renderCanvasFrame(currentTimeRef.current);
            showToast('🐾 Đã đặt lại tỷ lệ 100%');
            lastTapTimeRef.current = 0;
            return;
          }
          lastTapTimeRef.current = now;
          panStartCenterRef.current = { x: clientX, y: clientY };
          panStartPanRef.current = { ...previewPanRef.current };
        } else if (pointers.length === 2) {
          const dist = Math.hypot(pointers[0].x - pointers[1].x, pointers[0].y - pointers[1].y);
          pinchStartDistRef.current = Math.max(10, dist);
          pinchStartZoomRef.current = previewZoomRef.current;
          panStartCenterRef.current = {
            x: (pointers[0].x + pointers[1].x) / 2,
            y: (pointers[0].y + pointers[1].y) / 2
          };
          panStartPanRef.current = { ...previewPanRef.current };
        }
      };

      const handlePreviewPointerMove = (e) => {
        if (isDraggingTextRef.current && activeSubId) {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const rect = canvas.getBoundingClientRect();
          const dx = (e.clientX - textDragStartRef.current.x) / rect.width;
          const dy = (e.clientY - textDragStartRef.current.y) / rect.height;

          const newX = Math.max(0.08, Math.min(0.92, textDragStartRef.current.initialSubX + dx));
          const newY = Math.max(0.08, Math.min(0.92, textDragStartRef.current.initialSubY + dy));

          setSubtitles((prev) =>
            prev.map((s) => (s.id === activeSubId ? { ...s, x: newX, y: newY } : s))
          );
          renderCanvasFrame(currentTimeRef.current);
          return;
        }

        if (!activePointersRef.current.has(e.pointerId)) return;
        activePointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const pointers = Array.from(activePointersRef.current.values());

        if (pointers.length === 1) {
          const dx = e.clientX - panStartCenterRef.current.x;
          const dy = e.clientY - panStartCenterRef.current.y;
          previewPanRef.current = {
            x: panStartPanRef.current.x + dx,
            y: panStartPanRef.current.y + dy
          };
          renderCanvasFrame(currentTimeRef.current);
        } else if (pointers.length === 2) {
          const dist = Math.hypot(pointers[0].x - pointers[1].x, pointers[0].y - pointers[1].y);
          const ratio = dist / pinchStartDistRef.current;
          const newZoom = Math.max(0.4, Math.min(4.5, pinchStartZoomRef.current * ratio));
          previewZoomRef.current = newZoom;

          const midX = (pointers[0].x + pointers[1].x) / 2;
          const midY = (pointers[0].y + pointers[1].y) / 2;
          const dx = midX - panStartCenterRef.current.x;
          const dy = midY - panStartCenterRef.current.y;
          previewPanRef.current = {
            x: panStartPanRef.current.x + dx,
            y: panStartPanRef.current.y + dy
          };
          renderCanvasFrame(currentTimeRef.current);
        }
      };

      const handlePreviewPointerUp = (e) => {
        if (isDraggingTextRef.current) {
          isDraggingTextRef.current = false;
          return;
        }
        activePointersRef.current.delete(e.pointerId);
        const pointers = Array.from(activePointersRef.current.values());
        if (pointers.length === 1) {
          panStartCenterRef.current = { x: pointers[0].x, y: pointers[0].y };
          panStartPanRef.current = { ...previewPanRef.current };
        }
      };

      const handleTimelinePointerDown = (e) => {
        pauseVideo();
        isTimelineDraggingRef.current = true;
        timelineDragDataRef.current = {
          startX: e.clientX,
          startScrollLeft: timelineScrollRef.current ? timelineScrollRef.current.scrollLeft : 0,
          isMoved: false
        };
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleTimelinePointerMove = (e) => {
        if (!isTimelineDraggingRef.current || !timelineScrollRef.current) return;
        const data = timelineDragDataRef.current;
        const deltaX = e.clientX - data.startX;
        if (Math.abs(deltaX) > 2) data.isMoved = true;

        const newScrollLeft = Math.max(0, Math.min(totalDuration * timelineZoom, data.startScrollLeft - deltaX));
        timelineScrollRef.current.scrollLeft = newScrollLeft;
        const computedTime = Math.max(0, Math.min(totalDuration, newScrollLeft / timelineZoom));
        seekTo(computedTime, false);
      };

      const handleTimelinePointerUp = (e) => {
        if (isTimelineDraggingRef.current) {
          isTimelineDraggingRef.current = false;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      };

      const handleTimelineScroll = (e) => {
        if (isSystemScrolling.current || isPlayingRef.current) return;
        const scrollLeft = e.target.scrollLeft;
        const computedTime = Math.max(0, Math.min(totalDuration, scrollLeft / timelineZoom));
        if (Math.abs(computedTime - currentTimeRef.current) > 0.03) {
          seekTo(computedTime, false);
        }
      };

      const handleTrimPointerDown = (e, handleType, clip) => {
        e.stopPropagation();
        e.preventDefault();
        pauseVideo();
        playNekoSound('click');

        isTrimmingRef.current = true;
        trimDataRef.current = {
          handle: handleType,
          clipId: clip.id,
          startX: e.clientX,
          initTrimStart: clip.trimStart,
          initDuration: clip.duration,
          sourceDur: clip.sourceDuration || clip.duration,
          speed: clip.speed || 1.0
        };

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleTrimPointerMove = (e) => {
        if (!isTrimmingRef.current) return;
        const data = trimDataRef.current;
        const deltaX = e.clientX - data.startX;
        const deltaSec = (deltaX / timelineZoom) * data.speed;

        if (data.handle === 'right') {
          const maxAllowed = data.sourceDur - data.initTrimStart;
          const newDur = Math.max(0.3, Math.min(maxAllowed, data.initDuration + deltaSec));

          setVideoClips((prev) =>
            prev.map((c) => (c.id === data.clipId ? { ...c, duration: Number(newDur.toFixed(2)) } : c))
          );

          const vid = hiddenVideoRef.current;
          if (vid) {
            vid.currentTime = data.initTrimStart + newDur;
            renderCanvasFrame(currentTimeRef.current);
          }
        } else if (data.handle === 'left') {
          const maxTrim = data.initTrimStart + data.initDuration - 0.3;
          const newTrimStart = Math.max(0, Math.min(maxTrim, data.initTrimStart + deltaSec));
          const actualDelta = newTrimStart - data.initTrimStart;
          const newDur = Math.max(0.3, data.initDuration - actualDelta);

          setVideoClips((prev) =>
            prev.map((c) =>
              c.id === data.clipId
                ? { ...c, trimStart: Number(newTrimStart.toFixed(2)), duration: Number(newDur.toFixed(2)) }
                : c
            )
          );

          const vid = hiddenVideoRef.current;
          if (vid) {
            vid.currentTime = newTrimStart;
            renderCanvasFrame(currentTimeRef.current);
          }
        }
      };

      const handleTrimPointerUp = (e) => {
        if (isTrimmingRef.current) {
          isTrimmingRef.current = false;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
          showToast('🐾 Đã tinh chỉnh độ dài clip');
          seekTo(currentTimeRef.current, false);
        }
      };

      const handleSplitClipAtPlayhead = () => {
        const t = currentTimeRef.current;
        const info = getCurrentClipInfo(t);
        if (!info) return;

        const { clip, clipIndex, clipOffsetTime } = info;
        const spd = clip.speed || 1.0;
        const sourceOffset = clipOffsetTime * spd;

        if (clipOffsetTime < 0.1 || (clip.duration / spd) - clipOffsetTime < 0.1) {
          showToast('Điểm cắt phải cách 2 đầu ít nhất 0.1s');
          return;
        }

        playNekoSound('split');
        const clip1 = { 
          ...clip, 
          duration: Number(sourceOffset.toFixed(2)) 
        };
        const clip2 = {
          ...clip,
          id: `clip_${Date.now()}_part2`,
          trimStart: Number((clip.trimStart + sourceOffset).toFixed(2)),
          duration: Number((clip.duration - sourceOffset).toFixed(2)),
          transition: 'none',
          transitionDuration: 0.5,
          animIn: 'none',
          animInDur: 0.5,
          animOut: 'none',
          animOutDur: 0.5,
          isScoreClip: false
        };

        const newClips = [...videoClips];
        newClips.splice(clipIndex, 1, clip1, clip2);
        setVideoClips(newClips);
        
        setActiveClipId(clip1.id);
        activeClipIdRef.current = clip1.id;

        renderCanvasFrame(t);
        showToast('🐾 Đã tách clip! Sẵn sàng gán chuyển tiếp.');
      };

      const handleSubTrimPointerDown = (e, handleType, sub) => {
        e.stopPropagation();
        e.preventDefault();
        pauseVideo();
        playNekoSound('click');

        isSubTrimmingRef.current = true;
        subTrimDataRef.current = {
          handle: handleType,
          subId: sub.id,
          startX: e.clientX,
          initStart: sub.start,
          initEnd: sub.end
        };

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleSubTrimPointerMove = (e) => {
        if (!isSubTrimmingRef.current) return;
        const data = subTrimDataRef.current;
        const deltaX = e.clientX - data.startX;
        const deltaSec = deltaX / timelineZoom;

        setSubtitles((prev) =>
          prev.map((s) => {
            if (s.id !== data.subId) return s;
            if (data.handle === 'right') {
              const newEnd = Math.max(s.start + 0.3, Math.min(totalDuration, data.initEnd + deltaSec));
              return { ...s, end: Number(newEnd.toFixed(2)) };
            } else if (data.handle === 'left') {
              const newStart = Math.max(0, Math.min(s.end - 0.3, data.initStart + deltaSec));
              return { ...s, start: Number(newStart.toFixed(2)) };
            } else if (data.handle === 'move') {
              const dur = data.initEnd - data.initStart;
              let nStart = data.initStart + deltaSec;
              if (nStart < 0) nStart = 0;
              if (nStart + dur > totalDuration) nStart = totalDuration - dur;
              return { ...s, start: Number(nStart.toFixed(2)), end: Number((nStart + dur).toFixed(2)) };
            }
            return s;
          })
        );
        renderCanvasFrame(currentTimeRef.current);
      };

      const handleSubTrimPointerUp = (e) => {
        if (isSubTrimmingRef.current) {
          isSubTrimmingRef.current = false;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
          showToast('🐾 Đã cập nhật độ dài chữ');

      // MẪU MATRIXAUTO CẮT SẴN (Chỉ nơi này mới gán cờ isScoreClip: true)

        showToast(`🐾 MatrixAuto sẵn sàng: ${trueDuration.toFixed(1)}s`);
      };

      const handleExportMP4 = async () => {
        if (videoClips.length === 0 || isExporting) return;
        pauseVideo();
        setIsExporting(true);
        setExportProgress(0);
        playNekoSound('click');

        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;
        if (!vid) {
          setIsExporting(false);
          return;
        }

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = selectedRatio.w;
        exportCanvas.height = selectedRatio.h;
        const exportCtx = exportCanvas.getContext('2d', { alpha: false });

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!exportAudioCtxRef.current) {
          exportAudioCtxRef.current = new AudioCtx();
        }
        const actx = exportAudioCtxRef.current;
        if (actx.state === 'suspended') {
          await actx.resume();
        }

        const audioDest = actx.createMediaStreamDestination();

        if (!vidSourceNodeRef.current) {
          try {
            vidSourceNodeRef.current = actx.createMediaElementSource(vid);
          } catch (e) {}
        }
        if (vidSourceNodeRef.current) {
          vidSourceNodeRef.current.disconnect();
          vidSourceNodeRef.current.connect(audioDest);
        }

        if (bgm && !bgmSourceNodeRef.current) {
          try {
            bgmSourceNodeRef.current = actx.createMediaElementSource(bgm);
          } catch (e) {}
        }
        if (bgmSourceNodeRef.current && audioClips.length > 0) {
          bgmSourceNodeRef.current.disconnect();
          bgmSourceNodeRef.current.connect(audioDest);
        }

        const canvasStream = exportCanvas.captureStream(30);
        const combinedTracks = [
          ...canvasStream.getVideoTracks(),
          ...audioDest.stream.getAudioTracks()
        ];
        const combinedStream = new MediaStream(combinedTracks);

        let mimeType = 'video/webm;codecs=vp8,opus';
        if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1,mp4a.40.2')) {
          mimeType = 'video/mp4;codecs=avc1,mp4a.40.2';
        } else if (MediaRecorder.isTypeSupported('video/mp4')) {
          mimeType = 'video/mp4';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264,opus')) {
          mimeType = 'video/webm;codecs=h264,opus';
        }

        const recorder = new MediaRecorder(combinedStream, {
          mimeType,
          videoBitsPerSecond: 16000000
        });

        const chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
          const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
          const blob = new Blob(chunks, { type: mimeType });
          const downloadUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = `NekoCut_Export_${Date.now()}.${ext}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(downloadUrl);

          setIsExporting(false);
          playNekoSound('success');
          showToast('🐾 Xuất video hoàn tất với đầy đủ âm thanh!');
          seekTo(0, true);
        };

        recorder.start(100);
        showToast('Đang kết xuất video & audio...');

        const startTime = performance.now();
        const totalMs = totalDuration * 1000;

        seekTo(0, true);
        vid.volume = isMuted ? 0 : (videoClips[0]?.volume ?? 1.0);
        vid.play().catch(() => {});
        if (bgm && audioClips.length > 0) {
          bgm.currentTime = 0;
          bgm.play().catch(() => {});
        }

        const renderExportLoop = () => {
          const elapsed = performance.now() - startTime;
          const curTimelineSec = Math.min(totalDuration, elapsed / 1000);

          drawFrameToContext(exportCtx, exportCanvas.width, exportCanvas.height, curTimelineSec);
          setExportProgress(Math.min(100, Math.round((curTimelineSec / totalDuration) * 100)));

          const info = getCurrentClipInfo(curTimelineSec);
          if (info && vid.src !== info.clip.url) {
            vid.src = info.clip.url;
            vid.load();
          }
          if (info && vid.currentTime !== info.mediaSourceTime) {
            vid.currentTime = info.mediaSourceTime;
          }

          if (elapsed < totalMs) {
            requestAnimationFrame(renderExportLoop);
          } else {
            vid.pause();
            if (bgm) bgm.pause();
            recorder.stop();
          }
        };

        requestAnimationFrame(renderExportLoop);
      };

      return (

          <video

            onLoadedMetadata={() => renderCanvasFrame(currentTimeRef.current)}
            onError={() => showToast('🐾 Lỗi tải video mẫu, vui lòng chọn file từ thiết bị')}
          />
          <video
            ref={hiddenVideoRef2}
            className="hidden"
            playsInline
            muted={true}
            crossOrigin="anonymous"
          />

          <audio
            ref={bgmAudioRef}
            className="hidden"
            playsInline
            loop
          />

          {/* TRANG 1: MÀN HÌNH CHÍNH (HOME) */}
          {currentPage === 'home' && (

                  <div className="w-10 h-10 rounded-full border-2 border-pink-500/60 overflow-hidden bg-zinc-900 shadow-[0_0_12px_rgba(255,42,122,0.4)] shrink-0 flex items-center justify-center">
                    <img
                      src="nekocut.jpg"
                      alt="NekoCut Logo"

                      }}

                    <span className="text-[#ffb703]">Pro</span>

                  }}
                  className="px-3.5 py-1.5 rounded-full bg-gradient-to-r from-[#ff2a7a] via-[#ff5364] to-[#ffa726] text-black font-extrabold text-xs flex items-center gap-2 shadow-[0_0_15px_rgba(255,42,122,0.45)] active:scale-95 transition"
                >
                  <img
                    src="wwlogo.jpg"

              <header className="h-12 px-3 pt-1 flex items-center justify-between z-30 shrink-0 bg-[#09090e] border-b border-white/[0.06]">
                <div className="flex items-center gap-2.5">
                  <button

                  >

                      <div className="space-y-2 pt-1 border-t border-white/[0.06]">
                        <div className="text-[11px] font-bold text-zinc-400">Các đoạn chữ trên video:</div>
                        {subtitles.length === 0 ? (
                          <div className="text-[10px] text-zinc-500 italic">Chưa có chữ nào.</div>
                        ) : (
                          subtitles.map((sub) => (
                            <div
                              key={sub.id}
                              onClick={() => {
                                setActiveSubId(sub.id);
                                renderCanvasFrame(currentTimeRef.current);
                              }}
                              className={`flex items-center justify-between px-3 py-2 rounded-lg border cursor-pointer ${
                                activeSubId === sub.id ? 'bg-pink-950/40 border-pink-500/60' : 'bg-zinc-900 border-white/[0.06]'
                              }`}
                            >
                              <span className="text-xs text-pink-300 font-semibold truncate max-w-[180px]">{sub.text}</span>
                              <div className="flex items-center gap-2">
                                <span className="text-[9px] font-mono text-zinc-400">{sub.start.toFixed(1)}s - {sub.end.toFixed(1)}s</span>
                                <button
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    setSubtitles(subtitles.filter((s) => s.id !== sub.id));
                                    if (activeSubId === sub.id) setActiveSubId(null);
                                    renderCanvasFrame(currentTimeRef.current);
                                    showToast('Đã xóa chữ');
                                  }}
                                  className="text-rose-400 text-xs font-bold"
                                >
                                  Xóa
                                </button>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}

                  {activeBottomMenu === 'audio' && (
                    <div className="space-y-3">
                      <label className="w-full py-3 px-4 rounded-xl bg-pink-500/20 border border-pink-500/40 text-pink-300 font-bold text-xs flex items-center justify-center gap-2 cursor-pointer active:scale-95">
                        <span>🎵 Trích xuất file nhạc MP3/WAV</span>
                        <input
                          type="file"
                          accept="audio/*"
                          onChange={(e) => {
                            const f = e.target.files?.[0];
                            if (f) {
                              const url = URL.createObjectURL(f);
                              const newAudio = {
                                id: `audio_${Date.now()}`,
                                name: f.name,
                                url,
                                duration: totalDuration
                              };
                              setAudioClips([newAudio]);
                              if (bgmAudioRef.current) {
                                bgmAudioRef.current.src = url;
                                bgmAudioRef.current.play().catch(() => {});
                              }
                              playNekoSound('success');
                              showToast(`🐾 Đã nạp nhạc: ${f.name}`);
                              setShowToolSheet(false);
                            }
                          }}
                          className="hidden"
                        />
                      </label>
                    </div>
                  )}

                  {activeBottomMenu === 'edit' && activeClip && (
                    <div className="space-y-3">
                      <div className="space-y-1.5">
                        <label className="text-[11px] text-zinc-400 font-bold">Tốc độ phát:</label>
                        <div className="grid grid-cols-6 gap-1">
                          {SPEED_OPTIONS.map((spd) => (
                            <button
                              key={spd}
                              onClick={() => {
                                setVideoClips((prev) =>
                                  prev.map((c) => (c.id === activeClip.id ? { ...c, speed: spd } : c))
                                );
                                playNekoSound('click');
                                showToast(`🐾 Tốc độ ${spd}x`);
                              }}
                              className={`py-1.5 rounded text-xs font-mono font-bold ${
                                (activeClip.speed || 1.0) === spd ? 'bg-pink-500 text-white' : 'bg-zinc-800 text-zinc-300'
                              }`}
                            >
                              {spd}x
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {showCoverModal && (
                <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col justify-between animate-in fade-in duration-200 select-none">
                  <div className="h-12 px-4 flex items-center justify-between border-b border-white/[0.08] bg-[#0c0c12]">
                    <button
                      onClick={() => {
                        setShowCoverModal(false);
                        seekTo(coverBackupTimeRef.current, true);
                      }}
                      className="text-xs text-zinc-400 hover:text-white"
                    >
                      Hủy
                    </button>
                    <span className="text-sm font-bold text-white tracking-wide">
                      Chọn Ảnh Bìa Neko
                    </span>
                    <button
                      onClick={() => {
                        const canvas = coverCanvasRef.current;
                        if (canvas) {
                          const snapshotUrl = canvas.toDataURL('image/jpeg', 0.85);
                          setCoverImage(snapshotUrl);
                        }
                        setShowCoverModal(false);
                        seekTo(coverScrubTime, true);
                        playNekoSound('success');
                        showToast('🐾 Đã lưu ảnh bìa Neko!');
                      }}
                      className="px-3.5 py-1 rounded-full bg-[#ff2a7a] text-white font-extrabold text-xs shadow-[0_0_12px_rgba(255,42,122,0.4)]"
                    >
                      Lưu
                    </button>
                  </div>

                  <div className="flex-1 flex flex-col items-center justify-center p-4 relative min-h-0">
                    <div className="relative max-h-full max-w-full rounded-xl overflow-hidden border-2 border-pink-500/80 shadow-[0_0_30px_rgba(255,42,122,0.2)]">
                      <canvas
                        ref={(node) => {
                          coverCanvasRef.current = node;
                          if (node) {
                            node.width = selectedRatio.w;
                            node.height = selectedRatio.h;
                            const ctx = node.getContext('2d');
                            if (ctx) {
                              drawFrameToContext(ctx, node.width, node.height, coverScrubTime);
                              if (coverTitleText) {
                                ctx.save();
                                ctx.font = `900 ${Math.round(node.width * 0.052)}px 'Montserrat', sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.fillStyle = '#ffb703';
                                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                                ctx.shadowBlur = 12;
                                ctx.fillText(coverTitleText, node.width / 2, node.height * 0.88);
                                ctx.restore();
                              }
                            }
                          }
                        }}
                        className="max-h-[calc(100vh-280px)] max-w-full object-contain"
                        style={{ aspectRatio: selectedRatio.ratioCss }}
                      />
                    </div>
                  </div>

                  <div className="p-4 bg-[#0e0e16] border-t border-white/[0.08] space-y-3">
                    <input
                      type="text"
                      value={coverTitleText}
                      onChange={(e) => setCoverTitleText(e.target.value)}
                      placeholder="Nhập tiêu đề ảnh bìa..."
                      className="w-full bg-[#181824] border border-white/[0.1] rounded-lg px-3 py-1.5 text-xs text-white placeholder-zinc-500"
                    />
                    <input
                      type="range"
                      min={0}
                      max={totalDuration}
                      step={0.05}
                      value={coverScrubTime}
                      onChange={(e) => {
                        const val = parseFloat(e.target.value);
                        setCoverScrubTime(val);
                        seekTo(val, true);
                      }}
                      className="w-full h-2 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-[#ff2a7a]"
                    />
                  </div>
                </div>
              )}

              {/* MODAL POPUP CHỌN 2S: CHỈ MỞ KHI LÀ MẪU MATRIXAUTO */}
              {showScoreSelectModal && (() => {
                const targetClip = videoClips.find(c => c.isScoreClip);
                if (!targetClip) return null;
                const srcDur = targetClip.sourceDuration || totalDuration;
                const windowMin = Math.max(0, srcDur - 15);
                const windowMax = Math.max(windowMin, srcDur - 2);

                return (
                  <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col justify-between animate-in fade-in duration-200 select-none">
                    <div className="h-12 px-4 flex items-center justify-between border-b border-white/[0.08] bg-[#0c0c12]">
                      <button
                        onClick={() => {
                          setShowScoreSelectModal(false);
                          seekTo(currentTimeRef.current, true);
                        }}
                        className="text-xs text-zinc-400 hover:text-white"
                      >
                        Hủy
                      </button>
                      <div className="flex items-center gap-1.5">
                        <span className="text-pink-400 font-bold text-xs">⚡</span>
                        <span className="text-sm font-bold text-white tracking-wide">
                          Chọn 2s Điểm Số (15s Cuối)
                        </span>
                      </div>
                      <button
                        onClick={() => {
                          setVideoClips((prev) =>
                            prev.map((c) =>
                              c.isScoreClip ? { ...c, trimStart: Number(scoreTrimWindowStart.toFixed(2)), duration: 2.0 } : c
                            )
                          );
                          setShowScoreSelectModal(false);
                          playNekoSound('success');
                          showToast(`🐾 Đã chọn đoạn 2s: ${scoreTrimWindowStart.toFixed(1)}s - ${(scoreTrimWindowStart + 2).toFixed(1)}s`);
                          seekTo(0, true);
                        }}
                        className="px-3.5 py-1 rounded-full bg-[#ff2a7a] text-white font-extrabold text-xs shadow-[0_0_12px_rgba(255,42,122,0.4)]"
                      >
                        Xác nhận
                      </button>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center p-4 relative min-h-0">
                      <div className="relative max-h-full max-w-full rounded-xl overflow-hidden border-2 border-pink-500/80 shadow-[0_0_24px_rgba(255,42,122,0.25)]">
                        <canvas
                          ref={(node) => {
                            scoreModalCanvasRef.current = node;
                            if (node) {
                              node.width = selectedRatio.w;
                              node.height = selectedRatio.h;
                              const ctx = node.getContext('2d');
                              const vid = hiddenVideoRef.current;
                              if (ctx && vid) {
                                const dims = getDrawDimensions(vid, node.width, node.height, fitMode);
                                ctx.fillStyle = '#050508';
                                ctx.fillRect(0, 0, node.width, node.height);
                                ctx.drawImage(vid, dims.x, dims.y, dims.w, dims.h);
                              }
                            }
                          }}
                          className="max-h-[calc(100vh-300px)] max-w-full object-contain"
                          style={{ aspectRatio: selectedRatio.ratioCss }}
                        />
                      </div>
                    </div>

                    <div className="p-4 bg-[#0e0e16] border-t border-white/[0.08] space-y-3">
                      <div className="flex items-center justify-between text-xs text-zinc-300">
                        <span>Khoảng 2s được chọn:</span>
                        <span className="font-mono text-pink-300 font-bold bg-pink-950/40 px-2.5 py-0.5 rounded border border-pink-800/40">
                          {formatTimeCode(scoreTrimWindowStart)} ➔ {formatTimeCode(scoreTrimWindowStart + 2)}
                        </span>
                      </div>

                      <div className="relative pt-1">
                        <input
                          type="range"
                          min={windowMin}
                          max={windowMax}
                          step={0.05}
                          value={scoreTrimWindowStart}
                          onChange={(e) => {
                            const val = parseFloat(e.target.value);
                            setScoreTrimWindowStart(val);

                            const vid = hiddenVideoRef.current;
                            if (vid) {
                              vid.currentTime = val;
                              const onSeek = () => {
                                const canvas = scoreModalCanvasRef.current;
                                if (canvas) {
                                  const ctx = canvas.getContext('2d');
                                  if (ctx) {
                                    const dims = getDrawDimensions(vid, canvas.width, canvas.height, fitMode);
                                    ctx.fillStyle = '#050508';
                                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                                    ctx.drawImage(vid, dims.x, dims.y, dims.w, dims.h);
                                  }
                                }
                                vid.removeEventListener('seeked', onSeek);
                              };
                              vid.addEventListener('seeked', onSeek);
                            }
                          }}
                          className="w-full h-2 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-[#ff2a7a]"
                        />
                        <div className="flex justify-between text-[10px] font-mono text-zinc-500 mt-1">
                          <span>Bắt đầu 15s cuối ({formatTimeCode(windowMin)})</span>
                          <span>Hết video ({formatTimeCode(srcDur)})</span>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })()}
            </div>
          )}

          {showTemplateModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-[#121019] border-t sm:border border-white/[0.12] w-full max-w-lg rounded-t-3xl sm:rounded-3xl flex flex-col max-h-[88vh] overflow-hidden shadow-2xl">
                
                <div className="p-4 border-b border-zinc-800/80 flex items-center justify-between shrink-0 bg-[#15131d]">
                  <div className="flex items-center gap-2.5">
                    <div className="w-6 h-6 rounded-md overflow-hidden border border-pink-500/50 shadow-sm bg-zinc-900 shrink-0">
                      <img
                        src="wwlogo.jpg"
                        alt="MatrixAuto WW Logo"
                        className="w-full h-full object-cover"
                        onError={(e) => {
                          e.target.onerror = null;
                          e.target.src = 'https://placehold.co/40x40/15131d/ff2a7a?text=WW';
                        }}
                      />
                    </div>
                    <h3 className="font-extrabold text-sm text-zinc-100">Cấu Hình Mẫu MatrixAuto Neko</h3>
                  </div>
                  <button
                    onClick={() => setShowTemplateModal(false)}
                    className="w-8 h-8 rounded-full bg-zinc-800/80 text-zinc-400 flex items-center justify-center text-xs"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 overflow-y-auto neko-scroll space-y-4 flex-1">
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-zinc-300">Tông màu trận đấu:</label>
                    <div className="space-y-2">
                      {NEKO_STYLES.map((st) => (
                        <div
                          key={st.id}
                          onClick={() => setSelectedStyleId(st.id)}
                          className={`p-3 rounded-xl border text-left cursor-pointer flex items-center justify-between transition ${
                            selectedStyleId === st.id
                              ? 'bg-pink-500/20 border-pink-400 text-pink-300 shadow-[0_0_12px_rgba(255,42,122,0.2)]'
                              : 'bg-zinc-900/60 border-white/[0.06] text-zinc-300'
                          }`}
                        >
                          <div>
                            <div className="text-xs font-bold">{st.name}</div>
                            <div className="text-[10px] text-zinc-400 mt-0.5">{st.desc}</div>
                          </div>
                          {selectedStyleId === st.id && (
                            <span className="text-pink-400 font-bold text-sm shrink-0">✓</span>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  <label className="flex items-center justify-between bg-zinc-900/70 p-3.5 rounded-xl border border-white/[0.06] cursor-pointer">
                    <span className="text-xs text-zinc-200 font-medium">Tự động trích 2s điểm số đưa lên đầu clip</span>
                    <input
                      type="checkbox"
                      checked={autoScoreLoop}
                      onChange={(e) => setAutoScoreLoop(e.target.checked)}
                      className="w-5 h-5 accent-pink-500 rounded cursor-pointer shrink-0"
                    />
                  </label>
                </div>

                <div className="p-4 pt-3 pb-8 sm:pb-4 border-t border-zinc-800/80 bg-[#121019] shrink-0 grid grid-cols-2 gap-3 z-10">
                  <button
                    type="button"
                    onClick={() => applyMatrixTemplate()}
                    className="h-12 rounded-xl bg-zinc-800/90 text-xs font-bold text-zinc-100 border border-white/[0.1] hover:bg-zinc-700 flex items-center justify-center transition shadow-md gap-2"
                  >
                    <img
                      src="wwlogo.jpg"
                      alt="WW Icon"
                      className="w-4 h-4 rounded-full object-cover shrink-0"
                      onError={(e) => { e.target.style.display = 'none'; }}
                    />
                    <span>Dùng Video Mẫu Neko</span>
                  </button>

                  <label className="h-12 rounded-xl bg-gradient-to-r from-pink-500 via-rose-500 to-amber-400 text-xs font-black text-black text-center shadow-[0_0_16px_rgba(255,42,122,0.4)] cursor-pointer flex items-center justify-center gap-2">
                    <CatPawSvg className="w-4 h-4 fill-black" />
                    <span>Chọn Video Của Bạn</span>
                    <input
                      type="file"
                      accept="video/*"
                      onChange={(e) => {
                        const f = e.target.files?.[0];
                        if (f) applyMatrixTemplate(f);
                      }}
                      className="hidden"
                    />
                  </label>
                </div>
              </div>
            </div>
          )}

          {toastMsg && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-[#161622]/95 border border-pink-500/40 text-pink-200 px-4 py-2 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 backdrop-blur-md whitespace-nowrap">
              <CatPawSvg className="w-4 h-4 text-pink-400" />
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
