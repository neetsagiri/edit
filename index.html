<body class="bg-[#050508] text-white selection:bg-pink-500 selection:text-white overflow-hidden h-[100dvh] w-screen font-sans">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback, useMemo } = React;

    const playNekoSound = (type = 'click') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === 'split') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.09);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'success') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.setValueAtTime(680, now + 0.08);
          osc.frequency.setValueAtTime(980, now + 0.16);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(900, now);
          osc.frequency.exponentialRampToValueAtTime(350, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        }
      } catch (e) {}
    };

    const CatPawSvg = ({ className = "w-4 h-4" }) => (
      <svg viewBox="0 0 100 100" fill="currentColor" className={className}>
        <ellipse cx="50" cy="68" rx="26" ry="20" />

    const CloseIcon = ({ className = "w-4 h-4" }) => (

    );
    const SearchIcon = ({ className = "w-4 h-4" }) => (

    const PauseIcon = ({ className = "w-5 h-5" }) => (

    const UndoIcon = ({ className = "w-4 h-4" }) => (

    const RedoIcon = ({ className = "w-4 h-4" }) => (

    const FullscreenIcon = ({ className = "w-4 h-4" }) => (

    const MuteVolumeIcon = ({ className = "w-4 h-4" }) => (

    const AiCutIcon = ({ className = "w-4 h-4" }) => (

    const CoverIcon = ({ className = "w-4 h-4" }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    );

    const SAMPLE_WW_VIDEO = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4';
    const SPEED_OPTIONS = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0];

    const WW_STYLES = [
      { id: 'crisp', name: 'Sakura Crisp', desc: 'Sắc nét phong cách Sakura', css: 'contrast(1.18) saturate(1.15) brightness(1.02)' },
      { id: 'cyber', name: 'Neko Cyber Matrix', desc: 'Rực sáng VFX Hồng Tím', css: 'contrast(1.25) saturate(1.3) hue-rotate(300deg) brightness(0.95)' },
      { id: 'vibrant', name: 'Vibrant Neko', desc: 'Đòn nộ rực rỡ', css: 'contrast(1.15) saturate(1.5) brightness(1.04)' }
    ];

    const ASPECT_RATIOS = [
      { id: '9-16', label: '9:16 (TikTok/Shorts)', w: 1080, h: 1920, ratioCss: '9/16' },
      { id: '16-9', label: '16:9 (Chuẩn PC)', w: 1920, h: 1080, ratioCss: '16/9' },
      { id: '1-1', label: '1:1 (Vuông)', w: 1080, h: 1080, ratioCss: '1/1' },
      { id: '21-9', label: '21:9 (Điện ảnh)', w: 2560, h: 1080, ratioCss: '21/9' }
    ];

    const FILTERS = [
      { id: 'none', name: 'Gốc (Raw)', css: 'none' },
      { id: 'crisp', name: 'Sakura Crisp', css: 'contrast(1.18) saturate(1.15) brightness(1.02)' },
      { id: 'high-contrast', name: 'Tương Phản Cao', css: 'contrast(1.4) saturate(1.25) brightness(1.05)' },
      { id: 'cyber', name: 'Neko Cyber', css: 'contrast(1.25) saturate(1.3) hue-rotate(300deg) brightness(0.95)' },
      { id: 'vibrant', name: 'Vibrant Neko', css: 'contrast(1.15) saturate(1.5) brightness(1.04)' }
    ];

    const formatTimeCode = (sec) => {
      const s = Math.max(0, sec || 0);
      const m = Math.floor(s / 60);
      const remSec = Math.floor(s % 60);
      return `${String(m).padStart(2, '0')}:${String(remSec).padStart(2, '0')}`;
    };

    const getExactVideoDuration = (videoUrl) => {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.src = videoUrl;
        v.onloadedmetadata = () => resolve(v.duration && !isNaN(v.duration) && v.duration !== Infinity ? v.duration : 15);
        v.onerror = () => resolve(15);
        setTimeout(() => resolve(15), 3000);
      });
    };

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [toastMsg, setToastMsg] = useState('');

      const [projectTitle, setProjectTitle] = useState('NekoDự Án');
      const [videoClips, setVideoClips] = useState([
        {
          id: 'clip_ww_1',
          name: 'Neko_Combat_Sample.mp4',
          url: SAMPLE_WW_VIDEO,
          sourceDuration: 59.1,
          trimStart: 0,
          duration: 59.1,
          speed: 1.0,
          colorFilter: 'crisp',
          volume: 1.0,
          noiseReduction: false,
          loudnessNorm: false
        }
      ]);
      const [activeClipId, setActiveClipId] = useState(null);
      const [isClipSelected, setIsClipSelected] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const [selectedRatio, setSelectedRatio] = useState(ASPECT_RATIOS[0]);
      const [fitMode, setFitMode] = useState('cover');

      // State Âm lượng Drawer
      const [showVolumeDrawer, setShowVolumeDrawer] = useState(false);
      const [volumeValue, setVolumeValue] = useState(100);
      const [noiseReduction, setNoiseReduction] = useState(false);
      const [loudnessNorm, setLoudnessNorm] = useState(false);

      // State Ảnh bìa
      const [coverImage, setCoverImage] = useState(null);
      const [showCoverModal, setShowCoverModal] = useState(false);
      const [coverScrubTime, setCoverScrubTime] = useState(0);
      const [coverTitleText, setCoverTitleText] = useState('NEKO MEOW COMBAT 🐾');
      const [showCoverTextOnThumb, setShowCoverTextOnThumb] = useState(true);

      // Trim state
      const isTrimmingRef = useRef(false);
      const trimDataRef = useRef({
        handle: null,
        clipId: null,
        startX: 0,
        initTrimStart: 0,
        initDuration: 0,
        sourceDur: 0,
        speed: 1.0
      });

      const [showTemplateModal, setShowTemplateModal] = useState(false);
      const [selectedStyleId, setSelectedStyleId] = useState('crisp');
      const [autoScoreLoop, setAutoScoreLoop] = useState(true);

      const [audioClips, setAudioClips] = useState([]);
      const [subtitles, setSubtitles] = useState([]);

      const [isDraggingCanvas, setIsDraggingCanvas] = useState(false);
      const isDraggingVideoFrame = useRef(false);
      const dragStartPos = useRef({ startX: 0, startY: 0, initPanX: 0, initPanY: 0, scaleRatioW: 1, scaleRatioH: 1 });
      const activePointersRef = useRef(new Map());
      const pinchDataRef = useRef({ initialDist: 0, initialScale: 1.0, initialPanX: 0, initialPanY: 0, midX: 0, midY: 0 });

      // Timeline & Tool states
      const [timelineZoom] = useState(64);
      const [activeBottomMenu, setActiveBottomMenu] = useState('edit');
      const [showToolSheet, setShowToolSheet] = useState(false);
      const [isExporting, setIsExporting] = useState(false);
      const [exportProgress, setExportProgress] = useState(0);
      const [snapEnabled, setSnapEnabled] = useState(false);

      // Refs
      const canvasRef = useRef(null);
      const hiddenVideoRef = useRef(null);
      const timelineScrollRef = useRef(null);
      const currentTimeRef = useRef(0);
      const activeClipIdRef = useRef('clip_ww_1');
      const isPlayingRef = useRef(false);
      const isSystemScrolling = useRef(false);
      const isTouchDraggingTimeline = useRef(false);
      const animationFrameRef = useRef(null);
      const lastUiUpdateRef = useRef(0);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2200);
      };

      const handleCreateNewProject = async (file = null) => {
        playNekoSound('click');
        let newUrl = SAMPLE_WW_VIDEO;
        let newName = 'Neko_Combat_Sample.mp4';
        let newDur = 59.1;

        if (file) {
          newName = file.name;
          newUrl = URL.createObjectURL(file);
          showToast('Đang nạp video mèo...');
          newDur = await getExactVideoDuration(newUrl);
        }

        const newClip = {
          id: `clip_${Date.now()}`,
          name: newName.length > 20 ? newName.substring(0, 18) + '...' : newName,
          url: newUrl,
          sourceDuration: newDur,
          trimStart: 0,
          duration: newDur,
          speed: 1.0,
          colorFilter: 'crisp',
          volume: 1.0,
          noiseReduction: false,
          loudnessNorm: false
        };

        setProjectTitle(newName.replace(/\.[^/.]+$/, ""));
        setVideoClips([newClip]);
        setActiveClipId(null);
        setIsClipSelected(false);
        activeClipIdRef.current = newClip.id;
        setCurrentTime(0);
        currentTimeRef.current = 0;
        setSubtitles([]);
        setAudioClips([]);
        setCurrentPage('editor');
        if (timelineScrollRef.current) timelineScrollRef.current.scrollLeft = 0;
        showToast(`Đã mở dự án: ${newDur.toFixed(1)}s`);
      };

      const handleBackToHome = () => {
        pauseVideo();
        playNekoSound('click');
        setCurrentPage('home');
        showToast('Đã trở về sảnh chính Neko');
      };

      const totalDuration = useMemo(() => {
        const sum = videoClips.reduce((acc, c) => acc + (c.duration / (c.speed || 1.0)), 0);
        return Math.max(1, sum);
      }, [videoClips]);

      const activeClip = useMemo(() => {
        return videoClips.find((c) => c.id === activeClipId) || videoClips[0] || null;
      }, [videoClips, activeClipId]);

      const getCurrentClipInfo = useCallback(
        (time) => {
          let acc = 0;
          for (let i = 0; i < videoClips.length; i++) {
            const c = videoClips[i];
            const spd = c.speed || 1.0;
            const effectiveDur = c.duration / spd;

            if (time >= acc && time < acc + effectiveDur) {
              const timelineOffset = time - acc;
              const sourceOffset = timelineOffset * spd;
              return {
                clip: c,
                clipIndex: i,
                clipStartTime: acc,
                clipOffsetTime: timelineOffset,
                effectiveDuration: effectiveDur,
                mediaSourceTime: c.trimStart + sourceOffset
              };
            }
            acc += effectiveDur;
          }
          if (videoClips.length > 0) {
            const last = videoClips[videoClips.length - 1];
            const spd = last.speed || 1.0;
            const effDur = last.duration / spd;
            const lastStart = Math.max(0, acc - effDur);
            const timelineOffset = Math.min(effDur, Math.max(0, time - lastStart));
            return {
              clip: last,
              clipIndex: videoClips.length - 1,
              clipStartTime: lastStart,
              clipOffsetTime: timelineOffset,
              effectiveDuration: effDur,
              mediaSourceTime: last.trimStart + (timelineOffset * spd)
            };
          }
          return null;
        },
        [videoClips]
      );

      const drawFrameToContext = useCallback(
        (ctx, targetW, targetH, time) => {
          const vid = hiddenVideoRef.current;
          const clipInfo = getCurrentClipInfo(time);

          ctx.fillStyle = '#050508';
          ctx.fillRect(0, 0, targetW, targetH);

          if (clipInfo && vid && vid.readyState >= 2) {
            const { clip } = clipInfo;
            ctx.save();

            const filterDef = FILTERS.find((f) => f.id === clip.colorFilter) || FILTERS[0];
            ctx.filter = filterDef.css !== 'none' ? filterDef.css : 'none';

            const sFactor = fitMode === 'cover'
              ? Math.max(targetW / vid.videoWidth, targetH / vid.videoHeight)
              : Math.min(targetW / vid.videoWidth, targetH / vid.videoHeight);

            const baseScale = clip.scale || 1.0;
            const drawW = vid.videoWidth * sFactor * baseScale;
            const drawH = vid.videoHeight * sFactor * baseScale;
            const panX = clip.panX || 0;
            const panY = clip.panY || 0;
            const drawX = ((targetW - drawW) / 2) + panX;
            const drawY = ((targetH - drawH) / 2) + panY;

            ctx.drawImage(vid, drawX, drawY, drawW, drawH);
            ctx.restore();
          }

          // Vẽ phụ đề Neko
          subtitles.forEach((sub) => {
            if (time >= sub.start && time <= sub.end) {
              ctx.save();
              ctx.font = `bold ${sub.fontSize || 34}px 'Montserrat', sans-serif`;
              ctx.textAlign = 'center';
              ctx.fillStyle = sub.color || '#ff2a7a';
              ctx.shadowColor = 'rgba(255,42,122,0.8)';
              ctx.shadowBlur = 10;
              const pX = targetW / 2;
              const pY = targetH * 0.85;
              ctx.fillText(sub.text, pX, pY);
              ctx.restore();
            }
          });
        },
        [getCurrentClipInfo, subtitles, fitMode]
      );

      const renderCanvasFrame = useCallback(
        (time) => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d', { alpha: false });
          if (!ctx) return;
          drawFrameToContext(ctx, canvas.width, canvas.height, time);
        },
        [drawFrameToContext]
      );

      const seekTo = useCallback(
        (targetTime, forceRender = false) => {
          const clamped = Math.max(0, Math.min(totalDuration, targetTime));
          currentTimeRef.current = clamped;
          setCurrentTime(clamped);

          const info = getCurrentClipInfo(clamped);
          const vid = hiddenVideoRef.current;

          if (info && vid) {
            activeClipIdRef.current = info.clip.id;
            if (vid.src !== info.clip.url) vid.src = info.clip.url;
            vid.playbackRate = info.clip.speed || 1.0;
            vid.volume = isMuted ? 0 : (info.clip.volume ?? 1.0);

            if (Math.abs(vid.currentTime - info.mediaSourceTime) > 0.04 || forceRender) {
              vid.currentTime = info.mediaSourceTime;
              const onSeek = () => {
                renderCanvasFrame(clamped);
                vid.removeEventListener('seeked', onSeek);
              };
              vid.addEventListener('seeked', onSeek);
              renderCanvasFrame(clamped);
            } else {
              renderCanvasFrame(clamped);
            }
          } else {
            renderCanvasFrame(clamped);
          }
        },
        [totalDuration, getCurrentClipInfo, renderCanvasFrame, isMuted]
      );

      const handleTimelineScroll = (e) => {
        if (isSystemScrolling.current || isPlayingRef.current) return;
        const scrollLeft = e.target.scrollLeft;
        const computedTime = Math.max(0, Math.min(totalDuration, scrollLeft / timelineZoom));
        if (Math.abs(computedTime - currentTimeRef.current) > 0.03) {
          seekTo(computedTime, false);
        }
      };

      const handleTimelineTouchStart = () => {
        pauseVideo();
        isTouchDraggingTimeline.current = true;
      };

      const handleTimelineTouchEnd = () => {
        isTouchDraggingTimeline.current = false;
      };

      const handleTrimPointerDown = (e, handleType, clip) => {
        e.stopPropagation();
        e.preventDefault();
        pauseVideo();
        playNekoSound('click');

        isTrimmingRef.current = true;
        trimDataRef.current = {
          handle: handleType,
          clipId: clip.id,
          startX: e.clientX,
          initTrimStart: clip.trimStart,
          initDuration: clip.duration,
          sourceDur: clip.sourceDuration || clip.duration,
          speed: clip.speed || 1.0
        };

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleTrimPointerMove = (e) => {
        if (!isTrimmingRef.current) return;
        const data = trimDataRef.current;
        const deltaX = e.clientX - data.startX;
        const deltaSec = (deltaX / timelineZoom) * data.speed;

        if (data.handle === 'right') {
          const maxAllowed = data.sourceDur - data.initTrimStart;
          const newDur = Math.max(0.3, Math.min(maxAllowed, data.initDuration + deltaSec));

          setVideoClips((prev) =>
            prev.map((c) => (c.id === data.clipId ? { ...c, duration: Number(newDur.toFixed(2)) } : c))
          );

          const targetSeekTime = data.initTrimStart + newDur;
          const vid = hiddenVideoRef.current;
          if (vid) {
            vid.currentTime = targetSeekTime;
            renderCanvasFrame(currentTimeRef.current);
          }
        } else if (data.handle === 'left') {
          const maxTrim = data.initTrimStart + data.initDuration - 0.3;
          const newTrimStart = Math.max(0, Math.min(maxTrim, data.initTrimStart + deltaSec));
          const actualDelta = newTrimStart - data.initTrimStart;
          const newDur = Math.max(0.3, data.initDuration - actualDelta);

          setVideoClips((prev) =>
            prev.map((c) =>
              c.id === data.clipId
                ? { ...c, trimStart: Number(newTrimStart.toFixed(2)), duration: Number(newDur.toFixed(2)) }
                : c
            )
          );

          const vid = hiddenVideoRef.current;
          if (vid) {
            vid.currentTime = newTrimStart;
            renderCanvasFrame(currentTimeRef.current);
          }
        }
      };

      const handleTrimPointerUp = (e) => {
        if (isTrimmingRef.current) {
          isTrimmingRef.current = false;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
          showToast('🐾 Đã tinh chỉnh độ dài clip');
          seekTo(currentTimeRef.current, false);
        }
      };

      const handleOpenVolumeDrawer = () => {
        if (!activeClip) return;
        const currentVol = Math.round((activeClip.volume ?? 1.0) * 100);
        setVolumeValue(Math.min(1000, Math.max(0, currentVol)));
        setNoiseReduction(!!activeClip.noiseReduction);
        setLoudnessNorm(!!activeClip.loudnessNorm);
        setShowVolumeDrawer(true);
      };

      const handleVolumeSliderChange = (newVal) => {
        setVolumeValue(newVal);
        if (!activeClip) return;
        const scaledVol = newVal / 100;
        setVideoClips((prev) =>
          prev.map((c) => (c.id === activeClip.id ? { ...c, volume: scaledVol } : c))
        );
        const vid = hiddenVideoRef.current;
        if (vid) {
          vid.volume = isMuted ? 0 : Math.min(1.0, scaledVol);
        }
      };

      const playVideo = () => {
        if (videoClips.length === 0) return;
        playNekoSound('click');
        const vid = hiddenVideoRef.current;

        if (currentTimeRef.current >= totalDuration - 0.08) {
          seekTo(0, true);
        }

        const info = getCurrentClipInfo(currentTimeRef.current);
        if (info && vid) {
          if (vid.src !== info.clip.url) vid.src = info.clip.url;
          vid.playbackRate = info.clip.speed || 1.0;
          vid.currentTime = info.mediaSourceTime;
          vid.volume = isMuted ? 0 : (info.clip.volume ?? 1.0);
          vid.play().catch(() => {});
        }

        isPlayingRef.current = true;
        setIsPlaying(true);
      };

      const pauseVideo = () => {
        isPlayingRef.current = false;
        setIsPlaying(false);
        if (hiddenVideoRef.current) hiddenVideoRef.current.pause();
      };

      const togglePlay = () => {
        if (isPlayingRef.current) pauseVideo();
        else playVideo();
      };

      useEffect(() => {
        if (currentPage !== 'editor') return;

        const loop = (now) => {
          if (isPlayingRef.current) {
            const vid = hiddenVideoRef.current;
            const currentClipId = activeClipIdRef.current;
            const curIdx = videoClips.findIndex((c) => c.id === currentClipId);
            const activeIdx = curIdx >= 0 ? curIdx : 0;
            const curClip = videoClips[activeIdx];

            if (vid && curClip) {
              const spd = curClip.speed || 1.0;
              const clipSourceEnd = curClip.trimStart + curClip.duration;
              const curSourceTime = vid.currentTime;

              if (curSourceTime >= clipSourceEnd - 0.03) {
                if (activeIdx < videoClips.length - 1) {
                  const nextClip = videoClips[activeIdx + 1];
                  const nextSpd = nextClip.speed || 1.0;

                  const isContiguous = (
                    nextClip.url === curClip.url &&
                    Math.abs(clipSourceEnd - nextClip.trimStart) < 0.08 &&
                    nextSpd === spd &&
                    nextClip.colorFilter === curClip.colorFilter &&
                    (nextClip.scale || 1.0) === (curClip.scale || 1.0) &&
                    (nextClip.panX || 0) === (curClip.panX || 0) &&
                    (nextClip.panY || 0) === (curClip.panY || 0)
                  );

                  activeClipIdRef.current = nextClip.id;

                  if (isContiguous) {
                    if (vid.paused) vid.play().catch(() => {});
                  } else {
                    if (vid.src !== nextClip.url) vid.src = nextClip.url;
                    vid.playbackRate = nextSpd;
                    vid.currentTime = nextClip.trimStart;
                    vid.play().catch(() => {});
                  }
                } else {
                  pauseVideo();
                  seekTo(totalDuration, true);
                }
              } else {
                let clipStartTime = 0;
                for (let i = 0; i < activeIdx; i++) {
                  clipStartTime += videoClips[i].duration / (videoClips[i].speed || 1.0);
                }

                const elapsedSourceInClip = Math.max(0, curSourceTime - curClip.trimStart);
                const exactTimelineTime = Math.min(totalDuration, clipStartTime + elapsedSourceInClip / spd);

                currentTimeRef.current = exactTimelineTime;

                if (timelineScrollRef.current) {
                  isSystemScrolling.current = true;
                  timelineScrollRef.current.scrollLeft = exactTimelineTime * timelineZoom;
                  isSystemScrolling.current = false;
                }

                if (now - lastUiUpdateRef.current > 35) {
                  setCurrentTime(exactTimelineTime);
                  lastUiUpdateRef.current = now;
                }
                renderCanvasFrame(exactTimelineTime);
              }
            } else {
              pauseVideo();
            }
          }
          animationFrameRef.current = requestAnimationFrame(loop);
        };

        animationFrameRef.current = requestAnimationFrame(loop);
        return () => {
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };
      }, [currentPage, videoClips, totalDuration, timelineZoom, renderCanvasFrame, seekTo]);

      const handleCanvasPointerDown = (e) => {
        if (!activeClip) return;
        activePointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
        isDraggingVideoFrame.current = true;
        setIsDraggingCanvas(true);

        const rect = e.currentTarget.getBoundingClientRect();
        const scaleW = selectedRatio.w / rect.width;
        const scaleH = selectedRatio.h / rect.height;

        dragStartPos.current = {
          startX: e.clientX,
          startY: e.clientY,
          initPanX: activeClip.panX || 0,
          initPanY: activeClip.panY || 0,
          scaleRatioW: scaleW,
          scaleRatioH: scaleH
        };

        if (activePointersRef.current.size >= 2) {
          const pts = Array.from(activePointersRef.current.values());
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          pinchDataRef.current = {
            initialDist: Math.max(10, dist),
            initialScale: activeClip.scale || 1.0,
            initialPanX: activeClip.panX || 0,
            initialPanY: activeClip.panY || 0,
            midX: (pts[0].x + pts[1].x) / 2,
            midY: (pts[0].y + pts[1].y) / 2
          };
        }

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleCanvasPointerMove = (e) => {
        if (!isDraggingVideoFrame.current || !activeClip) return;
        activePointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (activePointersRef.current.size >= 2) {
          const pts = Array.from(activePointersRef.current.values());
          const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          const zoomFactor = currentDist / pinchDataRef.current.initialDist;
          const newScale = Math.max(0.4, Math.min(4.0, Number((pinchDataRef.current.initialScale * zoomFactor).toFixed(3))));

          const currentMidX = (pts[0].x + pts[1].x) / 2;
          const currentMidY = (pts[0].y + pts[1].y) / 2;
          const dMidX = (currentMidX - pinchDataRef.current.midX) * dragStartPos.current.scaleRatioW;
          const dMidY = (currentMidY - pinchDataRef.current.midY) * dragStartPos.current.scaleRatioH;
          const newPanX = Math.round(pinchDataRef.current.initialPanX + dMidX);
          const newPanY = Math.round(pinchDataRef.current.initialPanY + dMidY);

          setVideoClips((prev) =>
            prev.map((c) => (c.id === activeClip.id ? { ...c, scale: newScale, panX: newPanX, panY: newPanY } : c))
          );
          renderCanvasFrame(currentTimeRef.current);
          return;
        }

        const dx = (e.clientX - dragStartPos.current.startX) * dragStartPos.current.scaleRatioW;
        const dy = (e.clientY - dragStartPos.current.startY) * dragStartPos.current.scaleRatioH;
        const newPanX = Math.round(dragStartPos.current.initPanX + dx);
        const newPanY = Math.round(dragStartPos.current.initPanY + dy);

        setVideoClips((prev) =>
          prev.map((c) => (c.id === activeClip.id ? { ...c, panX: newPanX, panY: newPanY } : c))
        );
        renderCanvasFrame(currentTimeRef.current);
      };

      const handleCanvasPointerUp = (e) => {
        activePointersRef.current.delete(e.pointerId);
        if (activePointersRef.current.size === 0) {
          isDraggingVideoFrame.current = false;
          setIsDraggingCanvas(false);
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      };

      const handleSplitClipAtPlayhead = () => {
        const t = currentTimeRef.current;
        const info = getCurrentClipInfo(t);
        if (!info) return;

        const { clip, clipIndex, clipOffsetTime } = info;
        const spd = clip.speed || 1.0;
        const sourceOffset = clipOffsetTime * spd;

        if (clipOffsetTime < 0.08 || (clip.duration / spd) - clipOffsetTime < 0.08) {
          showToast('Điểm cắt phải cách 2 đầu ít nhất 0.1s');
          return;
        }

        playNekoSound('split');
        const clip1 = { ...clip, id: `clip_${Date.now()}_1`, duration: sourceOffset };
        const clip2 = {
          ...clip,
          id: `clip_${Date.now()}_2`,
          trimStart: clip.trimStart + sourceOffset,
          duration: clip.duration - sourceOffset
        };

        const newClips = [...videoClips];
        newClips.splice(clipIndex, 1, clip1, clip2);
        setVideoClips(newClips);
        setActiveClipId(clip2.id);
        activeClipIdRef.current = clip2.id;
        setIsClipSelected(true);

        if (timelineScrollRef.current) {
          isSystemScrolling.current = true;
          timelineScrollRef.current.scrollLeft = t * timelineZoom;
          setTimeout(() => { isSystemScrolling.current = false; }, 30);
        }
        renderCanvasFrame(t);
        showToast('🐾 Đã tách clip chuẩn Neko!');
      };

      const handleOpenCoverModal = () => {
        pauseVideo();
        playNekoSound('click');
        setCoverScrubTime(currentTimeRef.current);
        setShowCoverModal(true);
      };

      const handleSaveCoverImage = () => {
        const canvas = canvasRef.current;
        if (canvas) {
          const snapshotUrl = canvas.toDataURL('image/jpeg', 0.85);
          setCoverImage(snapshotUrl);
        }
        setShowCoverModal(false);
        playNekoSound('success');
        showToast('🐾 Đã lưu ảnh bìa Neko!');
      };

      const applyMatrixTemplate = async (customVideoFile = null) => {
        const url = customVideoFile ? URL.createObjectURL(customVideoFile) : SAMPLE_WW_VIDEO;
        const name = customVideoFile ? customVideoFile.name : 'Neko_Combat_Sample.mp4';
        showToast('🐾 NekoAuto đang phân tích trận đấu...');

        const trueDuration = await getExactVideoDuration(url);
        const combatDuration = Math.max(1.0, trueDuration - 2.0);
        const chosenStyle = WW_STYLES.find((s) => s.id === selectedStyleId) || WW_STYLES[0];

        const scoreClip = {
          id: `score_${Date.now()}`,
          name: '01. Điểm Neko (Mở đầu)',
          url,
          sourceDuration: trueDuration,
          trimStart: Math.max(0, trueDuration - 2.0),
          duration: 2.0,
          speed: 1.0,
          colorFilter: 'high-contrast',
          volume: 1.0,
          isScoreClip: true
        };

        const combatClip = {
          id: `combat_${Date.now()}`,
          name: `02. Combat (${chosenStyle.name})`,
          url,
          sourceDuration: trueDuration,
          trimStart: 0,
          duration: combatDuration,
          speed: 1.0,
          colorFilter: chosenStyle.id,
          volume: 1.0
        };

        const finalClips = autoScoreLoop ? [scoreClip, combatClip] : [{ ...combatClip, duration: trueDuration }];

        setProjectTitle(name.replace(/\.[^/.]+$/, ""));
        setVideoClips(finalClips);
        setActiveClipId(null);
        setIsClipSelected(false);
        activeClipIdRef.current = finalClips[0].id;
        setSelectedRatio(ASPECT_RATIOS[0]);
        setCurrentTime(0);
        currentTimeRef.current = 0;
        setSubtitles([]);
        setAudioClips([]);
        setShowTemplateModal(false);
        setCurrentPage('editor');
        if (timelineScrollRef.current) timelineScrollRef.current.scrollLeft = 0;
        showToast(`🐾 NekoAuto kích hoạt: ${trueDuration.toFixed(1)}s!`);
      };

      const handleExportMP4 = async () => {
        if (videoClips.length === 0 || isExporting) return;
        pauseVideo();
        setIsExporting(true);
        setExportProgress(0);
        playNekoSound('click');

        const vid = hiddenVideoRef.current;
        if (!vid) {
          setIsExporting(false);
          return;
        }

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = selectedRatio.w;
        exportCanvas.height = selectedRatio.h;
        const exportCtx = exportCanvas.getContext('2d', { alpha: false });

        try {
          const stream = exportCanvas.captureStream(30);
          const mimeType = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')
            ? 'video/mp4;codecs=avc1'
            : MediaRecorder.isTypeSupported('video/mp4')
            ? 'video/mp4'
            : 'video/webm';

          const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 14000000 });
          const chunks = [];
          recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `NekoCut_${Date.now()}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
            setIsExporting(false);
            playNekoSound('success');
            showToast('🐾 Xuất video Neko thành công!');
          };

          recorder.start();

          const fps = 24;
          const totalSteps = Math.max(24, Math.round(totalDuration * fps));
          for (let i = 0; i <= totalSteps; i++) {
            const targetT = (i / totalSteps) * totalDuration;
            const info = getCurrentClipInfo(targetT);
            if (info) {
              if (vid.src !== info.clip.url) vid.src = info.clip.url;
              vid.currentTime = info.mediaSourceTime;
              await new Promise((res) => {
                const onSeek = () => {
                  drawFrameToContext(exportCtx, exportCanvas.width, exportCanvas.height, targetT);
                  vid.removeEventListener('seeked', onSeek);
                  res();
                };
                vid.addEventListener('seeked', onSeek);
                setTimeout(onSeek, 35);
              });
            }
            setExportProgress(Math.round((i / totalSteps) * 100));
          }
          recorder.stop();
        } catch (err) {
          setIsExporting(false);
          showToast('Hoàn tất trích xuất Neko');
        }
      };

      return (
        <div className="flex flex-col h-full w-full bg-[#050508] text-zinc-100 select-none overflow-hidden relative font-sans">
          
          <video
            ref={hiddenVideoRef}
            className="hidden"
            playsInline
            crossOrigin="anonymous"
            onLoadedMetadata={() => renderCanvasFrame(currentTimeRef.current)}
          />

          {/* ============================================================== */}
          {/* TRANG 1: MÀN HÌNH CHÍNH NEKO THEME                             */}
          {/* ============================================================== */}
          {currentPage === 'home' && (
            <div className="flex flex-col h-full w-full overflow-hidden bg-[#07070a] relative select-none">
              
              <header className="h-16 px-4 pt-2 flex items-center justify-between z-20 shrink-0">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-full border-2 border-pink-500/60 overflow-hidden bg-zinc-900 shadow-[0_0_12px_rgba(255,42,122,0.4)] shrink-0">
                    <img
                      src="https://api.dicebear.com/7.x/bottts/svg?seed=NekoSagiri"
                      alt="Neko Avatar"
                      className="w-full h-full object-cover"
                      onError={(e) => { e.target.src = 'https://placehold.co/80x80/1a1a2e/ff2a7a?text=NEKO'; }}
                    />
                  </div>
                  <div className="text-xl font-black tracking-tight font-sans">
                    <span className="text-[#ff2a7a]">NekoCut </span>
                    <span className="text-[#ffb703]">Pro</span>
                  </div>
                </div>

                <button
                  onClick={() => {
                    playNekoSound('click');
                    setShowTemplateModal(true);
                  }}
                  className="px-3.5 py-1.5 rounded-full bg-gradient-to-r from-[#ff2a7a] via-[#ff5364] to-[#ffa726] text-black font-extrabold text-xs flex items-center gap-1.5 shadow-[0_0_15px_rgba(255,42,122,0.45)] active:scale-95 transition"
                >
                  <CatPawSvg className="w-3.5 h-3.5 fill-black" />
                  <span>MatrixAuto</span>
                </button>
              </header>

              <div className="flex-1 overflow-y-auto neko-scroll px-4 pt-6 space-y-4">
                <div className="relative">
                  <div className="flex items-end gap-3 pl-8 -mb-1 relative z-10">
                    <div className="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[18px] border-b-[#ff2a7a] drop-shadow-[0_0_8px_rgba(255,42,122,0.9)]" />
                    <div className="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[18px] border-b-[#ff2a7a] drop-shadow-[0_0_8px_rgba(255,42,122,0.9)]" />
                  </div>

                  <div className="rounded-[26px] bg-[#121118]/90 border border-white/[0.07] p-5 shadow-2xl relative overflow-hidden backdrop-blur-sm">
                    <div className="absolute -top-4 -left-4 text-pink-500/10 pointer-events-none scale-150">
                      <CatPawSvg className="w-24 h-24" />
                    </div>

                    <div className="relative z-10 space-y-2">
                      <div className="flex items-center gap-2">
                        <h2 className="text-xl font-extrabold text-white">Dự Án Mới</h2>
                        <span className="text-lg">🐾</span>
                      </div>
                      <p className="text-xs text-zinc-400 font-medium leading-relaxed max-w-[280px]">
                        Tải clip gameplay Neko lên để biên tập chuẩn Mobile & PC
                      </p>

                      <label className="mt-4 w-full py-3.5 px-4 rounded-full bg-gradient-to-r from-[#ff2a7a] via-[#ff5e57] to-[#ffb300] text-black font-extrabold text-sm flex items-center justify-center gap-2 cursor-pointer shadow-[0_4px_22px_rgba(255,42,122,0.45)] hover:brightness-105 active:scale-[0.98] transition">
                        <CatPawSvg className="w-4 h-4 fill-black" />
                        <span>Chọn Video Từ Thiết Bị</span>
                        <input
                          type="file"
                          accept="video/*"
                          onChange={(e) => {
                            const file = e.target.files?.[0];
                            if (file) handleCreateNewProject(file);
                          }}
                          className="hidden"
                        />
                      </label>
                    </div>
                  </div>
                </div>

                <div
                  onClick={() => {
                    playNekoSound('click');
                    setShowTemplateModal(true);
                  }}
                  className="rounded-2xl bg-[#14141c] border border-white/[0.06] p-3.5 flex items-center justify-between cursor-pointer hover:border-pink-500/40 active:scale-[0.99] transition shadow-lg"
                >
                  <div className="flex items-center gap-3 min-w-0">
                    <div className="w-11 h-11 rounded-full overflow-hidden bg-zinc-800 border border-pink-500/40 shrink-0">
                      <img
                        src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=120&auto=format&fit=crop&q=80"
                        alt="Neko Character"
                        className="w-full h-full object-cover"
                        onError={(e) => { e.target.src = 'https://placehold.co/80x80/23202e/ff2a7a?text=NEKO'; }}
                      />
                    </div>
                    <div className="min-w-0 pr-1">
                      <div className="text-xs font-bold text-[#ff2a7a] truncate">
                        Mẫu MatrixAuto Cắt Sẵn
                      </div>
                      <div className="text-[10px] text-zinc-400 mt-0.5 truncate">
                        Tự trích 2s điểm cao cuối trận lên đầu clip
                      </div>
                    </div>
                  </div>

                  <div className="text-xs font-bold text-[#ff2a7a] flex items-center gap-1 shrink-0 pl-2">
                    <span>Thử ngay</span>
                    <span>→</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* TRANG 2: TRÌNH BIÊN TẬP (NEKO STUDIO)                           */}
          {/* ============================================================== */}
          {currentPage === 'editor' && (
            <div className="flex flex-col h-full w-full overflow-hidden">
              
              {/* Header Neko Studio */}
              <header className="h-12 px-3 pt-1 flex items-center justify-between z-30 shrink-0 bg-[#09090e]">
                <div className="flex items-center gap-3">
                  <button
                    onClick={handleBackToHome}
                    className="w-8 h-8 rounded-full flex items-center justify-center text-zinc-300 hover:text-white active:scale-90"
                    title="Đóng dự án"
                  >
                    <CloseIcon className="w-5 h-5" />
                  </button>
                  <button
                    onClick={() => showToast('🐾 Tìm kiếm hiệu ứng Neko')}
                    className="w-8 h-8 rounded-full flex items-center justify-center text-zinc-300 active:scale-90"
                  >
                    <SearchIcon className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={() => {
                      const nextIdx = (ASPECT_RATIOS.findIndex((r) => r.id === selectedRatio.id) + 1) % ASPECT_RATIOS.length;
                      setSelectedRatio(ASPECT_RATIOS[nextIdx]);
                      showToast(`Tỉ lệ: ${ASPECT_RATIOS[nextIdx].label}`);
                    }}
                    className="flex items-center gap-1.5 px-3 py-1 rounded-md bg-[#18181f] border border-white/[0.08] text-xs font-semibold text-zinc-200 active:scale-95"
                  >
                    <span className="text-pink-400">🐾</span>
                    <span>NekoHD</span>
                    <span className="text-[10px] text-zinc-400">▼</span>
                  </button>

                  <button
                    onClick={handleExportMP4}
                    disabled={isExporting}
                    className="px-4 py-1 rounded-lg bg-[#ff2a7a] text-white font-black text-xs shadow-[0_0_12px_rgba(255,42,122,0.4)] active:scale-95 transition disabled:opacity-50"
                  >
                    {isExporting ? 'Đang xuất...' : 'Xuất'}
                  </button>
                </div>
              </header>

              {/* Preview Video Trung Tâm (Hỗ trợ Pinch-to-zoom 2 ngón & Pan 1 ngón) */}
              <main
                onClick={() => {
                  if (isClipSelected) setIsClipSelected(false);
                }}
                className="flex-1 flex items-center justify-center relative overflow-hidden bg-black p-2 min-h-0 touch-none"
              >
                <div

                      </div>
                    </div>

                    <label className="relative inline-flex items-center cursor-pointer">
                      <input
                        type="checkbox"
                        checked={noiseReduction}
                        onChange={(e) => {
                          const val = e.target.checked;
                          setNoiseReduction(val);
                          setVideoClips((prev) =>
                            prev.map((c) => (c.id === activeClip?.id ? { ...c, noiseReduction: val } : c))
                          );
                          playNekoSound('click');
                          showToast(val ? '🐾 Đã bật giảm tiếng ồn' : 'Đã tắt');
                        }}
                        className="sr-only peer"
                      />
                      <div className="w-9 h-5 bg-zinc-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#ff2a7a]" />
                    </label>
                  </div>

                  <div className="flex items-center justify-between py-2.5 border-t border-white/[0.06]">
                    <div>
                      <div className="text-xs font-semibold text-zinc-200 flex items-center gap-1.5">
                        <span>Điều chỉnh độ ồn</span>
                        <span className="text-pink-400 text-xs">🐾</span>
                      </div>
                      <div className="text-[10px] text-zinc-500 mt-0.5">
                        Balances other clips' volume based on the current clip.
                      </div>
                    </div>

                    <label className="relative inline-flex items-center cursor-pointer">
                      <input
                        type="checkbox"
                        checked={loudnessNorm}
                        onChange={(e) => {
                          const val = e.target.checked;
                          setLoudnessNorm(val);
                          setVideoClips((prev) =>
                            prev.map((c) => (c.id === activeClip?.id ? { ...c, loudnessNorm: val } : c))
                          );
                          playNekoSound('click');
                          showToast(val ? '🐾 Đã cân bằng độ ồn' : 'Đã tắt');
                        }}
                        className="sr-only peer"
                      />
                      <div className="w-9 h-5 bg-zinc-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#ff2a7a]" />
                    </label>
                  </div>
                </div>
              )}

              {/* Tool Sheet Phụ */}
              {showToolSheet && (
                <div className="fixed inset-x-0 bottom-0 z-50 bg-[#121218] border-t border-white/[0.1] rounded-t-2xl p-4 shadow-2xl max-h-[50vh] overflow-y-auto neko-scroll animate-in slide-in-from-bottom duration-200">
                  <div className="flex items-center justify-between border-b border-white/[0.08] pb-2 mb-3">
                    <span className="text-xs font-black text-pink-400 uppercase tracking-wider">
                      Công cụ Neko: {activeBottomMenu}
                    </span>
                    <button
                      onClick={() => setShowToolSheet(false)}
                      className="w-6 h-6 rounded-full bg-zinc-800 text-zinc-300 flex items-center justify-center text-xs active:scale-90"
                      title="Đóng"
                    >
                      ✕
                    </button>
                  </div>

                  {activeBottomMenu === 'filter' && (
                    <div className="grid grid-cols-2 gap-2">
                      {FILTERS.map((filt) => (
                        <button
                          key={filt.id}
                          onClick={() => {
                            if (activeClip) {
                              setVideoClips((prev) =>
                                prev.map((c) => (c.id === activeClip.id ? { ...c, colorFilter: filt.id } : c))
                              );
                              renderCanvasFrame(currentTimeRef.current);
                              playNekoSound('click');
                              showToast(`🐾 Bộ lọc: ${filt.name}`);
                            }
                          }}
                          className={`p-3 rounded-xl border text-left text-xs font-bold flex items-center justify-between ${
                            activeClip?.colorFilter === filt.id ? 'bg-pink-500/20 border-pink-400 text-pink-300' : 'bg-zinc-900 border-white/[0.06] text-zinc-300'
                          }`}
                        >
                          <span>{filt.name}</span>
                          {activeClip?.colorFilter === filt.id && <span className="text-pink-400">✓</span>}
                        </button>
                      ))}
                    </div>
                  )}

                  {activeBottomMenu === 'edit' && activeClip && (
                    <div className="space-y-3">
                      <div className="space-y-1.5">
                        <label className="text-[11px] text-zinc-400 font-bold">Tốc độ phát:</label>
                        <div className="grid grid-cols-6 gap-1">
                          {SPEED_OPTIONS.map((spd) => (
                            <button
                              key={spd}
                              onClick={() => {
                                setVideoClips((prev) =>
                                  prev.map((c) => (c.id === activeClip.id ? { ...c, speed: spd } : c))
                                );
                                playNekoSound('click');
                                showToast(`🐾 Tốc độ ${spd}x`);
                              }}
                              className={`py-1.5 rounded text-xs font-mono font-bold ${
                                (activeClip.speed || 1.0) === spd ? 'bg-pink-500 text-white' : 'bg-zinc-800 text-zinc-300'
                              }`}
                            >
                              {spd}x
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Modal Ảnh Bìa */}
              {showCoverModal && (
                <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col justify-between animate-in fade-in duration-200 select-none">
                  <div className="h-12 px-4 flex items-center justify-between border-b border-white/[0.08] bg-[#0c0c12]">
                    <button
                      onClick={() => setShowCoverModal(false)}
                      className="text-xs text-zinc-400 hover:text-white active:scale-95"
                    >
                      Hủy
                    </button>
                    <span className="text-sm font-bold text-white tracking-wide">
                      Chọn Ảnh Bìa Neko
                    </span>
                    <button
                      onClick={handleSaveCoverImage}
                      className="px-3.5 py-1 rounded-full bg-[#ff2a7a] text-white font-extrabold text-xs active:scale-95 shadow-[0_0_12px_rgba(255,42,122,0.4)]"
                    >
                      Lưu
                    </button>
                  </div>

                  <div className="flex-1 flex flex-col items-center justify-center p-4 relative min-h-0">
                    <div className="relative max-h-full max-w-full rounded-xl overflow-hidden border-2 border-pink-500/80 shadow-[0_0_30px_rgba(255,42,122,0.2)]">
                      <canvas
                        ref={(node) => {
                          if (node) {
                            node.width = selectedRatio.w;
                            node.height = selectedRatio.h;
                            const ctx = node.getContext('2d');
                            if (ctx) {
                              drawFrameToContext(ctx, node.width, node.height, coverScrubTime);
                              if (showCoverTextOnThumb && coverTitleText) {
                                ctx.save();
                                ctx.font = `900 ${Math.round(node.width * 0.052)}px 'Montserrat', sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.fillStyle = '#ffb703';
                                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                                ctx.shadowBlur = 12;
                                ctx.fillText(coverTitleText, node.width / 2, node.height * 0.88);
                                ctx.restore();
                              }
                            }
                          }
                        }}
                        className="max-h-[calc(100vh-280px)] max-w-full object-contain"
                        style={{ aspectRatio: selectedRatio.ratioCss }}
                      />
                    </div>

                    <div className="mt-2 text-xs font-mono text-pink-300 font-bold bg-[#14141e] px-3 py-1 rounded-full border border-pink-500/30">
                      Mốc thời gian: {formatTimeCode(coverScrubTime)}
                    </div>
                  </div>

                  <div className="p-4 bg-[#0e0e16] border-t border-white/[0.08] space-y-3">
                    <div className="flex items-center gap-2">
                      <input
                        type="text"
                        value={coverTitleText}
                        onChange={(e) => setCoverTitleText(e.target.value)}
                        placeholder="Nhập tiêu đề ảnh bìa..."
                        className="flex-1 bg-[#181824] border border-white/[0.1] rounded-lg px-3 py-1.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-pink-500"
                      />
                      <button
                        onClick={() => setShowCoverTextOnThumb(!showCoverTextOnThumb)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                          showCoverTextOnThumb ? 'bg-pink-500/20 border-pink-400 text-pink-300' : 'bg-zinc-800 border-white/[0.06] text-zinc-400'
                        }`}
                      >
                        {showCoverTextOnThumb ? 'Hiện chữ' : 'Ẩn chữ'}
                      </button>
                    </div>

                    <div className="space-y-1">
                      <div className="flex items-center justify-between text-[11px] text-zinc-400">
                        <span>Trượt chọn khung hình:</span>
                        <span className="font-mono text-zinc-300 font-bold">{coverScrubTime.toFixed(1)}s / {totalDuration.toFixed(1)}s</span>
                      </div>
                      <input
                        type="range"
                        min={0}
                        max={totalDuration}
                        step={0.05}
                        value={coverScrubTime}
                        onChange={(e) => {
                          const val = parseFloat(e.target.value);
                          setCoverScrubTime(val);
                          seekTo(val, true);
                        }}
                        className="w-full h-2 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-[#ff2a7a]"
                      />
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Modal MatrixAuto */}
          {showTemplateModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-[#121019] border-t sm:border border-white/[0.12] w-full max-w-lg rounded-t-3xl sm:rounded-3xl flex flex-col max-h-[88vh] overflow-hidden shadow-2xl">
                
                <div className="p-4 border-b border-zinc-800/80 flex items-center justify-between shrink-0 bg-[#15131d]">
                  <div className="flex items-center gap-2">
                    <CatPawSvg className="w-5 h-5 text-pink-400" />
                    <h3 className="font-extrabold text-sm text-zinc-100">Kịch Bản MatrixAuto Neko</h3>
                  </div>
                  <button
                    onClick={() => setShowTemplateModal(false)}
                    className="w-8 h-8 rounded-full bg-zinc-800/80 hover:bg-zinc-700 text-zinc-400 flex items-center justify-center text-xs active:scale-90"
                    title="Đóng"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 overflow-y-auto neko-scroll space-y-4 flex-1">
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-zinc-300">Tông màu trận đấu:</label>
                    <div className="space-y-2">
                      {WW_STYLES.map((st) => (
                        <div
                          key={st.id}
                          onClick={() => setSelectedStyleId(st.id)}
                          className={`p-3 rounded-xl border text-left cursor-pointer flex items-center justify-between transition ${
                            selectedStyleId === st.id
                              ? 'bg-pink-500/20 border-pink-400 text-pink-300 shadow-[0_0_12px_rgba(255,42,122,0.2)]'
                              : 'bg-zinc-900/60 border-white/[0.06] text-zinc-300 hover:border-zinc-700'
                          }`}
                        >
                          <div>
                            <div className="text-xs font-bold">{st.name}</div>
                            <div className="text-[10px] text-zinc-400 mt-0.5">{st.desc}</div>
                          </div>
                          {selectedStyleId === st.id && (
                            <span className="text-pink-400 font-bold text-sm shrink-0">✓</span>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  <label className="flex items-center justify-between bg-zinc-900/70 p-3.5 rounded-xl border border-white/[0.06] cursor-pointer active:bg-zinc-800 transition">
                    <span className="text-xs text-zinc-200 font-medium">Tự động trích 2s điểm số đưa lên đầu clip</span>
                    <input
                      type="checkbox"
                      checked={autoScoreLoop}
                      onChange={(e) => setAutoScoreLoop(e.target.checked)}
                      className="w-5 h-5 accent-pink-500 rounded cursor-pointer shrink-0"
                    />
                  </label>
                </div>

                <div className="p-4 pt-3 pb-8 sm:pb-4 border-t border-zinc-800/80 bg-[#121019] shrink-0 grid grid-cols-2 gap-3 z-10">
                  <button
                    type="button"
                    onClick={() => applyMatrixTemplate()}
                    className="h-12 rounded-xl bg-zinc-800/90 text-xs font-bold text-zinc-100 border border-white/[0.1] hover:bg-zinc-700 active:scale-95 flex items-center justify-center transition shadow-md"
                  >
                    Dùng Video Mẫu Neko
                  </button>

                  <label className="h-12 rounded-xl bg-gradient-to-r from-pink-500 via-rose-500 to-amber-400 text-xs font-black text-black text-center shadow-[0_0_16px_rgba(255,42,122,0.4)] cursor-pointer flex items-center justify-center active:scale-95 transition">
                    <span>Chọn Video Của Bạn</span>
                    <input
                      type="file"
                      accept="video/*"
                      onChange={(e) => {
                        const f = e.target.files?.[0];
                        if (f) applyMatrixTemplate(f);
                      }}
                      className="hidden"
                    />
                  </label>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-[#161622]/95 border border-pink-500/40 text-pink-200 px-4 py-2 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 backdrop-blur-md whitespace-nowrap animate-fade-in">
              <CatPawSvg className="w-4 h-4 text-pink-400" />
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
