    );

    const SAMPLE_WW_VIDEO = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4';

    const ASPECT_RATIOS = [
      { id: '16-9', label: '16:9 (Chuẩn WW 1080p)', w: 1920, h: 1080, ratioCss: '16/9', isDefault: true },
      { id: '9-16', label: '9:16 (TikTok / Shorts 1080p)', w: 1080, h: 1920, ratioCss: '9/16' },
      { id: '1-1', label: '1:1 (Vuông Instagram 1080p)', w: 1080, h: 1080, ratioCss: '1/1' },
      { id: '21-9', label: '21:9 (Điện ảnh 2K)', w: 2560, h: 1080, ratioCss: '21/9' }
    ];

    const WW_STYLES = [
      { id: 'crisp', name: 'Crisp & Punchy', desc: 'Contrast +15, Saturation +8. Nét sâu đòn đánh.', css: 'contrast(1.18) saturate(1.12) brightness(0.96)' },
      { id: 'cyber', name: 'Deep Cyber Matrix', desc: 'Lạnh & Sâu, làm rực sáng các vệt tia VFX neon.', css: 'contrast(1.22) saturate(1.25) hue-rotate(185deg) brightness(0.92)' },
      { id: 'vibrant', name: 'Vibrant VFX Anime', desc: 'Màu sắc bùng nổ, chiêu nộ rực rỡ và nịnh mắt.', css: 'contrast(1.15) saturate(1.45) brightness(1.04)' }
    ];

    const ANIM_IN_EFFECTS = [
      { id: 'none', label: 'Không hiệu ứng', icon: '⛔' },
      { id: 'flash', label: '⚡ White Flash', icon: '⚡' },
      { id: 'black_flash', label: '🌑 Fade In Đen', icon: '🌑' },
      { id: 'whip', label: '💥 Whip Zoom', icon: '💥' },
      { id: 'zoom_in', label: '🔍 Phóng To Nhẹ', icon: '🔍' },
      { id: 'glitch', label: '👾 Cyber Glitch', icon: '👾' },
      { id: 'shake', label: '📳 Rung Chấn Mạnh', icon: '📳' },
      { id: 'blur_in', label: '🌫 Mờ Nét', icon: '🌫' },
      { id: 'slide_up', label: '⬆ Trượt Từ Dưới', icon: '⬆️' },
      { id: 'slide_down', label: '⬇️ Trượt Từ Trên', icon: '⬇️' },
      { id: 'slide_left', label: '⬅ Lướt Từ Trái', icon: '⬅️' },
      { id: 'rgb_split', label: '🌈 Quang Sai RGB', icon: '🌈' }
    ];

    const FILTERS = [
      { id: 'none', name: 'Gốc (Bình thường)', cat: 'all', tag: 'Original', css: 'none' },
      { id: 'crisp', name: 'Crisp & Punchy', cat: 'ww', tag: 'WW Hot', css: 'contrast(1.18) saturate(1.12) brightness(0.96)' },
      { id: 'high-contrast', name: 'High Contrast (Điểm)', cat: 'ww', tag: 'WW Score', css: 'contrast(1.35) saturate(1.2) brightness(1.05)' },
      { id: 'cyber', name: 'Deep Cyber Matrix', cat: 'ww', tag: 'WW Neon', css: 'contrast(1.22) saturate(1.25) hue-rotate(185deg) brightness(0.92)' },
      { id: 'vibrant', name: 'Vibrant VFX Anime', cat: 'ww', tag: 'WW Anime', css: 'contrast(1.15) saturate(1.45) brightness(1.04)' }
    ];

    const getExactVideoDuration = (videoUrl) => {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.preload = 'auto';
        v.src = videoUrl;
        v.onloadedmetadata = () => {
          if (v.duration === Infinity || isNaN(v.duration) || v.duration === 0) {
            v.currentTime = 1e101;
            v.ontimeupdate = () => {
              v.ontimeupdate = null;
              const trueDur = v.duration && !isNaN(v.duration) && v.duration !== Infinity ? v.duration : 15;
              v.currentTime = 0;
              resolve(Math.max(1, trueDur));
            };
          } else {
            resolve(v.duration);
          }
        };
        v.onerror = () => resolve(15);
        setTimeout(() => resolve(v.duration && !isNaN(v.duration) ? v.duration : 15), 2000);
      });
    };

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [toastMsg, setToastMsg] = useState('');

      // Timeline Clips State
      const [videoClips, setVideoClips] = useState([]);
      const [activeClipId, setActiveClipId] = useState(null);
      const [currentTime, setCurrentTime] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const [selectedRatio, setSelectedRatio] = useState(ASPECT_RATIOS[0]);
      const [fitMode, setFitMode] = useState('fit');

      // Audio Control
      const [masterVolume, setMasterVolume] = useState(1.0);
      const [bgmTrack, setBgmTrack] = useState(null);
      const [showAddMusicModal, setShowAddMusicModal] = useState(false);
      const [ytLinkInput, setYtLinkInput] = useState('');
      const [isProcessingAudio, setIsProcessingAudio] = useState(false);

      // Subtitles & Text Dragging
      const [subtitles, setSubtitles] = useState([]);
      const [activeSubId, setActiveSubId] = useState(null);
      const [newSubText, setNewSubText] = useState('Highlight Matrix WW');
      const [draggingSubId, setDraggingSubId] = useState(null);

      // Drag and Drop & Modals
      const [draggedClipIndex, setDraggedClipIndex] = useState(null);
      const [dragOverIndex, setDragOverIndex] = useState(null);
      const [showScorePickerModal, setShowScorePickerModal] = useState(false);
      const [previewScoreTime, setPreviewScoreTime] = useState(0);
      const [activeInspectorTab, setActiveInspectorTab] = useState('clip');
      const [historyStack, setHistoryStack] = useState([]);
      const [showTemplateModal, setShowTemplateModal] = useState(false);
      const [selectedStyleId, setSelectedStyleId] = useState('crisp');
      const [autoScoreLoop, setAutoScoreLoop] = useState(true);

      // Export State
      const [isExporting, setIsExporting] = useState(false);
      const [exportProgress, setExportProgress] = useState(0);

      // Core Refs
      const canvasRef = useRef(null);
      const hiddenVideoRef = useRef(null);
      const bgmAudioRef = useRef(null);
      const pickerVideoRef = useRef(null);
      const timelineTrackRef = useRef(null);
      const currentTimeRef = useRef(0);
      const prevClipIdRef = useRef(null);
      const isPlayingRef = useRef(false);
      const animationFrameRef = useRef(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      };

      const pushToHistory = useCallback(() => {
        setHistoryStack((prev) => [...prev.slice(-10), JSON.parse(JSON.stringify(videoClips))]);
      }, [videoClips]);

      const handleUndo = () => {
        if (historyStack.length === 0) return;
        const previous = historyStack[historyStack.length - 1];
        setHistoryStack((prev) => prev.slice(0, -1));
        setVideoClips(previous);
        if (previous.length > 0 && !previous.some((c) => c.id === activeClipId)) {
          setActiveClipId(previous[0].id);
        }
        showToast('Đã hoàn tác (Undo)');
      };

      const totalDuration = videoClips.reduce((sum, c) => sum + (c.duration || 0), 0);

      const getCurrentClipInfo = useCallback(
        (time) => {
          let acc = 0;
          for (let i = 0; i < videoClips.length; i++) {
            const c = videoClips[i];
            if (time >= acc && time < acc + c.duration) {
              return {
                clip: c,
                clipIndex: i,
                clipStartTime: acc,
                clipOffsetTime: time - acc,
                mediaSourceTime: c.trimStart + (time - acc)
              };
            }
            acc += c.duration;
          }
          if (videoClips.length > 0) {
            const last = videoClips[videoClips.length - 1];
            const lastStart = acc - last.duration;
            const offset = Math.min(last.duration, Math.max(0, time - lastStart));
            return {
              clip: last,
              clipIndex: videoClips.length - 1,
              clipStartTime: lastStart,
              clipOffsetTime: offset,
              mediaSourceTime: last.trimStart + offset
            };
          }
          return null;
        },
        [videoClips]
      );

      // CẬP NHẬT ÂM LƯỢNG TRỰC TIẾP LÊN THẺ NGUYÊN BẢN (KHÔNG BỊ CHẶN)
      const updateRuntimeAudioVolumes = useCallback(() => {
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;
        const curInfo = getCurrentClipInfo(currentTimeRef.current);

        if (vid && curInfo) {
          if (isMuted) {
            vid.muted = true;
          } else {
            vid.muted = false;
            const rawVol = (curInfo.clip.volume ?? 1.0) * masterVolume;
            vid.volume = Math.max(0, Math.min(1.0, rawVol));
          }
        }

        if (bgm && bgmTrack) {
          if (isMuted || bgmTrack.isMuted) {
            bgm.muted = true;
          } else {
            bgm.muted = false;
            const rawBgmVol = (bgmTrack.volume ?? 1.0) * masterVolume;
            bgm.volume = Math.max(0, Math.min(1.0, rawBgmVol));
          }
        }
      }, [getCurrentClipInfo, isMuted, masterVolume, bgmTrack]);

      useEffect(() => {
        updateRuntimeAudioVolumes();
      }, [masterVolume, isMuted, bgmTrack, updateRuntimeAudioVolumes]);

      // RENDER CANVAS CHUẨN
      const drawFrameToContext = useCallback(
        (ctx, targetW, targetH, time) => {
          const vid = hiddenVideoRef.current;
          const clipInfo = getCurrentClipInfo(time);

          ctx.fillStyle = '#09090b';
          ctx.fillRect(0, 0, targetW, targetH);

          if (clipInfo && vid && vid.readyState >= 2) {
            const { clip, clipOffsetTime } = clipInfo;

            ctx.save();
            if (fitMode === 'blur') {
              ctx.save();
              ctx.filter = 'blur(28px) brightness(0.6)';
              const bScale = Math.max(targetW / vid.videoWidth, targetH / vid.videoHeight);
              const bW = vid.videoWidth * bScale;
              const bH = vid.videoHeight * bScale;
              ctx.drawImage(vid, (targetW - bW) / 2, (targetH - bH) / 2, bW, bH);
              ctx.restore();
            }

            const filterDef = FILTERS.find((f) => f.id === clip.colorFilter) || FILTERS[0];
            let activeCssFilter = filterDef.css !== 'none' ? filterDef.css : '';

            const sFactor = fitMode === 'cover'
              ? Math.max(targetW / vid.videoWidth, targetH / vid.videoHeight)
              : Math.min(targetW / vid.videoWidth, targetH / vid.videoHeight);

            const drawW = vid.videoWidth * sFactor;
            const drawH = vid.videoHeight * sFactor;
            const drawX = (targetW - drawW) / 2;
            const drawY = (targetH - drawH) / 2;

            const animDuration = clip.animInDuration || 0.45;
            const isInAnim = clip.animIn && clip.animIn !== 'none' && clipOffsetTime <= animDuration;

            if (isInAnim) {
              const prog = Math.min(1, Math.max(0, clipOffsetTime / animDuration));
              if (clip.animIn === 'flash') {
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, 0.9 * (1 - prog))})`;
                ctx.fillRect(0, 0, targetW, targetH);
              } else {
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              }
            } else {
              ctx.filter = activeCssFilter || 'none';
              ctx.drawImage(vid, drawX, drawY, drawW, drawH);
            }
            ctx.restore();
          }

          // Render Subtitles
          subtitles.forEach((sub) => {
            if (time >= sub.start && time <= sub.end) {
              ctx.save();
              const fontSize = Math.max(16, Math.floor((sub.fontSize || 34) * (targetW / 1920)));
              ctx.font = `bold ${fontSize}px sans-serif`;
              ctx.textAlign = 'center';
              const pX = (targetW * (sub.x ?? 50)) / 100;
              const pY = (targetH * (sub.y ?? 82)) / 100;
              const metrics = ctx.measureText(sub.text);

              if (sub.showBg) {
                ctx.fillStyle = sub.id === activeSubId ? 'rgba(236, 72, 153, 0.85)' : 'rgba(0, 0, 0, 0.75)';
                ctx.beginPath();
                ctx.roundRect(pX - metrics.width / 2 - 14, pY - fontSize * 0.85, metrics.width + 28, fontSize * 1.3, 8);
                ctx.fill();
              }
              ctx.fillStyle = sub.color || '#ffffff';
              ctx.fillText(sub.text, pX, pY);
              ctx.restore();
            }
          });
        },
        [getCurrentClipInfo, subtitles, activeSubId, fitMode]
      );

      const renderCanvasFrame = useCallback(
        (time) => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d', { alpha: false });
          if (!ctx) return;
          drawFrameToContext(ctx, canvas.width, canvas.height, time);
        },
        [drawFrameToContext]
      );

      // PLAY/PAUSE KHÔNG BỊ TRÌNH DUYỆT CHẶN ÂM THANH
      const playVideo = async () => {
        if (videoClips.length === 0) return;
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;

        if (currentTimeRef.current >= totalDuration - 0.08) {
          currentTimeRef.current = 0;
          setCurrentTime(0);
          prevClipIdRef.current = null;
        }

        const info = getCurrentClipInfo(currentTimeRef.current);
        if (info && vid) {
          if (vid.src !== info.clip.url) vid.src = info.clip.url;
          vid.currentTime = info.mediaSourceTime;
          updateRuntimeAudioVolumes();
          try { await vid.play(); } catch (e) { console.warn('Vid play:', e); }
        }

        if (bgm && bgmTrack && bgm.src) {
          const bgmOffset = currentTimeRef.current - (bgmTrack.timelineStart || 0);
          if (bgmOffset >= 0 && bgmOffset <= (bgmTrack.duration || 999)) {
            bgm.currentTime = (bgmTrack.trimStart || 0) + bgmOffset;
            updateRuntimeAudioVolumes();
            try { await bgm.play(); } catch (e) { console.warn('Bgm play:', e); }
          }
        }

        isPlayingRef.current = true;
        setIsPlaying(true);
      };

      const pauseVideo = () => {
        isPlayingRef.current = false;
        setIsPlaying(false);
        if (hiddenVideoRef.current) hiddenVideoRef.current.pause();
        if (bgmAudioRef.current) bgmAudioRef.current.pause();
      };

      const togglePlay = () => {
        if (isPlayingRef.current) pauseVideo();
        else playVideo();
      };

      // VÒNG LẶP RENDER KHÔNG CAN THIỆP GÂY GIẬT ÂM THANH
      useEffect(() => {
        let lastTime = performance.now();
        const loop = (now) => {
          const delta = Math.min(0.08, (now - lastTime) / 1000);
          lastTime = now;

          if (isPlayingRef.current) {
            const vid = hiddenVideoRef.current;
            const currentInfo = getCurrentClipInfo(currentTimeRef.current);

            if (currentInfo && vid) {
              if (prevClipIdRef.current !== currentInfo.clip.id) {
                prevClipIdRef.current = currentInfo.clip.id;
                setActiveClipId(currentInfo.clip.id);
                if (vid.src !== currentInfo.clip.url) vid.src = currentInfo.clip.url;
                vid.currentTime = currentInfo.mediaSourceTime;
                updateRuntimeAudioVolumes();
                vid.play().catch(() => {});
              }

              currentTimeRef.current += delta;

              if (currentTimeRef.current >= totalDuration) {
                currentTimeRef.current = totalDuration;
                setCurrentTime(totalDuration);
                pauseVideo();
                renderCanvasFrame(totalDuration);
              } else {
                setCurrentTime(currentTimeRef.current);
                renderCanvasFrame(currentTimeRef.current);
              }
            } else {
              pauseVideo();
            }
          }
          animationFrameRef.current = requestAnimationFrame(loop);
        };

        animationFrameRef.current = requestAnimationFrame(loop);
        return () => {
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };
      }, [getCurrentClipInfo, renderCanvasFrame, totalDuration, updateRuntimeAudioVolumes]);

      const seekTo = (targetTime) => {
        const clamped = Math.max(0, Math.min(totalDuration, targetTime));
        currentTimeRef.current = clamped;
        setCurrentTime(clamped);

        const info = getCurrentClipInfo(clamped);
        const vid = hiddenVideoRef.current;
        if (info && vid) {
          if (prevClipIdRef.current !== info.clip.id) {
            prevClipIdRef.current = info.clip.id;
            setActiveClipId(info.clip.id);
            if (vid.src !== info.clip.url) vid.src = info.clip.url;
          }
          vid.currentTime = info.mediaSourceTime;
          updateRuntimeAudioVolumes();
        }

        if (bgmAudioRef.current && bgmTrack) {
          const bgmOffset = clamped - (bgmTrack.timelineStart || 0);
          if (bgmOffset >= 0 && bgmOffset <= (bgmTrack.duration || 999)) {
            bgmAudioRef.current.currentTime = (bgmTrack.trimStart || 0) + bgmOffset;
          }
        }
        renderCanvasFrame(clamped);
      };

      const handleAddMusicFromFile = (file) => {
        if (!file) return;
        const url = URL.createObjectURL(file);
        const temp = new Audio();
        temp.src = url;
        temp.onloadedmetadata = () => {
          const dur = temp.duration && !isNaN(temp.duration) ? temp.duration : 60;
          setBgmTrack({
            id: `bgm_${Date.now()}`,
            name: file.name.substring(0, 24),
            url,
            timelineStart: 0,
            trimStart: 0,
            duration: Math.min(dur, totalDuration || dur),
            sourceDuration: dur,
            volume: 1.0,
            isMuted: false
          });
          if (bgmAudioRef.current) bgmAudioRef.current.src = url;
          setShowAddMusicModal(false);
          showToast('Đã nạp file nhạc nền!');
        };
      };

      const handleAddMusicFromYouTube = async () => {
        const rawLink = ytLinkInput.trim();
        if (!rawLink) return;
        const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
        const match = rawLink.match(ytRegex);
        if (!match || !match[1]) return showToast('Link YouTube không hợp lệ!');

        const videoId = match[1];
        setIsProcessingAudio(true);
        showToast('Đang kết nối luồng Invidious API...');

        try {
          const res = await fetch(`https://inv.tux.pizza/api/v1/videos/${videoId}`);
          const data = await res.json();
          const bestAudio = data.adaptiveFormats?.filter((f) => f.type?.startsWith('audio/'))?.[0];

          setBgmTrack({
            id: `yt_${videoId}`,
            name: data.title?.substring(0, 24) || `YouTube (${videoId})`,
            url: bestAudio?.url || SAMPLE_WW_VIDEO,
            timelineStart: 0,
            trimStart: 0,
            duration: totalDuration || 90,
            sourceDuration: 90,
            volume: 1.0,
            isMuted: false
          });
          if (bgmAudioRef.current) bgmAudioRef.current.src = bestAudio?.url || SAMPLE_WW_VIDEO;
          setIsProcessingAudio(false);
          setShowAddMusicModal(false);
          showToast('Đã kết nối nhạc từ YouTube!');
        } catch (e) {
          setIsProcessingAudio(false);
          showToast('Lỗi Proxy. Vui lòng chọn tệp MP3 từ máy!');
        }
      };

      // TÁCH NHẠC NỀN TẠI KIM PHÁT
      const handleSplitBgm = () => {
        if (!bgmTrack) return;
        const offset = currentTime - (bgmTrack.timelineStart || 0);
        if (offset < 0.5 || offset > bgmTrack.duration - 0.5) {
          showToast('Điểm tách nhạc cần cách hai đầu ít nhất 0.5s');
          return;
        }
        setBgmTrack((prev) => ({
          ...prev,
          duration: offset
        }));
        showToast('Đã cắt ngắn nhạc đến vị trí kim phát');
      };

      // XUẤT VIDEO 1080P HOÀN CHỈNH
      const handleExportMP4 = async () => {
        if (videoClips.length === 0 || isExporting) return;
        pauseVideo();
        setIsExporting(true);
        setExportProgress(0);

        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = selectedRatio.w;
        exportCanvas.height = selectedRatio.h;
        const exportCtx = exportCanvas.getContext('2d', { alpha: false });

        try {
          const stream = exportCanvas.captureStream(30);
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          let audioCtx = null;

          if (AudioCtxClass) {
            audioCtx = new AudioCtxClass();
            await audioCtx.resume();
            const dest = audioCtx.createMediaStreamDestination();
            const masterGain = audioCtx.createGain();
            masterGain.gain.value = isMuted ? 0 : masterVolume;
            masterGain.connect(dest);

            if (vid && !isMuted) {
              const vidSrc = audioCtx.createMediaElementSource(vid);
              vidSrc.connect(masterGain);
            }
            if (bgm && bgmTrack && !bgmTrack.isMuted) {
              const bgmSrc = audioCtx.createMediaElementSource(bgm);
              bgmSrc.connect(masterGain);
            }
            dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
          }

          const recorder = new MediaRecorder(stream, { mimeType: 'video/webm', videoBitsPerSecond: 14000000 });
          const chunks = [];
          recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `NekoCut_${Date.now()}.mp4`;
            a.click();
            setIsExporting(false);
            if (audioCtx) audioCtx.close();
            seekTo(0);
            showToast('Xuất video thành công!');
          };

          recorder.start();
          const fps = 30;
          const totalFrames = Math.ceil(totalDuration * fps);

          for (let f = 0; f <= totalFrames; f++) {
            const targetT = (f / totalFrames) * totalDuration;
            const info = getCurrentClipInfo(targetT);
            if (info && vid) {
              if (vid.src !== info.clip.url) vid.src = info.clip.url;
              vid.currentTime = info.mediaSourceTime;
              if (bgm && bgmTrack) {
                const bgmOffset = targetT - (bgmTrack.timelineStart || 0);
                if (bgmOffset >= 0 && bgmOffset <= bgmTrack.duration) {
                  bgm.currentTime = (bgmTrack.trimStart || 0) + bgmOffset;
                }
              }
              await new Promise((res) => {
                const onSeek = () => {
                  drawFrameToContext(exportCtx, exportCanvas.width, exportCanvas.height, targetT);
                  vid.removeEventListener('seeked', onSeek);
                  res();
                };
                vid.addEventListener('seeked', onSeek);
                setTimeout(onSeek, 40);
              });
            }
            setExportProgress(Math.round((f / totalFrames) * 100));
          }
          recorder.stop();
        } catch (e) {
          setIsExporting(false);
          showToast('Lỗi khi xuất video');
        }
      };

      if (currentPage === 'home') {
        return (
          <div className="flex flex-col min-h-screen bg-[#08080c] text-white select-none relative font-sans">
            <CatPawTrail />
            <header className="h-16 border-b border-white/[0.07] px-6 flex items-center justify-between bg-zinc-950/75 sticky top-0 z-30">
              <div className="flex items-center gap-3">
                <NekoCutLogo className="w-9 h-9" />
                <span className="font-black text-xl bg-gradient-to-r from-pink-400 to-amber-300 bg-clip-text text-transparent">
                  NekoCut Pro
                </span>
              </div>
            </header>
            <main className="flex-1 max-w-xl mx-auto px-4 py-16 flex flex-col justify-center text-center space-y-6">
              <div className="p-8 bg-zinc-900/60 rounded-3xl border border-white/[0.08] shadow-2xl space-y-4">
                <CatEarsSvg className="w-20 h-7 mx-auto text-pink-500" />
                <h1 className="text-2xl font-black">Biên Tập Video Wuthering Waves</h1>
                <p className="text-xs text-zinc-400">Đầy đủ âm thanh, kéo cắt nhạc nền và căn chỉnh chữ tự do.</p>
                <label className="inline-flex items-center gap-2.5 px-6 py-3.5 rounded-2xl bg-gradient-to-r from-pink-500 to-amber-400 text-zinc-950 font-black text-sm cursor-pointer shadow-xl">
                  <CatPawSvg className="w-5 h-5" />
                  <span>Chọn Video Của Bạn</span>
                  <input
                    type="file"
                    accept="video/*"
                    onChange={async (e) => {
                      const file = e.target.files?.[0];
                      if (!file) return;
                      const url = URL.createObjectURL(file);
                      const dur = await getExactVideoDuration(url);
                      setVideoClips([{
                        id: `clip_${Date.now()}`,
                        name: file.name.substring(0, 20),
                        url,
                        sourceDuration: dur,
                        trimStart: 0,
                        duration: dur,
                        colorFilter: 'none',
                        animIn: 'none',
                        volume: 1.0
                      }]);
                      setActiveClipId(`clip_${Date.now()}`);
                      setCurrentPage('studio');
                      showToast(`Đã nhận ${dur.toFixed(1)}s video!`);
                    }}
                    className="hidden"
                  />
                </label>
              </div>
            </main>
          </div>
        );
      }

      const activeClip = videoClips.find((c) => c.id === activeClipId) || videoClips[0];

      return (
        <div className="flex flex-col h-screen w-screen bg-[#07070b] text-white select-none overflow-hidden font-sans">
          {/* THẺ MEDIA HIỆN DIỆN VỚI KÍCH THƯỚC TỐI THIỂU ĐỂ TRÌNH DUYỆT KHÔNG TẮT TIẾNG */}
          <div className="absolute top-0 left-0 w-1 h-1 opacity-0 pointer-events-none overflow-hidden">
            <video ref={hiddenVideoRef} playsInline crossOrigin="anonymous" onLoadedMetadata={() => renderCanvasFrame(currentTimeRef.current)} />
            <audio ref={bgmAudioRef} playsInline crossOrigin="anonymous" />
          </div>

          <header className="h-12 border-b border-white/[0.08] px-4 flex items-center justify-between bg-zinc-950/90 z-20 shrink-0">
            <div className="flex items-center gap-2.5">
              <button onClick={() => { pauseVideo(); setCurrentPage('home'); }} className="p-1.5 rounded-xl bg-zinc-900 text-zinc-400 hover:text-white">
                <ArrowLeftIcon className="w-4 h-4" />
              </button>
              <NekoCutLogo className="w-7 h-7" />
              <span className="font-black text-sm bg-gradient-to-r from-pink-400 to-amber-300 bg-clip-text text-transparent">NekoCut Pro</span>
            </div>
            <button onClick={handleExportMP4} disabled={isExporting} className="px-4 py-1.5 rounded-xl bg-gradient-to-r from-pink-500 to-amber-400 text-zinc-950 text-xs font-black">
              <DownloadIcon className="w-3.5 h-3.5 inline mr-1" />
              Xuất MP4
            </button>
          </header>

          <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
            {/* Inspector Left */}
            <aside className="w-full lg:w-80 border-r border-white/[0.06] bg-[#0b0b10] p-3 space-y-3 overflow-y-auto shrink-0 text-xs">
              <div className="grid grid-cols-4 gap-1 p-1 bg-zinc-900 rounded-xl text-center font-bold">
                {['clip', 'filter', 'text', 'ratio'].map((tab) => (
                  <button key={tab} onClick={() => setActiveInspectorTab(tab)} className={`py-1 rounded-lg capitalize ${activeInspectorTab === tab ? 'bg-zinc-800 text-pink-400' : 'text-zinc-400'}`}>
                    {tab}
                  </button>
                ))}
              </div>

              {/* Master Volume */}
              <div className="bg-zinc-900/60 p-3 rounded-2xl border border-white/[0.06] space-y-2">
                <div className="flex justify-between font-bold text-amber-400">
                  <span>Âm Lượng Tổng:</span>
                  <span>{Math.round(masterVolume * 100)}%</span>
                </div>
                <input type="range" min={0} max={2.0} step={0.05} value={masterVolume} onChange={(e) => setMasterVolume(parseFloat(e.target.value))} className="w-full accent-amber-400 h-1.5 bg-zinc-800 rounded cursor-pointer" />
              </div>

              {/* BGM Panel */}
              <div className="bg-zinc-900/60 p-3 rounded-2xl border border-white/[0.06] space-y-2">
                <div className="flex justify-between font-bold text-pink-400">
                  <span>Nhạc Nền (BGM):</span>
                  <span>{bgmTrack ? `${Math.round((bgmTrack.volume ?? 1.0) * 100)}%` : 'Chưa có'}</span>
                </div>
                {bgmTrack && (
                  <>
                    <input type="range" min={0} max={2.0} step={0.05} value={bgmTrack.volume ?? 1.0} onChange={(e) => setBgmTrack({ ...bgmTrack, volume: parseFloat(e.target.value) })} className="w-full accent-pink-400 h-1.5 bg-zinc-800 rounded cursor-pointer" />
                    <button onClick={handleSplitBgm} className="w-full py-1.5 bg-zinc-800 hover:bg-zinc-700 text-amber-300 font-bold rounded-xl flex items-center justify-center gap-1.5">
                      <ScissorsIcon className="w-3.5 h-3.5" /> Tách Nhạc Tại Kim Phát
                    </button>
                  </>
                )}
                <button onClick={() => setShowAddMusicModal(true)} className="w-full py-2 bg-pink-500/20 text-pink-300 rounded-xl font-bold border border-pink-500/30">
                  {bgmTrack ? 'Đổi Nhạc / YouTube' : '+ Thêm Nhạc Nền'}
                </button>
              </div>

              {/* Tab Text */}
              {activeInspectorTab === 'text' && (
                <div className="bg-zinc-900/60 p-3 rounded-2xl border border-white/[0.06] space-y-2">
                  <input type="text" value={newSubText} onChange={(e) => setNewSubText(e.target.value)} className="w-full bg-zinc-950 p-2 rounded-xl text-white border border-white/[0.08]" placeholder="Nhập chữ..." />
                  <button
                    onClick={() => {
                      const newSub = {
                        id: `sub_${Date.now()}`,
                        text: newSubText || 'Highlight WW',
                        start: currentTime,
                        end: Math.min(totalDuration, currentTime + 3.0),
                        x: 50,
                        y: 80,
                        showBg: true
                      };
                      setSubtitles([...subtitles, newSub]);
                      setActiveSubId(newSub.id);
                      showToast('Đã thêm chữ lên Timeline!');
                    }}
                    className="w-full py-2 bg-gradient-to-r from-pink-500 to-amber-400 text-zinc-950 font-bold rounded-xl"
                  >
                    + Thêm Chữ Tại Giây Hiện Tại
                  </button>
                </div>
              )}
            </aside>

            {/* Canvas Preview Center */}
            <main
              className="flex-1 flex flex-col items-center justify-between p-4 bg-[#08080c] overflow-hidden"
              onPointerMove={(e) => {
                if (!draggingSubId || !canvasRef.current) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const newX = Math.max(5, Math.min(95, ((e.clientX - rect.left) / rect.width) * 100));
                const newY = Math.max(5, Math.min(95, ((e.clientY - rect.top) / rect.height) * 100));
                setSubtitles((prev) => prev.map((s) => (s.id === draggingSubId ? { ...s, x: newX, y: newY } : s)));
                renderCanvasFrame(currentTimeRef.current);
              }}
              onPointerUp={() => setDraggingSubId(null)}
            >
              <div className="flex-1 w-full flex items-center justify-center min-h-0">
                <canvas
                  ref={canvasRef}
                  width={selectedRatio.w}
                  height={selectedRatio.h}
                  onPointerDown={(e) => {
                    if (!canvasRef.current) return;
                    const rect = canvasRef.current.getBoundingClientRect();
                    const clickX = ((e.clientX - rect.left) / rect.width) * 100;
                    const clickY = ((e.clientY - rect.top) / rect.height) * 100;
                    const found = subtitles.find((s) => currentTime >= s.start && currentTime <= s.end && Math.abs((s.x ?? 50) - clickX) < 18 && Math.abs((s.y ?? 82) - clickY) < 10);
                    if (found) { setDraggingSubId(found.id); setActiveSubId(found.id); }
                  }}
                  className="max-h-full max-w-full rounded-2xl shadow-2xl bg-black border border-white/[0.08] cursor-crosshair object-contain"
                  style={{ aspectRatio: selectedRatio.ratioCss }}
                />
              </div>

              {/* Controls Bar */}
              <div className="mt-3 flex items-center gap-4 bg-zinc-950/80 px-4 py-2 rounded-2xl border border-white/[0.08]">
                <span className="font-mono text-xs text-pink-400">{currentTime.toFixed(1)}s / {totalDuration.toFixed(1)}s</span>
                <button onClick={togglePlay} className="px-5 py-2 bg-gradient-to-r from-pink-500 to-amber-400 text-zinc-950 rounded-xl font-bold text-xs">
                  {isPlaying ? 'Tạm Dừng' : 'Phát'}
                </button>
                <button onClick={() => setIsMuted(!isMuted)} className="text-xs text-zinc-400">
                  {isMuted ? '🔇 Tắt' : '🔊 Bật'}
                </button>
              </div>
            </main>
          </div>

          {/* Timeline Bottom (Video Clips, Chữ & Nhạc nền có kéo cắt) */}
          <footer className="h-56 border-t border-white/[0.08] bg-[#09090d] p-3 space-y-2 shrink-0">
            {/* 1. Track Video Clips */}
            <div
              ref={timelineTrackRef}
              onClick={(e) => {
                if (!timelineTrackRef.current || totalDuration === 0) return;
                const rect = timelineTrackRef.current.getBoundingClientRect();
                seekTo(Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * totalDuration);
              }}
              className="relative h-14 bg-zinc-950 rounded-2xl border border-white/[0.08] p-1 flex items-center gap-1 cursor-pointer overflow-hidden shadow-inner"
            >
              {videoClips.map((clip) => (
                <div key={clip.id} style={{ width: `${Math.max(8, (clip.duration / totalDuration) * 100)}%` }} className="h-full bg-zinc-900 border border-white/[0.08] rounded-xl p-2 flex items-center justify-between text-xs">
                  <span className="truncate">{clip.name}</span>
                  <span className="font-mono text-[10px] text-zinc-400">{clip.duration.toFixed(1)}s</span>
                </div>
              ))}
              {totalDuration > 0 && <div style={{ left: `${(currentTime / totalDuration) * 100}%` }} className="absolute top-0 bottom-0 w-0.5 bg-pink-400 pointer-events-none z-20" />}
            </div>

            {/* 2. Track Text Subtitles */}
            <div className="relative h-7 bg-zinc-950/80 rounded-xl border border-dashed border-amber-500/30 overflow-hidden flex items-center px-1">
              {subtitles.map((sub) => (
                <div
                  key={sub.id}
                  onClick={(e) => { e.stopPropagation(); setActiveSubId(sub.id); seekTo(sub.start); }}
                  style={{ left: `${(sub.start / totalDuration) * 100}%`, width: `${((sub.end - sub.start) / totalDuration) * 100}%` }}
                  className="absolute top-0.5 bottom-0.5 rounded bg-amber-500/30 text-amber-300 border border-amber-500/50 flex items-center justify-between px-1 text-[10px] font-bold cursor-pointer"
                >
                  <span onClick={(e) => { e.stopPropagation(); setSubtitles(subtitles.map(s => s.id === sub.id ? { ...s, start: Math.max(0, s.start - 0.5) } : s)); }}>◀</span>
                  <span className="truncate mx-1">{sub.text}</span>
                  <span onClick={(e) => { e.stopPropagation(); setSubtitles(subtitles.map(s => s.id === sub.id ? { ...s, end: Math.min(totalDuration, s.end + 0.5) } : s)); }}>▶</span>
                </div>
              ))}
            </div>

            {/* 3. Track BGM Audio (KÉO CẮT RÚT NGẮN THỜI GIAN NHẠC NỀN) */}
            <div className="relative h-8 bg-zinc-950/80 rounded-xl border border-dashed border-pink-500/30 overflow-hidden flex items-center px-1">
              {bgmTrack ? (
                <div
                  style={{
                    left: `${((bgmTrack.timelineStart || 0) / totalDuration) * 100}%`,
                    width: `${((bgmTrack.duration || totalDuration) / totalDuration) * 100}%`
                  }}
                  className="absolute top-0.5 bottom-0.5 rounded-lg bg-pink-500/30 border border-pink-400 flex items-center justify-between px-2 text-[10px] font-bold text-pink-200"
                >
                  {/* Nút kéo lùi nhạc */}
                  <span
                    onClick={(e) => {
                      e.stopPropagation();
                      setBgmTrack((prev) => ({
                        ...prev,
                        timelineStart: Math.max(0, (prev.timelineStart || 0) - 0.5)
                      }));
                    }}
                    className="hover:scale-125 cursor-pointer opacity-70 hover:opacity-100"
                    title="Dời nhạc về trước"
                  >
                    ◀
                  </span>

                  <span className="truncate mx-2">🎵 {bgmTrack.name} ({(bgmTrack.duration).toFixed(1)}s)</span>

                  {/* Nút rút ngắn / kéo dài nhạc */}
                  <span
                    onClick={(e) => {
                      e.stopPropagation();
                      setBgmTrack((prev) => ({
                        ...prev,
                        duration: Math.max(1.0, Math.min(prev.sourceDuration || totalDuration, prev.duration + 0.5))
                      }));
                    }}
                    className="hover:scale-125 cursor-pointer opacity-70 hover:opacity-100"
                    title="Kéo dài thời lượng phát"
                  >
                    ▶
                  </span>
                </div>
              ) : (
                <span className="text-[10px] text-zinc-600 pl-2">Chưa có nhạc nền. Bấm "+ Thêm Nhạc Nền" để nạp file.</span>
              )}
            </div>
          </footer>

          {/* Modal Music */}
          {showAddMusicModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-[#110f17] border border-white/[0.12] w-full max-w-md rounded-3xl p-5 space-y-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
                  <h3 className="font-bold text-sm">Nạp Nhạc Nền (BGM)</h3>
                  <button onClick={() => setShowAddMusicModal(false)} className="text-zinc-400">✕</button>
                </div>
                <div className="space-y-2 text-xs">
                  <label className="font-bold text-zinc-300">1. Dán Link YouTube:</label>
                  <div className="flex gap-2">
                    <input type="text" value={ytLinkInput} onChange={(e) => setYtLinkInput(e.target.value)} placeholder="https://youtube.com/watch?v=..." className="flex-1 bg-zinc-950 border border-white/[0.08] rounded-xl px-3 py-2 text-white" />
                    <button onClick={handleAddMusicFromYouTube} disabled={isProcessingAudio} className="px-3 py-2 bg-pink-500 text-zinc-950 font-bold rounded-xl">Kết Nối</button>
                  </div>
                </div>
                <div className="space-y-2 text-xs">
                  <label className="font-bold text-zinc-300">2. Hoặc nạp file trực tiếp từ máy:</label>
                  <label className="w-full py-3 bg-zinc-800 rounded-xl text-center block cursor-pointer text-zinc-200 border border-white/[0.08]">
                    <span>Chọn tệp MP3, WAV hoặc MP4</span>
                    <input type="file" accept="audio/*,video/*" onChange={(e) => { const f = e.target.files?.[0]; if (f) handleAddMusicFromFile(f); }} className="hidden" />
                  </label>
                </div>
              </div>
            </div>
          )}

          {/* Toast */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-zinc-900 border border-pink-500/40 text-pink-200 px-4 py-2 rounded-2xl text-xs font-bold shadow-2xl">
              {toastMsg}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
