    const getExactVideoDuration = (videoUrl) => {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.preload = 'auto';
        v.src = videoUrl;
        const onMeta = () => {
          if (v.duration === Infinity || isNaN(v.duration) || v.duration === 0) {
            v.currentTime = 1e101;
            v.ontimeupdate = () => {
              v.ontimeupdate = null;
              const trueDur = v.duration && !isNaN(v.duration) && v.duration !== Infinity ? v.duration : 15;
              v.currentTime = 0;
              resolve(Math.max(1, trueDur));
            };
          } else {
            resolve(v.duration);
          }
        };
        v.onloadedmetadata = onMeta;
        v.onerror = () => resolve(15);
        setTimeout(() => resolve(v.duration && !isNaN(v.duration) ? v.duration : 15), 2000);
      });
    };

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [toastMsg, setToastMsg] = useState('');

      // Timeline Clips State
      const [videoClips, setVideoClips] = useState([]);
      const [activeClipId, setActiveClipId] = useState(null);
      const [currentTime, setCurrentTime] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const [selectedRatio, setSelectedRatio] = useState(ASPECT_RATIOS[0]);
      const [fitMode, setFitMode] = useState('fit');

      // Audio Track State
      const [bgmTrack, setBgmTrack] = useState(null);
      const [showAddMusicModal, setShowAddMusicModal] = useState(false);
      const [ytLinkInput, setYtLinkInput] = useState('');
      const [isProcessingAudio, setIsProcessingAudio] = useState(false);
      const bgmAudioRef = useRef(null);

      // Drag and Drop
      const [draggedClipIndex, setDraggedClipIndex] = useState(null);
      const [dragOverIndex, setDragOverIndex] = useState(null);

      // Popup 15s Cuối để chọn 2s điểm
      const [showScorePickerModal, setShowScorePickerModal] = useState(false);
      const [previewScoreTime, setPreviewScoreTime] = useState(0);

      // Subtitles
      const [subtitles, setSubtitles] = useState([]);
      const [newSubText, setNewSubText] = useState('Highlight Matrix WW');

      // Modals & Navigation
      const [activeInspectorTab, setActiveInspectorTab] = useState('clip');
      const [historyStack, setHistoryStack] = useState([]);
      const [showTemplateModal, setShowTemplateModal] = useState(false);
      const [selectedStyleId, setSelectedStyleId] = useState('crisp');
      const [autoScoreLoop, setAutoScoreLoop] = useState(true);

      // Export State
      const [isExporting, setIsExporting] = useState(false);
      const [exportProgress, setExportProgress] = useState(0);

      // Core Refs
      const canvasRef = useRef(null);
      const hiddenVideoRef = useRef(null);
      const pickerVideoRef = useRef(null);
      const timelineTrackRef = useRef(null);
      const currentTimeRef = useRef(0);
      const prevClipIdRef = useRef(null);
      const isPlayingRef = useRef(false);
      const animationFrameRef = useRef(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      };

      const pushToHistory = useCallback(() => {
        setHistoryStack((prev) => [...prev.slice(-10), JSON.parse(JSON.stringify(videoClips))]);
      }, [videoClips]);

      const handleUndo = () => {
        if (historyStack.length === 0) {
          showToast('Không còn thao tác để hoàn tác');
          return;
        }
        const previous = historyStack[historyStack.length - 1];
        setHistoryStack((prev) => prev.slice(0, -1));
        setVideoClips(previous);
        if (previous.length > 0 && !previous.some((c) => c.id === activeClipId)) {
          setActiveClipId(previous[0].id);
        }
        showToast('Đã hoàn tác (Undo)');
      };

      const totalDuration = videoClips.reduce((sum, c) => sum + (c.duration || 0), 0);

      const getCurrentClipInfo = useCallback(
        (time) => {
          let acc = 0;
          for (let i = 0; i < videoClips.length; i++) {
            const c = videoClips[i];
            if (time >= acc && time < acc + c.duration) {
              return {
                clip: c,
                clipIndex: i,
                clipStartTime: acc,
                clipOffsetTime: time - acc,
                mediaSourceTime: c.trimStart + (time - acc)
              };
            }
            acc += c.duration;
          }
          if (videoClips.length > 0) {
            const last = videoClips[videoClips.length - 1];
            const lastStart = acc - last.duration;
            const offset = Math.min(last.duration, Math.max(0, time - lastStart));
            return {
              clip: last,
              clipIndex: videoClips.length - 1,
              clipStartTime: lastStart,
              clipOffsetTime: offset,
              mediaSourceTime: last.trimStart + offset
            };
          }
          return null;
        },
        [videoClips]
      );

      const renderCanvasFrame = useCallback(
        (time) => {
          const canvas = canvasRef.current;
          const vid = hiddenVideoRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d', { alpha: false });
          if (!ctx) return;

          const clipInfo = getCurrentClipInfo(time);

          ctx.fillStyle = '#09090b';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          if (clipInfo && vid && vid.readyState >= 2) {
            const { clip, clipOffsetTime } = clipInfo;

            ctx.save();

            if (fitMode === 'blur') {
              ctx.save();
              ctx.filter = 'blur(18px) brightness(0.6)';
              const bScale = Math.max(canvas.width / vid.videoWidth, canvas.height / vid.videoHeight);
              const bW = vid.videoWidth * bScale;
              const bH = vid.videoHeight * bScale;
              ctx.drawImage(vid, (canvas.width - bW) / 2, (canvas.height - bH) / 2, bW, bH);
              ctx.restore();
            }

            const filterDef = FILTERS.find((f) => f.id === clip.colorFilter) || FILTERS[0];
            let activeCssFilter = filterDef.css !== 'none' ? filterDef.css : '';

            const sFactor =
              fitMode === 'cover'
                ? Math.max(canvas.width / vid.videoWidth, canvas.height / vid.videoHeight)
                : Math.min(canvas.width / vid.videoWidth, canvas.height / vid.videoHeight);

            const drawW = vid.videoWidth * sFactor;
            const drawH = vid.videoHeight * sFactor;
            const drawX = (canvas.width - drawW) / 2;
            const drawY = (canvas.height - drawH) / 2;

            const animDuration = clip.animInDuration || 0.45;
            const isInAnim = clip.animIn && clip.animIn !== 'none' && clipOffsetTime <= animDuration;

            if (isInAnim) {
              const prog = Math.min(1, Math.max(0, clipOffsetTime / animDuration));
              const easeOut = Math.sin((prog * Math.PI) / 2);

              if (clip.animIn === 'flash') {
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, 0.9 * (1 - prog))})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
              } else if (clip.animIn === 'black_flash') {
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
                ctx.fillStyle = `rgba(0, 0, 0, ${Math.max(0, 1 - prog)})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
              } else if (clip.animIn === 'whip') {
                const sc = 1.35 - 0.35 * easeOut;
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(sc, sc);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              } else if (clip.animIn === 'zoom_in') {
                const sc = 0.7 + 0.3 * easeOut;
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(sc, sc);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);
                ctx.globalAlpha = Math.min(1, prog * 1.3);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              } else if (clip.animIn === 'glitch') {
                const shiftX = (1 - prog) * (Math.random() * 16 - 8);
                const shiftY = (1 - prog) * (Math.random() * 8 - 4);
                ctx.filter = (activeCssFilter ? activeCssFilter + ' ' : '') + `hue-rotate(${(1 - prog) * 90}deg)`;
                ctx.drawImage(vid, drawX + shiftX, drawY + shiftY, drawW, drawH);
              } else if (clip.animIn === 'shake') {
                const amp = (1 - prog) * 14;
                const ox = Math.sin(prog * Math.PI * 10) * amp;
                const oy = Math.cos(prog * Math.PI * 8) * amp * 0.5;
                ctx.translate(ox, oy);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              } else if (clip.animIn === 'blur_in') {
                const blurVal = (1 - prog) * 12;
                ctx.filter = (activeCssFilter ? activeCssFilter + ' ' : '') + `blur(${blurVal}px)`;
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              } else {
                ctx.globalAlpha = Math.min(1, prog);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              }
            } else {
              ctx.filter = activeCssFilter || 'none';
              ctx.drawImage(vid, drawX, drawY, drawW, drawH);
            }

            ctx.restore();

            if (clip.hasVignette) {
              ctx.save();
              const grad = ctx.createRadialGradient(
                canvas.width / 2,
                canvas.height / 2,
                canvas.width * 0.25,
                canvas.width / 2,
                canvas.height / 2,
                canvas.width * 0.65
              );
              grad.addColorStop(0, 'rgba(0,0,0,0)');
              grad.addColorStop(0.7, 'rgba(0,0,0,0.3)');
              grad.addColorStop(1, 'rgba(0,0,0,0.85)');
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.restore();
            }
          }

          subtitles.forEach((sub) => {
            if (time >= sub.start && time <= sub.end) {
              ctx.save();
              const maxW = canvas.width * 0.85;
              let fontSize = sub.fontSize || 22;
              ctx.font = `bold ${fontSize}px sans-serif`;
              let metrics = ctx.measureText(sub.text);

              if (metrics.width > maxW) {
                fontSize = Math.max(12, Math.floor(fontSize * (maxW / metrics.width)));
                ctx.font = `bold ${fontSize}px sans-serif`;
                metrics = ctx.measureText(sub.text);
              }

              ctx.textAlign = 'center';
              const pX = canvas.width / 2;
              const pY = (canvas.height * (sub.y || 82)) / 100;

              if (sub.showBg) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.beginPath();
                ctx.roundRect(pX - metrics.width / 2 - 8, pY - fontSize * 0.85, metrics.width + 16, fontSize * 1.3, 6);
                ctx.fill();
              }

              ctx.fillStyle = sub.color || '#ffffff';
              ctx.fillText(sub.text, pX, pY);
              ctx.restore();
            }
          });
        },
        [getCurrentClipInfo, subtitles, fitMode]
      );

      const playVideo = () => {
        if (videoClips.length === 0) return;
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;

        if (currentTimeRef.current >= totalDuration - 0.08) {
          currentTimeRef.current = 0;
          setCurrentTime(0);
          prevClipIdRef.current = null;
        }

        const info = getCurrentClipInfo(currentTimeRef.current);
        if (info && vid) {
          if (vid.src !== info.clip.url) vid.src = info.clip.url;
          if (Math.abs(vid.currentTime - info.mediaSourceTime) > 0.15) {
            vid.currentTime = info.mediaSourceTime;
          }
          vid.volume = isMuted ? 0 : info.clip.volume || 1.0;
          vid.play().catch(() => {});
        }

        if (bgm && bgmTrack && bgm.src) {
          bgm.currentTime = currentTimeRef.current % (bgmTrack.duration || 9999);
          bgm.volume = bgmTrack.isMuted ? 0 : (bgmTrack.volume ?? 0.8);
          bgm.play().catch(() => {});
        }

        isPlayingRef.current = true;
        setIsPlaying(true);
      };

      const pauseVideo = () => {
        isPlayingRef.current = false;
        setIsPlaying(false);
        if (hiddenVideoRef.current) hiddenVideoRef.current.pause();
        if (bgmAudioRef.current) bgmAudioRef.current.pause();
      };

      const togglePlay = () => {
        if (isPlayingRef.current) pauseVideo();
        else playVideo();
      };

      useEffect(() => {
        let lastTime = performance.now();
        let lastUiTime = 0;

        const loop = (now) => {
          const delta = Math.min(0.08, (now - lastTime) / 1000);
          lastTime = now;

          if (isPlayingRef.current) {
            const vid = hiddenVideoRef.current;
            const currentInfo = getCurrentClipInfo(currentTimeRef.current);

            if (currentInfo && vid) {
              if (prevClipIdRef.current !== currentInfo.clip.id) {
                prevClipIdRef.current = currentInfo.clip.id;
                setActiveClipId(currentInfo.clip.id);
                if (vid.src !== currentInfo.clip.url) vid.src = currentInfo.clip.url;
                vid.currentTime = currentInfo.mediaSourceTime;
                vid.volume = isMuted ? 0 : currentInfo.clip.volume || 1.0;
                vid.play().catch(() => {});
              } else if (vid.paused && vid.readyState >= 2) {
                vid.play().catch(() => {});
              }

              currentTimeRef.current += delta;

              if (currentTimeRef.current >= totalDuration) {
                currentTimeRef.current = totalDuration;
                setCurrentTime(totalDuration);
                pauseVideo();
                renderCanvasFrame(totalDuration);
              } else {
                if (now - lastUiTime > 50) {
                  setCurrentTime(currentTimeRef.current);
                  lastUiTime = now;
                }
                renderCanvasFrame(currentTimeRef.current);
              }
            } else {
              pauseVideo();
            }
          }
          animationFrameRef.current = requestAnimationFrame(loop);
        };

        animationFrameRef.current = requestAnimationFrame(loop);
        return () => {
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };
      }, [getCurrentClipInfo, renderCanvasFrame, totalDuration, isMuted]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (e.code === 'Space') {
            e.preventDefault();
            togglePlay();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const seekTo = (targetTime) => {
        const clamped = Math.max(0, Math.min(totalDuration, targetTime));
        currentTimeRef.current = clamped;
        setCurrentTime(clamped);

        const info = getCurrentClipInfo(clamped);
        const vid = hiddenVideoRef.current;
        if (info && vid) {
          if (prevClipIdRef.current !== info.clip.id) {
            prevClipIdRef.current = info.clip.id;
            setActiveClipId(info.clip.id);
            if (vid.src !== info.clip.url) vid.src = info.clip.url;
          }
          vid.currentTime = info.mediaSourceTime;
          const onSeek = () => {
            renderCanvasFrame(clamped);
            vid.removeEventListener('seeked', onSeek);
          };
          vid.addEventListener('seeked', onSeek);
          renderCanvasFrame(clamped);
        } else {
          renderCanvasFrame(clamped);
        }

        if (bgmAudioRef.current && bgmTrack) {
          bgmAudioRef.current.currentTime = clamped % (bgmTrack.duration || 9999);
        }
      };

      const handleAddMusicFromFile = async (file) => {
        if (!file) return;
        setIsProcessingAudio(true);
        showToast('Đang trích xuất âm thanh từ tệp...');

        try {
          const url = URL.createObjectURL(file);
          const tempAudio = new Audio();
          tempAudio.src = url;

          tempAudio.onloadedmetadata = () => {
            const dur = tempAudio.duration && !isNaN(tempAudio.duration) && tempAudio.duration !== Infinity
              ? tempAudio.duration
              : totalDuration || 60;

            setBgmTrack({
              id: `bgm_${Date.now()}`,
              name: file.name.substring(0, 30),
              url,
              duration: dur,
              volume: 0.8,
              isMuted: false,
              type: file.type.startsWith('video') ? 'video_extracted' : 'audio'
            });

            if (bgmAudioRef.current) {
              bgmAudioRef.current.src = url;
              bgmAudioRef.current.currentTime = currentTimeRef.current;
            }

            setIsProcessingAudio(false);
            setShowAddMusicModal(false);
            showToast('Đã thêm bài nhạc nền thành công!');
          };

          tempAudio.onerror = () => {
            setBgmTrack({
              id: `bgm_${Date.now()}`,
              name: file.name.substring(0, 30),
              url,
              duration: totalDuration || 60,
              volume: 0.8,
              isMuted: false,
              type: 'audio'
            });
            setIsProcessingAudio(false);
            setShowAddMusicModal(false);
            showToast('Đã nạp file nhạc!');
          };
        } catch (err) {
          console.error(err);
          setIsProcessingAudio(false);
          showToast('Không thể trích xuất âm thanh');

      };

      const handleAddMusicFromYouTube = async () => {

        const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
        const match = rawLink.match(ytRegex);

        if (!match || !match[1]) {
          showToast('Link YouTube không hợp lệ!');
          return;
        }

        const videoId = match[1];
        setIsProcessingAudio(true);
        showToast('Đang kết nối luồng YouTube...');

        try {
          const sampleAudioUrl = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4';
          setBgmTrack({

          showToast('Lỗi trích xuất từ YouTube');

      const handleDragStart = (e, index) => {

      const handleDragOver = (e, index) => {

      const handleDrop = (e, targetIndex) => {

          setDragOverIndex(null);
          return;

        pushToHistory();
        const updated = [...videoClips];
        const [moved] = updated.splice(draggedClipIndex, 1);
        updated.splice(targetIndex, 0, moved);
        setVideoClips(updated);
        setActiveClipId(moved.id);
        setDraggedClipIndex(null);
        setDragOverIndex(null);

            pickerVideoRef.current.currentTime = clip.trimStart;

      const applySelectedScoreTime = (confirmedTrimStart) => {
        pushToHistory();
        setVideoClips((prev) =>

        setShowScorePickerModal(false);
        seekTo(0);
        showToast('Đã chọn 2s điểm số mới cho clip mở đầu!');
      };

      const handleTimelineScrub = (e) => {
        if (!timelineTrackRef.current || totalDuration === 0) return;
        const rect = timelineTrackRef.current.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, clickX / rect.width));
        seekTo(ratio * totalDuration);
      };

      const handleSplitClip = () => {
        if (!activeClipId || isPlaying) return;
        pushToHistory();

        const info = getCurrentClipInfo(currentTimeRef.current);
        if (!info || info.clip.id !== activeClipId) {
          showToast('Đặt kim phát trong đoạn cần tách');
          return;
        }

        const { clip, clipIndex, clipOffsetTime } = info;
        if (clipOffsetTime < 0.2 || clipOffsetTime > clip.duration - 0.2) {
          showToast('Điểm tách cần cách hai đầu ít nhất 0.2s');
          return;
        }

        const clip1 = { ...clip, id: `clip_${Date.now()}_1`, duration: clipOffsetTime };
        const clip2 = {
          ...clip,
          id: `clip_${Date.now()}_2`,
          trimStart: clip.trimStart + clipOffsetTime,
          duration: clip.duration - clipOffsetTime,
          animIn: 'none'
        };

        const newClips = [...videoClips];
        newClips.splice(clipIndex, 1, clip1, clip2);
        setVideoClips(newClips);
        setActiveClipId(clip2.id);
        showToast('Đã tách đoạn');
      };

      const handleDuplicateClip = () => {
        if (!activeClipId) return;
        pushToHistory();
        const idx = videoClips.findIndex((c) => c.id === activeClipId);
        if (idx === -1) return;

        const source = videoClips[idx];
        const clone = { ...source, id: `clip_${Date.now()}_copy`, name: `${source.name} (Bản sao)` };
        const newClips = [...videoClips];
        newClips.splice(idx + 1, 0, clone);
        setVideoClips(newClips);
        setActiveClipId(clone.id);
        showToast('Đã nhân bản');
      };

      const handleDeleteClip = () => {
        if (!activeClipId || videoClips.length <= 1) {
          showToast('Cần giữ ít nhất 1 đoạn');
          return;
        }
        pushToHistory();
        const newClips = videoClips.filter((c) => c.id !== activeClipId);
        setVideoClips(newClips);
        setActiveClipId(newClips[0]?.id || null);
        seekTo(Math.min(currentTimeRef.current, newClips.reduce((s, c) => s + c.duration, 0)));
        showToast('Đã xóa clip');
      };

      const applyMatrixTemplate = async (customVideoFile = null) => {
        pushToHistory();
        const url = customVideoFile ? URL.createObjectURL(customVideoFile) : SAMPLE_WW_VIDEO;
        showToast('Đang nhận diện toàn bộ thời lượng video...');

        const trueDuration = await getExactVideoDuration(url);
        const scoreDuration = Math.min(2.0, Math.max(0.5, trueDuration * 0.2));
        const combatDuration = Math.max(1.0, trueDuration - scoreDuration);
        const chosenStyle = WW_STYLES.find((s) => s.id === selectedStyleId) || WW_STYLES[0];

        const scoreClip = {
          id: `score_${Date.now()}`,
          name: '01. Điểm Matrix (Mở đầu)',
          url,
          sourceDuration: trueDuration,
          trimStart: Math.max(0, trueDuration - 2.0),
          duration: 2.0,
          colorFilter: 'high-contrast',
          hasVignette: true,
          animIn: 'flash',
          animInDuration: 0.35,
          volume: 1.0,
          isScoreClip: true
        };

        const combatClip = {
          id: `combat_${Date.now()}`,
          name: `02. Combat (${chosenStyle.name})`,
          url,
          sourceDuration: trueDuration,
          trimStart: 0,
          duration: combatDuration,
          colorFilter: chosenStyle.id,
          hasVignette: false,
          animIn: 'whip',
          animInDuration: 0.45,
          volume: 1.0
        };

        const finalClips = autoScoreLoop ? [scoreClip, combatClip] : [{ ...combatClip, duration: trueDuration }];

        setVideoClips(finalClips);
        setActiveClipId(finalClips[0].id);
        setSelectedRatio(ASPECT_RATIOS[0]);
        setFitMode('fit');
        setCurrentTime(0);
        currentTimeRef.current = 0;
        prevClipIdRef.current = null;
        setShowTemplateModal(false);
        setCurrentPage('studio');
        showToast(`Đã nhận ${trueDuration.toFixed(1)}s! Nhấn vào clip Điểm để chỉnh 15s cuối.`);
      };

      const handleExportMP4 = async () => {
        if (videoClips.length === 0 || isExporting) return;
        pauseVideo();
        setIsExporting(true);
        setExportProgress(0);

        const canvas = canvasRef.current;
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;
        if (!canvas || !vid) {
          setIsExporting(false);
          return;
        }

        try {
          const stream = canvas.captureStream(30);

          let audioCtx = null;
          try {
            const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
            if (AudioCtxClass) {
              audioCtx = new AudioCtxClass();
              const dest = audioCtx.createMediaStreamDestination();

              if (!isMuted) {
                const vidSource = audioCtx.createMediaElementSource(vid);
                vidSource.connect(dest);
                vidSource.connect(audioCtx.destination);
              }

              if (bgmTrack && !bgmTrack.isMuted && bgm && bgm.src) {
                try {
                  const bgmSource = audioCtx.createMediaElementSource(bgm);
                  const gainNode = audioCtx.createGain();
                  gainNode.gain.value = bgmTrack.volume ?? 0.8;
                  bgmSource.connect(gainNode);
                  gainNode.connect(dest);
                  gainNode.connect(audioCtx.destination);
                } catch (err) {
                  console.warn('BGM source already connected:', err);
                }
              }

              dest.stream.getAudioTracks().forEach((track) => stream.addTrack(track));
            }
          } catch (e) {
            console.warn('Audio bypass:', e);
          }

          const mimeType = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')
            ? 'video/mp4;codecs=avc1'
            : MediaRecorder.isTypeSupported('video/mp4')
            ? 'video/mp4'
            : 'video/webm';

          const recorder = new MediaRecorder(stream, {
            mimeType,
            videoBitsPerSecond: 6000000
          });

          const chunks = [];
          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };

          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `NekoCut_WW_${Date.now()}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
            setIsExporting(false);
            showToast('Xuất video MP4 thành công!');
            if (audioCtx) audioCtx.close();
          };

          recorder.start();

          const fps = 25;
          const totalSteps = Math.max(25, Math.round(totalDuration * fps));
          for (let i = 0; i <= totalSteps; i++) {
            const targetT = (i / totalSteps) * totalDuration;
            const info = getCurrentClipInfo(targetT);
            if (info) {
              if (vid.src !== info.clip.url) vid.src = info.clip.url;
              vid.currentTime = info.mediaSourceTime;
              if (bgm && bgmTrack) {
                bgm.currentTime = targetT % (bgmTrack.duration || 9999);
              }
              await new Promise((res) => {
                const onSeek = () => {
                  renderCanvasFrame(targetT);
                  vid.removeEventListener('seeked', onSeek);
                  res();
                };
                vid.addEventListener('seeked', onSeek);
                setTimeout(res, 60);
              });
            }
            setExportProgress(Math.round((i / totalSteps) * 100));
          }

          recorder.stop();
        } catch (err) {
          console.error(err);
          setIsExporting(false);
          showToast('Có lỗi xảy ra khi xuất video');
        }
      };

              <div className="absolute -top-40 left-1/4 w-[32rem] h-[32rem] bg-gradient-to-br from-pink-600/15 via-rose-500/10 to-transparent rounded-full blur-[130px]" />
              <div className="absolute top-1/2 -right-20 w-[28rem] h-[28rem] bg-gradient-to-bl from-amber-500/12 via-orange-500/8 to-transparent rounded-full blur-[120px]" />
            </div>

            <CatPawTrail />

            <header className="h-16 border-b border-white/[0.07] px-5 md:px-8 flex items-center justify-between bg-zinc-950/75 backdrop-blur-xl sticky top-0 z-30 shadow-lg">
              <div className="flex items-center gap-3">
                <NekoCutLogo className="w-9 h-9" />
                <span className="font-black tracking-tight text-xl bg-gradient-to-r from-pink-400 via-rose-300 to-amber-300 bg-clip-text text-transparent flex items-center gap-1.5 drop-shadow-[0_2px_10px_rgba(244,63,94,0.3)]">

              >
                <CatPawSvg className="w-3.5 h-3.5" />

            <main className="flex-1 max-w-2xl w-full mx-auto px-4 md:px-6 py-12 md:py-16 space-y-9 relative z-10">

                  <CatEarsSvg className="w-20 h-7 text-pink-500 drop-shadow-[0_0_12px_rgba(236,72,153,0.95)]" />
                </div>

                <div className="relative group overflow-hidden rounded-3xl p-7 md:p-9 bg-gradient-to-br from-zinc-900/80 via-[#14121a]/90 to-[#19101d]/90 border border-white/[0.08] hover:border-pink-500/40 transition-all duration-300 shadow-2xl backdrop-blur-md">
                  <div className="relative z-10 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                    <div className="space-y-1.5">
                      <div className="flex items-center gap-2.5">
                        <span className="p-1.5 rounded-xl bg-pink-500/20 text-pink-400 border border-pink-500/30">
                          <CatPawSvg className="w-4 h-4" />
                        </span>
                        <h1 className="text-2xl md:text-3xl font-black tracking-tight text-zinc-100 flex items-center gap-2">
                          <span>Dự Án Mới</span>
                          <CatPawSvg className="w-5 h-5 text-pink-400 inline-block drop-shadow-[0_0_8px_rgba(244,63,94,0.6)]" />
                        </h1>
                      </div>
                      <p className="text-xs text-zinc-400 font-medium pl-0.5">
                        Tải video gameplay Wuthering Waves lên để bắt đầu biên tập
                      </p>
                    </div>

                    <label className="flex items-center gap-2.5 px-6 py-3.5 rounded-2xl bg-gradient-to-r from-pink-500 via-rose-500 to-amber-400 hover:from-pink-400 hover:to-amber-300 text-zinc-950 font-black text-sm shadow-[0_0_24px_rgba(236,72,153,0.35)] transition-all active:scale-95 cursor-pointer shrink-0">
                      <CatPawSvg className="w-5 h-5 text-zinc-950 animate-pulse" />
                      <span>Tải Video Của Bạn</span>
                      <input
                        type="file"

                        onChange={async (e) => {
                          const file = e.target.files?.[0];

                        {clip.isScoreClip && <span className="text-amber-400 text-xs">⭐</span>}
                        {clip.name}
                      </span>
                      <span className="text-[10px] font-mono text-zinc-400 shrink-0">{clip.duration.toFixed(1)}s</span>
                    </div>

                    {clip.isScoreClip && (
                      <span className="text-[9px] text-amber-300 font-bold bg-amber-500/20 px-1 py-0.5 rounded self-start">
                        Chạm để đổi 2s điểm
                      </span>
                    )}
                  </div>
                );
              })}

              {/* Playhead marker */}
              {totalDuration > 0 && (
                <div
                  style={{ left: `${(currentTime / totalDuration) * 100}%` }}
                  className="absolute top-0 bottom-0 w-0.5 bg-gradient-to-b from-pink-400 to-amber-300 pointer-events-none shadow-[0_0_8px_rgba(244,63,94,0.9)] z-20"
                >
                  <div className="absolute -top-1 -left-1.5 w-3.5 h-3.5 rounded-full bg-pink-500 border border-white flex items-center justify-center text-[7px]">
                    🐾
                  </div>
                </div>
              )}
            </div>

            {/* BGM Audio Track Row */}
            <div className="h-10 bg-zinc-950/80 rounded-xl border border-white/[0.06] px-3 flex items-center justify-between">
              {bgmTrack ? (
                <div className="flex items-center justify-between w-full text-xs">
                  <div className="flex items-center gap-2">
                    <MusicIcon className="w-3.5 h-3.5 text-pink-400 animate-pulse" />
                    <span className="font-bold text-zinc-200 truncate max-w-[200px]">{bgmTrack.name}</span>
                    <span className="text-[10px] font-mono text-zinc-400">({bgmTrack.duration.toFixed(1)}s)</span>
                  </div>

                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => setBgmTrack({ ...bgmTrack, isMuted: !bgmTrack.isMuted })}
                      className="text-xs text-zinc-300 hover:text-white"
                    >
                      {bgmTrack.isMuted ? '🔇 Mute' : '🔊 Bật'}
                    </button>
                    <button
                      onClick={() => {
                        setBgmTrack(null);
                        if (bgmAudioRef.current) bgmAudioRef.current.src = '';
                        showToast('Đã gỡ bài nhạc');
                      }}
                      className="text-xs text-rose-400 hover:text-rose-300 font-bold"
                    >
                      ✕ Gỡ
                    </button>
                  </div>
                </div>
              ) : (
                <div className="flex items-center justify-between w-full text-xs text-zinc-500">
                  <div className="flex items-center gap-2">
                    <MusicIcon className="w-3.5 h-3.5" />
                    <span>Chưa có nhạc nền (BGM)</span>
                  </div>
                  <button
                    onClick={() => setShowAddMusicModal(true)}
                    className="text-xs font-bold text-pink-400 hover:text-pink-300"
                  >
                    + Thêm Nhạc
                  </button>
                </div>
              )}
            </div>
          </footer>

          {/* Modal Popup 15s Cuối Chọn Điểm Số */}
          {showScorePickerModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#110f17] border border-white/[0.12] w-full max-w-lg rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <h3 className="font-extrabold text-sm text-zinc-100 flex items-center gap-1.5">
                    <span>🎯 Chọn 2s Điểm Số (15s Cuối Cùng)</span>
                  </h3>
                  <button
                    onClick={() => setShowScorePickerModal(false)}
                    className="w-7 h-7 rounded-full bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <div className="w-full aspect-video bg-black rounded-2xl overflow-hidden border border-white/[0.08] relative">
                  <video
                    ref={pickerVideoRef}
                    className="w-full h-full object-contain"
                    playsInline
                    crossOrigin="anonymous"
                  />
                  <div className="absolute top-2 right-2 bg-black/75 px-2 py-1 rounded text-[10px] font-mono font-bold text-amber-300">
                    Khung hình: {previewScoreTime.toFixed(2)}s
                  </div>
                </div>

                <div className="space-y-2">
                  <div className="flex items-center justify-between text-xs text-zinc-300">
                    <span>Mốc bắt đầu 2 giây:</span>
                    <span className="font-bold text-amber-400 font-mono">
                      {previewScoreTime.toFixed(2)}s ➔ {(previewScoreTime + 2.0).toFixed(2)}s
                    </span>
                  </div>
                  <input
                    type="range"
                    min={minScoreWindow}
                    max={maxScoreWindow}
                    step={0.05}
                    value={previewScoreTime}
                    onChange={(e) => {
                      const val = parseFloat(e.target.value);
                      setPreviewScoreTime(val);
                      if (pickerVideoRef.current) pickerVideoRef.current.currentTime = val;
                    }}
                    className="w-full accent-amber-400 h-2 bg-zinc-800 rounded-lg cursor-pointer"
                  />
                </div>

                <div className="grid grid-cols-4 gap-1.5 pt-1">
                  {[-0.5, -0.1, 0.1, 0.5].map((step) => (
                    <button
                      key={step}
                      onClick={() => {
                        const next = Math.max(minScoreWindow, Math.min(maxScoreWindow, previewScoreTime + step));
                        setPreviewScoreTime(next);
                        if (pickerVideoRef.current) pickerVideoRef.current.currentTime = next;
                      }}
                      className="py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-xs font-mono font-bold transition"
                    >
                      {step > 0 ? `+${step}s` : `${step}s`}
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => applySelectedScoreTime(previewScoreTime)}
                  className="w-full py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-amber-400 text-zinc-950 font-black text-xs shadow-lg transition active:scale-95"
                >
                  Xác Nhận Lấy 2 Giây Này
                </button>
              </div>
            </div>
          )}

          {/* Modal Thêm Nhạc / Link YouTube */}
          {showAddMusicModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#110f17] border border-white/[0.12] w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <h3 className="font-extrabold text-sm text-zinc-100 flex items-center gap-1.5">
                    <MusicIcon className="w-4 h-4 text-pink-400" />
                    <span>Thêm Nhạc Nền (BGM)</span>
                  </h3>
                  <button
                    onClick={() => setShowAddMusicModal(false)}
                    className="w-7 h-7 rounded-full bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-bold text-zinc-300">1. Dán Link YouTube:</label>
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      value={ytLinkInput}
                      onChange={(e) => setYtLinkInput(e.target.value)}
                      placeholder="https://youtube.com/watch?v=..."
                      className="flex-1 bg-zinc-950 border border-white/[0.08] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500"
                    />
                    <button
                      onClick={handleAddMusicFromYouTube}
                      disabled={isProcessingAudio}
                      className="px-3 py-2 bg-pink-500 hover:bg-pink-400 text-zinc-950 font-bold text-xs rounded-xl transition disabled:opacity-50"
                    >
                      Kết Nối
                    </button>
                  </div>
                </div>

                <div className="relative flex items-center justify-center my-2">
                  <div className="border-t border-zinc-800 w-full" />
                  <span className="bg-[#110f17] px-2 text-[10px] text-zinc-500 font-bold uppercase">Hoặc</span>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-bold text-zinc-300">2. Tải File Audio / Video từ máy:</label>
                  <label className="w-full py-3 rounded-2xl bg-zinc-800 hover:bg-zinc-750 text-zinc-200 border border-white/[0.08] text-xs font-bold flex items-center justify-center gap-2 cursor-pointer transition">
                    <span>Chọn tệp MP3, WAV, hoặc MP4 để trích xuất</span>
                    <input
                      type="file"
                      accept="audio/*,video/*"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (file) handleAddMusicFromFile(file);
                      }}
                      className="hidden"
                    />
                  </label>
                </div>
              </div>
            </div>
          )}

          {/* Popup Tiến Trình Xuất Video Tối Giản */}
          {isExporting && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#110f17] border border-white/[0.12] w-full max-w-xs rounded-3xl p-6 flex flex-col items-center justify-center space-y-4 shadow-2xl">
                <div className="text-pink-400 animate-bounce">
                  <CatPawSvg className="w-12 h-12" />
                </div>
                <div className="text-sm font-black text-zinc-100">Đang xuất video...</div>
                <div className="w-full bg-zinc-800 h-2.5 rounded-full overflow-hidden">
                  <div
                    style={{ width: `${exportProgress}%` }}
                    className="h-full bg-gradient-to-r from-pink-500 to-amber-400 transition-all duration-150"
                  />
                </div>
                <span className="text-xs font-mono font-bold text-pink-400">{exportProgress}%</span>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-zinc-950/95 border border-pink-500/40 text-pink-200 px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-2 backdrop-blur-md">
              <CatPawSvg className="w-4 h-4 text-pink-400" />
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    /* Khởi chạy React 18 */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
