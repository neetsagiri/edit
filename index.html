<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NekoCut Pro - Trình Biên Tập Wuthering Waves 1080p</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18, ReactDOM & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#07070b] text-white selection:bg-pink-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const CatPawSvg = ({ className = "w-5 h-5" }) => (
      <svg viewBox="0 0 100 100" fill="currentColor" className={className}>
        <ellipse cx="50" cy="68" rx="26" ry="20" />
        <circle cx="24" cy="38" r="11" />
        <circle cx="41" cy="24" r="11" />
        <circle cx="59" cy="24" r="11" />
        <circle cx="76" cy="38" r="11" />
      </svg>
    );

    const CatEarsSvg = ({ className = "w-16 h-8 text-pink-500" }) => (
      <svg viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
        <path d="M10 38 L28 4 L48 38 Z" fill="currentColor" fillOpacity="0.25" stroke="currentColor" strokeWidth="3" strokeLinejoin="round" />
        <path d="M20 38 L28 16 L38 38 Z" fill="currentColor" fillOpacity="0.6" />
        <path d="M110 38 L92 4 L72 38 Z" fill="currentColor" fillOpacity="0.25" stroke="currentColor" strokeWidth="3" strokeLinejoin="round" />
        <path d="M100 38 L92 16 L82 38 Z" fill="currentColor" fillOpacity="0.6" />
      </svg>
    );

    const ASPECT_RATIOS = [
      { id: '16-9', label: '16:9 (1080p Ngang)', w: 1920, h: 1080, ratioCss: '16/9' },
      { id: '9-16', label: '9:16 (Shorts / TikTok)', w: 1080, h: 1920, ratioCss: '9/16' },
      { id: '1-1', label: '1:1 (Vuông 1080p)', w: 1080, h: 1080, ratioCss: '1/1' },
      { id: '21-9', label: '21:9 (Ultrawide 2K)', w: 2560, h: 1080, ratioCss: '21/9' }
    ];

    const FILTERS = [
      { id: 'none', name: 'Gốc (Bình thường)', css: 'none' },
      { id: 'crisp', name: 'Crisp & Punchy (WW Combat)', css: 'contrast(1.22) saturate(1.15) brightness(0.97)' },
      { id: 'high-contrast', name: 'High Contrast (Bảng Điểm)', css: 'contrast(1.4) saturate(1.25) brightness(1.05)' },
      { id: 'cyber', name: 'Deep Cyber Matrix', css: 'contrast(1.25) saturate(1.3) hue-rotate(185deg) brightness(0.92)' },
      { id: 'vibrant', name: 'Vibrant VFX Anime', css: 'contrast(1.16) saturate(1.5) brightness(1.03)' }
    ];

    const getExactVideoDuration = (videoUrl) => {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.src = videoUrl;
        v.onloadedmetadata = () => {
          if (v.duration === Infinity || isNaN(v.duration) || v.duration === 0) {
            v.currentTime = 1e101;
            v.ontimeupdate = () => {
              v.ontimeupdate = null;
              resolve(v.duration && !isNaN(v.duration) && v.duration !== Infinity ? v.duration : 15);
            };
          } else {
            resolve(v.duration);
          }
        };
        v.onerror = () => resolve(15);
      });
    };

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [toastMsg, setToastMsg] = useState('');

      const [videoClips, setVideoClips] = useState([]);
      const [activeClipId, setActiveClipId] = useState(null);
      const [currentTime, setCurrentTime] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const [selectedRatio, setSelectedRatio] = useState(ASPECT_RATIOS[0]);
      const [fitMode, setFitMode] = useState('fit');

      // Audio Track State
      const [bgmTrack, setBgmTrack] = useState(null);
      const [showAddMusicModal, setShowAddMusicModal] = useState(false);
      const [ytLinkInput, setYtLinkInput] = useState('');
      const [isProcessingAudio, setIsProcessingAudio] = useState(false);
      const bgmAudioRef = useRef(null);

      // Export State
      const [isExporting, setIsExporting] = useState(false);
      const [exportProgress, setExportProgress] = useState(0);

      // Core Refs
      const canvasRef = useRef(null);
      const hiddenVideoRef = useRef(null);
      const timelineTrackRef = useRef(null);
      const currentTimeRef = useRef(0);
      const prevClipIdRef = useRef(null);
      const isPlayingRef = useRef(false);
      const animationFrameRef = useRef(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      };

      const totalDuration = videoClips.reduce((sum, c) => sum + (c.duration || 0), 0);

      const getCurrentClipInfo = useCallback((time) => {
        let acc = 0;
        for (let i = 0; i < videoClips.length; i++) {
          const c = videoClips[i];
          if (time >= acc && time < acc + c.duration) {
            return {
              clip: c,
              clipIndex: i,
              clipStartTime: acc,
              clipOffsetTime: time - acc,
              mediaSourceTime: c.trimStart + (time - acc)
            };
          }
          acc += c.duration;
        }
        if (videoClips.length > 0) {
          const last = videoClips[videoClips.length - 1];
          const lastStart = acc - last.duration;
          const offset = Math.min(last.duration, Math.max(0, time - lastStart));
          return {
            clip: last,
            clipIndex: videoClips.length - 1,
            clipStartTime: lastStart,
            clipOffsetTime: offset,
            mediaSourceTime: last.trimStart + offset
          };
        }
        return null;
      }, [videoClips]);

      // CORE RENDER METHOD: Dùng chung cho Preview Canvas và Export Canvas Full HD
      const drawFrameToContext = useCallback((targetCtx, targetW, targetH, time) => {
        const vid = hiddenVideoRef.current;
        const clipInfo = getCurrentClipInfo(time);

        targetCtx.fillStyle = '#050508';
        targetCtx.fillRect(0, 0, targetW, targetH);

        if (clipInfo && vid && vid.readyState >= 2) {
          const { clip, clipOffsetTime } = clipInfo;
          targetCtx.save();

          if (fitMode === 'blur') {
            targetCtx.save();
            targetCtx.filter = 'blur(35px) brightness(0.55)';
            const bScale = Math.max(targetW / vid.videoWidth, targetH / vid.videoHeight);
            const bW = vid.videoWidth * bScale;
            const bH = vid.videoHeight * bScale;
            targetCtx.drawImage(vid, (targetW - bW) / 2, (targetH - bH) / 2, bW, bH);
            targetCtx.restore();
          }

          const filterDef = FILTERS.find((f) => f.id === clip.colorFilter) || FILTERS[0];
          let activeCssFilter = filterDef.css !== 'none' ? filterDef.css : '';

          const sFactor = fitMode === 'cover'
            ? Math.max(targetW / vid.videoWidth, targetH / vid.videoHeight)
            : Math.min(targetW / vid.videoWidth, targetH / vid.videoHeight);

          const drawW = vid.videoWidth * sFactor;
          const drawH = vid.videoHeight * sFactor;
          const drawX = (targetW - drawW) / 2;
          const drawY = (targetH - drawH) / 2;

          targetCtx.filter = activeCssFilter || 'none';
          targetCtx.drawImage(vid, drawX, drawY, drawW, drawH);
          targetCtx.restore();

          if (clip.hasVignette) {
            targetCtx.save();
            const grad = targetCtx.createRadialGradient(
              targetW / 2, targetH / 2, targetW * 0.25,
              targetW / 2, targetH / 2, targetW * 0.7
            );
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.7, 'rgba(0,0,0,0.35)');
            grad.addColorStop(1, 'rgba(0,0,0,0.85)');
            targetCtx.fillStyle = grad;
            targetCtx.fillRect(0, 0, targetW, targetH);
            targetCtx.restore();
          }
        }
      }, [getCurrentClipInfo, fitMode]);

      const renderCanvasFrame = useCallback((time) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d', { alpha: false });
        if (!ctx) return;
        drawFrameToContext(ctx, canvas.width, canvas.height, time);
      }, [drawFrameToContext]);

      const playVideo = () => {
        if (videoClips.length === 0) return;
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;

        if (currentTimeRef.current >= totalDuration - 0.08) {
          currentTimeRef.current = 0;
          setCurrentTime(0);
          prevClipIdRef.current = null;
        }

        const info = getCurrentClipInfo(currentTimeRef.current);
        if (info && vid) {
          if (vid.src !== info.clip.url) vid.src = info.clip.url;
          if (Math.abs(vid.currentTime - info.mediaSourceTime) > 0.15) {
            vid.currentTime = info.mediaSourceTime;
          }
          vid.volume = isMuted ? 0 : info.clip.volume || 1.0;
          vid.play().catch(() => {});
        }

        if (bgm && bgmTrack && bgm.src) {
          bgm.currentTime = currentTimeRef.current % (bgmTrack.duration || 9999);
          bgm.volume = bgmTrack.isMuted ? 0 : (bgmTrack.volume ?? 0.85);
          bgm.play().catch(() => {});
        }

        isPlayingRef.current = true;
        setIsPlaying(true);
      };

      const pauseVideo = () => {
        isPlayingRef.current = false;
        setIsPlaying(false);
        if (hiddenVideoRef.current) hiddenVideoRef.current.pause();
        if (bgmAudioRef.current) bgmAudioRef.current.pause();
      };

      const togglePlay = () => {
        if (isPlayingRef.current) pauseVideo();
        else playVideo();
      };

      const seekTo = (targetTime) => {
        const clamped = Math.max(0, Math.min(totalDuration, targetTime));
        currentTimeRef.current = clamped;
        setCurrentTime(clamped);

        const info = getCurrentClipInfo(clamped);
        const vid = hiddenVideoRef.current;
        if (info && vid) {
          if (prevClipIdRef.current !== info.clip.id) {
            prevClipIdRef.current = info.clip.id;
            setActiveClipId(info.clip.id);
            if (vid.src !== info.clip.url) vid.src = info.clip.url;
          }
          vid.currentTime = info.mediaSourceTime;
          const onSeek = () => {
            renderCanvasFrame(clamped);
            vid.removeEventListener('seeked', onSeek);
          };
          vid.addEventListener('seeked', onSeek);
          renderCanvasFrame(clamped);
        } else {
          renderCanvasFrame(clamped);
        }

        if (bgmAudioRef.current && bgmTrack) {
          bgmAudioRef.current.currentTime = clamped % (bgmTrack.duration || 9999);
        }
      };

      useEffect(() => {
        let lastTime = performance.now();
        const loop = (now) => {
          const delta = Math.min(0.08, (now - lastTime) / 1000);
          lastTime = now;

          if (isPlayingRef.current) {
            const vid = hiddenVideoRef.current;
            const currentInfo = getCurrentClipInfo(currentTimeRef.current);

            if (currentInfo && vid) {
              if (prevClipIdRef.current !== currentInfo.clip.id) {
                prevClipIdRef.current = currentInfo.clip.id;
                setActiveClipId(currentInfo.clip.id);
                if (vid.src !== currentInfo.clip.url) vid.src = currentInfo.clip.url;
                vid.currentTime = currentInfo.mediaSourceTime;
                vid.volume = isMuted ? 0 : currentInfo.clip.volume || 1.0;
                vid.play().catch(() => {});
              } else if (vid.paused && vid.readyState >= 2) {
                vid.play().catch(() => {});
              }

              currentTimeRef.current += delta;

              if (currentTimeRef.current >= totalDuration) {
                currentTimeRef.current = totalDuration;
                setCurrentTime(totalDuration);
                pauseVideo();
                renderCanvasFrame(totalDuration);
              } else {
                setCurrentTime(currentTimeRef.current);
                renderCanvasFrame(currentTimeRef.current);
              }
            } else {
              pauseVideo();
            }
          }
          animationFrameRef.current = requestAnimationFrame(loop);
        };

        animationFrameRef.current = requestAnimationFrame(loop);
        return () => {
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };
      }, [getCurrentClipInfo, renderCanvasFrame, totalDuration, isMuted]);

      // Nạp luồng YouTube audio qua Invidious API
      const handleAddMusicFromYouTube = async () => {
        const rawLink = ytLinkInput.trim();
        if (!rawLink) return showToast('Vui lòng dán link YouTube');

        const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
        const match = rawLink.match(ytRegex);

        if (!match || !match[1]) return showToast('Link YouTube không hợp lệ!');

        const videoId = match[1];
        setIsProcessingAudio(true);
        showToast('Đang kết nối luồng Invidious API...');

        try {
          const res = await fetch(`https://inv.tux.pizza/api/v1/videos/${videoId}`);
          if (!res.ok) throw new Error('Proxy lỗi');
          const data = await res.json();

          const audioFormats = data.adaptiveFormats?.filter((f) => f.type?.startsWith('audio/')) || [];
          const bestAudio = audioFormats.sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0))[0];

          if (!bestAudio || !bestAudio.url) throw new Error('Không có audio');

          setBgmTrack({
            id: `yt_${videoId}`,
            name: data.title?.substring(0, 30) || `YouTube OST (${videoId})`,
            url: bestAudio.url,
            duration: data.lengthSeconds || totalDuration || 120,
            volume: 0.85,
            isMuted: false
          });

          if (bgmAudioRef.current) {
            bgmAudioRef.current.src = bestAudio.url;
            bgmAudioRef.current.currentTime = currentTimeRef.current;
          }

          setShowAddMusicModal(false);
          setIsProcessingAudio(false);
          showToast('Đã nạp audio từ YouTube thành công!');
        } catch (err) {
          console.warn(err);
          setIsProcessingAudio(false);
          showToast('Không lấy được audio trực tiếp. Hãy chọn file từ máy!');
        }
      };

      const handleAddMusicFromFile = (file) => {
        if (!file) return;
        const url = URL.createObjectURL(file);
        setBgmTrack({
          id: `bgm_${Date.now()}`,
          name: file.name.substring(0, 28),
          url,
          duration: totalDuration || 60,
          volume: 0.85,
          isMuted: false
        });
        if (bgmAudioRef.current) {
          bgmAudioRef.current.src = url;
          bgmAudioRef.current.currentTime = currentTimeRef.current;
        }
        setShowAddMusicModal(false);
        showToast('Đã nạp file nhạc nền!');
      };

      // XUẤT VIDEO 1080P TỐC ĐỘ CAO (Hardware Accelerated Recording)
      const handleFastExportMP4 = async () => {
        if (videoClips.length === 0 || isExporting) return;
        pauseVideo();
        setIsExporting(true);
        setExportProgress(0);

        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = selectedRatio.w;
        exportCanvas.height = selectedRatio.h;
        const exportCtx = exportCanvas.getContext('2d', { alpha: false });

        try {
          const stream = exportCanvas.captureStream(30);

          let audioCtx = null;
          try {
            const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
            if (AudioCtxClass) {
              audioCtx = new AudioCtxClass();
              const dest = audioCtx.createMediaStreamDestination();

              if (!isMuted && vid) {
                const vidSource = audioCtx.createMediaElementSource(vid);
                vidSource.connect(dest);
                vidSource.connect(audioCtx.destination);
              }

              if (bgmTrack && !bgmTrack.isMuted && bgm && bgm.src) {
                try {
                  const bgmSource = audioCtx.createMediaElementSource(bgm);
                  const gainNode = audioCtx.createGain();
                  gainNode.gain.value = bgmTrack.volume ?? 0.85;
                  bgmSource.connect(gainNode);
                  gainNode.connect(dest);
                  gainNode.connect(audioCtx.destination);
                } catch (e) {}
              }

              dest.stream.getAudioTracks().forEach((track) => stream.addTrack(track));
            }
          } catch (e) {}

          const mimeType = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')
            ? 'video/mp4;codecs=avc1'
            : MediaRecorder.isTypeSupported('video/mp4')
            ? 'video/mp4'
            : 'video/webm';

          const recorder = new MediaRecorder(stream, {
            mimeType,
            videoBitsPerSecond: 14000000 // 14 Mbps Full HD
          });

          const chunks = [];
          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };

          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `NekoCut_${selectedRatio.w}p_${Date.now()}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
            setIsExporting(false);
            if (audioCtx) audioCtx.close();
            seekTo(0);
            showToast('Xuất video 1080p thành công!');
          };

          recorder.start();

          let playHead = 0;
          const fps = 30;
          const interval = 1 / fps;
          const totalFrames = Math.ceil(totalDuration * fps);

          for (let f = 0; f <= totalFrames; f++) {
            playHead = Math.min(totalDuration, f * interval);
            const info = getCurrentClipInfo(playHead);
            if (info && vid) {
              if (vid.src !== info.clip.url) vid.src = info.clip.url;
              vid.currentTime = info.mediaSourceTime;
              if (bgm && bgmTrack) {
                bgm.currentTime = playHead % (bgmTrack.duration || 9999);
              }
              await new Promise((res) => {
                const onSeek = () => {
                  drawFrameToContext(exportCtx, exportCanvas.width, exportCanvas.height, playHead);
                  vid.removeEventListener('seeked', onSeek);
                  res();
                };
                vid.addEventListener('seeked', onSeek);
                setTimeout(onSeek, 40);
              });
            }
            setExportProgress(Math.round((f / totalFrames) * 100));
          }

          recorder.stop();
        } catch (err) {
          console.error(err);
          setIsExporting(false);
          showToast('Lỗi khi xuất video');
        }
      };

      if (currentPage === 'home') {
        return (
          <div className="flex flex-col min-h-screen bg-[#08080c] text-white select-none relative font-sans">
            <header className="h-16 border-b border-white/[0.07] px-6 flex items-center justify-between bg-zinc-950/80">
              <span className="font-black text-xl bg-gradient-to-r from-pink-400 to-amber-300 bg-clip-text text-transparent">
                NekoCut Pro 1080p
              </span>
            </header>
            <main className="flex-1 max-w-xl w-full mx-auto px-4 py-16 space-y-6 flex flex-col justify-center text-center">
              <div className="p-8 bg-zinc-900/60 rounded-3xl border border-white/[0.08] space-y-4">
                <CatEarsSvg className="w-16 h-8 mx-auto text-pink-500" />
                <h1 className="text-2xl font-black">Biên Tập Video Độ Phân Giải Cao</h1>
                <p className="text-xs text-zinc-400">Xuất chuẩn Full HD / 2K, không răng cưa và không nghẽn khung hình.</p>
                <label className="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-amber-400 text-zinc-950 font-black text-sm cursor-pointer shadow-xl">
                  <CatPawSvg className="w-5 h-5" />
                  <span>Chọn Video Gameplay Để Bắt Đầu</span>
                  <input
                    type="file"
                    accept="video/*"
                    onChange={async (e) => {
                      const file = e.target.files?.[0];
                      if (!file) return;
                      const url = URL.createObjectURL(file);
                      const dur = await getExactVideoDuration(url);
                      const newClip = {
                        id: `clip_${Date.now()}`,
                        name: file.name.substring(0, 24),
                        url,
                        sourceDuration: dur,
                        trimStart: 0,
                        duration: dur,
                        colorFilter: 'crisp',
                        hasVignette: false,
                        volume: 1.0
                      };
                      setVideoClips([newClip]);
                      setActiveClipId(newClip.id);
                      setCurrentPage('studio');
                      showToast(`Đã nhận ${dur.toFixed(1)}s video!`);
                    }}
                    className="hidden"
                  />
                </label>
              </div>
            </main>
          </div>
        );
      }

      return (
        <div className="flex flex-col h-screen w-screen bg-[#07070b] text-white select-none overflow-hidden font-sans">
          <video ref={hiddenVideoRef} className="hidden" playsInline crossOrigin="anonymous" onLoadedMetadata={() => renderCanvasFrame(currentTimeRef.current)} />
          <audio ref={bgmAudioRef} className="hidden" playsInline crossOrigin="anonymous" />

          {/* Header */}
          <header className="h-12 border-b border-white/[0.08] px-4 flex items-center justify-between bg-zinc-950/90 z-20 shrink-0">
            <div className="flex items-center gap-3">
              <button onClick={() => { pauseVideo(); setCurrentPage('home'); }} className="text-xs text-zinc-400 hover:text-white">◀ Về Trang Chủ</button>
              <span className="font-bold text-sm bg-gradient-to-r from-pink-400 to-amber-300 bg-clip-text text-transparent">NekoCut Studio</span>
              <span className="text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-pink-300 font-mono">{selectedRatio.label}</span>
            </div>
            <button
              onClick={handleFastExportMP4}
              disabled={isExporting || videoClips.length === 0}
              className="px-4 py-1.5 rounded-xl bg-gradient-to-r from-pink-500 to-amber-400 text-zinc-950 text-xs font-black shadow-lg disabled:opacity-50"
            >
              Xuất MP4 (1080p)
            </button>
          </header>

          {/* Body */}
          <div className="flex-1 flex overflow-hidden">
            {/* Inspector Left */}
            <aside className="w-72 border-r border-white/[0.06] bg-[#0b0b10] p-3 space-y-3 shrink-0 overflow-y-auto text-xs">
              <div className="p-3 bg-zinc-900/60 rounded-2xl border border-white/[0.06] space-y-2">
                <div className="font-bold text-zinc-200">Âm Nhạc (BGM)</div>
                <button
                  onClick={() => setShowAddMusicModal(true)}
                  className="w-full py-2 bg-pink-500/20 text-pink-200 rounded-xl font-bold border border-pink-500/30"
                >
                  {bgmTrack ? 'Đổi Nhạc / YouTube' : '+ Thêm Nhạc / Link YouTube'}
                </button>
              </div>

              <div className="space-y-1.5">
                <label className="font-bold text-zinc-300">Tỉ lệ xuất hình:</label>
                <div className="grid grid-cols-2 gap-2">
                  {ASPECT_RATIOS.map((r) => (
                    <button
                      key={r.id}
                      onClick={() => {
                        setSelectedRatio(r);
                        renderCanvasFrame(currentTimeRef.current);
                      }}
                      className={`p-2 rounded-xl border text-center font-bold text-xs ${
                        selectedRatio.id === r.id ? 'bg-pink-500/20 border-pink-400 text-pink-300' : 'bg-zinc-800/60 border-white/[0.04] text-zinc-400'
                      }`}
                    >
                      {r.label}
                    </button>
                  ))}
                </div>
              </div>
            </aside>

            {/* Canvas Preview Center */}
            <main className="flex-1 flex flex-col items-center justify-between p-4 bg-[#08080c] overflow-hidden">
              <div className="flex-1 w-full flex items-center justify-center min-h-0">
                <canvas
                  ref={canvasRef}
                  width={selectedRatio.w}
                  height={selectedRatio.h}
                  className="max-h-full max-w-full rounded-2xl border border-white/[0.08] shadow-2xl bg-black object-contain"
                  style={{ aspectRatio: selectedRatio.ratioCss }}
                />
              </div>

              {/* Controls */}
              <div className="mt-3 flex items-center gap-4 bg-zinc-950/80 px-4 py-2 rounded-2xl border border-white/[0.08]">
                <span className="font-mono text-xs text-pink-400">{currentTime.toFixed(1)}s / {totalDuration.toFixed(1)}s</span>
                <button onClick={togglePlay} className="px-4 py-1.5 bg-gradient-to-r from-pink-500 to-amber-400 text-zinc-950 rounded-xl font-bold text-xs">
                  {isPlaying ? 'Tạm Dừng' : 'Phát'}
                </button>
                <button onClick={() => setIsMuted(!isMuted)} className="text-xs text-zinc-400">
                  {isMuted ? '🔇 Tắt' : '🔊 Bật'}
                </button>
              </div>
            </main>
          </div>

          {/* Timeline Bottom */}
          <footer className="h-24 border-t border-white/[0.08] bg-[#09090d] p-3 shrink-0">
            <div
              ref={timelineTrackRef}
              onClick={(e) => {
                if (!timelineTrackRef.current || totalDuration === 0) return;
                const rect = timelineTrackRef.current.getBoundingClientRect();
                const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                seekTo(ratio * totalDuration);
              }}
              className="relative h-12 bg-zinc-950 rounded-xl border border-white/[0.08] p-1 flex items-center cursor-pointer overflow-hidden"
            >
              {videoClips.map((clip) => {
                const widthPercent = totalDuration > 0 ? (clip.duration / totalDuration) * 100 : 100;
                return (
                  <div
                    key={clip.id}
                    style={{ width: `${Math.max(8, widthPercent)}%` }}
                    className="h-full bg-gradient-to-r from-pink-500/30 to-amber-500/20 border border-pink-400 rounded-lg p-1.5 flex items-center justify-between text-xs"
                  >
                    <span className="truncate">{clip.name}</span>
                    <span className="font-mono text-[10px]">{clip.duration.toFixed(1)}s</span>
                  </div>
                );
              })}
              {totalDuration > 0 && (
                <div
                  style={{ left: `${(currentTime / totalDuration) * 100}%` }}
                  className="absolute top-0 bottom-0 w-0.5 bg-pink-400 pointer-events-none"
                />
              )}
            </div>
          </footer>

          {/* Modal Music */}
          {showAddMusicModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-[#110f17] border border-white/[0.12] w-full max-w-md rounded-3xl p-5 space-y-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
                  <h3 className="font-bold text-sm">Thêm Âm Nhạc Nền</h3>
                  <button onClick={() => setShowAddMusicModal(false)} className="text-zinc-400">✕</button>
                </div>
                <div className="space-y-2 text-xs">
                  <label className="font-bold text-zinc-300">1. Luồng YouTube (Invidious Proxy):</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={ytLinkInput}
                      onChange={(e) => setYtLinkInput(e.target.value)}
                      placeholder="https://youtube.com/watch?v=..."
                      className="flex-1 bg-zinc-950 border border-white/[0.08] rounded-xl px-3 py-2 text-white"
                    />
                    <button
                      onClick={handleAddMusicFromYouTube}
                      disabled={isProcessingAudio}
                      className="px-3 py-2 bg-pink-500 text-zinc-950 font-bold rounded-xl disabled:opacity-50"
                    >
                      Kết Nối
                    </button>
                  </div>
                </div>
                <div className="space-y-2 text-xs">
                  <label className="font-bold text-zinc-300">2. Hoặc chọn tệp Audio/Video từ máy:</label>
                  <label className="w-full py-2.5 bg-zinc-800 rounded-xl text-center block cursor-pointer text-zinc-200">
                    <span>Chọn file MP3, WAV, MP4</span>
                    <input
                      type="file"
                      accept="audio/*,video/*"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (file) handleAddMusicFromFile(file);
                      }}
                      className="hidden"
                    />
                  </label>
                </div>
              </div>
            </div>
          )}

          {/* Modal Exporting */}
          {isExporting && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <div className="bg-[#110f17] border border-white/[0.12] w-full max-w-xs rounded-3xl p-6 text-center space-y-3">
                <CatPawSvg className="w-10 h-10 text-pink-400 mx-auto animate-bounce" />
                <div className="font-bold text-sm">Đang Xuất Video 1080p...</div>
                <div className="w-full bg-zinc-800 h-2 rounded-full overflow-hidden">
                  <div style={{ width: `${exportProgress}%` }} className="h-full bg-pink-500 transition-all duration-100" />
                </div>
                <div className="font-mono text-xs text-pink-400">{exportProgress}%</div>
              </div>
            </div>
          )}

          {/* Toast */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-zinc-900 border border-pink-500/40 text-pink-200 px-4 py-2 rounded-2xl text-xs font-bold shadow-2xl">
              {toastMsg}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
