    const playNekoSound = (type = 'click') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === 'split') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1300, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'parry') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.type = 'sine';
          osc2.type = 'triangle';
          osc1.frequency.setValueAtTime(2093, now);
          osc2.frequency.setValueAtTime(2793, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.4);
          osc2.stop(now + 0.4);
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(360, now + 0.05);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      } catch (e) {}
    };

    const getExactVideoDuration = (videoUrl) => {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.preload = 'auto';
        v.src = videoUrl;
        v.onloadedmetadata = () => resolve(v.duration && !isNaN(v.duration) && v.duration !== Infinity ? v.duration : 15);
        v.onerror = () => resolve(15);
        setTimeout(() => resolve(15), 2500);
      });
    };

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [toastMsg, setToastMsg] = useState('');

      // Timeline Clips State
      const [videoClips, setVideoClips] = useState([]);
      const [activeClipId, setActiveClipId] = useState(null);
      const [currentTime, setCurrentTime] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const [selectedRatio, setSelectedRatio] = useState(ASPECT_RATIOS[0]);
      const [fitMode, setFitMode] = useState('fit');

      // Audio Control & Multi-Clip BGM
      const [masterVolume, setMasterVolume] = useState(1.0);
      const [audioClips, setAudioClips] = useState([]);
      const [activeAudioClipId, setActiveAudioClipId] = useState(null);
      const [showAddMusicModal, setShowAddMusicModal] = useState(false);
      const [ytLinkInput, setYtLinkInput] = useState('');
      const [isProcessingAudio, setIsProcessingAudio] = useState(false);

      // Subtitles & Text Dragging State
      const [subtitles, setSubtitles] = useState([]);
      const [activeSubId, setActiveSubId] = useState(null);
      const [newSubText, setNewSubText] = useState('Highlight Matrix WW');
      const [draggingSubId, setDraggingSubId] = useState(null);

      // Inspector Tabs (Giữ 4 tab rõ ràng, dễ nhìn như bản gốc)
      const [activeInspectorTab, setActiveInspectorTab] = useState('clip'); // 'clip' | 'filter' | 'text' | 'ratio'
      const [historyStack, setHistoryStack] = useState([]);
      const [showTemplateModal, setShowTemplateModal] = useState(false);
      const [selectedStyleId, setSelectedStyleId] = useState('crisp');
      const [autoScoreLoop, setAutoScoreLoop] = useState(true);

      // Drag and drop video
      const [draggedClipIndex, setDraggedClipIndex] = useState(null);
      const [dragOverIndex, setDragOverIndex] = useState(null);

      // Popup 15s Cuối để chọn 2s điểm
      const [showScorePickerModal, setShowScorePickerModal] = useState(false);
      const [previewScoreTime, setPreviewScoreTime] = useState(0);
      const [isPickerPlaying, setIsPickerPlaying] = useState(false);

      // Export State
      const [isExporting, setIsExporting] = useState(false);
      const [exportProgress, setExportProgress] = useState(0);

      // Core Refs
      const canvasRef = useRef(null);
      const hiddenVideoRef = useRef(null);
      const bgmAudioRef = useRef(null);
      const pickerVideoRef = useRef(null);
      const trackAreaRef = useRef(null);
      const playheadRef = useRef(null);
      const currentTimeRef = useRef(0);
      const activeClipIdRef = useRef(null);
      const isPlayingRef = useRef(false);
      const isScrubbingRef = useRef(false);
      const animationFrameRef = useRef(null);
      const lastUiUpdateRef = useRef(0);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      };

      const pushToHistory = useCallback(() => {
        setHistoryStack((prev) => [
          ...prev.slice(-12),
          JSON.parse(JSON.stringify({ videoClips, audioClips, subtitles }))
        ]);
      }, [videoClips, audioClips, subtitles]);

      const handleUndo = () => {
        if (historyStack.length === 0) {
          showToast('Không còn thao tác để hoàn tác');
          return;
        }
        playNekoSound('click');
        const previous = historyStack[historyStack.length - 1];
        setHistoryStack((prev) => prev.slice(0, -1));
        if (previous.videoClips) setVideoClips(previous.videoClips);
        if (previous.audioClips) setAudioClips(previous.audioClips);
        if (previous.subtitles) setSubtitles(previous.subtitles);
        showToast('Đã hoàn tác (Undo)');
      };

      const totalDuration = useMemo(() => {
        return videoClips.reduce((sum, c) => sum + (c.duration / (c.speed || 1.0)), 0);
      }, [videoClips]);

      useEffect(() => {
        activeClipIdRef.current = activeClipId;
      }, [activeClipId]);

      const getCurrentClipInfo = useCallback(
        (time) => {
          let acc = 0;
          for (let i = 0; i < videoClips.length; i++) {
            const c = videoClips[i];
            const spd = c.speed || 1.0;
            const effectiveDur = c.duration / spd;

            if (time >= acc && time < acc + effectiveDur) {
              const timelineOffset = time - acc;
              const sourceOffset = timelineOffset * spd;
              return {
                clip: c,
                clipIndex: i,
                clipStartTime: acc,
                clipOffsetTime: timelineOffset,
                effectiveDuration: effectiveDur,
                mediaSourceTime: c.trimStart + sourceOffset
              };
            }
            acc += effectiveDur;
          }
          if (videoClips.length > 0) {
            const last = videoClips[videoClips.length - 1];
            const spd = last.speed || 1.0;
            const effDur = last.duration / spd;
            const lastStart = Math.max(0, acc - effDur);
            const timelineOffset = Math.min(effDur, Math.max(0, time - lastStart));
            return {
              clip: last,
              clipIndex: videoClips.length - 1,
              clipStartTime: lastStart,
              clipOffsetTime: timelineOffset,
              effectiveDuration: effDur,
              mediaSourceTime: last.trimStart + (timelineOffset * spd)
            };
          }
          return null;
        },
        [videoClips]
      );

      const getCurrentAudioClipInfo = useCallback(
        (time) => {
          let acc = 0;
          for (let i = 0; i < audioClips.length; i++) {
            const a = audioClips[i];
            if (time >= acc && time < acc + a.duration) {
              return {
                audio: a,
                index: i,
                startTime: acc,
                offsetTime: time - acc,
                mediaSourceTime: (a.trimStart || 0) + (time - acc)
              };
            }
            acc += a.duration;
          }
          return null;
        },
        [audioClips]
      );

      const updateRuntimeAudioVolumes = useCallback(() => {
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;
        const curVid = getCurrentClipInfo(currentTimeRef.current);
        const curAud = getCurrentAudioClipInfo(currentTimeRef.current);

        if (vid && curVid) {
          if (isMuted) {
            vid.volume = 0;
          } else {
            const rawVidVol = (curVid.clip.volume ?? 1.0) * masterVolume;
            vid.volume = Math.max(0, Math.min(1.0, rawVidVol));
          }
        }

        if (bgm && curAud) {
          if (isMuted || curAud.audio.isMuted) {
            bgm.volume = 0;
          } else {
            const rawBgmVol = (curAud.audio.volume ?? 1.0) * masterVolume;
            bgm.volume = Math.max(0, Math.min(1.0, rawBgmVol));
          }
        }
      }, [getCurrentClipInfo, getCurrentAudioClipInfo, isMuted, masterVolume]);

      useEffect(() => {
        updateRuntimeAudioVolumes();
      }, [masterVolume, isMuted, audioClips, videoClips, updateRuntimeAudioVolumes]);

      const drawFrameToContext = useCallback(
        (ctx, targetW, targetH, time) => {
          const vid = hiddenVideoRef.current;
          const clipInfo = getCurrentClipInfo(time);

          ctx.fillStyle = '#09090b';
          ctx.fillRect(0, 0, targetW, targetH);

          if (clipInfo && vid && vid.readyState >= 2) {
            const { clip, clipOffsetTime } = clipInfo;

            ctx.save();

            if (fitMode === 'blur') {
              ctx.save();
              ctx.filter = 'blur(28px) brightness(0.6)';
              const bScale = Math.max(targetW / vid.videoWidth, targetH / vid.videoHeight);
              const bW = vid.videoWidth * bScale;
              const bH = vid.videoHeight * bScale;
              ctx.drawImage(vid, (targetW - bW) / 2, (targetH - bH) / 2, bW, bH);
              ctx.restore();
            }

            const filterDef = FILTERS.find((f) => f.id === clip.colorFilter) || FILTERS[0];
            let activeCssFilter = filterDef.css !== 'none' ? filterDef.css : '';

            const sFactor =
              fitMode === 'cover'
                ? Math.max(targetW / vid.videoWidth, targetH / vid.videoHeight)
                : Math.min(targetW / vid.videoWidth, targetH / vid.videoHeight);

            const drawW = vid.videoWidth * sFactor;
            const drawH = vid.videoHeight * sFactor;
            const drawX = (targetW - drawW) / 2;
            const drawY = (targetH - drawH) / 2;

            const animDuration = clip.animInDuration || 0.45;
            const isInAnim = clip.animIn && clip.animIn !== 'none' && clipOffsetTime <= animDuration;

            if (isInAnim) {
              const prog = Math.min(1, Math.max(0, clipOffsetTime / animDuration));
              const easeOut = Math.sin((prog * Math.PI) / 2);

              if (clip.animIn === 'flash') {
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, 0.9 * (1 - prog))})`;
                ctx.fillRect(0, 0, targetW, targetH);
              } else if (clip.animIn === 'black_flash') {
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
                ctx.fillStyle = `rgba(0, 0, 0, ${Math.max(0, 1 - prog)})`;
                ctx.fillRect(0, 0, targetW, targetH);
              } else if (clip.animIn === 'whip') {
                const sc = 1.35 - 0.35 * easeOut;
                ctx.translate(targetW / 2, targetH / 2);
                ctx.scale(sc, sc);
                ctx.translate(-targetW / 2, -targetH / 2);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              } else if (clip.animIn === 'zoom_in') {
                const sc = 0.7 + 0.3 * easeOut;
                ctx.translate(targetW / 2, targetH / 2);
                ctx.scale(sc, sc);
                ctx.translate(-targetW / 2, -targetH / 2);
                ctx.globalAlpha = Math.min(1, prog * 1.3);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              } else if (clip.animIn === 'shake') {
                const amp = (1 - prog) * 16;
                const ox = Math.sin(prog * Math.PI * 10) * amp;
                const oy = Math.cos(prog * Math.PI * 8) * amp * 0.5;
                ctx.translate(ox, oy);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              } else {
                ctx.globalAlpha = Math.min(1, prog);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              }
            } else {
              ctx.filter = activeCssFilter || 'none';
              ctx.drawImage(vid, drawX, drawY, drawW, drawH);
            }

            ctx.restore();

            if (clip.hasVignette) {
              ctx.save();
              const grad = ctx.createRadialGradient(
                targetW / 2,
                targetH / 2,
                targetW * 0.25,
                targetW / 2,
                targetH / 2,
                targetW * 0.68
              );
              grad.addColorStop(0, 'rgba(0,0,0,0)');
              grad.addColorStop(0.7, 'rgba(0,0,0,0.3)');
              grad.addColorStop(1, 'rgba(0,0,0,0.85)');
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, targetW, targetH);
              ctx.restore();
            }
          }

          // Vẽ Subtitles
          subtitles.forEach((sub) => {
            if (time >= sub.start && time <= sub.end) {
              ctx.save();
              const maxW = targetW * 0.85;
              const scaleRatio = targetW / 1920;
              let fontSize = Math.max(16, Math.floor((sub.fontSize || 36) * Math.max(0.6, scaleRatio)));
              const fontFam = sub.fontFamily || 'sans-serif';
              ctx.font = `bold ${fontSize}px ${fontFam}`;
              let metrics = ctx.measureText(sub.text);

              if (metrics.width > maxW) {
                fontSize = Math.max(12, Math.floor(fontSize * (maxW / metrics.width)));
                ctx.font = `bold ${fontSize}px ${fontFam}`;
                metrics = ctx.measureText(sub.text);
              }

              ctx.textAlign = 'center';
              const pX = (targetW * (sub.x !== undefined ? sub.x : 50)) / 100;
              const pY = (targetH * (sub.y !== undefined ? sub.y : 82)) / 100;

              if (sub.showBg) {
                const bgAlpha = sub.bgOpacity !== undefined ? sub.bgOpacity : 0.75;
                ctx.fillStyle = sub.id === activeSubId ? `rgba(236, 72, 153, ${bgAlpha})` : `rgba(0, 0, 0, ${bgAlpha})`;
                ctx.beginPath();
                ctx.roundRect(pX - metrics.width / 2 - 14, pY - fontSize * 0.85, metrics.width + 28, fontSize * 1.3, 8);
                ctx.fill();
                if (sub.id === activeSubId) {
                  ctx.lineWidth = 2;
                  ctx.strokeStyle = '#fde047';
                  ctx.stroke();
                }
              }

              if (sub.strokeWidth && sub.strokeWidth > 0) {
                ctx.lineWidth = sub.strokeWidth * Math.max(0.6, scaleRatio);
                ctx.strokeStyle = sub.strokeColor || '#000000';
                ctx.strokeText(sub.text, pX, pY);
              }

              ctx.fillStyle = sub.color || '#ffffff';
              ctx.fillText(sub.text, pX, pY);
              ctx.restore();
            }
          });
        },
        [getCurrentClipInfo, subtitles, activeSubId, fitMode]
      );

      const renderCanvasFrame = useCallback(
        (time) => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d', { alpha: false });
          if (!ctx) return;
          drawFrameToContext(ctx, canvas.width, canvas.height, time);
        },
        [drawFrameToContext]
      );

      const playVideo = () => {
        if (videoClips.length === 0) return;
        playNekoSound('click');
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;

        if (currentTimeRef.current >= totalDuration - 0.08) {
          currentTimeRef.current = 0;
          setCurrentTime(0);
        }

        const info = getCurrentClipInfo(currentTimeRef.current);
        if (info && vid) {
          if (vid.src !== info.clip.url) vid.src = info.clip.url;
          vid.playbackRate = info.clip.speed || 1.0;
          vid.currentTime = info.mediaSourceTime;
          activeClipIdRef.current = info.clip.id;
          setActiveClipId(info.clip.id);
          updateRuntimeAudioVolumes();
          vid.play().catch(() => {});
        }

        const audInfo = getCurrentAudioClipInfo(currentTimeRef.current);
        if (audInfo && bgm) {
          if (bgm.src !== audInfo.audio.url) bgm.src = audInfo.audio.url;
          bgm.currentTime = audInfo.mediaSourceTime;
          updateRuntimeAudioVolumes();
          bgm.play().catch(() => {});
        }

        isPlayingRef.current = true;
        setIsPlaying(true);
      };

      const pauseVideo = () => {
        isPlayingRef.current = false;
        setIsPlaying(false);
        if (hiddenVideoRef.current) hiddenVideoRef.current.pause();
        if (bgmAudioRef.current) bgmAudioRef.current.pause();
      };

      const togglePlay = () => {
        if (isPlayingRef.current) pauseVideo();
        else playVideo();
      };

      useEffect(() => {
        const loop = (now) => {
          if (isPlayingRef.current && !isScrubbingRef.current) {
            const vid = hiddenVideoRef.current;
            const bgm = bgmAudioRef.current;
            const currentClipId = activeClipIdRef.current;
            const curIdx = videoClips.findIndex((c) => c.id === currentClipId);
            const activeIdx = curIdx >= 0 ? curIdx : 0;
            const curClip = videoClips[activeIdx];

            if (vid && curClip) {
              const spd = curClip.speed || 1.0;
              const clipSourceEnd = curClip.trimStart + curClip.duration;
              const curSourceTime = vid.currentTime;

              if (curSourceTime >= clipSourceEnd - 0.04) {
                if (activeIdx < videoClips.length - 1) {
                  const nextClip = videoClips[activeIdx + 1];
                  activeClipIdRef.current = nextClip.id;
                  setActiveClipId(nextClip.id);
                  if (vid.src !== nextClip.url) vid.src = nextClip.url;
                  vid.playbackRate = nextClip.speed || 1.0;
                  vid.currentTime = nextClip.trimStart;
                  updateRuntimeAudioVolumes();
                  vid.play().catch(() => {});
                } else {
                  currentTimeRef.current = totalDuration;
                  setCurrentTime(totalDuration);
                  if (playheadRef.current && totalDuration > 0) {
                    playheadRef.current.style.left = '100%';
                  }
                  pauseVideo();
                  renderCanvasFrame(totalDuration);
                }
              } else {
                let clipStartTime = 0;
                for (let i = 0; i < activeIdx; i++) {
                  clipStartTime += videoClips[i].duration / (videoClips[i].speed || 1.0);
                }

                const elapsedSourceInClip = Math.max(0, curSourceTime - curClip.trimStart);
                const exactTimelineTime = Math.min(totalDuration, clipStartTime + elapsedSourceInClip / spd);

                currentTimeRef.current = exactTimelineTime;

                if (playheadRef.current && totalDuration > 0) {
                  const percent = (exactTimelineTime / totalDuration) * 100;
                  playheadRef.current.style.left = `${percent}%`;
                }

                if (now - lastUiUpdateRef.current > 35) {
                  setCurrentTime(exactTimelineTime);
                  lastUiUpdateRef.current = now;
                }

                const audInfo = getCurrentAudioClipInfo(exactTimelineTime);
                if (audInfo && bgm) {
                  if (bgm.src !== audInfo.audio.url) bgm.src = audInfo.audio.url;
                  if (Math.abs(bgm.currentTime - audInfo.mediaSourceTime) > 0.18) {
                    bgm.currentTime = audInfo.mediaSourceTime;
                  }
                  if (bgm.paused && bgm.readyState >= 2) {
                    updateRuntimeAudioVolumes();
                    bgm.play().catch(() => {});
                  }
                } else if (bgm && !bgm.paused) {
                  bgm.pause();
                }

                renderCanvasFrame(exactTimelineTime);
              }
            } else {
              pauseVideo();
            }
          }
          animationFrameRef.current = requestAnimationFrame(loop);
        };

        animationFrameRef.current = requestAnimationFrame(loop);
        return () => {
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };
      }, [videoClips, totalDuration, getCurrentAudioClipInfo, renderCanvasFrame, updateRuntimeAudioVolumes]);

      // Dừng video và đưa kim phát đến đúng vị trí ấn chuột chính xác 100%
      const seekToAndStop = useCallback((targetTime) => {
        pauseVideo();
        const clamped = Math.max(0, Math.min(totalDuration, targetTime));
        currentTimeRef.current = clamped;
        setCurrentTime(clamped);

        if (playheadRef.current && totalDuration > 0) {
          const percent = (clamped / totalDuration) * 100;
          playheadRef.current.style.left = `${percent}%`;
        }

        const info = getCurrentClipInfo(clamped);
        const vid = hiddenVideoRef.current;
        if (info && vid) {
          activeClipIdRef.current = info.clip.id;
          setActiveClipId(info.clip.id);
          if (vid.src !== info.clip.url) vid.src = info.clip.url;
          vid.playbackRate = info.clip.speed || 1.0;
          vid.currentTime = info.mediaSourceTime;
          updateRuntimeAudioVolumes();

          const onSeek = () => {
            renderCanvasFrame(clamped);
            vid.removeEventListener('seeked', onSeek);
          };
          vid.addEventListener('seeked', onSeek);
          renderCanvasFrame(clamped);
        } else {
          renderCanvasFrame(clamped);
        }

        const audInfo = getCurrentAudioClipInfo(clamped);
        const bgm = bgmAudioRef.current;
        if (audInfo && bgm) {
          setActiveAudioClipId(audInfo.audio.id);
          if (bgm.src !== audInfo.audio.url) bgm.src = audInfo.audio.url;
          bgm.currentTime = audInfo.mediaSourceTime;
          updateRuntimeAudioVolumes();
        } else if (bgm) {
          bgm.pause();
        }
      }, [totalDuration, getCurrentClipInfo, getCurrentAudioClipInfo, renderCanvasFrame, updateRuntimeAudioVolumes]);

      const handleTimelinePointerDown = (e) => {
        if (e.target.closest('button, input, [data-interactive="true"]')) return;
        if (!trackAreaRef.current || totalDuration === 0) return;
        isScrubbingRef.current = true;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        const rect = trackAreaRef.current.getBoundingClientRect();
        const clickX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
        seekToAndStop((clickX / rect.width) * totalDuration);
      };

      const handleTimelinePointerMove = (e) => {
        if (!isScrubbingRef.current || !trackAreaRef.current || totalDuration === 0) return;
        const rect = trackAreaRef.current.getBoundingClientRect();
        const clickX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
        seekToAndStop((clickX / rect.width) * totalDuration);
      };

      const handleTimelinePointerUp = (e) => {
        if (isScrubbingRef.current) {
          isScrubbingRef.current = false;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (e.code === 'Space') {
            e.preventDefault();
            togglePlay();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            seekToAndStop(currentTimeRef.current - 0.1);
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            seekToAndStop(currentTimeRef.current + 0.1);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [seekToAndStop]);

      const handleSplitClip = () => {
        if (!activeClipId || isPlaying) return;
        const info = getCurrentClipInfo(currentTimeRef.current);
        if (!info || info.clip.id !== activeClipId) {
          showToast('Đặt kim phát trong đoạn video cần tách');
          return;
        }

        const { clip, clipIndex, clipOffsetTime } = info;
        const spd = clip.speed || 1.0;
        const sourceOffset = clipOffsetTime * spd;

        if (sourceOffset < 0.15 || sourceOffset > clip.duration - 0.15) {
          showToast('Điểm tách cần cách hai đầu ít nhất 0.2s');
          return;
        }

        pushToHistory();
        playNekoSound('split');

        const clip1 = { ...clip, id: `clip_${Date.now()}_1`, duration: sourceOffset };
        const clip2 = {
          ...clip,
          id: `clip_${Date.now()}_2`,
          trimStart: clip.trimStart + sourceOffset,
          duration: clip.duration - sourceOffset,
          animIn: 'none'
        };

        const newClips = [...videoClips];
        newClips.splice(clipIndex, 1, clip1, clip2);
        setVideoClips(newClips);
        setActiveClipId(clip2.id);
        showToast('Đã tách đoạn video');
      };

      const handleDuplicateClip = () => {
        if (!activeClipId) return;
        pushToHistory();
        playNekoSound('click');
        const idx = videoClips.findIndex((c) => c.id === activeClipId);
        if (idx === -1) return;

        const source = videoClips[idx];
        const clone = { ...source, id: `clip_${Date.now()}_copy`, name: `${source.name} (Bản sao)` };
        const newClips = [...videoClips];
        newClips.splice(idx + 1, 0, clone);
        setVideoClips(newClips);
        setActiveClipId(clone.id);
        showToast('Đã nhân bản');
      };

      const handleDeleteClip = () => {
        if (!activeClipId || videoClips.length <= 1) {
          showToast('Cần giữ ít nhất 1 đoạn');
          return;
        }
        pushToHistory();
        playNekoSound('click');
        const newClips = videoClips.filter((c) => c.id !== activeClipId);
        setVideoClips(newClips);
        setActiveClipId(newClips[0]?.id || null);
        seekToAndStop(0);
        showToast('Đã xóa clip');
      };

      // Tách nhạc BGM
      const handleSplitAudioClip = () => {
        if (!activeAudioClipId || isPlaying) return;
        const curAudInfo = getCurrentAudioClipInfo(currentTimeRef.current);
        if (!curAudInfo || curAudInfo.audio.id !== activeAudioClipId) {
          showToast('Đặt kim phát vào đoạn nhạc cần tách');
          return;
        }

        const { audio, index, offsetTime } = curAudInfo;
        if (offsetTime < 0.2 || offsetTime > audio.duration - 0.2) {
          showToast('Điểm tách nhạc cần cách 2 đầu ít nhất 0.2s');
          return;
        }

        pushToHistory();
        playNekoSound('split');

        const part1 = { ...audio, id: `audio_${Date.now()}_1`, duration: offsetTime };
        const part2 = {
          ...audio,
          id: `audio_${Date.now()}_2`,
          trimStart: (audio.trimStart || 0) + offsetTime,
          duration: audio.duration - offsetTime
        };

        const newAudios = [...audioClips];
        newAudios.splice(index, 1, part1, part2);
        setAudioClips(newAudios);
        setActiveAudioClipId(part2.id);
        showToast('Đã tách đoạn nhạc');
      };

      const handleAddMusicFromFile = async (file) => {
        if (!file) return;
        setIsProcessingAudio(true);
        showToast('Đang nạp file nhạc...');

        try {
          const url = URL.createObjectURL(file);
          const tempAudio = new Audio();
          tempAudio.src = url;

          tempAudio.onloadedmetadata = () => {
            const dur = tempAudio.duration && !isNaN(tempAudio.duration) && tempAudio.duration !== Infinity
              ? tempAudio.duration
              : totalDuration || 30;

            const newTrack = {
              id: `aud_${Date.now()}`,
              name: file.name.substring(0, 26),
              url,
              sourceDuration: dur,
              trimStart: 0,
              duration: dur,
              volume: 1.0,
              isMuted: false
            };

            setAudioClips((prev) => [...prev, newTrack]);
            setActiveAudioClipId(newTrack.id);
            setIsProcessingAudio(false);
            setShowAddMusicModal(false);
            showToast('Đã thêm bài nhạc nền!');
          };

          tempAudio.onerror = () => {
            const newTrack = {
              id: `aud_${Date.now()}`,
              name: file.name.substring(0, 26),
              url,
              sourceDuration: totalDuration || 30,
              trimStart: 0,
              duration: totalDuration || 30,
              volume: 1.0,
              isMuted: false
            };
            setAudioClips((prev) => [...prev, newTrack]);
            setActiveAudioClipId(newTrack.id);
            setIsProcessingAudio(false);
            setShowAddMusicModal(false);
            showToast('Đã nạp file nhạc!');
          };
        } catch (err) {
          setIsProcessingAudio(false);
          showToast('Không thể nạp file âm thanh');
        }
      };

      const handleAddMusicFromYouTube = async () => {
        const rawLink = ytLinkInput.trim();
        if (!rawLink) {
          showToast('Vui lòng dán link YouTube');
          return;
        }

        const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
        const match = rawLink.match(ytRegex);

        if (!match || !match[1]) {
          showToast('Link YouTube không hợp lệ!');
          return;
        }

        const videoId = match[1];
        setIsProcessingAudio(true);
        showToast('Đang kết nối nhạc từ YouTube...');

        try {
          const res = await fetch(`https://inv.tux.pizza/api/v1/videos/${videoId}`);
          if (!res.ok) throw new Error('Proxy lỗi');
          const data = await res.json();
          const audioFormats = data.adaptiveFormats?.filter((f) => f.type?.startsWith('audio/')) || [];
          const bestAudio = audioFormats.sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0))[0];

          if (!bestAudio || !bestAudio.url) throw new Error('Không có audio');

          const newTrack = {
            id: `yt_${videoId}_${Date.now()}`,
            name: data.title?.substring(0, 26) || `YouTube OST (${videoId})`,
            url: bestAudio.url,
            sourceDuration: data.lengthSeconds || totalDuration || 120,
            trimStart: 0,
            duration: totalDuration || 60,
            volume: 1.0,
            isMuted: false
          };

          setAudioClips((prev) => [...prev, newTrack]);
          setActiveAudioClipId(newTrack.id);
          setIsProcessingAudio(false);
          setShowAddMusicModal(false);
          setYtLinkInput('');
          showToast('Đã kết nối nhạc từ YouTube thành công!');
        } catch (err) {
          const sampleAudioUrl = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4';
          const newTrack = {
            id: `yt_${videoId}_${Date.now()}`,
            name: `YouTube Battle OST (${videoId})`,
            url: sampleAudioUrl,
            sourceDuration: totalDuration || 120,
            trimStart: 0,
            duration: totalDuration || 60,
            volume: 1.0,
            isMuted: false
          };

          setAudioClips((prev) => [...prev, newTrack]);
          setActiveAudioClipId(newTrack.id);
          setIsProcessingAudio(false);
          setShowAddMusicModal(false);
          setYtLinkInput('');
          showToast('Đã kết nối luồng nhạc dự phòng!');
        }
      };

      const handleCanvasPointerDown = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = ((e.clientX - rect.left) / rect.width) * 100;
        const clickY = ((e.clientY - rect.top) / rect.height) * 100;

        const found = subtitles.find(
          (s) =>
            currentTime >= s.start &&
            currentTime <= s.end &&
            Math.abs((s.x !== undefined ? s.x : 50) - clickX) < 18 &&
            Math.abs((s.y !== undefined ? s.y : 82) - clickY) < 10
        );

        if (found) {
          setDraggingSubId(found.id);
          setActiveSubId(found.id);
          setActiveInspectorTab('text');
        }
      };

      const handleCanvasPointerMove = (e) => {
        if (!draggingSubId || !canvasRef.current) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const newX = Math.max(5, Math.min(95, ((e.clientX - rect.left) / rect.width) * 100));
        const newY = Math.max(5, Math.min(95, ((e.clientY - rect.top) / rect.height) * 100));

        setSubtitles((prev) =>
          prev.map((s) => (s.id === draggingSubId ? { ...s, x: newX, y: newY } : s))
        );
        renderCanvasFrame(currentTimeRef.current);
      };

      const handleCanvasPointerUp = () => {
        setDraggingSubId(null);
      };

      const handleClipBarClick = (clip) => {
        setActiveClipId(clip.id);
        setActiveInspectorTab('clip');
        if (clip.isScoreClip) {
          pauseVideo();
          const targetStart = clip.trimStart ?? Math.max(0, (clip.sourceDuration || 60) - 2.0);
          setPreviewScoreTime(targetStart);
          setIsPickerPlaying(false);
          setShowScorePickerModal(true);
        }
      };

      // Đồng bộ nạp video và định vị khung hình khi mở popup chọn điểm
      useEffect(() => {
        if (showScorePickerModal && pickerVideoRef.current && scoreClipObj?.url) {
          const v = pickerVideoRef.current;
          if (v.src !== scoreClipObj.url) {
            v.src = scoreClipObj.url;
          }
          v.currentTime = previewScoreTime;
        }
      }, [showScorePickerModal, scoreClipObj?.url]);

      const applySelectedScoreTime = (confirmedTrimStart) => {
        pushToHistory();
        setVideoClips((prev) =>
          prev.map((c) =>

      const applyMatrixTemplate = async (customVideoFile = null) => {

        const url = customVideoFile ? URL.createObjectURL(customVideoFile) : SAMPLE_WW_VIDEO;
        showToast('Đang nhận diện toàn bộ thời lượng video...');

        const trueDuration = await getExactVideoDuration(url);
        const scoreDuration = Math.min(2.0, Math.max(0.5, trueDuration * 0.2));
        const combatDuration = Math.max(1.0, trueDuration - scoreDuration);
        const chosenStyle = WW_STYLES.find((s) => s.id === selectedStyleId) || WW_STYLES[0];

        const scoreClip = {
          id: `score_${Date.now()}`,
          name: '01. Điểm Matrix (Mở đầu)',

          sourceDuration: trueDuration,
          trimStart: Math.max(0, trueDuration - 2.0),

        const finalClips = autoScoreLoop ? [scoreClip, combatClip] : [{ ...combatClip, duration: trueDuration }];

        setVideoClips(finalClips);

        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;
        if (!vid) {

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = selectedRatio.w;
        exportCanvas.height = selectedRatio.h;
        const exportCtx = exportCanvas.getContext('2d', { alpha: false });

        try {
          const stream = exportCanvas.captureStream(30);

          let audioCtx = null;
          let exportVidNode = null;
          let exportBgmNode = null;
          let exportVidEl = null;
          let exportBgmEl = null;

          try {
            const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
            if (AudioCtxClass) {
              audioCtx = new AudioCtxClass();
              await audioCtx.resume();

              const dest = audioCtx.createMediaStreamDestination();
              const masterGain = audioCtx.createGain();
              masterGain.gain.value = isMuted ? 0 : masterVolume;
              masterGain.connect(dest);

              if (!isMuted && vid.src) {
                exportVidEl = document.createElement('video');
                exportVidEl.src = vid.src;
                exportVidEl.muted = false;
                const vidSource = audioCtx.createMediaElementSource(exportVidEl);
                exportVidNode = audioCtx.createGain();
                exportVidNode.gain.value = videoClips[0]?.volume ?? 1.0;
                vidSource.connect(exportVidNode);
                exportVidNode.connect(masterGain);
                exportVidEl.play().catch(() => {});
              }

              if (audioClips.length > 0 && bgm && bgm.src) {
                exportBgmEl = new Audio(bgm.src);
                const bgmSource = audioCtx.createMediaElementSource(exportBgmEl);
                exportBgmNode = audioCtx.createGain();
                exportBgmNode.gain.value = audioClips[0]?.volume ?? 1.0;
                bgmSource.connect(exportBgmNode);
                exportBgmNode.connect(masterGain);
                exportBgmEl.play().catch(() => {});
              }

              dest.stream.getAudioTracks().forEach((track) => stream.addTrack(track));
            }
          } catch (e) {}

          const mimeType = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')
            ? 'video/mp4;codecs=avc1'
            : MediaRecorder.isTypeSupported('video/mp4')
            ? 'video/mp4'
            : 'video/webm';

          const recorder = new MediaRecorder(stream, {
            mimeType,
            videoBitsPerSecond: 16000000
          });

          const chunks = [];
          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };

          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `NekoCut_WW_${selectedRatio.w}p_${Date.now()}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
            setIsExporting(false);
            showToast('Xuất video MP4 1080p thành công!');

            if (exportVidEl) exportVidEl.pause();
            if (exportBgmEl) exportBgmEl.pause();
            if (audioCtx) audioCtx.close();
            seekToAndStop(0);
          };

          recorder.start();

          const fps = 30;
          const totalSteps = Math.max(30, Math.round(totalDuration * fps));
          for (let i = 0; i <= totalSteps; i++) {
            const targetT = (i / totalSteps) * totalDuration;
            const info = getCurrentClipInfo(targetT);
            const audInfo = getCurrentAudioClipInfo(targetT);

            if (info) {
              if (vid.src !== info.clip.url) vid.src = info.clip.url;
              vid.currentTime = info.mediaSourceTime;

              if (exportVidEl) {
                if (exportVidEl.src !== info.clip.url) exportVidEl.src = info.clip.url;
                exportVidEl.currentTime = info.mediaSourceTime;
              }

              if (exportVidNode) {
                exportVidNode.gain.value = info.clip.volume ?? 1.0;
              }

              if (exportBgmEl && audInfo) {
                if (exportBgmEl.src !== audInfo.audio.url) exportBgmEl.src = audInfo.audio.url;
                exportBgmEl.currentTime = audInfo.mediaSourceTime;
              }

              await new Promise((res) => {
                const onSeek = () => {
                  drawFrameToContext(exportCtx, exportCanvas.width, exportCanvas.height, targetT);
                  vid.removeEventListener('seeked', onSeek);
                  res();
                };
                vid.addEventListener('seeked', onSeek);
                setTimeout(onSeek, 35);
              });
            }
            setExportProgress(Math.round((i / totalSteps) * 100));
          }

          recorder.stop();
        } catch (err) {
          console.error(err);
          setIsExporting(false);
          showToast('Có lỗi xảy ra khi xuất video');
        }

                    onDrop={(e) => {
                      e.preventDefault();
                      if (draggedClipIndex === null || draggedClipIndex === index) return;
                      pushToHistory();
                      const updated = [...videoClips];
                      const [moved] = updated.splice(draggedClipIndex, 1);
                      updated.splice(index, 0, moved);
                      setVideoClips(updated);
                      setActiveClipId(moved.id);
                      setDraggedClipIndex(null);
                      setDragOverIndex(null);
                      seekToAndStop(0);
                      showToast(`Đã dời "${moved.name}"`);
                    }}
                    onClick={(e) => {
                      e.stopPropagation();
                      handleClipBarClick(clip);
                    }}
                    style={{ width: `${Math.max(8, widthPercent)}%` }}
                    className={`h-full rounded-xl p-2 flex flex-col justify-between transition-all select-none relative overflow-hidden text-left border ${
                      isCurrent
                        ? 'bg-gradient-to-r from-pink-500/30 to-amber-500/20 border-pink-400 shadow-[0_0_12px_rgba(244,63,94,0.3)] text-white'
                        : 'bg-zinc-900/80 border-white/[0.06] hover:bg-zinc-800 text-zinc-300'
                    } ${clip.isScoreClip ? 'ring-1 ring-amber-400/60' : ''}`}
                  >
                    <div className="flex items-center justify-between w-full">
                      <span className="text-[11px] font-extrabold truncate text-zinc-100 flex items-center gap-1">
                        {clip.isScoreClip && <span className="text-amber-400 text-xs">⭐</span>}
                        {clip.name}
                      </span>
                      <span className="text-[10px] font-mono text-zinc-400 shrink-0">{effDur.toFixed(1)}s</span>
                    </div>

                    <div className="flex items-center justify-between w-full text-[9px] font-mono">
                      {clip.isScoreClip ? (
                        <span className="text-amber-300 font-bold bg-amber-500/20 px-1 py-0.5 rounded">
                          Chạm đổi 2s điểm
                        </span>
                      ) : (
                        <span>{clip.speed ? `${clip.speed}x` : '1x'}</span>
                      )}
                      <span className="text-amber-400 font-bold">🔊 {Math.round((clip.volume ?? 1.0) * 100)}%</span>
                    </div>
                  </div>
                );
              })}

              {/* Kim phát mèo Neko đồng bộ chính xác */}
              {totalDuration > 0 && (
                <div
                  ref={playheadRef}
                  style={{
                    left: `${(currentTime / totalDuration) * 100}%`,
                    transform: 'translateX(-50%)'
                  }}
                  className="absolute top-0 bottom-0 w-0.5 bg-gradient-to-b from-pink-400 to-amber-300 pointer-events-none shadow-[0_0_10px_rgba(244,63,94,0.9)] z-30 transition-none"
                >
                  <div className="absolute -top-1 -left-1.5 w-3.5 h-3.5 rounded-full bg-pink-500 border border-white flex items-center justify-center text-[7px] shadow-lg">
                    🐾
                  </div>
                </div>
              )}
            </div>

            {/* THANH TEXT LAYER RIÊNG BIỆT (Kéo dài/thu ngắn & nhảy kim video) */}
            <div className="relative h-7 bg-zinc-950/80 rounded-xl border border-dashed border-amber-500/30 overflow-hidden flex items-center px-1">
              {subtitles.length === 0 ? (
                <span className="text-[10px] text-zinc-600 pl-2">Chưa có chữ trên timeline. Vào tab "Chữ" để thêm.</span>
              ) : (
                subtitles.map((sub) => {
                  const leftPercent = totalDuration > 0 ? (sub.start / totalDuration) * 100 : 0;
                  const widthPercent = totalDuration > 0 ? ((sub.end - sub.start) / totalDuration) * 100 : 10;
                  const isCurrent = activeSubId === sub.id;

                  return (
                    <div
                      key={sub.id}
                      data-interactive="true"
                      onClick={(e) => {
                        e.stopPropagation();
                        setActiveSubId(sub.id);
                        seekToAndStop(sub.start);
                      }}
                      style={{
                        left: `${Math.max(0, leftPercent)}%`,
                        width: `${Math.max(4, widthPercent)}%`
                      }}
                      className={`absolute top-0.5 bottom-0.5 rounded-lg flex items-center justify-between px-1.5 border text-[10px] font-bold cursor-pointer transition select-none z-10 ${
                        isCurrent
                          ? 'bg-amber-400 text-zinc-950 border-white shadow-md'
                          : 'bg-amber-500/30 text-amber-300 border-amber-500/50 hover:bg-amber-500/50'
                      }`}
                      title="Bấm để đưa kim phát đến chữ này"
                    >
                      <span
                        onClick={(e) => {
                          e.stopPropagation();
                          const newStart = Math.max(0, sub.start - 0.5);
                          setSubtitles((prev) => prev.map((s) => (s.id === sub.id ? { ...s, start: newStart } : s)));
                          seekToAndStop(newStart);
                        }}
                        className="hover:scale-125 px-0.5 cursor-ew-resize font-mono opacity-70 hover:opacity-100"
                        title="Kéo dài về trước"
                      >
                        ◀
                      </span>

                      <span className="truncate mx-1">{sub.text}</span>

                      <span
                        onClick={(e) => {
                          e.stopPropagation();
                          const newEnd = Math.min(totalDuration, sub.end + 0.5);
                          setSubtitles((prev) => prev.map((s) => (s.id === sub.id ? { ...s, end: newEnd } : s)));
                          seekToAndStop(sub.start);
                        }}
                        className="hover:scale-125 px-0.5 cursor-ew-resize font-mono opacity-70 hover:opacity-100"
                        title="Kéo dài về sau"
                      >
                        ▶
                      </span>
                    </div>
                  );
                })
              )}
            </div>

            {/* THANH BGM AUDIO TRACK ĐA ĐOẠN (Cắt, Thả, Kéo, Chỉnh Âm Lượng) */}
            <div className="h-9 bg-zinc-950/80 rounded-xl border border-pink-500/20 px-2 flex items-center justify-between gap-1 overflow-hidden">
              {audioClips.length === 0 ? (
                <div
                  data-interactive="true"
                  onClick={(e) => {
                    e.stopPropagation();
                    setShowAddMusicModal(true);
                  }}
                  className="flex items-center justify-between w-full text-xs text-zinc-500 hover:text-pink-300 cursor-pointer px-2"
                >
                  <div className="flex items-center gap-2">
                    <MusicIcon className="w-3.5 h-3.5 text-pink-400" />
                    <span>Chưa có nhạc nền (BGM) • Bấm để thêm file MP3 hoặc link YouTube</span>
                  </div>
                  <span className="text-xs font-bold text-pink-400 hover:underline">+ Thêm Nhạc</span>
                </div>
              ) : (
                audioClips.map((aud, index) => {
                  const widthPercent = totalDuration > 0 ? (aud.duration / totalDuration) * 100 : 100;
                  const isCurAudio = activeAudioClipId === aud.id;

                  return (
                    <div
                      key={aud.id}
                      data-interactive="true"
                      draggable
                      onDragStart={(e) => {
                        e.dataTransfer.setData('audioIndex', index);
                      }}
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={(e) => {
                        e.preventDefault();
                        const fromIdx = parseInt(e.dataTransfer.getData('audioIndex'), 10);
                        if (!isNaN(fromIdx) && fromIdx !== index) {
                          pushToHistory();
                          const updated = [...audioClips];
                          const [moved] = updated.splice(fromIdx, 1);
                          updated.splice(index, 0, moved);
                          setAudioClips(updated);
                          setActiveAudioClipId(moved.id);
                          showToast(`Đã dời "${moved.name}"`);
                        }
                      }}
                      onClick={(e) => {
                        e.stopPropagation();
                        setActiveAudioClipId(aud.id);
                      }}
                      style={{ width: `${Math.max(12, widthPercent)}%` }}
                      className={`h-full rounded-lg px-2.5 flex items-center justify-between border text-xs font-bold transition cursor-pointer select-none shrink-0 ${
                        isCurAudio
                          ? 'bg-gradient-to-r from-pink-500/30 to-purple-500/25 border-pink-400 text-pink-200'
                          : 'bg-[#181424] border-pink-500/20 text-zinc-300 hover:bg-[#221c32]'
                      }`}
                    >
                      <div className="flex items-center gap-1.5 truncate">
                        <MusicIcon className="w-3.5 h-3.5 text-pink-400 shrink-0" />
                        <span className="truncate">{aud.name}</span>
                      </div>
                      <span className="text-[10px] font-mono text-pink-400 shrink-0 ml-1">
                        🔊 {Math.round((aud.volume ?? 1.0) * 100)}%
                      </span>
                    </div>
                  );
                })
              )}
            </div>
          </footer>

          {/* Modal Popup 15s Cuối Chọn Điểm Số */}
          {showScorePickerModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#110f17] border border-white/[0.12] w-full max-w-lg rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <h3 className="font-extrabold text-sm text-zinc-100 flex items-center gap-1.5">
                    <span>🎯 Chọn 2s Điểm Số (15s Cuối Cùng)</span>
                  </h3>
                  <button
                    onClick={() => {
                      if (pickerVideoRef.current) pickerVideoRef.current.pause();
                      setIsPickerPlaying(false);
                      setShowScorePickerModal(false);
                    }}
                    className="w-7 h-7 rounded-full bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="w-full aspect-video bg-black rounded-2xl overflow-hidden border border-white/[0.08] relative group">
                  <video
                    ref={pickerVideoRef}
                    src={scoreClipObj?.url}
                    preload="auto"
                    muted
                    playsInline
                    onLoadedMetadata={(e) => {
                      e.currentTarget.currentTime = previewScoreTime;
                    }}
                    onTimeUpdate={(e) => {
                      if (isPickerPlaying && e.currentTarget.currentTime >= previewScoreTime + 2.0) {
                        e.currentTarget.currentTime = previewScoreTime;
                      }
                    }}
                    className="w-full h-full object-contain bg-black"
                  />
                  <div className="absolute top-2.5 right-2.5 bg-black/80 backdrop-blur-md px-2.5 py-1 rounded-lg text-[11px] font-mono font-bold text-amber-300 border border-amber-500/20 shadow">
                    Khung hình: {previewScoreTime.toFixed(2)}s
                  </div>

                  <button
                    type="button"
                    onClick={() => {
                      const v = pickerVideoRef.current;
                      if (!v) return;
                      if (isPickerPlaying) {
                        v.pause();
                        v.currentTime = previewScoreTime;
                        setIsPickerPlaying(false);
                      } else {
                        v.currentTime = previewScoreTime;
                        v.play().then(() => setIsPickerPlaying(true)).catch(() => {});
                      }
                    }}
                    className="absolute bottom-3 right-3 px-3.5 py-1.5 rounded-xl bg-zinc-900/90 hover:bg-zinc-800 text-white text-xs font-bold flex items-center gap-1.5 border border-white/20 backdrop-blur-md transition shadow-lg active:scale-95"
                  >
                    {isPickerPlaying ? '⏸ Tạm dừng' : '▶ Xem thử 2s này'}
                  </button>
                </div>

                <div className="space-y-2">
                  <div className="flex items-center justify-between text-xs text-zinc-300">
                    <span>Mốc bắt đầu 2 giây:</span>
                    <span className="font-bold text-amber-400 font-mono">
                      {previewScoreTime.toFixed(2)}s ➔ {(previewScoreTime + 2.0).toFixed(2)}s
                    </span>
                  </div>
                  <input
                    type="range"
                    min={minScoreWindow}
                    max={maxScoreWindow}
                    step={0.05}
                    value={previewScoreTime}
                    onChange={(e) => {
                      const val = parseFloat(e.target.value);
                      setPreviewScoreTime(val);
                      const v = pickerVideoRef.current;
                      if (v) {
                        if (isPickerPlaying) {
                          v.pause();
                          setIsPickerPlaying(false);
                        }
                        v.currentTime = val;
                      }
                    }}
                    className="w-full accent-amber-400 h-2 bg-zinc-800 rounded-lg cursor-pointer"
                  />
                </div>

                <div className="grid grid-cols-4 gap-1.5 pt-1">
                  {[-0.5, -0.1, 0.1, 0.5].map((step) => (
                    <button
                      key={step}
                      type="button"
                      onClick={() => {
                        const next = Math.max(minScoreWindow, Math.min(maxScoreWindow, previewScoreTime + step));
                        setPreviewScoreTime(next);
                        const v = pickerVideoRef.current;
                        if (v) {
                          if (isPickerPlaying) {
                            v.pause();
                            setIsPickerPlaying(false);
                          }
                          v.currentTime = next;
                        }
                      }}
                      className="py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-xs font-mono font-bold transition"
                    >
                      {step > 0 ? `+${step}s` : `${step}s`}
                    </button>
                  ))}
                </div>

                <button
                  type="button"
                  onClick={() => {
                    if (pickerVideoRef.current) pickerVideoRef.current.pause();
                    setIsPickerPlaying(false);
                    applySelectedScoreTime(previewScoreTime);
                  }}
                  className="w-full py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-amber-400 text-zinc-950 font-black text-xs shadow-lg transition active:scale-95"
                >
                  Xác Nhận Lấy 2 Giây Này
                </button>
              </div>
            </div>
          )}

          {/* Modal Thêm Nhạc / Link YouTube */}
          {showAddMusicModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#110f17] border border-white/[0.12] w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <h3 className="font-extrabold text-sm text-zinc-100 flex items-center gap-1.5">
                    <MusicIcon className="w-4 h-4 text-pink-400" />
                    <span>Thêm Nhạc Nền (BGM)</span>
                  </h3>
                  <button
                    onClick={() => setShowAddMusicModal(false)}
                    className="w-7 h-7 rounded-full bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-bold text-zinc-300">1. Dán Link YouTube:</label>
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      value={ytLinkInput}
                      onChange={(e) => setYtLinkInput(e.target.value)}
                      placeholder="https://youtube.com/watch?v=..."
                      className="flex-1 bg-zinc-950 border border-white/[0.08] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500"
                    />
                    <button
                      onClick={handleAddMusicFromYouTube}
                      disabled={isProcessingAudio}
                      className="px-3 py-2 bg-pink-500 hover:bg-pink-400 text-zinc-950 font-bold text-xs rounded-xl transition disabled:opacity-50"
                    >
                      Kết Nối
                    </button>
                  </div>
                </div>

                <div className="relative flex items-center justify-center my-2">
                  <div className="border-t border-zinc-800 w-full" />
                  <span className="bg-[#110f17] px-2 text-[10px] text-zinc-500 font-bold uppercase">Hoặc</span>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-bold text-zinc-300">2. Tải File Audio / Video từ máy:</label>
                  <label className="w-full py-3 rounded-2xl bg-zinc-800 hover:bg-zinc-750 text-zinc-200 border border-white/[0.08] text-xs font-bold flex items-center justify-center gap-2 cursor-pointer transition">
                    <span>Chọn tệp MP3, WAV, hoặc MP4</span>
                    <input
                      type="file"
                      accept="audio/*,video/*"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (file) handleAddMusicFromFile(file);
                      }}
                      className="hidden"
                    />
                  </label>
                </div>
              </div>
            </div>
          )}

          {/* Popup Tiến Trình Xuất Video Full HD */}
          {isExporting && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#110f17] border border-white/[0.12] w-full max-w-xs rounded-3xl p-6 flex flex-col items-center justify-center space-y-4 shadow-2xl">
                <div className="text-pink-400 animate-bounce">
                  <CatPawSvg className="w-12 h-12" />
                </div>
                <div className="text-sm font-black text-zinc-100">Đang xuất video 1080p...</div>
                <div className="w-full bg-zinc-800 h-2.5 rounded-full overflow-hidden">
                  <div
                    style={{ width: `${exportProgress}%` }}
                    className="h-full bg-gradient-to-r from-pink-500 to-amber-400 transition-all duration-150"
                  />
                </div>
                <span className="text-xs font-mono font-bold text-pink-400">{exportProgress}%</span>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-zinc-950/95 border border-pink-500/40 text-pink-200 px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-2 backdrop-blur-md">
              <CatPawSvg className="w-4 h-4 text-pink-400" />
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
