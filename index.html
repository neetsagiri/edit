    const formatTimeCode = (sec) => {
      const s = Math.max(0, sec || 0);
      const m = Math.floor(s / 60);
      const remSec = Math.floor(s % 60);
      return `${String(m).padStart(2, '0')}:${String(remSec).padStart(2, '0')}`;

    const easeInOutCubic = (x) => {

    const getExactVideoDuration = (videoUrl) => {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.muted = true;
        v.playsInline = true;
        v.src = videoUrl;

        let hasResolved = false;
        const doResolve = (dur) => {
          if (!hasResolved) {
            hasResolved = true;
            v.src = '';
            v.load();
            resolve(dur && !isNaN(dur) && dur !== Infinity && dur > 0 ? dur : 15);
          }
        };

        v.onloadedmetadata = () => doResolve(v.duration);
        v.oncanplay = () => doResolve(v.duration);
        v.onerror = () => doResolve(15);
        setTimeout(() => doResolve(15), 3500);
      });
    };

      const totalDuration = useMemo(() => {
        const sum = videoClips.reduce((acc, c) => acc + (c.duration / (c.speed || 1.0)), 0);

      // Xác định clip hiện tại với ranh giới chính xác tuyệt đối
      const getCurrentClipInfo = useCallback(
        (time) => {
          let acc = 0;
          for (let i = 0; i < videoClips.length; i++) {
            const c = videoClips[i];
            const spd = c.speed || 1.0;
            const effectiveDur = c.duration / spd;

            if (time >= acc && time < acc + effectiveDur) {
              const timelineOffset = time - acc;
              const sourceOffset = timelineOffset * spd;

              return {
                clip: c,
                clipIndex: i,
                clipStartTime: acc,
                clipOffsetTime: timelineOffset,
                effectiveDuration: effectiveDur,
                mediaSourceTime: c.trimStart + sourceOffset
              };
            }
            acc += effectiveDur;
          }

          if (videoClips.length > 0) {
            const last = videoClips[videoClips.length - 1];
            const spd = last.speed || 1.0;
            const effDur = last.duration / spd;
            const lastStart = Math.max(0, acc - effDur);
            const timelineOffset = Math.min(effDur, Math.max(0, time - lastStart));
            return {
              clip: last,
              clipIndex: videoClips.length - 1,
              clipStartTime: lastStart,
              clipOffsetTime: timelineOffset,
              effectiveDuration: effDur,
              mediaSourceTime: last.trimStart + (timelineOffset * spd)
            };
          }
          return null;
        },
        [videoClips]
      );

      const getDrawDimensions = (vidEl, targetW, targetH, currentFitMode, zoom = 1, pan = { x: 0, y: 0 }) => {
        if (!vidEl || !vidEl.videoWidth) return { x: 0, y: 0, w: targetW, h: targetH };
        const sFactor = currentFitMode === 'cover'
          ? Math.max(targetW / vidEl.videoWidth, targetH / vidEl.videoHeight)
          : Math.min(targetW / vidEl.videoWidth, targetH / vidEl.videoHeight);

        const drawW = vidEl.videoWidth * sFactor * zoom;
        const drawH = vidEl.videoHeight * sFactor * zoom;
        const drawX = ((targetW - drawW) / 2) + pan.x;
        const drawY = ((targetH - drawH) / 2) + pan.y;
        return { x: drawX, y: drawY, w: drawW, h: drawH };
      };

      // VẼ CANVAS: KHÔNG VẼ KHI ĐANG NHẢY THỜI GIAN ĐỂ TRÁNH DÍNH KHUNG HÌNH CŨ
      const drawFrameToContext = useCallback(
        (ctx, targetW, targetH, time) => {
          const vid = hiddenVideoRef.current;
          const clipInfo = getCurrentClipInfo(time);

          ctx.fillStyle = '#050508';
          ctx.fillRect(0, 0, targetW, targetH);

          if (!clipInfo || !vid || vid.readyState < 1 || isSwitchingClipRef.current) return;

          const { clip, clipOffsetTime, effectiveDuration } = clipInfo;
          const transDur = clip.transitionDuration || 0.45;
          const inDur = clip.animInDur || 0.5;
          const outDur = clip.animOutDur || 0.5;
          const timeLeft = Math.max(0, effectiveDuration - clipOffsetTime);

          const zoom = previewZoomRef.current || 1.0;
          const pan = previewPanRef.current || { x: 0, y: 0 };
          const panScaleX = targetW / (selectedRatio.w || 1);
          const panScaleY = targetH / (selectedRatio.h || 1);
          const basePan = { x: pan.x * panScaleX, y: pan.y * panScaleY };

          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, targetW, targetH);
          ctx.clip();

          const filterDef = FILTERS.find((f) => f.id === clip.colorFilter) || FILTERS[0];
          ctx.filter = (filterDef && filterDef.css && filterDef.css !== 'none') ? filterDef.css : 'none';

          let curAlpha = 1.0;
          let curScale = 1.0;
          let curTransX = 0;
          let curTransY = 0;

          // Transition mượt mà không dính frame
          if (clip.transition && clip.transition !== 'none' && clipOffsetTime < transDur) {
            const rawProgress = Math.max(0, Math.min(1, clipOffsetTime / transDur));
            const easeProgress = easeInOutCubic(rawProgress);

            if (clip.transition === 'fade') curAlpha = easeProgress;
            else if (clip.transition === 'zoom') {
              curScale = 0.6 + easeProgress * 0.4;
              curAlpha = easeProgress;
            } else if (clip.transition === 'slide') curTransX = (1.0 - easeProgress) * targetW;
            else if (clip.transition === 'slide_up') curTransY = (1.0 - easeProgress) * targetH;
            else if (clip.transition === 'black_fade') curAlpha = rawProgress < 0.35 ? 0 : (rawProgress - 0.35) / 0.65;
            else if (clip.transition === 'glitch') {
              curTransX = (Math.random() - 0.5) * 18 * (1.0 - easeProgress);
              curTransY = (Math.random() - 0.5) * 10 * (1.0 - easeProgress);
            }
          }

          // Anim In
          if ((!clip.transition || clip.transition === 'none' || clipOffsetTime >= transDur) && clip.animIn && clip.animIn !== 'none' && clipOffsetTime < inDur) {
            const pIn = easeInOutCubic(clipOffsetTime / inDur);
            if (clip.animIn === 'fade_in') curAlpha = Math.min(curAlpha, pIn);
            else if (clip.animIn === 'zoom_in') curScale *= (0.4 + pIn * 0.6);
            else if (clip.animIn === 'slide_in_left') curTransX -= (1.0 - pIn) * targetW * 0.6;
            else if (clip.animIn === 'slide_in_right') curTransX += (1.0 - pIn) * targetW * 0.6;
            else if (clip.animIn === 'slide_in_up') curTransY += (1.0 - pIn) * targetH * 0.6;
          }

          // Anim Out
          if (clip.animOut && clip.animOut !== 'none' && timeLeft < outDur) {
            const pOut = easeInOutCubic(timeLeft / outDur);
            if (clip.animOut === 'fade_out') curAlpha = Math.min(curAlpha, pOut);
            else if (clip.animOut === 'zoom_out') curScale *= (0.4 + pOut * 0.6);
            else if (clip.animOut === 'slide_out_left') curTransX -= (1.0 - pOut) * targetW * 0.6;
            else if (clip.animOut === 'slide_out_right') curTransX += (1.0 - pOut) * targetW * 0.6;
            else if (clip.animOut === 'slide_out_down') curTransY += (1.0 - pOut) * targetH * 0.6;
            else if (clip.animOut === 'black_out') curAlpha = Math.min(curAlpha, pOut);
          }

          ctx.globalAlpha = Math.max(0, Math.min(1, curAlpha));
          const dimsCur = getDrawDimensions(
            vid,
            targetW,
            targetH,
            fitMode,
            zoom * curScale,
            { x: basePan.x + curTransX, y: basePan.y + curTransY }
          );
          ctx.drawImage(vid, dimsCur.x, dimsCur.y, dimsCur.w, dimsCur.h);

          // Flash
          if (clip.transition === 'flash' && clipOffsetTime < transDur) {
            const flashProgress = clipOffsetTime / transDur;
            ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 1.0 - flashProgress * 1.6)})`;
            ctx.fillRect(0, 0, targetW, targetH);
          }
          if (clip.animIn === 'flash_in' && clipOffsetTime < inDur) {
            ctx.fillStyle = `rgba(255,255,255,${Math.max(0, (1.0 - clipOffsetTime / inDur) * 0.85)})`;
            ctx.fillRect(0, 0, targetW, targetH);
          }

          ctx.restore();
        },
        [getCurrentClipInfo, fitMode, selectedRatio]
      );

      const renderCanvasFrame = useCallback(
        (time) => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d', { alpha: false });
          if (!ctx) return;
          drawFrameToContext(ctx, canvas.width, canvas.height, time);
        },
        [drawFrameToContext]
      );

      const seekTo = useCallback(
        (targetTime, forceRender = false) => {
          const clamped = Math.max(0, Math.min(totalDuration, targetTime));
          currentTimeRef.current = clamped;
          setCurrentTime(clamped);

          const info = getCurrentClipInfo(clamped);
          const vid = hiddenVideoRef.current;

          if (info && vid) {
            activeClipIdRef.current = info.clip.id;
            setActiveClipId(info.clip.id);

            if (vid.src !== info.clip.url) {
              vid.src = info.clip.url;
              vid.load();
            }
            vid.playbackRate = info.clip.speed || 1.0;
            vid.volume = isMuted ? 0 : (info.clip.volume ?? 1.0);

            if (Math.abs(vid.currentTime - info.mediaSourceTime) > 0.04 || forceRender) {
              vid.currentTime = info.mediaSourceTime;
              const onSeek = () => {
                renderCanvasFrame(clamped);
                vid.removeEventListener('seeked', onSeek);
              };
              vid.addEventListener('seeked', onSeek);
              renderCanvasFrame(clamped);
            } else {
              renderCanvasFrame(clamped);
            }
          } else {
            renderCanvasFrame(clamped);
          }
        },
        [totalDuration, getCurrentClipInfo, renderCanvasFrame, isMuted]
      );

      const playVideo = () => {
        if (videoClips.length === 0) return;
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;

        if (currentTimeRef.current >= totalDuration - 0.08) {
          seekTo(0, true);
        }

        const info = getCurrentClipInfo(currentTimeRef.current);
        if (info && vid) {
          if (vid.src !== info.clip.url) {
            vid.src = info.clip.url;
            vid.load();
          }
          vid.playbackRate = info.clip.speed || 1.0;
          vid.currentTime = info.mediaSourceTime;
          vid.volume = isMuted ? 0 : (info.clip.volume ?? 1.0);
          vid.play().catch(() => {});
        }

        if (bgm && audioClips.length > 0) {
          bgm.play().catch(() => {});
        }

        isPlayingRef.current = true;
        setIsPlaying(true);
      };

      const pauseVideo = () => {
        isPlayingRef.current = false;
        setIsPlaying(false);
        if (hiddenVideoRef.current) hiddenVideoRef.current.pause();
        if (bgmAudioRef.current) bgmAudioRef.current.pause();
      };

      const togglePlay = () => {
        if (isPlayingRef.current) pauseVideo();
        else playVideo();
      };

      // VÒNG LẶP PHÁT THỜI GIAN THỰC ĐƯỢC FIX DỨT ĐIỂM:
      // KHI HẾT CLIP, DỪNG VẼ FRAME CŨ VÀ ĐỢI VID SEEKED ĐẾN MỐC TRIMSTART CLIP MỚI
      useEffect(() => {
        if (currentPage !== 'editor') return;

        const loop = (now) => {
          if (isPlayingRef.current) {
            const vid = hiddenVideoRef.current;
            const currentClipId = activeClipIdRef.current;
            const curIdx = videoClips.findIndex((c) => c.id === currentClipId);
            const activeIdx = curIdx >= 0 ? curIdx : 0;
            const curClip = videoClips[activeIdx];

            if (vid && curClip && !isSwitchingClipRef.current) {
              const spd = curClip.speed || 1.0;
              const clipSourceEnd = curClip.trimStart + curClip.duration;
              const curSourceTime = vid.currentTime;

              // Chạm mốc kết thúc của clip hiện tại
              if (curSourceTime >= clipSourceEnd - 0.04) {
                if (activeIdx < videoClips.length - 1) {
                  const nextClip = videoClips[activeIdx + 1];
                  const nextSpd = nextClip.speed || 1.0;

                  // KHÓA LẠI: Tạm dừng vẽ ngay để clip sau không bị dính frame clip trước
                  isSwitchingClipRef.current = true;
                  activeClipIdRef.current = nextClip.id;
                  setActiveClipId(nextClip.id);

                  if (vid.src !== nextClip.url) {
                    vid.src = nextClip.url;
                    vid.load();
                  }
                  vid.playbackRate = nextSpd;
                  vid.currentTime = nextClip.trimStart;

                  // Đợi video giải mã xong mốc mới rồi mới tiếp tục phát
                  const onSwitchDone = () => {
                    vid.removeEventListener('seeked', onSwitchDone);
                    isSwitchingClipRef.current = false;
                    vid.play().catch(() => {});
                  };
                  vid.addEventListener('seeked', onSwitchDone);
                } else {
                  pauseVideo();
                  seekTo(totalDuration, true);
                }
              } else {
                let clipStartTime = 0;
                for (let i = 0; i < activeIdx; i++) {
                  clipStartTime += videoClips[i].duration / (videoClips[i].speed || 1.0);
                }

                const elapsedSourceInClip = Math.max(0, curSourceTime - curClip.trimStart);
                const exactTimelineTime = Math.min(totalDuration, clipStartTime + elapsedSourceInClip / spd);

                currentTimeRef.current = exactTimelineTime;

                if (timelineScrollRef.current) {
                  isSystemScrolling.current = true;
                  timelineScrollRef.current.scrollLeft = exactTimelineTime * timelineZoom;
                  isSystemScrolling.current = false;
                }

                if (now - lastUiUpdateRef.current > 35) {
                  setCurrentTime(exactTimelineTime);
                  lastUiUpdateRef.current = now;
                }
                renderCanvasFrame(exactTimelineTime);
              }
            }
          }
          animationFrameRef.current = requestAnimationFrame(loop);
        };

        animationFrameRef.current = requestAnimationFrame(loop);
        return () => {
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };
      }, [currentPage, videoClips, totalDuration, timelineZoom, renderCanvasFrame, seekTo, getCurrentClipInfo]);

      const handleTimelinePointerDown = (e) => {
        pauseVideo();
        isTimelineDraggingRef.current = true;
        timelineDragDataRef.current = {
          startX: e.clientX,
          startScrollLeft: timelineScrollRef.current ? timelineScrollRef.current.scrollLeft : 0,
          isMoved: false
        };
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleTimelinePointerMove = (e) => {
        if (!isTimelineDraggingRef.current || !timelineScrollRef.current) return;
        const data = timelineDragDataRef.current;
        const deltaX = e.clientX - data.startX;
        if (Math.abs(deltaX) > 2) data.isMoved = true;

        const newScrollLeft = Math.max(0, Math.min(totalDuration * timelineZoom, data.startScrollLeft - deltaX));
        timelineScrollRef.current.scrollLeft = newScrollLeft;
        const computedTime = Math.max(0, Math.min(totalDuration, newScrollLeft / timelineZoom));
        seekTo(computedTime, false);
      };

      const handleTimelinePointerUp = (e) => {
        if (isTimelineDraggingRef.current) {
          isTimelineDraggingRef.current = false;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      };

      const handleTimelineScroll = (e) => {
        if (isSystemScrolling.current || isPlayingRef.current) return;
        const scrollLeft = e.target.scrollLeft;
        const computedTime = Math.max(0, Math.min(totalDuration, scrollLeft / timelineZoom));
        if (Math.abs(computedTime - currentTimeRef.current) > 0.03) {
          seekTo(computedTime, false);
        }
      };

      const handleTrimPointerDown = (e, handleType, clip) => {
        e.stopPropagation();
        e.preventDefault();
        pauseVideo();
        triggerHaptic(10);

        isTrimmingRef.current = true;
        trimDataRef.current = {
          handle: handleType,
          clipId: clip.id,
          startX: e.clientX,
          initTrimStart: clip.trimStart,
          initDuration: clip.duration,
          sourceDur: clip.sourceDuration || clip.duration,
          speed: clip.speed || 1.0
        };

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleTrimPointerMove = (e) => {
        if (!isTrimmingRef.current) return;
        const data = trimDataRef.current;
        const deltaX = e.clientX - data.startX;
        const deltaSec = (deltaX / timelineZoom) * data.speed;

        if (data.handle === 'right') {
          const maxAllowed = data.sourceDur - data.initTrimStart;
          const newDur = Math.max(0.3, Math.min(maxAllowed, data.initDuration + deltaSec));

          setVideoClips((prev) =>
            prev.map((c) => (c.id === data.clipId ? { ...c, duration: Number(newDur.toFixed(2)) } : c))
          );

          const vid = hiddenVideoRef.current;
          if (vid) {
            vid.currentTime = data.initTrimStart + newDur;
            renderCanvasFrame(currentTimeRef.current);
          }
        } else if (data.handle === 'left') {
          const maxTrim = data.initTrimStart + data.initDuration - 0.3;
          const newTrimStart = Math.max(0, Math.min(maxTrim, data.initTrimStart + deltaSec));
          const actualDelta = newTrimStart - data.initTrimStart;
          const newDur = Math.max(0.3, data.initDuration - actualDelta);

          setVideoClips((prev) =>
            prev.map((c) =>
              c.id === data.clipId
                ? { ...c, trimStart: Number(newTrimStart.toFixed(2)), duration: Number(newDur.toFixed(2)) }
                : c
            )
          );

          const vid = hiddenVideoRef.current;
          if (vid) {
            vid.currentTime = newTrimStart;
            renderCanvasFrame(currentTimeRef.current);
          }
        }
      };

      const handleTrimPointerUp = (e) => {
        if (isTrimmingRef.current) {
          isTrimmingRef.current = false;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
          showToast('🐾 Đã tinh chỉnh độ dài clip');
          seekTo(currentTimeRef.current, false);
        }
      };

      // TÁCH CLIP TẠI PLAYHEAD
      const handleSplitClipAtPlayhead = () => {
        const t = currentTimeRef.current;
        const info = getCurrentClipInfo(t);
        if (!info) return;

        const { clip, clipIndex, clipOffsetTime } = info;
        const spd = clip.speed || 1.0;
        const sourceOffset = clipOffsetTime * spd;

        if (clipOffsetTime < 0.1 || (clip.duration / spd) - clipOffsetTime < 0.1) {
          showToast('Điểm cắt phải cách 2 đầu ít nhất 0.1s');
          return;
        }

        triggerHaptic(20);

        const clip1 = { 
          ...clip, 
          duration: Number(sourceOffset.toFixed(2)) 
        };
        const clip2 = {
          ...clip,
          id: `clip_${Date.now()}_part2`,
          trimStart: Number((clip.trimStart + sourceOffset).toFixed(2)),
          duration: Number((clip.duration - sourceOffset).toFixed(2)),
          transition: 'none',
          transitionDuration: 0.5,
          animIn: 'none',
          animInDur: 0.5,
          animOut: 'none',
          animOutDur: 0.5,
          isScoreClip: false
        };

        const newClips = [...videoClips];
        newClips.splice(clipIndex, 1, clip1, clip2);
        setVideoClips(newClips);
        
        setActiveClipId(clip1.id);
        activeClipIdRef.current = clip1.id;

        renderCanvasFrame(t);
        showToast('🐾 Đã tách clip!');
      };

      const applyMatrixTemplate = async (customVideoFile = null) => {
        const url = customVideoFile ? URL.createObjectURL(customVideoFile) : SAMPLE_WW_VIDEO;
        const name = customVideoFile ? customVideoFile.name : 'Neko_Combat_Sample.mp4';
        showToast('🐾 NekoAuto đang dựng kịch bản tối ưu...');

        const trueDuration = await getExactVideoDuration(url);
        const chosenStyle = NEKO_STYLES.find((s) => s.id === selectedStyleId) || NEKO_STYLES[0];

        const scoreDuration = Math.min(2.0, Math.max(0.5, trueDuration * 0.15));
        const combatDuration = Math.max(1.0, trueDuration - scoreDuration);

        const scoreClip = {
          id: `score_${Date.now()}`,
          name: '01. Điểm Neko (Hook 2s)',
          url,
          sourceDuration: trueDuration,
          trimStart: Math.max(0, trueDuration - scoreDuration),
          duration: scoreDuration,
          speed: 0.85,
          colorFilter: 'high-contrast',
          transition: 'flash',
          transitionDuration: 0.45,
          animIn: 'zoom_in',
          animInDur: 0.45,
          animOut: 'flash_out',
          animOutDur: 0.3,
          volume: 1.0,
          isScoreClip: true
        };

        const combatClip = {
          id: `combat_${Date.now()}`,
          name: `02. Combat (${chosenStyle.name})`,
          url,
          sourceDuration: trueDuration,
          trimStart: 0,
          duration: combatDuration,
          speed: 1.0,
          colorFilter: chosenStyle.id,
          transition: 'zoom',
          transitionDuration: 0.5,
          animIn: 'none',
          animInDur: 0.4,
          animOut: 'fade_out',
          animOutDur: 0.4,
          volume: 1.0,
          isScoreClip: false
        };

        const finalClips = autoScoreLoop ? [scoreClip, combatClip] : [{ ...combatClip, duration: trueDuration }];

        setProjectTitle(name.replace(/\.[^/.]+$/, ""));
        setVideoClips(finalClips);
        setActiveClipId(finalClips[0].id);
        activeClipIdRef.current = finalClips[0].id;
        setSelectedRatio(ASPECT_RATIOS[0]);
        setCurrentTime(0);
        currentTimeRef.current = 0;
        setSubtitles([]);
        setAudioClips([]);
        setShowTemplateModal(false);

        const vid = hiddenVideoRef.current;
        if (vid) {
          vid.pause();
          vid.removeAttribute('crossorigin');
          vid.src = url;
          vid.load();
        }

        setCurrentPage('editor');
        if (timelineScrollRef.current) timelineScrollRef.current.scrollLeft = 0;
        showToast(`🐾 MatrixAuto sẵn sàng: ${trueDuration.toFixed(1)}s`);
      };

      const handleExportMP4 = async () => {
        if (videoClips.length === 0 || isExporting) return;
        pauseVideo();
        setIsExporting(true);
        setExportProgress(0);

        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;
        if (!vid) {
          setIsExporting(false);
          return;
        }

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = selectedRatio.w;
        exportCanvas.height = selectedRatio.h;
        const exportCtx = exportCanvas.getContext('2d', { alpha: false });

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const actx = new AudioCtx();
        const audioDest = actx.createMediaStreamDestination();

        if (vid) {
          try {
            const vidSrc = actx.createMediaElementSource(vid);
            vidSrc.connect(audioDest);
          } catch (_) {}
        }
        if (bgm && audioClips.length > 0) {
          try {
            const bgmSrc = actx.createMediaElementSource(bgm);
            bgmSrc.connect(audioDest);
          } catch (_) {}
        }

        const canvasStream = exportCanvas.captureStream(30);
        const combinedTracks = [
          ...canvasStream.getVideoTracks(),
          ...audioDest.stream.getAudioTracks()
        ];
        const combinedStream = new MediaStream(combinedTracks);

        let mimeType = 'video/webm;codecs=vp8,opus';
        if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1,mp4a.40.2')) {
          mimeType = 'video/mp4;codecs=avc1,mp4a.40.2';
        } else if (MediaRecorder.isTypeSupported('video/mp4')) {
          mimeType = 'video/mp4';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264,opus')) {
          mimeType = 'video/webm;codecs=h264,opus';
        }

        const recorder = new MediaRecorder(combinedStream, {
          mimeType,
          videoBitsPerSecond: 16000000
        });

        const chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
          const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
          const blob = new Blob(chunks, { type: mimeType });
          const downloadUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = `NekoCut_Export_${Date.now()}.${ext}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(downloadUrl);

          setIsExporting(false);
          showToast('🐾 Xuất video hoàn tất!');
          seekTo(0, true);
        };

        recorder.start(100);
        showToast('Đang kết xuất video & audio...');

        const startTime = performance.now();
        const totalMs = totalDuration * 1000;

        seekTo(0, true);
        vid.volume = isMuted ? 0 : (videoClips[0]?.volume ?? 1.0);
        vid.play().catch(() => {});
        if (bgm && audioClips.length > 0) {
          bgm.currentTime = 0;
          bgm.play().catch(() => {});
        }

        const renderExportLoop = () => {
          const elapsed = performance.now() - startTime;
          const curTimelineSec = Math.min(totalDuration, elapsed / 1000);

          drawFrameToContext(exportCtx, exportCanvas.width, exportCanvas.height, curTimelineSec);
          setExportProgress(Math.min(100, Math.round((curTimelineSec / totalDuration) * 100)));

          const info = getCurrentClipInfo(curTimelineSec);
          if (info && vid.src !== info.clip.url) {
            vid.src = info.clip.url;
            vid.load();
          }
          if (info && Math.abs(vid.currentTime - info.mediaSourceTime) > 0.08) {
            vid.currentTime = info.mediaSourceTime;
          }

          if (elapsed < totalMs) {
            requestAnimationFrame(renderExportLoop);
          } else {
            vid.pause();
            if (bgm) bgm.pause();
            recorder.stop();
          }
        };

        requestAnimationFrame(renderExportLoop);
      };

      return (
        <div className="flex flex-col h-full w-full bg-[#050508] text-zinc-100 select-none overflow-hidden relative font-sans">
          
          <video
            ref={hiddenVideoRef}
            className="hidden"
            playsInline
            muted={isMuted}
            onLoadedMetadata={() => renderCanvasFrame(currentTimeRef.current)}
            onError={() => showToast('🐾 Lỗi tải video, vui lòng chọn file từ thiết bị')}
          />

          <audio
            ref={bgmAudioRef}
            className="hidden"
            playsInline
            loop
          />

          {/* TRANG 1: MÀN HÌNH CHÍNH (HOME) */}
          {currentPage === 'home' && (
            <div className="flex flex-col h-full w-full overflow-hidden bg-[#07070a] relative select-none">
              <CatPawTrail />
              
              <header className="h-16 px-4 pt-2 flex items-center justify-between z-20 shrink-0">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-full border-2 border-pink-500/60 overflow-hidden bg-zinc-900 shadow-[0_0_12px_rgba(255,42,122,0.4)] shrink-0 flex items-center justify-center">
                    <img
                      src="nekocut.jpg"
                      alt="NekoCut Logo"
                      className="w-full h-full object-cover"
                      onError={(e) => {
                        e.target.onerror = null;
                        e.target.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=NekoSagiri';

      const m = Math.floor(s / 60);

      return `${String(m).padStart(2, '0')}:${String(remSec).padStart(2, '0')}`;
    };

    const easeInOutCubic = (x) => {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

    const getExactVideoDuration = (videoUrl) => {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.muted = true;
        v.playsInline = true;
        v.src = videoUrl;

        let hasResolved = false;
        const doResolve = (dur) => {
          if (!hasResolved) {
            hasResolved = true;
            v.src = '';
            v.load();
            resolve(dur && !isNaN(dur) && dur !== Infinity && dur > 0 ? dur : 15);
          }
        };

        v.onloadedmetadata = () => doResolve(v.duration);
        v.oncanplay = () => doResolve(v.duration);
        v.onerror = () => doResolve(15);
        setTimeout(() => doResolve(15), 3500);
      });
    };

      const totalDuration = useMemo(() => {
        const sum = videoClips.reduce((acc, c) => acc + (c.duration / (c.speed || 1.0)), 0);
        return Math.max(1, sum);
      }, [videoClips]);

      const activeClip = useMemo(() => {
        return videoClips.find((c) => c.id === activeClipId) || videoClips[0] || null;
      }, [videoClips, activeClipId]);

      const getCurrentClipInfo = useCallback(
        (time) => {
          let acc = 0;
          for (let i = 0; i < videoClips.length; i++) {
            const c = videoClips[i];
            const spd = c.speed || 1.0;
            const effectiveDur = c.duration / spd;

            if (time >= acc && time < acc + effectiveDur) {
              const timelineOffset = time - acc;
              const sourceOffset = timelineOffset * spd;

              return {
                clip: c,
                clipIndex: i,
                clipStartTime: acc,
                clipOffsetTime: timelineOffset,
                effectiveDuration: effectiveDur,
                mediaSourceTime: c.trimStart + sourceOffset
              };
            }
            acc += effectiveDur;
          }

          if (videoClips.length > 0) {
            const last = videoClips[videoClips.length - 1];
            const spd = last.speed || 1.0;
            const effDur = last.duration / spd;
            const lastStart = Math.max(0, acc - effDur);
            const timelineOffset = Math.min(effDur, Math.max(0, time - lastStart));
            return {
              clip: last,
              clipIndex: videoClips.length - 1,
              clipStartTime: lastStart,
              clipOffsetTime: timelineOffset,
              effectiveDuration: effDur,
              mediaSourceTime: last.trimStart + (timelineOffset * spd)
            };
          }
          return null;
        },
        [videoClips]
      );

      const getDrawDimensions = (vidEl, targetW, targetH, currentFitMode, zoom = 1, pan = { x: 0, y: 0 }) => {
        if (!vidEl || !vidEl.videoWidth) return { x: 0, y: 0, w: targetW, h: targetH };
        const sFactor = currentFitMode === 'cover'
          ? Math.max(targetW / vidEl.videoWidth, targetH / vidEl.videoHeight)
          : Math.min(targetW / vidEl.videoWidth, targetH / vidEl.videoHeight);

        const drawW = vidEl.videoWidth * sFactor * zoom;
        const drawH = vidEl.videoHeight * sFactor * zoom;
        const drawX = ((targetW - drawW) / 2) + pan.x;
        const drawY = ((targetH - drawH) / 2) + pan.y;
        return { x: drawX, y: drawY, w: drawW, h: drawH };
      };

      // VẼ CANVAS: KHÔNG VẼ KHI ĐANG NHẢY CLIP ĐỂ TRÁNH LẶP HÌNH CŨ
      const drawFrameToContext = useCallback(
        (ctx, targetW, targetH, time) => {
          const vid = hiddenVideoRef.current;
          const clipInfo = getCurrentClipInfo(time);

          ctx.fillStyle = '#050508';
          ctx.fillRect(0, 0, targetW, targetH);

          if (!clipInfo || !vid || vid.readyState < 1 || isSwitchingClipRef.current) return;

          const { clip, clipOffsetTime, effectiveDuration } = clipInfo;
          const transDur = clip.transitionDuration || 0.45;
          const inDur = clip.animInDur || 0.5;
          const outDur = clip.animOutDur || 0.5;
          const timeLeft = Math.max(0, effectiveDuration - clipOffsetTime);

          const zoom = previewZoomRef.current || 1.0;
          const pan = previewPanRef.current || { x: 0, y: 0 };
          const panScaleX = targetW / (selectedRatio.w || 1);
          const panScaleY = targetH / (selectedRatio.h || 1);
          const basePan = { x: pan.x * panScaleX, y: pan.y * panScaleY };

          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, targetW, targetH);
          ctx.clip();

          const filterDef = FILTERS.find((f) => f.id === clip.colorFilter) || FILTERS[0];
          ctx.filter = (filterDef && filterDef.css && filterDef.css !== 'none') ? filterDef.css : 'none';

          let curAlpha = 1.0;
          let curScale = 1.0;
          let curTransX = 0;
          let curTransY = 0;

          // Transition mượt mà không dính frame
          if (clip.transition && clip.transition !== 'none' && clipOffsetTime < transDur) {
            const rawProgress = Math.max(0, Math.min(1, clipOffsetTime / transDur));
            const easeProgress = easeInOutCubic(rawProgress);

            if (clip.transition === 'fade') curAlpha = easeProgress;
            else if (clip.transition === 'zoom') {
              curScale = 0.6 + easeProgress * 0.4;
              curAlpha = easeProgress;
            } else if (clip.transition === 'slide') curTransX = (1.0 - easeProgress) * targetW;
            else if (clip.transition === 'slide_up') curTransY = (1.0 - easeProgress) * targetH;
            else if (clip.transition === 'black_fade') curAlpha = rawProgress < 0.35 ? 0 : (rawProgress - 0.35) / 0.65;
            else if (clip.transition === 'glitch') {
              curTransX = (Math.random() - 0.5) * 18 * (1.0 - easeProgress);
              curTransY = (Math.random() - 0.5) * 10 * (1.0 - easeProgress);
            }
          }

          // Anim In
          if ((!clip.transition || clip.transition === 'none' || clipOffsetTime >= transDur) && clip.animIn && clip.animIn !== 'none' && clipOffsetTime < inDur) {
            const pIn = easeInOutCubic(clipOffsetTime / inDur);
            if (clip.animIn === 'fade_in') curAlpha = Math.min(curAlpha, pIn);
            else if (clip.animIn === 'zoom_in') curScale *= (0.4 + pIn * 0.6);
            else if (clip.animIn === 'slide_in_left') curTransX -= (1.0 - pIn) * targetW * 0.6;
            else if (clip.animIn === 'slide_in_right') curTransX += (1.0 - pIn) * targetW * 0.6;
            else if (clip.animIn === 'slide_in_up') curTransY += (1.0 - pIn) * targetH * 0.6;
          }

          // Anim Out
          if (clip.animOut && clip.animOut !== 'none' && timeLeft < outDur) {
            const pOut = easeInOutCubic(timeLeft / outDur);
            if (clip.animOut === 'fade_out') curAlpha = Math.min(curAlpha, pOut);
            else if (clip.animOut === 'zoom_out') curScale *= (0.4 + pOut * 0.6);
            else if (clip.animOut === 'slide_out_left') curTransX -= (1.0 - pOut) * targetW * 0.6;
            else if (clip.animOut === 'slide_out_right') curTransX += (1.0 - pOut) * targetW * 0.6;
            else if (clip.animOut === 'slide_out_down') curTransY += (1.0 - pOut) * targetH * 0.6;
            else if (clip.animOut === 'black_out') curAlpha = Math.min(curAlpha, pOut);
          }

          ctx.globalAlpha = Math.max(0, Math.min(1, curAlpha));
          const dimsCur = getDrawDimensions(
            vid,
            targetW,
            targetH,
            fitMode,
            zoom * curScale,
            { x: basePan.x + curTransX, y: basePan.y + curTransY }
          );
          ctx.drawImage(vid, dimsCur.x, dimsCur.y, dimsCur.w, dimsCur.h);

          // Flash
          if (clip.transition === 'flash' && clipOffsetTime < transDur) {
            const flashProgress = clipOffsetTime / transDur;
            ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 1.0 - flashProgress * 1.6)})`;
            ctx.fillRect(0, 0, targetW, targetH);
          }
          if (clip.animIn === 'flash_in' && clipOffsetTime < inDur) {
            ctx.fillStyle = `rgba(255,255,255,${Math.max(0, (1.0 - clipOffsetTime / inDur) * 0.85)})`;
            ctx.fillRect(0, 0, targetW, targetH);
          }

          ctx.restore();
        },
        [getCurrentClipInfo, fitMode, selectedRatio]
      );

      const renderCanvasFrame = useCallback(
        (time) => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d', { alpha: false });
          if (!ctx) return;
          drawFrameToContext(ctx, canvas.width, canvas.height, time);
        },
        [drawFrameToContext]
      );

      const seekTo = useCallback(
        (targetTime, forceRender = false) => {
          const clamped = Math.max(0, Math.min(totalDuration, targetTime));
          currentTimeRef.current = clamped;
          setCurrentTime(clamped);

          const info = getCurrentClipInfo(clamped);
          const vid = hiddenVideoRef.current;

          if (info && vid) {
            activeClipIdRef.current = info.clip.id;
            setActiveClipId(info.clip.id);

            if (vid.src !== info.clip.url) {
              vid.src = info.clip.url;
              vid.load();
            }
            vid.playbackRate = info.clip.speed || 1.0;
            vid.volume = isMuted ? 0 : (info.clip.volume ?? 1.0);

            if (Math.abs(vid.currentTime - info.mediaSourceTime) > 0.04 || forceRender) {
              vid.currentTime = info.mediaSourceTime;
              const onSeek = () => {
                renderCanvasFrame(clamped);
                vid.removeEventListener('seeked', onSeek);
              };
              vid.addEventListener('seeked', onSeek);
              renderCanvasFrame(clamped);
            } else {
              renderCanvasFrame(clamped);
            }
          } else {
            renderCanvasFrame(clamped);
          }
        },
        [totalDuration, getCurrentClipInfo, renderCanvasFrame, isMuted]
      );

      const playVideo = () => {
        if (videoClips.length === 0) return;
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;

        if (currentTimeRef.current >= totalDuration - 0.08) {
          seekTo(0, true);
        }

        const info = getCurrentClipInfo(currentTimeRef.current);
        if (info && vid) {
          if (vid.src !== info.clip.url) {
            vid.src = info.clip.url;
            vid.load();
          }
          vid.playbackRate = info.clip.speed || 1.0;
          vid.currentTime = info.mediaSourceTime;
          vid.volume = isMuted ? 0 : (info.clip.volume ?? 1.0);
          vid.play().catch(() => {});
        }

        if (bgm && audioClips.length > 0) {
          bgm.play().catch(() => {});
        }

        isPlayingRef.current = true;
        setIsPlaying(true);
      };

      const pauseVideo = () => {
        isPlayingRef.current = false;
        setIsPlaying(false);
        if (hiddenVideoRef.current) hiddenVideoRef.current.pause();
        if (bgmAudioRef.current) bgmAudioRef.current.pause();
      };

      const togglePlay = () => {
        if (isPlayingRef.current) pauseVideo();
        else playVideo();
      };

      // VÒNG LẶP PHÁT THỜI GIAN THỰC ĐƯỢC FIX DỨT ĐIỂM:
      // KHI HẾT CLIP, DỪNG VẼ FRAME CŨ VÀ ĐỢI VID SEEKED ĐẾN MỐC TRIMSTART CLIP MỚI
      useEffect(() => {
        if (currentPage !== 'editor') return;

        const loop = (now) => {
          if (isPlayingRef.current) {
            const vid = hiddenVideoRef.current;
            const currentClipId = activeClipIdRef.current;
            const curIdx = videoClips.findIndex((c) => c.id === currentClipId);
            const activeIdx = curIdx >= 0 ? curIdx : 0;
            const curClip = videoClips[activeIdx];

            if (vid && curClip && !isSwitchingClipRef.current) {
              const spd = curClip.speed || 1.0;
              const clipSourceEnd = curClip.trimStart + curClip.duration;
              const curSourceTime = vid.currentTime;

              // Chạm mốc kết thúc của clip hiện tại
              if (curSourceTime >= clipSourceEnd - 0.04) {
                if (activeIdx < videoClips.length - 1) {
                  const nextClip = videoClips[activeIdx + 1];
                  const nextSpd = nextClip.speed || 1.0;

                  // KHÓA LẠI: Tạm dừng vẽ ngay để clip sau không bị dính frame clip trước
                  isSwitchingClipRef.current = true;
                  activeClipIdRef.current = nextClip.id;
                  setActiveClipId(nextClip.id);

                  if (vid.src !== nextClip.url) {
                    vid.src = nextClip.url;
                    vid.load();
                  }
                  vid.playbackRate = nextSpd;
                  vid.currentTime = nextClip.trimStart;

                  // Đợi video giải mã xong mốc mới rồi mới tiếp tục phát
                  const onSwitchDone = () => {
                    vid.removeEventListener('seeked', onSwitchDone);
                    isSwitchingClipRef.current = false;
                    vid.play().catch(() => {});
                  };
                  vid.addEventListener('seeked', onSwitchDone);
                } else {
                  pauseVideo();
                  seekTo(totalDuration, true);
                }
              } else {
                let clipStartTime = 0;
                for (let i = 0; i < activeIdx; i++) {
                  clipStartTime += videoClips[i].duration / (videoClips[i].speed || 1.0);
                }

                const elapsedSourceInClip = Math.max(0, curSourceTime - curClip.trimStart);
                const exactTimelineTime = Math.min(totalDuration, clipStartTime + elapsedSourceInClip / spd);

                currentTimeRef.current = exactTimelineTime;

                if (timelineScrollRef.current) {
                  isSystemScrolling.current = true;
                  timelineScrollRef.current.scrollLeft = exactTimelineTime * timelineZoom;
                  isSystemScrolling.current = false;
                }

                if (now - lastUiUpdateRef.current > 35) {
                  setCurrentTime(exactTimelineTime);
                  lastUiUpdateRef.current = now;
                }
                renderCanvasFrame(exactTimelineTime);
              }
            }
          }
          animationFrameRef.current = requestAnimationFrame(loop);
        };

        animationFrameRef.current = requestAnimationFrame(loop);
        return () => {
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };
      }, [currentPage, videoClips, totalDuration, timelineZoom, renderCanvasFrame, seekTo, getCurrentClipInfo]);

      const handleTimelinePointerDown = (e) => {
        pauseVideo();
        isTimelineDraggingRef.current = true;
        timelineDragDataRef.current = {
          startX: e.clientX,
          startScrollLeft: timelineScrollRef.current ? timelineScrollRef.current.scrollLeft : 0,
          isMoved: false
        };
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleTimelinePointerMove = (e) => {
        if (!isTimelineDraggingRef.current || !timelineScrollRef.current) return;
        const data = timelineDragDataRef.current;
        const deltaX = e.clientX - data.startX;
        if (Math.abs(deltaX) > 2) data.isMoved = true;

        const newScrollLeft = Math.max(0, Math.min(totalDuration * timelineZoom, data.startScrollLeft - deltaX));
        timelineScrollRef.current.scrollLeft = newScrollLeft;
        const computedTime = Math.max(0, Math.min(totalDuration, newScrollLeft / timelineZoom));
        seekTo(computedTime, false);
      };

      const handleTimelinePointerUp = (e) => {
        if (isTimelineDraggingRef.current) {
          isTimelineDraggingRef.current = false;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      };

      const handleTimelineScroll = (e) => {
        if (isSystemScrolling.current || isPlayingRef.current) return;
        const scrollLeft = e.target.scrollLeft;
        const computedTime = Math.max(0, Math.min(totalDuration, scrollLeft / timelineZoom));
        if (Math.abs(computedTime - currentTimeRef.current) > 0.03) {
          seekTo(computedTime, false);
        }
      };

      const handleTrimPointerDown = (e, handleType, clip) => {
        e.stopPropagation();
        e.preventDefault();
        pauseVideo();
        triggerHaptic(10);

        isTrimmingRef.current = true;
        trimDataRef.current = {
          handle: handleType,
          clipId: clip.id,
          startX: e.clientX,
          initTrimStart: clip.trimStart,
          initDuration: clip.duration,
          sourceDur: clip.sourceDuration || clip.duration,
          speed: clip.speed || 1.0
        };

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleTrimPointerMove = (e) => {
        if (!isTrimmingRef.current) return;
        const data = trimDataRef.current;
        const deltaX = e.clientX - data.startX;
        const deltaSec = (deltaX / timelineZoom) * data.speed;

        if (data.handle === 'right') {
          const maxAllowed = data.sourceDur - data.initTrimStart;
          const newDur = Math.max(0.3, Math.min(maxAllowed, data.initDuration + deltaSec));

          setVideoClips((prev) =>
            prev.map((c) => (c.id === data.clipId ? { ...c, duration: Number(newDur.toFixed(2)) } : c))
          );

          const vid = hiddenVideoRef.current;
          if (vid) {
            vid.currentTime = data.initTrimStart + newDur;
            renderCanvasFrame(currentTimeRef.current);
          }
        } else if (data.handle === 'left') {
          const maxTrim = data.initTrimStart + data.initDuration - 0.3;
          const newTrimStart = Math.max(0, Math.min(maxTrim, data.initTrimStart + deltaSec));
          const actualDelta = newTrimStart - data.initTrimStart;
          const newDur = Math.max(0.3, data.initDuration - actualDelta);

          setVideoClips((prev) =>
            prev.map((c) =>
              c.id === data.clipId
                ? { ...c, trimStart: Number(newTrimStart.toFixed(2)), duration: Number(newDur.toFixed(2)) }
                : c
            )
          );

          const vid = hiddenVideoRef.current;
          if (vid) {
            vid.currentTime = newTrimStart;
            renderCanvasFrame(currentTimeRef.current);
          }
        }
      };

      const handleTrimPointerUp = (e) => {
        if (isTrimmingRef.current) {
          isTrimmingRef.current = false;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
          showToast('🐾 Đã tinh chỉnh độ dài clip');
          seekTo(currentTimeRef.current, false);
        }
      };

      const handleSplitClipAtPlayhead = () => {
        const t = currentTimeRef.current;
        const info = getCurrentClipInfo(t);
        if (!info) return;

        const { clip, clipIndex, clipOffsetTime } = info;
        const spd = clip.speed || 1.0;
        const sourceOffset = clipOffsetTime * spd;

        if (clipOffsetTime < 0.1 || (clip.duration / spd) - clipOffsetTime < 0.1) {
          showToast('Điểm cắt phải cách 2 đầu ít nhất 0.1s');
          return;
        }

        triggerHaptic(20);

        const clip1 = { 
          ...clip, 
          duration: Number(sourceOffset.toFixed(2)) 
        };
        const clip2 = {
          ...clip,
          id: `clip_${Date.now()}_part2`,
          trimStart: Number((clip.trimStart + sourceOffset).toFixed(2)),
          duration: Number((clip.duration - sourceOffset).toFixed(2)),
          transition: 'none',
          transitionDuration: 0.5,
          animIn: 'none',
          animInDur: 0.5,
          animOut: 'none',
          animOutDur: 0.5,
          isScoreClip: false
        };

        const newClips = [...videoClips];
        newClips.splice(clipIndex, 1, clip1, clip2);
        setVideoClips(newClips);
        
        setActiveClipId(clip1.id);
        activeClipIdRef.current = clip1.id;

        renderCanvasFrame(t);
        showToast('🐾 Đã tách clip!');
      };

      const applyMatrixTemplate = async (customVideoFile = null) => {
        const url = customVideoFile ? URL.createObjectURL(customVideoFile) : SAMPLE_WW_VIDEO;
        const name = customVideoFile ? customVideoFile.name : 'Neko_Combat_Sample.mp4';
        showToast('🐾 NekoAuto đang dựng kịch bản tối ưu...');

        const trueDuration = await getExactVideoDuration(url);
        const chosenStyle = NEKO_STYLES.find((s) => s.id === selectedStyleId) || NEKO_STYLES[0];

        const scoreDuration = Math.min(2.0, Math.max(0.5, trueDuration * 0.15));
        const combatDuration = Math.max(1.0, trueDuration - scoreDuration);

        const scoreClip = {
          id: `score_${Date.now()}`,
          name: '01. Điểm Neko (Hook 2s)',
          url,
          sourceDuration: trueDuration,
          trimStart: Math.max(0, trueDuration - scoreDuration),
          duration: scoreDuration,
          speed: 0.85,
          colorFilter: 'high-contrast',
          transition: 'flash',
          transitionDuration: 0.45,
          animIn: 'zoom_in',
          animInDur: 0.45,
          animOut: 'flash_out',
          animOutDur: 0.3,
          volume: 1.0,
          isScoreClip: true
        };

        const combatClip = {
          id: `combat_${Date.now()}`,
          name: `02. Combat (${chosenStyle.name})`,
          url,
          sourceDuration: trueDuration,
          trimStart: 0,
          duration: combatDuration,
          speed: 1.0,
          colorFilter: chosenStyle.id,
          transition: 'zoom',
          transitionDuration: 0.5,
          animIn: 'none',
          animInDur: 0.4,
          animOut: 'fade_out',
          animOutDur: 0.4,
          volume: 1.0,
          isScoreClip: false
        };

        const finalClips = autoScoreLoop ? [scoreClip, combatClip] : [{ ...combatClip, duration: trueDuration }];

        setProjectTitle(name.replace(/\.[^/.]+$/, ""));
        setVideoClips(finalClips);
        setActiveClipId(finalClips[0].id);
        activeClipIdRef.current = finalClips[0].id;
        setSelectedRatio(ASPECT_RATIOS[0]);
        setCurrentTime(0);
        currentTimeRef.current = 0;
        setSubtitles([]);
        setAudioClips([]);
        setShowTemplateModal(false);

        const vid = hiddenVideoRef.current;
        if (vid) {
          vid.pause();
          vid.removeAttribute('crossorigin');
          vid.src = url;
          vid.load();
        }

        setCurrentPage('editor');
        if (timelineScrollRef.current) timelineScrollRef.current.scrollLeft = 0;
        showToast(`🐾 MatrixAuto sẵn sàng: ${trueDuration.toFixed(1)}s`);
      };

      const handleExportMP4 = async () => {
        if (videoClips.length === 0 || isExporting) return;
        pauseVideo();
        setIsExporting(true);
        setExportProgress(0);

        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;
        if (!vid) {
          setIsExporting(false);
          return;
        }

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = selectedRatio.w;
        exportCanvas.height = selectedRatio.h;
        const exportCtx = exportCanvas.getContext('2d', { alpha: false });

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const actx = new AudioCtx();
        const audioDest = actx.createMediaStreamDestination();

        if (vid) {
          try {
            const vidSrc = actx.createMediaElementSource(vid);
            vidSrc.connect(audioDest);
          } catch (_) {}
        }
        if (bgm && audioClips.length > 0) {
          try {
            const bgmSrc = actx.createMediaElementSource(bgm);
            bgmSrc.connect(audioDest);
          } catch (_) {}
        }

        const canvasStream = exportCanvas.captureStream(30);
        const combinedTracks = [
          ...canvasStream.getVideoTracks(),
          ...audioDest.stream.getAudioTracks()
        ];
        const combinedStream = new MediaStream(combinedTracks);

        let mimeType = 'video/webm;codecs=vp8,opus';
        if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1,mp4a.40.2')) {
          mimeType = 'video/mp4;codecs=avc1,mp4a.40.2';
        } else if (MediaRecorder.isTypeSupported('video/mp4')) {
          mimeType = 'video/mp4';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264,opus')) {
          mimeType = 'video/webm;codecs=h264,opus';
        }

        const recorder = new MediaRecorder(combinedStream, {
          mimeType,
          videoBitsPerSecond: 16000000
        });

        const chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
          const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
          const blob = new Blob(chunks, { type: mimeType });
          const downloadUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = `NekoCut_Export_${Date.now()}.${ext}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(downloadUrl);

          setIsExporting(false);
          showToast('🐾 Xuất video hoàn tất!');
          seekTo(0, true);
        };

        recorder.start(100);
        showToast('Đang kết xuất video & audio...');

        const startTime = performance.now();
        const totalMs = totalDuration * 1000;

        seekTo(0, true);
        vid.volume = isMuted ? 0 : (videoClips[0]?.volume ?? 1.0);
        vid.play().catch(() => {});
        if (bgm && audioClips.length > 0) {
          bgm.currentTime = 0;
          bgm.play().catch(() => {});
        }

        const renderExportLoop = () => {
          const elapsed = performance.now() - startTime;
          const curTimelineSec = Math.min(totalDuration, elapsed / 1000);

          drawFrameToContext(exportCtx, exportCanvas.width, exportCanvas.height, curTimelineSec);
          setExportProgress(Math.min(100, Math.round((curTimelineSec / totalDuration) * 100)));

          const info = getCurrentClipInfo(curTimelineSec);
          if (info && vid.src !== info.clip.url) {
            vid.src = info.clip.url;
            vid.load();
          }
          if (info && Math.abs(vid.currentTime - info.mediaSourceTime) > 0.08) {
            vid.currentTime = info.mediaSourceTime;
          }

          if (elapsed < totalMs) {
            requestAnimationFrame(renderExportLoop);
          } else {
            vid.pause();
            if (bgm) bgm.pause();
            recorder.stop();
          }
        };

        requestAnimationFrame(renderExportLoop);
      };

      return (
        <div className="flex flex-col h-full w-full bg-[#050508] text-zinc-100 select-none overflow-hidden relative font-sans">
          
          <video
            ref={hiddenVideoRef}
            className="hidden"
            playsInline
            muted={isMuted}
            onLoadedMetadata={() => renderCanvasFrame(currentTimeRef.current)}
            onError={() => showToast('🐾 Lỗi tải video, vui lòng chọn file từ thiết bị')}
          />

          <audio
            ref={bgmAudioRef}
            className="hidden"
            playsInline
            loop
          />

          {/* TRANG 1: MÀN HÌNH CHÍNH (HOME) */}
          {currentPage === 'home' && (
            <div className="flex flex-col h-full w-full overflow-hidden bg-[#07070a] relative select-none">
              <CatPawTrail />
              
              <header className="h-16 px-4 pt-2 flex items-center justify-between z-20 shrink-0">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-full border-2 border-pink-500/60 overflow-hidden bg-zinc-900 shadow-[0_0_12px_rgba(255,42,122,0.4)] shrink-0 flex items-center justify-center">
                    <img
                      src="nekocut.jpg"
                      alt="NekoCut Logo"
                      className="w-full h-full object-cover"
                      onError={(e) => {
                        e.target.onerror = null;
                        e.target.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=NekoSagiri';
                      }}
                    />
                  </div>
                  <div className="text-xl font-black tracking-tight font-sans">
                    <span className="text-[#ff2a7a]">NekoCut </span>
                    <span className="text-[#ffb703]">Pro</span>
                  </div>
                </div>

                <button
                  onClick={() => setShowTemplateModal(true)}
                  className="px-3.5 py-1.5 rounded-full bg-gradient-to-r from-[#ff2a7a] via-[#ff5364] to-[#ffa726] text-black font-extrabold text-xs flex items-center gap-2 shadow-[0_0_15px_rgba(255,42,122,0.45)] active:scale-95 transition"
                >
                  <img
                    src="wwlogo.jpg"
                    alt="MatrixAuto Logo"
                    className="w-4 h-4 rounded-full object-cover border border-black/40 shrink-0 shadow-sm"
                    onError={(e) => {
                      e.target.onerror = null;
                      e.target.src = 'https://placehold.co/40x40/15131d/ff2a7a?text=WW';
                    }}
                  />
                  <span>MatrixAuto</span>
                </button>
              </header>

              <div className="flex-1 overflow-y-auto neko-scroll px-4 pt-6 space-y-4 z-10">
                <div className="relative">
                  <div className="flex items-end gap-3 pl-8 -mb-1 relative z-10">
                    <CatEarsSvg className="w-16 h-8 text-pink-500" />
                  </div>

                  <div className="rounded-[26px] bg-[#121118]/90 border border-white/[0.07] p-5 shadow-2xl relative overflow-hidden backdrop-blur-sm">
                    <div className="absolute -top-4 -left-4 text-pink-500/10 pointer-events-none scale-150">
                      <CatPawSvg className="w-24 h-24" />
                    </div>

                    <div className="relative z-10 space-y-2">
                      <div className="flex items-center gap-2">
                        <h2 className="text-xl font-extrabold text-white">Dự Án Mới</h2>
                        <span className="text-lg">🐾</span>
                      </div>
                      <p className="text-xs text-zinc-400 font-medium leading-relaxed max-w-[280px]">
                        Tải clip gameplay Neko lên để biên tập chuẩn Mobile & PC
                      </p>

                      <label className="mt-4 w-full py-3.5 px-4 rounded-full bg-gradient-to-r from-[#ff2a7a] via-[#ff5e57] to-[#ffb300] text-black font-extrabold text-sm flex items-center justify-center gap-2 cursor-pointer shadow-[0_4px_22px_rgba(255,42,122,0.45)] hover:brightness-105 active:scale-[0.98] transition">
                        <CatPawSvg className="w-4 h-4 fill-black" />
                        <span>Chọn Video Từ Thiết Bị</span>
                        <input
                          type="file"
                          accept="video/*"
                          onChange={(e) => {
                            const file = e.target.files?.[0];
                            if (file) handleCreateNewProject(file);
                          }}
                          className="hidden"
                        />
                      </label>
                    </div>
                  </div>
                </div>

                <div onClick={() => setShowTemplateModal(true)} className="relative cursor-pointer">
                  <div className="rounded-[26px] bg-[#121118]/90 border border-white/[0.07] p-5 shadow-2xl relative overflow-hidden backdrop-blur-sm hover:border-pink-500/40 transition">
                    <div className="absolute -top-4 -left-4 text-pink-500/10 pointer-events-none scale-150">
                      <CatPawSvg className="w-24 h-24" />
                    </div>

                    <div className="relative z-10 space-y-2">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                          <div className="w-7 h-7 rounded-lg overflow-hidden border border-pink-500/50 shadow-[0_0_10px_rgba(255,42,122,0.3)] bg-zinc-900 shrink-0">
                            <img
                              src="wwlogo.jpg"
                              alt="MatrixAuto WW Logo"
                              className="w-full h-full object-cover"
                              onError={(e) => {
                                e.target.onerror = null;
                                e.target.src = 'https://placehold.co/80x80/1a1824/ff2a7a?text=WW';
                              }}
                            />
                          </div>
                          <h2 className="text-xl font-extrabold text-white">Mẫu MatrixAuto Cắt Sẵn</h2>
                        </div>
                        <span className="text-lg">⚡</span>
                      </div>
                      <p className="text-xs text-zinc-400 font-medium leading-relaxed max-w-[280px]">
                        Tự trích 2s điểm cao cuối trận lên đầu clip
                      </p>

                      <div className="mt-4 w-full py-3.5 px-4 rounded-full bg-gradient-to-r from-[#ff2a7a] via-[#ff5e57] to-[#ffb300] text-black font-extrabold text-sm flex items-center justify-center gap-2 shadow-[0_4px_22px_rgba(255,42,122,0.45)] hover:brightness-105 active:scale-[0.98] transition">
                        <img
                          src="wwlogo.jpg"
                          alt="WW Icon"
                          className="w-4 h-4 rounded-full object-cover border border-black/40 shrink-0"
                          onError={(e) => { e.target.style.display = 'none'; }}
                        />
                        <span>Mở Cấu Hình MatrixAuto</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TRANG 2: TRÌNH BIÊN TẬP (EDITOR) */}
          {currentPage === 'editor' && (
            <div className="flex flex-col h-full w-full overflow-hidden">
              
              <header className="h-12 px-3 pt-1 flex items-center justify-between z-30 shrink-0 bg-[#09090e] border-b border-white/[0.06]">
                <div className="flex items-center gap-2.5">
                  <button
                    onClick={handleBackToHome}
                    className="w-8 h-8 rounded-full flex items-center justify-center text-zinc-300 hover:text-white active:scale-90"
                    title="Đóng dự án"
                  >
                    <CloseIcon className="w-5 h-5" />
                  </button>

                  <div className="w-7 h-7 rounded-full border border-pink-500/40 overflow-hidden bg-zinc-900 shadow-sm shrink-0">
                    <img
                      src="nekocut.jpg"
                      alt="NekoCut Logo"
                      className="w-full h-full object-cover"
                      onError={(e) => {
                        e.target.onerror = null;
                        e.target.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=NekoSagiri';
                      }}
                    />
                  </div>

                  <span className="text-xs font-black text-pink-400 font-mono tracking-tight truncate max-w-[120px]">
                    {projectTitle}
                  </span>
                </div>

                <div className="flex items-center gap-2 relative">
                  <button
                    onClick={() => setShowRatioMenu(!showRatioMenu)}
                    className="flex items-center gap-1.5 px-3 py-1 rounded-md bg-[#18181f] border border-pink-500/40 text-xs font-semibold text-zinc-200 active:scale-95 shadow-sm"
                  >
                    <span className="text-pink-400">📐</span>
                    <span>Tỷ lệ: {selectedRatio.shortName}</span>
                    <span className="text-[10px] text-zinc-400">▼</span>
                  </button>

                  {showRatioMenu && (
                    <div className="absolute top-10 right-14 w-48 bg-[#14131d] border border-white/[0.1] rounded-xl shadow-2xl p-1.5 z-50 flex flex-col gap-1">
                      {ASPECT_RATIOS.map((r) => (
                        <button
                          key={r.id}
                          onClick={() => {
                            setSelectedRatio(r);
                            setShowRatioMenu(false);
                            showToast(`Đã đổi tỷ lệ: ${r.label}`);
                          }}
                          className={`px-3 py-2 rounded-lg text-left text-xs font-bold flex items-center justify-between transition ${
                            selectedRatio.id === r.id
                              ? 'bg-pink-500/25 text-pink-300 border border-pink-500/40'

                          }`}
                        >
                          <span>{r.label}</span>
                          {selectedRatio.id === r.id && <span className="text-pink-400">✓</span>}
                        </button>
                      ))}
                    </div>
                  )}

                  <button
                    onClick={handleExportMP4}

                        <PlayIcon className="w-7 h-7 fill-white ml-0.5" />

                    <span className="text-white font-bold">{formatTimeCode(currentTime)}</span>
                    <span className="text-zinc-600"> / {formatTimeCode(totalDuration)}</span>
                  </div>

                  <div className="grid grid-cols-2 gap-1 items-center px-0.5">
                    <button
                      onClick={() => {
                        setIsMuted(!isMuted);
                        if (hiddenVideoRef.current) hiddenVideoRef.current.volume = !isMuted ? 0 : 1;
                        showToast(!isMuted ? '🐾 Đã tắt tiếng' : '🐾 Đã bật tiếng');

                    </button>

                    >
                      {coverImage ? (

                        </div>
                      ) : (
                        <CoverIcon className="w-4 h-4 text-zinc-300 group-hover:text-pink-400" />

                    </button>
                  </div>

                >
                  <div className="absolute top-0 bottom-0 left-1/2 w-[2px] bg-white z-40 shadow-[0_0_10px_rgba(255,255,255,0.9)] pointer-events-none -translate-x-1/2 flex flex-col items-center">
                    <div className="w-3 h-3 bg-white rotate-45 rounded-[2px] shadow -mt-0.5" />
                    <div className="w-[2px] h-full bg-white" />
                  </div>

                    onScroll={handleTimelineScroll}

                          const clipWidth = effDur * timelineZoom;
                          const isSelected = activeClipId === clip.id;

                          return (
                            <React.Fragment key={clip.id}>
                              <div
                                onClick={(e) => {
                                  e.stopPropagation();
                                  pauseVideo();
                                  setActiveClipId(clip.id);
                                  activeClipIdRef.current = clip.id;

                                  if (clip.isScoreClip) {
                                    setScoreTrimWindowStart(clip.trimStart);
                                    setShowScoreSelectModal(true);
                                  }
                                }}
                                style={{ width: `${clipWidth}px` }}
                                className={`h-full flex items-center justify-between cursor-pointer shrink-0 relative overflow-visible transition-colors ${
                                  isSelected
                                    ? 'border-2 border-white bg-[#1a1924] shadow-2xl z-20 rounded-lg ring-2 ring-white/60'
                                    : 'border-y border-r border-white/[0.08] bg-[#14141c] hover:border-white/30'
                                } ${idx === 0 ? 'border-l border-white/[0.08]' : ''}`}

                                    {effDur.toFixed(1)}s

                                </div>

                                {isSelected && (
                                  <div
                                    onPointerDown={(e) => handleTrimPointerDown(e, 'left', clip)}
                                    onPointerMove={handleTrimPointerMove}
                                    onPointerUp={handleTrimPointerUp}
                                    onPointerCancel={handleTrimPointerUp}
                                    className="absolute -left-1 top-0 bottom-0 w-4 bg-white rounded-l-md flex items-center justify-center z-30 cursor-ew-resize active:bg-pink-300 shadow-lg touch-none"

                                    <div className="w-[3px] h-4 bg-black/80 rounded-full" />
                                  </div>
                                )}

                                <div className="flex flex-col min-w-0 z-10 pointer-events-none pl-4">
                                  <span className="text-[10px] font-bold text-white drop-shadow truncate">

                                    <span className="text-[8px] text-pink-400 font-bold truncate">Chạm chọn 2s ⚡</span>
                                  )}

                                {isSelected && (
                                  <div
                                    onPointerDown={(e) => handleTrimPointerDown(e, 'right', clip)}
                                    onPointerMove={handleTrimPointerMove}
                                    onPointerUp={handleTrimPointerUp}
                                    onPointerCancel={handleTrimPointerUp}
                                    className="absolute -right-1 top-0 bottom-0 w-4 bg-white rounded-r-md flex items-center justify-center z-30 cursor-ew-resize active:bg-pink-300 shadow-lg touch-none"

                                    <div className="w-[3px] h-4 bg-black/80 rounded-full" />
                                  </div>
                                )}
                              </div>

                              {idx < videoClips.length - 1 && (
                                <div
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    pauseVideo();
                                    setActiveTransitionIndex(idx);
                                    setShowTransitionDrawer(true);

                                  className="relative -mx-2.5 z-30 w-5 h-6 rounded bg-[#201d2b] border border-pink-500/70 hover:border-pink-300 hover:bg-pink-900/60 shadow-[0_0_10px_rgba(255,42,122,0.45)] flex items-center justify-center cursor-pointer active:scale-90 transition group shrink-0"

                                >
                                  <span className="text-[9px] font-black text-pink-300 group-hover:scale-110 transition-transform">
                                    {TRANSITIONS.find((t) => t.id === videoClips[idx + 1]?.transition)?.icon || '⚡'}
                                  </span>
                                </div>
                              )}
                            </React.Fragment>
                          );
                        })}
                      </div>

                      {/* Track 2: Audio */}
                      <div className="h-6 flex items-center gap-2">
                        {audioClips.map((aud) => (
                          <div key={aud.id} className="text-[10px] text-pink-300 flex items-center gap-1.5 bg-pink-950/40 px-2.5 py-0.5 rounded-md border border-pink-800/40 shrink-0">
                            <span>🎵</span>
                            <span className="font-semibold truncate max-w-[140px]">{aud.name}</span>
                          </div>
                        ))}
                      </div>

                      {/* Track 3: Subtitles */}
                      <div className="h-6 relative flex items-center">
                        {subtitles.map((sub) => {
                          const subLeft = sub.start * timelineZoom;
                          const subW = Math.max(20, (sub.end - sub.start) * timelineZoom);

                          return (
                            <div
                              key={sub.id}
                              style={{ left: `${subLeft}px`, width: `${subW}px` }}
                              className="absolute h-5 rounded-md flex items-center justify-between px-1.5 z-20 cursor-pointer bg-rose-950/60 border border-rose-800/40 text-rose-300"
                            >
                              <div className="flex-1 truncate text-[9px] font-bold px-1 select-none">
                                {sub.text}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Thanh công cụ dưới cùng */}
              <footer className="h-16 px-2 flex items-center justify-around bg-[#08080c] border-t border-white/[0.06] shrink-0 z-30">
                {activeClip ? (
                  <div className="flex items-center justify-between w-full px-2 overflow-x-auto no-scrollbar">
                    <button
                      onClick={() => setActiveClipId(null)}
                      className="flex flex-col items-center justify-center gap-1 min-w-[50px] py-1 text-zinc-300 hover:text-white active:scale-90"
                    >
                      <span className="text-lg font-bold">‹</span>
                      <span className="text-[9px]">Trở về</span>
                    </button>

                    <button
                      onClick={handleSplitClipAtPlayhead}
                      className="flex flex-col items-center justify-center gap-1 min-w-[50px] py-1 text-zinc-300 hover:text-pink-400 active:scale-90"
                    >
                      <AiCutIcon className="w-4 h-4 text-pink-400" />
                      <span className="text-[9px] font-bold">Tách</span>
                    </button>

                    <button
                      onClick={() => setShowAnimDrawer(true)}
                      className="flex flex-col items-center justify-center gap-1 min-w-[52px] py-1 text-zinc-300 hover:text-pink-400 active:scale-90"
                    >
                      <span className="text-base">🎬</span>
                      <span className="text-[9px] font-bold">Vào & Ra</span>
                    </button>

                    <button
                      onClick={() => {
                        if (!activeClip) return;
                        const currentVol = Math.round((activeClip.volume ?? 1.0) * 100);
                        setVolumeValue(Math.min(1000, Math.max(0, currentVol)));
                        setShowVolumeDrawer(true);
                      }}
                      className="flex flex-col items-center justify-center gap-1 min-w-[50px] py-1 text-zinc-300 hover:text-white active:scale-90"
                    >
                      <UnmuteVolumeIcon className="w-4 h-4" />
                      <span className="text-[9px]">Âm lượng</span>
                    </button>

                    <button
                      onClick={() => {
                        setActiveBottomMenu('effects');
                        setShowToolSheet(true);
                      }}
                      className="flex flex-col items-center justify-center gap-1 min-w-[58px] py-1 text-zinc-300 hover:text-white active:scale-90"
                    >
                      <span className="text-base">✨</span>
                      <span className="text-[9px]">Hiệu ứng</span>
                    </button>

                    <button
                      onClick={() => {
                        setActiveBottomMenu('filter');
                        setShowToolSheet(true);
                      }}
                      className="flex flex-col items-center justify-center gap-1 min-w-[50px] py-1 text-zinc-300 hover:text-white active:scale-90"
                    >
                      <span className="text-base">🎨</span>
                      <span className="text-[9px]">Bộ lọc</span>
                    </button>

                    <button
                      onClick={() => {
                        if (videoClips.length <= 1) {
                          showToast('Cần ít nhất 1 clip');
