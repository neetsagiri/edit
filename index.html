                        const newClips = videoClips.filter((c) => c.id !== activeClip?.id);
                        setVideoClips(newClips);
                        setActiveClipId(newClips[0]?.id || null);
                        showToast('🐾 Đã xóa đoạn clip');
                      }}
                      className="flex flex-col items-center justify-center gap-1 min-w-[50px] py-1 text-rose-400 active:scale-90"
                    >
                      <span className="text-base">🗑</span>
                      <span className="text-[9px]">Xóa</span>
                    </button>

                    <button
                      onClick={() => {
                        setActiveBottomMenu('edit');
                        setShowToolSheet(true);
                      }}
                      className="flex flex-col items-center justify-center gap-1 min-w-[50px] py-1 text-zinc-300 hover:text-white active:scale-90"
                    >
                      <span className="text-base">⏱️</span>
                      <span className="text-[9px]">Tốc độ</span>
                    </button>
                  </div>
                ) : (
                  [
                    { id: 'edit', label: 'Chỉnh sửa', icon: '✂' },
                    { id: 'audio', label: 'Âm thanh', icon: '🎵' },
                    { id: 'text', label: 'Văn bản', icon: '💬' },
                    { id: 'effects', label: 'Hiệu ứng', icon: '✨' },
                    { id: 'filter', label: 'Bộ lọc', icon: '🎨' }
                  ].map((menu) => (
                    <button
                      key={menu.id}
                      onClick={() => {
                        setActiveBottomMenu(menu.id);
                        setShowToolSheet(true);
                      }}
                      className={`flex flex-col items-center justify-center gap-1 w-11 py-1 transition ${
                        activeBottomMenu === menu.id && showToolSheet ? 'text-pink-400 font-bold' : 'text-zinc-400 hover:text-zinc-200'
                      }`}
                    >
                      <span className="text-base">{menu.icon}</span>
                      <span className="text-[9px] tracking-tight whitespace-nowrap">{menu.label}</span>
                    </button>
                  ))
                )}
              </footer>

              {/* Volume Drawer */}
              {showVolumeDrawer && (
                <div className="fixed inset-x-0 bottom-0 z-50 bg-[#121218] border-t border-white/[0.1] rounded-t-2xl p-4 shadow-2xl animate-in slide-in-from-bottom duration-200">

                    <div className="w-6" />
                    <span className="text-sm font-bold text-white tracking-wide">
                      Âm lượng
                    </span>
                    <button
                      onClick={() => setShowVolumeDrawer(false)}
                      className="text-zinc-400 hover:text-white p-1 text-base active:scale-90"
                    >
                      ∨
                    </button>
                  </div>

                  <div className="space-y-4 px-1">
                    <div className="space-y-1.5">
                      <div className="flex items-center justify-between text-xs font-mono text-zinc-400">
                        <span>0</span>
                        <span className="text-sm font-bold text-white bg-zinc-800 px-2.5 py-0.5 rounded-full border border-white/10 shadow">
                          {volumeValue}
                        </span>
                        <span>1000</span>
                      </div>

                      <input
                        type="range"
                        min={0}
                        max={1000}
                        step={5}
                        value={volumeValue}
                        onChange={(e) => {
                          const val = parseInt(e.target.value, 10);
                          setVolumeValue(val);
                          if (!activeClip) return;
                          const scaledVol = val / 100;
                          setVideoClips((prev) =>
                            prev.map((c) => (c.id === activeClip.id ? { ...c, volume: scaledVol } : c))
                          );
                          const vid = hiddenVideoRef.current;
                          if (vid) vid.volume = isMuted ? 0 : Math.min(1.0, scaledVol);
                        }}
                        className="w-full h-1.5 bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-[#ff2a7a]"
                      />
                    </div>
                  </div>
                </div>
              )}

              {/* Transition Drawer */}
              {showTransitionDrawer && (
                <div className="fixed inset-x-0 bottom-0 z-50 bg-[#121218] border-t border-pink-500/30 rounded-t-2xl p-4 shadow-2xl animate-in slide-in-from-bottom duration-200">
                  <div className="flex items-center justify-between pb-3 mb-2 border-b border-white/[0.08]">
                    <div className="flex items-center gap-2">
                      <span className="text-pink-400">⚡</span>
                      <span className="text-sm font-bold text-white tracking-wide">
                        Hiệu Ứng Chuyển Tiếp Khe Nối #{activeTransitionIndex + 1}
                      </span>
                    </div>
                    <button
                      onClick={() => setShowTransitionDrawer(false)}
                      className="w-6 h-6 rounded-full bg-zinc-800 text-zinc-300 flex items-center justify-center text-xs active:scale-90"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="grid grid-cols-2 gap-2 max-h-[38vh] overflow-y-auto neko-scroll pr-1">
                    {TRANSITIONS.map((trans) => {
                      const targetClip = videoClips[activeTransitionIndex + 1];
                      const isSelected = targetClip?.transition === trans.id;
                      return (
                        <button
                          key={trans.id}
                          onClick={() => {
                            setVideoClips((prev) =>
                              prev.map((c, idx) => (idx === activeTransitionIndex + 1 ? { ...c, transition: trans.id } : c))
                            );
                            showToast(`🐾 Chuyển tiếp: ${trans.name}`);
                            renderCanvasFrame(currentTimeRef.current);
                          }}
                          className={`p-3 rounded-xl border text-left flex items-center gap-2.5 transition ${
                            isSelected
                              ? 'bg-pink-500/25 border-pink-400 text-pink-300 shadow-[0_0_12px_rgba(255,42,122,0.3)]'
                              : 'bg-zinc-900 border-white/[0.06] text-zinc-300 hover:border-pink-500/40'
                          }`}
                        >
                          <span className="text-xl">{trans.icon}</span>
                          <div className="flex flex-col min-w-0">
                            <span className="text-xs font-bold truncate">{trans.name}</span>
                            <span className="text-[9px] text-zinc-400 truncate">{trans.desc}</span>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Tool Sheet Phụ */}
              {showToolSheet && (
                <div className="fixed inset-x-0 bottom-0 z-50 bg-[#121218] border-t border-white/[0.1] rounded-t-2xl p-4 shadow-2xl max-h-[56vh] overflow-y-auto neko-scroll animate-in slide-in-from-bottom duration-200">
                  <div className="flex items-center justify-between border-b border-white/[0.08] pb-2 mb-3">
                    <span className="text-xs font-black text-pink-400 uppercase tracking-wider">
                      Công cụ Neko: {activeBottomMenu}
                    </span>
                    <button
                      onClick={() => setShowToolSheet(false)}
                      className="w-6 h-6 rounded-full bg-zinc-800 text-zinc-300 flex items-center justify-center text-xs"
                    >
                      ✕
                    </button>
                  </div>

                  {activeBottomMenu === 'filter' && (
                    <div className="grid grid-cols-2 gap-2">
                      {FILTERS.map((filt) => (
                        <button
                          key={filt.id}
                          onClick={() => {
                            if (activeClip) {
                              setVideoClips((prev) =>
                                prev.map((c) => (c.id === activeClip.id ? { ...c, colorFilter: filt.id } : c))
                              );
                              renderCanvasFrame(currentTimeRef.current);
                              showToast(`🐾 Bộ lọc: ${filt.name}`);
                            }
                          }}
                          className={`p-3 rounded-xl border text-left text-xs font-bold flex items-center justify-between ${
                            activeClip?.colorFilter === filt.id ? 'bg-pink-500/20 border-pink-400 text-pink-300' : 'bg-zinc-900 border-white/[0.06] text-zinc-300'
                          }`}
                        >
                          <div className="flex flex-col gap-0.5">
                            <span>{filt.name}</span>
                            <span className="text-[9px] text-zinc-500 font-normal">{filt.tag}</span>
                          </div>
                          {activeClip?.colorFilter === filt.id && <span className="text-pink-400">✓</span>}
                        </button>
                      ))}
                    </div>
                  )}

                  {activeBottomMenu === 'effects' && (
                    <div className="grid grid-cols-2 gap-2">
                      {TRANSITIONS.map((trans) => (
                        <button
                          key={trans.id}
                          onClick={() => {
                            if (activeClip) {
                              setVideoClips((prev) =>
                                prev.map((c) => (c.id === activeClip.id ? { ...c, transition: trans.id } : c))
                              );
                              showToast(`🐾 Chuyển tiếp: ${trans.name}`);
                              renderCanvasFrame(currentTimeRef.current);
                            }
                          }}
                          className={`p-3 rounded-xl border text-left text-xs font-bold flex items-center gap-2 ${
                            activeClip?.transition === trans.id ? 'bg-pink-500/20 border-pink-400 text-pink-300' : 'bg-zinc-900 border-white/[0.06] text-zinc-300'
                          }`}
                        >
                          <span className="text-lg">{trans.icon}</span>
                          <span>{trans.name}</span>
                        </button>
                      ))}
                    </div>
                  )}

                  {activeBottomMenu === 'text' && (
                    <div className="space-y-4">
                      <div className="flex gap-2">
                        <input
                          type="text"
                          id="nekoSubInput"
                          placeholder="Nhập nội dung chữ..."
                          className="flex-1 bg-zinc-900 border border-white/[0.1] rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-pink-500"
                        />
                        <button
                          onClick={() => {
                            const inputEl = document.getElementById('nekoSubInput');
                            if (inputEl && inputEl.value.trim()) {
                              const newSub = {
                                id: `sub_${Date.now()}`,
                                text: inputEl.value.trim(),
                                start: currentTimeRef.current,
                                end: Math.min(totalDuration, currentTimeRef.current + 3.0),
                                templateId: 'sakura_glow'
                              };
                              setSubtitles([...subtitles, newSub]);
                              inputEl.value = '';
                              renderCanvasFrame(currentTimeRef.current);
                              showToast('🐾 Đã thêm chữ!');
                            }
                          }}
                          className="px-4 py-2 rounded-xl bg-pink-500 text-white font-bold text-xs active:scale-95 shadow"
                        >
                          Thêm
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* MODAL ẢNH BÌA */}
              {showCoverModal && (
                <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col justify-between animate-in fade-in duration-200 select-none">
                  <div className="h-12 px-4 flex items-center justify-between border-b border-white/[0.08] bg-[#0c0c12]">
                    <button
                      onClick={() => {
                        setShowCoverModal(false);
                        seekTo(coverBackupTimeRef.current, true);
                      }}
                      className="text-xs text-zinc-400 hover:text-white"
                    >
                      Hủy
                    </button>
                    <span className="text-sm font-bold text-white tracking-wide">
                      Chọn Ảnh Bìa Neko
                    </span>
                    <button
                      onClick={() => {
                        const canvas = coverCanvasRef.current;
                        if (canvas) {
                          const snapshotUrl = canvas.toDataURL('image/jpeg', 0.85);
                          setCoverImage(snapshotUrl);
                        }
                        setShowCoverModal(false);
                        seekTo(coverScrubTime, true);
                        showToast('🐾 Đã lưu ảnh bìa Neko!');
                      }}
                      className="px-3.5 py-1 rounded-full bg-[#ff2a7a] text-white font-extrabold text-xs shadow-[0_0_12px_rgba(255,42,122,0.4)]"
                    >
                      Lưu
                    </button>
                  </div>

                  <div className="flex-1 flex flex-col items-center justify-center p-4 relative min-h-0">
                    <canvas
                      ref={(node) => {
                        coverCanvasRef.current = node;
                        if (node) {
                          node.width = selectedRatio.w;
                          node.height = selectedRatio.h;
                          const ctx = node.getContext('2d');
                          if (ctx) {
                            drawFrameToContext(ctx, node.width, node.height, coverScrubTime);
                            if (coverTitleText) {
                              ctx.save();
                              ctx.font = `900 ${Math.round(node.width * 0.052)}px 'Montserrat', sans-serif`;
                              ctx.textAlign = 'center';
                              ctx.fillStyle = '#ffb703';
                              ctx.fillText(coverTitleText, node.width / 2, node.height * 0.88);
                              ctx.restore();
                            }
                          }
                        }
                      }}
                      className="max-h-[calc(100vh-280px)] max-w-full object-contain"
                      style={{ aspectRatio: selectedRatio.ratioCss }}
                    />
                  </div>

                  <div className="p-4 bg-[#0e0e16] border-t border-white/[0.08] space-y-3">
                    <input
                      type="text"
                      value={coverTitleText}
                      onChange={(e) => setCoverTitleText(e.target.value)}
                      placeholder="Nhập tiêu đề ảnh bìa..."
                      className="w-full bg-[#181824] border border-white/[0.1] rounded-lg px-3 py-1.5 text-xs text-white"
                    />
                    <input
                      type="range"
                      min={0}
                      max={totalDuration}
                      step={0.05}
                      value={coverScrubTime}
                      onChange={(e) => {
                        const val = parseFloat(e.target.value);
                        setCoverScrubTime(val);
                        seekTo(val, true);
                      }}
                      className="w-full h-2 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-[#ff2a7a]"
                    />
                  </div>
                </div>
              )}

              {/* MODAL MATRIXAUTO */}
              {showTemplateModal && (
                <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                  <div className="bg-[#121019] border-t sm:border border-white/[0.12] w-full max-w-lg rounded-t-3xl sm:rounded-3xl flex flex-col max-h-[88vh] overflow-hidden shadow-2xl">
                    <div className="p-4 border-b border-zinc-800/80 flex items-center justify-between shrink-0 bg-[#15131d]">
                      <div className="flex items-center gap-2.5">
                        <div className="w-6 h-6 rounded-md overflow-hidden border border-pink-500/50 shadow-sm bg-zinc-900 shrink-0">
                          <img
                            src="wwlogo.jpg"
                            alt="MatrixAuto WW Logo"
                            className="w-full h-full object-cover"
                            onError={(e) => {
                              e.target.onerror = null;
                              e.target.src = 'https://placehold.co/40x40/15131d/ff2a7a?text=WW';
                            }}
                          />
                        </div>
                        <h3 className="font-extrabold text-sm text-zinc-100">Cấu Hình Mẫu MatrixAuto Neko</h3>
                      </div>
                      <button
                        onClick={() => setShowTemplateModal(false)}
                        className="w-8 h-8 rounded-full bg-zinc-800/80 text-zinc-400 flex items-center justify-center text-xs"
                      >
                        ✕
                      </button>
                    </div>

                    <div className="p-4 overflow-y-auto neko-scroll space-y-4 flex-1">
                      <div className="space-y-2">
                        <label className="text-xs font-bold text-zinc-300">Tông màu trận đấu:</label>
                        <div className="grid grid-cols-1 gap-2">
                          {NEKO_STYLES.map((st) => (
                            <div
                              key={st.id}
                              onClick={() => setSelectedStyleId(st.id)}
                              className={`p-3 rounded-xl border text-left cursor-pointer flex items-center justify-between transition ${
                                selectedStyleId === st.id
                                  ? 'bg-pink-500/20 border-pink-400 text-pink-300 shadow-[0_0_12px_rgba(255,42,122,0.2)]'
                                  : 'bg-zinc-900/60 border-white/[0.06] text-zinc-300'
                              }`}
                            >
                              <div>
                                <div className="text-xs font-bold">{st.name}</div>
                                <div className="text-[10px] text-zinc-400 mt-0.5">{st.desc}</div>
                              </div>
                              {selectedStyleId === st.id && (
                                <span className="text-pink-400 font-bold text-sm shrink-0">✓</span>
                              )}
                            </div>
                          ))}
                        </div>
                      </div>

                      <label className="flex items-center justify-between bg-zinc-900/70 p-3.5 rounded-xl border border-white/[0.06] cursor-pointer">
                        <span className="text-xs text-zinc-200 font-medium">Tự động trích 2s điểm số đưa lên đầu clip</span>
                        <input
                          type="checkbox"
                          checked={autoScoreLoop}
                          onChange={(e) => setAutoScoreLoop(e.target.checked)}
                          className="w-5 h-5 accent-pink-500 rounded cursor-pointer shrink-0"
                        />
                      </label>
                    </div>

                    <div className="p-4 pt-3 pb-8 sm:pb-4 border-t border-zinc-800/80 bg-[#121019] shrink-0 grid grid-cols-2 gap-3 z-10">
                      <button
                        type="button"
                        onClick={() => applyMatrixTemplate()}
                        className="h-12 rounded-xl bg-zinc-800/90 text-xs font-bold text-zinc-100 border border-white/[0.1] hover:bg-zinc-700 flex items-center justify-center transition shadow-md gap-2"
                      >
                        <img
                          src="wwlogo.jpg"
                          alt="WW Icon"
                          className="w-4 h-4 rounded-full object-cover shrink-0"
                          onError={(e) => { e.target.style.display = 'none'; }}
                        />
                        <span>Dùng Video Mẫu Neko</span>
                      </button>

                      <label className="h-12 rounded-xl bg-gradient-to-r from-pink-500 via-rose-500 to-amber-400 text-xs font-black text-black text-center shadow-[0_0_16px_rgba(255,42,122,0.4)] cursor-pointer flex items-center justify-center gap-2">
                        <CatPawSvg className="w-4 h-4 fill-black" />
                        <span>Chọn Video Của Bạn</span>
                        <input
                          type="file"
                          accept="video/*"
                          onChange={(e) => {
                            const f = e.target.files?.[0];
                            if (f) applyMatrixTemplate(f);
                          }}
                          className="hidden"
                        />
                      </label>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {toastMsg && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-[#161622]/95 border border-pink-500/40 text-pink-200 px-4 py-2 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 backdrop-blur-md whitespace-nowrap">
              <CatPawSvg className="w-4 h-4 text-pink-400" />
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
