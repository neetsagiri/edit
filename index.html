    const playNekoSound = (type = 'click') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === 'split') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.09);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'success') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.setValueAtTime(680, now + 0.08);
          osc.frequency.setValueAtTime(980, now + 0.16);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(900, now);
          osc.frequency.exponentialRampToValueAtTime(350, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        }
      } catch (e) {}
    };

    const formatTimeCode = (sec) => {
      const s = Math.max(0, sec || 0);
      const m = Math.floor(s / 60);
      const remSec = Math.floor(s % 60);
      return `${String(m).padStart(2, '0')}:${String(remSec).padStart(2, '0')}`;

    const getExactVideoDuration = (videoUrl) => {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.src = videoUrl;
        v.onloadedmetadata = () => resolve(v.duration && !isNaN(v.duration) && v.duration !== Infinity ? v.duration : 15);
        v.onerror = () => resolve(15);
        setTimeout(() => resolve(15), 3000);
      });
    };

            const c = videoClips[i];
            const spd = c.speed || 1.0;
            const effectiveDur = c.duration / spd;

            if (time >= acc && time < acc + effectiveDur) {
              const timelineOffset = time - acc;
              const sourceOffset = timelineOffset * spd;
              return {
                clip: c,
                clipIndex: i,
                clipStartTime: acc,
                clipOffsetTime: timelineOffset,
                effectiveDuration: effectiveDur,
                mediaSourceTime: c.trimStart + sourceOffset
              };
            }
            acc += effectiveDur;
          }
          if (videoClips.length > 0) {
            const last = videoClips[videoClips.length - 1];
            const spd = last.speed || 1.0;
            const effDur = last.duration / spd;
            const lastStart = Math.max(0, acc - effDur);
            const timelineOffset = Math.min(effDur, Math.max(0, time - lastStart));
            return {
              clip: last,
              clipIndex: videoClips.length - 1,
              clipStartTime: lastStart,
              clipOffsetTime: timelineOffset,
              effectiveDuration: effDur,
              mediaSourceTime: last.trimStart + (timelineOffset * spd)
            };
          }
          return null;
        },
        [videoClips]
      );

      const drawFrameToContext = useCallback(
        (ctx, targetW, targetH, time) => {
          const vid = hiddenVideoRef.current;
          const clipInfo = getCurrentClipInfo(time);

          ctx.fillStyle = '#050508';
          ctx.fillRect(0, 0, targetW, targetH);

          if (clipInfo && vid && vid.readyState >= 2) {
            const { clip, clipOffsetTime, effectiveDuration } = clipInfo;
            ctx.save();

            const filterDef = FILTERS.find((f) => f.id === clip.colorFilter) || FILTERS[0];
            ctx.filter = (filterDef && filterDef.css && filterDef.css !== 'none') ? filterDef.css : 'none';

            let alphaVal = 1.0;
            let scaleVal = 1.0;
            let transX = 0;

            if (clip.transition === 'fade') {
              if (clipOffsetTime < 0.4) alphaVal = clipOffsetTime / 0.4;
              else if (effectiveDuration - clipOffsetTime < 0.4) alphaVal = (effectiveDuration - clipOffsetTime) / 0.4;
            } else if (clip.transition === 'zoom') {
              if (clipOffsetTime < 0.35) scaleVal = 0.75 + (clipOffsetTime / 0.35) * 0.25;
            } else if (clip.transition === 'slide') {
              if (clipOffsetTime < 0.35) transX = (1 - clipOffsetTime / 0.35) * targetW * 0.4;
            } else if (clip.transition === 'flash') {
              if (clipOffsetTime < 0.25) {
                ctx.fillStyle = `rgba(255,255,255,${1 - clipOffsetTime / 0.25})`;
              }
            }

            ctx.globalAlpha = Math.max(0, Math.min(1, alphaVal));

            const sFactor = fitMode === 'cover'
              ? Math.max(targetW / vid.videoWidth, targetH / vid.videoHeight)
              : Math.min(targetW / vid.videoWidth, targetH / vid.videoHeight);

            const zoom = previewZoomRef.current || 1.0;
            const pan = previewPanRef.current || { x: 0, y: 0 };
            const panScaleX = targetW / (selectedRatio.w || 1);
            const panScaleY = targetH / (selectedRatio.h || 1);

            const drawW = vid.videoWidth * sFactor * scaleVal * zoom;
            const drawH = vid.videoHeight * sFactor * scaleVal * zoom;
            const drawX = ((targetW - drawW) / 2) + transX + (pan.x * panScaleX);
            const drawY = ((targetH - drawH) / 2) + (pan.y * panScaleY);

            ctx.drawImage(vid, drawX, drawY, drawW, drawH);

            if (clip.transition === 'flash' && clipOffsetTime < 0.25) {
              ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 1 - clipOffsetTime / 0.25)})`;
              ctx.fillRect(0, 0, targetW, targetH);
            }

            ctx.restore();
          }

          subtitles.forEach((sub) => {
            if (time >= sub.start && time <= sub.end) {
              const tmpl = TEXT_TEMPLATES.find((t) => t.id === sub.templateId) || TEXT_TEMPLATES[0];
              const fSize = Math.max(18, Math.round((sub.fontSize || 34) * (targetW / 1080)));
              
              ctx.save();
              ctx.font = `900 ${fSize}px ${tmpl.fontFamily}`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';

              const pX = targetW / 2;
              const pY = targetH * 0.82;

              if (tmpl.bgColor) {
                const metrics = ctx.measureText(sub.text);
                const padX = fSize * 0.7;
                const padY = fSize * 0.45;
                const bW = metrics.width + padX * 2;
                const bH = fSize * 1.5;
                
                ctx.fillStyle = tmpl.bgColor;
                ctx.beginPath();
                const radius = 12;
                const rx = pX - bW / 2;
                const ry = pY - bH / 2;
                ctx.roundRect ? ctx.roundRect(rx, ry, bW, bH, radius) : ctx.rect(rx, ry, bW, bH);
                ctx.fill();
              }

              if (tmpl.shadowColor && tmpl.shadowBlur > 0) {
                ctx.shadowColor = tmpl.shadowColor;
                ctx.shadowBlur = tmpl.shadowBlur;
              }

              if (tmpl.strokeWidth && tmpl.strokeWidth > 0 && tmpl.strokeColor) {
                ctx.strokeStyle = tmpl.strokeColor;
                ctx.lineWidth = tmpl.strokeWidth * (targetW / 1080);
                ctx.lineJoin = 'round';
                ctx.strokeText(sub.text, pX, pY);
              }

              ctx.fillStyle = tmpl.textColor;
              ctx.fillText(sub.text, pX, pY);
              ctx.restore();
            }
          });
        },
        [getCurrentClipInfo, subtitles, fitMode]
      );

      const renderCanvasFrame = useCallback(
        (time) => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d', { alpha: false });
          if (!ctx) return;
          drawFrameToContext(ctx, canvas.width, canvas.height, time);
        },
        [drawFrameToContext]
      );

      const isSeekingMediaRef = useRef(false);
      const pendingSeekTargetRef = useRef(null);
      const isDraggingTimelineRef = useRef(false);
      const dragTimelineStartRef = useRef({ startX: 0, startScrollLeft: 0, hasMoved: false });

      useEffect(() => {
        previewZoomRef.current = previewZoom;
        previewPanRef.current = previewPan;
        renderCanvasFrame(currentTimeRef.current);
      }, [previewZoom, previewPan, renderCanvasFrame]);

      const seekTo = useCallback(
        (targetTime, forceRender = false) => {
          const clamped = Math.max(0, Math.min(totalDuration, targetTime));
          currentTimeRef.current = clamped;
          setCurrentTime(clamped);

          const info = getCurrentClipInfo(clamped);
          const vid = hiddenVideoRef.current;

          if (info && vid) {
            activeClipIdRef.current = info.clip.id;
            setActiveClipId(info.clip.id);
            if (vid.src !== info.clip.url) {
              vid.src = info.clip.url;
              vid.load();
            }
            vid.playbackRate = info.clip.speed || 1.0;
            vid.volume = isMuted ? 0 : (info.clip.volume ?? 1.0);

            const targetSourceTime = info.mediaSourceTime;
            if (vid.seeking) {
              pendingSeekTargetRef.current = clamped;
            } else {
              if (Math.abs(vid.currentTime - targetSourceTime) > 0.02 || forceRender) {
                try {
                  vid.currentTime = targetSourceTime;
                } catch (_) {}
              }
            }
            renderCanvasFrame(clamped);
          } else {
            renderCanvasFrame(clamped);
          }
        },
        [totalDuration, getCurrentClipInfo, renderCanvasFrame, isMuted]
      );

      const handleTimelineScroll = (e) => {
        if (isSystemScrolling.current || isPlayingRef.current) return;
        const scrollLeft = e.target.scrollLeft;
        const computedTime = Math.max(0, Math.min(totalDuration, scrollLeft / timelineZoom));
        if (Math.abs(computedTime - currentTimeRef.current) > 0.02) {
          seekTo(computedTime, false);
        }
      };

      const playVideo = () => {
        if (videoClips.length === 0) return;
        playNekoSound('click');
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;

        // Tự động tua về đầu nếu playhead đang ở sát cuối video
        if (currentTimeRef.current >= totalDuration - 0.25) {
          currentTimeRef.current = 0;
          setCurrentTime(0);
          seekTo(0, true);
        }

        const info = getCurrentClipInfo(currentTimeRef.current);
        if (info && vid) {
          if (vid.src !== info.clip.url) {
            vid.src = info.clip.url;
            vid.load();
          }
          vid.playbackRate = info.clip.speed || 1.0;
          if (Math.abs(vid.currentTime - info.mediaSourceTime) > 0.05) {
            try {
              vid.currentTime = info.mediaSourceTime;
            } catch (_) {}
          }
          vid.volume = isMuted ? 0 : (info.clip.volume ?? 1.0);
          const playPromise = vid.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {});
          }
        }

        if (bgm && audioClips.length > 0) {
          bgm.play().catch(() => {});
        }

        isPlayingRef.current = true;
        setIsPlaying(true);
      };

      const pauseVideo = useCallback(() => {
        isPlayingRef.current = false;
        setIsPlaying(false);

        const vid = hiddenVideoRef.current;
        if (vid) {
          vid.pause();
          const curClipId = activeClipIdRef.current;
          const curIdx = videoClips.findIndex((c) => c.id === curClipId);
          if (curIdx >= 0) {
            let clipStart = 0;
            for (let i = 0; i < curIdx; i++) {
              clipStart += videoClips[i].duration / (videoClips[i].speed || 1.0);
            }
            const c = videoClips[curIdx];
            const spd = c.speed || 1.0;
            const elapsed = Math.max(0, vid.currentTime - c.trimStart);
            const exactTimelineTime = Math.min(totalDuration, clipStart + elapsed / spd);

            currentTimeRef.current = exactTimelineTime;
            setCurrentTime(exactTimelineTime);

            if (timelineScrollRef.current) {
              isSystemScrolling.current = true;
              timelineScrollRef.current.scrollLeft = exactTimelineTime * timelineZoom;
              requestAnimationFrame(() => {
                isSystemScrolling.current = false;
              });
            }
            renderCanvasFrame(exactTimelineTime);
          }
        }

        if (bgmAudioRef.current) bgmAudioRef.current.pause();
      }, [videoClips, totalDuration, timelineZoom, renderCanvasFrame]);

      const togglePlay = () => {
        if (isPlayingRef.current) pauseVideo();
        else playVideo();
      };

      useEffect(() => {
        if (currentPage !== 'editor') return;

        const loop = (now) => {
          if (isPlayingRef.current) {
            const vid = hiddenVideoRef.current;
            const currentClipId = activeClipIdRef.current;
            const curIdx = videoClips.findIndex((c) => c.id === currentClipId);
            const activeIdx = curIdx >= 0 ? curIdx : 0;
            const curClip = videoClips[activeIdx];

            if (vid && curClip) {
              const spd = curClip.speed || 1.0;
              const clipSourceEnd = curClip.trimStart + curClip.duration;
              const curSourceTime = vid.currentTime;

              if (curSourceTime >= clipSourceEnd - 0.03) {
                if (activeIdx < videoClips.length - 1) {
                  const nextClip = videoClips[activeIdx + 1];
                  const nextSpd = nextClip.speed || 1.0;

                  const isContiguous = (
                    nextClip.url === curClip.url &&
                    Math.abs(clipSourceEnd - nextClip.trimStart) < 0.08 &&
                    nextSpd === spd &&
                    nextClip.colorFilter === curClip.colorFilter &&
                    nextClip.transition === curClip.transition
                  );

                  activeClipIdRef.current = nextClip.id;
                  setActiveClipId(nextClip.id);

                  if (isContiguous) {
                    if (vid.paused) vid.play().catch(() => {});
                  } else {
                    if (vid.src !== nextClip.url) {
                      vid.src = nextClip.url;
                      vid.load();
                    }
                    vid.playbackRate = nextSpd;
                    vid.currentTime = nextClip.trimStart;
                    vid.play().catch(() => {});
                  }
                } else {
                  pauseVideo();
                  seekTo(totalDuration, true);
                }
              } else {
                let clipStartTime = 0;
                for (let i = 0; i < activeIdx; i++) {
                  clipStartTime += videoClips[i].duration / (videoClips[i].speed || 1.0);
                }

                const elapsedSourceInClip = Math.max(0, curSourceTime - curClip.trimStart);
                const exactTimelineTime = Math.min(totalDuration, clipStartTime + elapsedSourceInClip / spd);

                currentTimeRef.current = exactTimelineTime;

                if (timelineScrollRef.current) {
                  isSystemScrolling.current = true;
                  timelineScrollRef.current.scrollLeft = exactTimelineTime * timelineZoom;
                  isSystemScrolling.current = false;
                }

                if (now - lastUiUpdateRef.current > 35) {
                  setCurrentTime(exactTimelineTime);
                  lastUiUpdateRef.current = now;
                }
                renderCanvasFrame(exactTimelineTime);
              }
            } else {
              pauseVideo();
            }
          }
          animationFrameRef.current = requestAnimationFrame(loop);
        };

        animationFrameRef.current = requestAnimationFrame(loop);
        return () => {
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };
      }, [currentPage, videoClips, totalDuration, timelineZoom, renderCanvasFrame, seekTo, pauseVideo]);

      const handleTimelinePointerDown = (e) => {
        pauseVideo();
        if (!timelineScrollRef.current) return;
        
        isDraggingTimelineRef.current = true;
        dragTimelineStartRef.current = {
          startX: e.clientX,
          startScrollLeft: timelineScrollRef.current.scrollLeft,
          hasMoved: false
        };

        const rect = timelineScrollRef.current.getBoundingClientRect();
        const clickOffsetFromCenter = e.clientX - (rect.left + rect.width / 2);
        const targetTime = Math.max(0, Math.min(totalDuration, currentTimeRef.current + (clickOffsetFromCenter / timelineZoom)));
        
        isSystemScrolling.current = true;
        timelineScrollRef.current.scrollLeft = targetTime * timelineZoom;
        setTimeout(() => { isSystemScrolling.current = false; }, 35);
        seekTo(targetTime, true);

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleTimelinePointerMove = (e) => {
        if (!isDraggingTimelineRef.current || !timelineScrollRef.current) return;
        const deltaX = e.clientX - dragTimelineStartRef.current.startX;
        if (Math.abs(deltaX) > 3) {
          dragTimelineStartRef.current.hasMoved = true;
          pauseVideo();
        }

        const newScrollLeft = Math.max(0, Math.min(totalDuration * timelineZoom, dragTimelineStartRef.current.startScrollLeft - deltaX));
        timelineScrollRef.current.scrollLeft = newScrollLeft;
        const targetTime = Math.max(0, Math.min(totalDuration, newScrollLeft / timelineZoom));
        seekTo(targetTime, false);
      };

      const handleTimelinePointerUp = (e) => {
        if (isDraggingTimelineRef.current) {
          isDraggingTimelineRef.current = false;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      };

      const handleClipPointerDown = (e, clip) => {
        e.stopPropagation();
        pauseVideo();
        setActiveClipId(clip.id);
        playNekoSound('click');

        if (!timelineScrollRef.current) return;
        const rect = timelineScrollRef.current.getBoundingClientRect();
        const clickOffsetFromCenter = e.clientX - (rect.left + rect.width / 2);
        const targetTime = Math.max(0, Math.min(totalDuration, currentTimeRef.current + (clickOffsetFromCenter / timelineZoom)));
        
        isSystemScrolling.current = true;
        timelineScrollRef.current.scrollLeft = targetTime * timelineZoom;
        setTimeout(() => { isSystemScrolling.current = false; }, 35);
        seekTo(targetTime, true);

        isDraggingTimelineRef.current = true;
        dragTimelineStartRef.current = {
          startX: e.clientX,
          startScrollLeft: timelineScrollRef.current.scrollLeft,
          hasMoved: false
        };

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleTrimPointerDown = (e, handleType, clip) => {
        e.stopPropagation();
        e.preventDefault();
        pauseVideo();
        playNekoSound('click');

        isTrimmingRef.current = true;
        trimDataRef.current = {
          handle: handleType,
          clipId: clip.id,
          startX: e.clientX,
          initTrimStart: clip.trimStart,
          initDuration: clip.duration,
          sourceDur: clip.sourceDuration || clip.duration,
          speed: clip.speed || 1.0
        };

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleTrimPointerMove = (e) => {
        if (!isTrimmingRef.current) return;
        const data = trimDataRef.current;
        const deltaX = e.clientX - data.startX;
        const deltaSec = (deltaX / timelineZoom) * data.speed;

        if (data.handle === 'right') {
          const maxAllowed = data.sourceDur - data.initTrimStart;
          const newDur = Math.max(0.3, Math.min(maxAllowed, data.initDuration + deltaSec));

          setVideoClips((prev) =>
            prev.map((c) => (c.id === data.clipId ? { ...c, duration: Number(newDur.toFixed(2)) } : c))
          );

          const targetSeekTime = data.initTrimStart + newDur;
          const vid = hiddenVideoRef.current;
          if (vid) {
            vid.currentTime = targetSeekTime;
            renderCanvasFrame(currentTimeRef.current);
          }
        } else if (data.handle === 'left') {
          const maxTrim = data.initTrimStart + data.initDuration - 0.3;
          const newTrimStart = Math.max(0, Math.min(maxTrim, data.initTrimStart + deltaSec));
          const actualDelta = newTrimStart - data.initTrimStart;
          const newDur = Math.max(0.3, data.initDuration - actualDelta);

          setVideoClips((prev) =>
            prev.map((c) =>
              c.id === data.clipId
                ? { ...c, trimStart: Number(newTrimStart.toFixed(2)), duration: Number(newDur.toFixed(2)) }
                : c
            )
          );

          const vid = hiddenVideoRef.current;
          if (vid) {
            vid.currentTime = newTrimStart;
            renderCanvasFrame(currentTimeRef.current);
          }
        }
      };

      const handleTrimPointerUp = (e) => {
        if (isTrimmingRef.current) {
          isTrimmingRef.current = false;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
          showToast('🐾 Đã tinh chỉnh độ dài clip');
          seekTo(currentTimeRef.current, false);
        }
      };

      const handleSubTrimPointerDown = (e, handleType, sub) => {
        e.stopPropagation();
        e.preventDefault();
        pauseVideo();
        playNekoSound('click');
        setActiveSubId(sub.id);

        isTrimmingSubRef.current = true;
        trimSubDataRef.current = {
          handle: handleType,
          subId: sub.id,
          startX: e.clientX,
          initStart: sub.start,
          initEnd: sub.end
        };

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      };

      const handleSubTrimPointerMove = (e) => {
        if (!isTrimmingSubRef.current) return;
        const data = trimSubDataRef.current;
        const deltaX = e.clientX - data.startX;
        const deltaSec = deltaX / timelineZoom;

        if (data.handle === 'right') {
          const newEnd = Math.max(data.initStart + 0.3, Math.min(totalDuration, data.initEnd + deltaSec));
          setSubtitles((prev) =>
            prev.map((s) => (s.id === data.subId ? { ...s, end: Number(newEnd.toFixed(2)) } : s))
          );
        } else if (data.handle === 'left') {
          const newStart = Math.max(0, Math.min(data.initEnd - 0.3, data.initStart + deltaSec));
          setSubtitles((prev) =>
            prev.map((s) => (s.id === data.subId ? { ...s, start: Number(newStart.toFixed(2)) } : s))
          );
        } else if (data.handle === 'move') {
          const subLen = data.initEnd - data.initStart;
          let newStart = data.initStart + deltaSec;
          if (newStart < 0) newStart = 0;
          if (newStart + subLen > totalDuration) newStart = totalDuration - subLen;

          setSubtitles((prev) =>
            prev.map((s) =>
              s.id === data.subId

                : s

        const clip2 = {

      const applyMatrixTemplate = async (customVideoFile = null) => {

      const handleExportMP4 = async () => {

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = selectedRatio.w;

        const exportCtx = exportCanvas.getContext('2d', { alpha: false });

        try {
          const stream = exportCanvas.captureStream(30);
          const mimeType = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')
            ? 'video/mp4;codecs=avc1'
            : MediaRecorder.isTypeSupported('video/mp4')
            ? 'video/mp4'
            : 'video/webm';

          const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 14000000 });
          const chunks = [];
          recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `NekoCut_${Date.now()}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
            setIsExporting(false);
            playNekoSound('success');
            showToast('🐾 Xuất video Neko thành công!');
          };

          recorder.start();

          const fps = 24;
          const totalSteps = Math.max(24, Math.round(totalDuration * fps));
          for (let i = 0; i <= totalSteps; i++) {
            const targetT = (i / totalSteps) * totalDuration;
            const info = getCurrentClipInfo(targetT);
            if (info) {
              if (vid.src !== info.clip.url) {
                vid.src = info.clip.url;
                vid.load();
              }
              vid.currentTime = info.mediaSourceTime;
              await new Promise((res) => {
                const onSeek = () => {
                  drawFrameToContext(exportCtx, exportCanvas.width, exportCanvas.height, targetT);
                  vid.removeEventListener('seeked', onSeek);
                  res();
                };
                vid.addEventListener('seeked', onSeek);
                setTimeout(onSeek, 35);
              });
            }
            setExportProgress(Math.round((i / totalSteps) * 100));
          }
          recorder.stop();

          showToast('Hoàn tất trích xuất Neko');

        if (!ctx) return;
        drawFrameToContext(ctx, canvas.width, canvas.height, coverScrubTime);
        if (coverTitleText) {
          ctx.save();
          ctx.font = `900 ${Math.round(canvas.width * 0.052)}px 'Montserrat', sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = Math.round(canvas.width * 0.01);
          ctx.strokeText(coverTitleText, canvas.width / 2, canvas.height * 0.88);
          ctx.fillStyle = '#ffb703';
          ctx.shadowColor = 'rgba(0,0,0,0.9)';
          ctx.shadowBlur = 12;
          ctx.fillText(coverTitleText, canvas.width / 2, canvas.height * 0.88);
          ctx.restore();
        }
      }, [drawFrameToContext, coverScrubTime, coverTitleText]);

                  const canvas = canvasRef.current;
                  const rect = canvas ? canvas.getBoundingClientRect() : { width: 400, height: 700 };
                  const canvasScaleX = selectedRatio.w / (rect.width || 1);
                  const canvasScaleY = selectedRatio.h / (rect.height || 1);

                  dragStartPosRef.current = {
                    clientX: e.clientX,
                    clientY: e.clientY,
                    scaleX: canvasScaleX,
                    scaleY: canvasScaleY,
                    initPanX: previewPanRef.current.x,
                    initPanY: previewPanRef.current.y,
                    moved: false
                  };
                  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
                }}
                onPointerMove={(e) => {
                  if (!isDraggingPreviewRef.current) return;
                  const rawDx = e.clientX - dragStartPosRef.current.clientX;
                  const rawDy = e.clientY - dragStartPosRef.current.clientY;
                  if (Math.hypot(rawDx, rawDy) > 4) {
                    dragStartPosRef.current.moved = true;
                    const dx = rawDx * (dragStartPosRef.current.scaleX || 1);
                    const dy = rawDy * (dragStartPosRef.current.scaleY || 1);
                    setPreviewPan({
                      x: dragStartPosRef.current.initPanX + dx,
                      y: dragStartPosRef.current.initPanY + dy
                    });
                  }
                }}
                onPointerUp={(e) => {
                  if (isDraggingPreviewRef.current) {
                    isDraggingPreviewRef.current = false;
                    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
                    // Chạm nhẹ không kéo -> Pause/Play tức thì không khựng
                    if (!dragStartPosRef.current.moved) {
                      playNekoSound('click');
                      togglePlay();
                    }
                  }

                    const scaleFactor = dist / touchPinchDistRef.current;
                    setPreviewZoom((prev) => Math.min(4.5, Math.max(0.4, Number((prev * scaleFactor).toFixed(2)))));
                    touchPinchDistRef.current = dist;
                  }

                                onClick={() => {
                                  setActiveSubId(sub.id);
                                  setSelectedTextTemplate(sub.templateId || TEXT_TEMPLATES[0].id);
                                  seekTo(sub.start, true);
                                }}
                                className={`flex items-center justify-between px-3 py-2 rounded-xl border cursor-pointer transition ${
                                  isSelected
                                    ? 'bg-pink-950/60 border-pink-400 text-white'
                                    : 'bg-zinc-900/70 border-white/[0.06] text-zinc-300'
                                }`}
                              >
                                <div className="flex items-center gap-2 min-w-0">
                                  <span>{tmpl.icon}</span>
                                  <div className="flex flex-col min-w-0">
                                    <span className="text-xs font-bold truncate max-w-[170px]">{sub.text}</span>
                                    <span className="text-[9px] text-zinc-400 font-mono">
                                      {sub.start.toFixed(1)}s ➜ {sub.end.toFixed(1)}s ({(sub.end - sub.start).toFixed(1)}s)
                                    </span>
                                  </div>
                                </div>

                                <div className="flex items-center gap-2">
                                  <button
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      setSubtitles(subtitles.filter((s) => s.id !== sub.id));
                                      if (activeSubId === sub.id) setActiveSubId(null);
                                      renderCanvasFrame(currentTimeRef.current);
                                      showToast('Đã xóa đoạn chữ');
                                    }}
                                    className="p-1 px-2 rounded-lg bg-rose-950/70 text-rose-300 hover:text-white border border-rose-800/40 text-[10px] font-bold"
                                  >
                                    Xóa
                                  </button>
                                </div>
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  )}

                  {activeBottomMenu === 'audio' && (
                    <div className="space-y-3">
                      <label className="w-full py-3 px-4 rounded-xl bg-pink-500/20 border border-pink-500/40 text-pink-300 font-bold text-xs flex items-center justify-center gap-2 cursor-pointer">
                        <span>🎵 Trích xuất file nhạc MP3/WAV</span>
                        <input
                          type="file"
                          accept="audio/*"
                          onChange={(e) => {
                            const f = e.target.files?.[0];
                            if (f) {
                              const url = URL.createObjectURL(f);
                              const newAudio = {
                                id: `audio_${Date.now()}`,
                                name: f.name,
                                url,
                                duration: totalDuration
                              };
                              setAudioClips([newAudio]);
                              if (bgmAudioRef.current) {
                                bgmAudioRef.current.src = url;
                                bgmAudioRef.current.play().catch(() => {});
                              }
                              playNekoSound('success');
                              showToast(`🐾 Đã nạp nhạc: ${f.name}`);
                              setShowToolSheet(false);
                            }
                          }}
                          className="hidden"
                        />
                      </label>
                    </div>
                  )}

                  {activeBottomMenu === 'edit' && activeClip && (
                    <div className="space-y-3">
                      <div className="space-y-1.5">
                        <label className="text-[11px] text-zinc-400 font-bold">Tốc độ phát:</label>
                        <div className="grid grid-cols-6 gap-1">
                          {SPEED_OPTIONS.map((spd) => (
                            <button
                              key={spd}
                              onClick={() => {
                                setVideoClips((prev) =>
                                  prev.map((c) => (c.id === activeClip.id ? { ...c, speed: spd } : c))
                                );
                                playNekoSound('click');
                                showToast(`🐾 Tốc độ ${spd}x`);
                              }}
                              className={`py-1.5 rounded text-xs font-mono font-bold ${
                                (activeClip.speed || 1.0) === spd ? 'bg-pink-500 text-white' : 'bg-zinc-800 text-zinc-300'
                              }`}
                            >
                              {spd}x
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Modal Ảnh Bìa */}
              {showCoverModal && (
                <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col justify-between animate-in fade-in duration-200 select-none">
                  <div className="h-12 px-4 flex items-center justify-between border-b border-white/[0.08] bg-[#0c0c12]">
                    <button
                      onClick={() => {
                        setShowCoverModal(false);
                        seekTo(savedEditorTimeRef.current, true);
                      }}
                      className="text-xs text-zinc-400 hover:text-white"
                    >
                      Hủy
                    </button>
                    <span className="text-sm font-bold text-white tracking-wide">
                      Chọn Ảnh Bìa Neko
                    </span>
                    <button
                      onClick={() => {
                        const canvas = coverCanvasRef.current || canvasRef.current;
                        if (canvas) {
                          try {
                            const snapshotUrl = canvas.toDataURL('image/jpeg', 0.85);
                            setCoverImage(snapshotUrl);
                          } catch (e) {
                            console.warn("Cover snapshot error:", e);
                          }
                        }
                        setShowCoverModal(false);
                        seekTo(coverScrubTime, true);
                        playNekoSound('success');
                        showToast('🐾 Đã lưu ảnh bìa Neko!');
                      }}
                      className="px-3.5 py-1 rounded-full bg-[#ff2a7a] text-white font-extrabold text-xs shadow-[0_0_12px_rgba(255,42,122,0.4)]"
                    >
                      Lưu
                    </button>
                  </div>

                  <div className="flex-1 flex flex-col items-center justify-center p-4 relative min-h-0">
                    <div className="relative max-h-full max-w-full rounded-xl overflow-hidden border-2 border-pink-500/80 shadow-[0_0_30px_rgba(255,42,122,0.2)]">
                      <canvas
                        ref={coverCanvasRef}
                        width={selectedRatio.w}
                        height={selectedRatio.h}
                        className="max-h-[calc(100vh-280px)] max-w-full object-contain"
                        style={{ aspectRatio: selectedRatio.ratioCss }}
                      />
                    </div>
                  </div>

                  <div className="p-4 bg-[#0e0e16] border-t border-white/[0.08] space-y-3">
                    <input
                      type="text"
                      value={coverTitleText}
                      onChange={(e) => setCoverTitleText(e.target.value)}
                      placeholder="Nhập tiêu đề ảnh bìa..."
                      className="w-full bg-[#181824] border border-white/[0.1] rounded-lg px-3 py-1.5 text-xs text-white placeholder-zinc-500"
                    />
                    <input
                      type="range"
                      min={0}
                      max={totalDuration}
                      step={0.05}
                      value={coverScrubTime}
                      onChange={(e) => {
                        const val = parseFloat(e.target.value);
                        setCoverScrubTime(val);
                        seekTo(val, true);
                      }}
                      className="w-full h-2 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-[#ff2a7a]"
                    />
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Modal MatrixAuto */}
          {showTemplateModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-[#121019] border-t sm:border border-white/[0.12] w-full max-w-lg rounded-t-3xl sm:rounded-3xl flex flex-col max-h-[88vh] overflow-hidden shadow-2xl">
                
                <div className="p-4 border-b border-zinc-800/80 flex items-center justify-between shrink-0 bg-[#15131d]">
                  <div className="flex items-center gap-2">
                    <CatPawSvg className="w-5 h-5 text-pink-400" />
                    <h3 className="font-extrabold text-sm text-zinc-100">Cấu Hình Mẫu MatrixAuto Neko</h3>
                  </div>
                  <button
                    onClick={() => setShowTemplateModal(false)}
                    className="w-8 h-8 rounded-full bg-zinc-800/80 text-zinc-400 flex items-center justify-center text-xs"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 overflow-y-auto neko-scroll space-y-4 flex-1">
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-zinc-300">Tông màu trận đấu:</label>
                    <div className="space-y-2">
                      {NEKO_STYLES.map((st) => (
                        <div
                          key={st.id}
                          onClick={() => setSelectedStyleId(st.id)}
                          className={`p-3 rounded-xl border text-left cursor-pointer flex items-center justify-between transition ${
                            selectedStyleId === st.id
                              ? 'bg-pink-500/20 border-pink-400 text-pink-300 shadow-[0_0_12px_rgba(255,42,122,0.2)]'
                              : 'bg-zinc-900/60 border-white/[0.06] text-zinc-300'
                          }`}
                        >
                          <div>
                            <div className="text-xs font-bold">{st.name}</div>
                            <div className="text-[10px] text-zinc-400 mt-0.5">{st.desc}</div>
                          </div>
                          {selectedStyleId === st.id && (
                            <span className="text-pink-400 font-bold text-sm shrink-0">✓</span>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  <label className="flex items-center justify-between bg-zinc-900/70 p-3.5 rounded-xl border border-white/[0.06] cursor-pointer">
                    <span className="text-xs text-zinc-200 font-medium">Tự động trích 2s điểm số đưa lên đầu clip</span>
                    <input
                      type="checkbox"
                      checked={autoScoreLoop}
                      onChange={(e) => setAutoScoreLoop(e.target.checked)}
                      className="w-5 h-5 accent-pink-500 rounded cursor-pointer shrink-0"
                    />
                  </label>
                </div>

                <div className="p-4 pt-3 pb-8 sm:pb-4 border-t border-zinc-800/80 bg-[#121019] shrink-0 grid grid-cols-2 gap-3 z-10">
                  <button
                    type="button"
                    onClick={() => applyMatrixTemplate()}
                    className="h-12 rounded-xl bg-zinc-800/90 text-xs font-bold text-zinc-100 border border-white/[0.1] hover:bg-zinc-700 flex items-center justify-center transition shadow-md"
                  >
                    Dùng Video Mẫu Neko
                  </button>

                  <label className="h-12 rounded-xl bg-gradient-to-r from-pink-500 via-rose-500 to-amber-400 text-xs font-black text-black text-center shadow-[0_0_16px_rgba(255,42,122,0.4)] cursor-pointer flex items-center justify-center">
                    <span>Chọn Video Của Bạn</span>
                    <input
                      type="file"
                      accept="video/*"
                      onChange={(e) => {
                        const f = e.target.files?.[0];
                        if (f) applyMatrixTemplate(f);
                      }}
                      className="hidden"
                    />
                  </label>
                </div>
              </div>
            </div>
          )}

          {toastMsg && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-[#161622]/95 border border-pink-500/40 text-pink-200 px-4 py-2 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 backdrop-blur-md whitespace-nowrap">
              <CatPawSvg className="w-4 h-4 text-pink-400" />
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
