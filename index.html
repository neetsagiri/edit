    const playNekoSound = (type = 'click') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === 'split') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1300, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'parry') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.type = 'sine';
          osc2.type = 'triangle';
          osc1.frequency.setValueAtTime(2093, now);
          osc2.frequency.setValueAtTime(2793, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.4);
          osc2.stop(now + 0.4);
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(360, now + 0.05);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      } catch (e) {}
    };

    const drawRoundedRect = (ctx, x, y, width, height, radius) => {
      if (typeof ctx.roundRect === 'function') {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
        return;
      }
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    };

    const getExactVideoDuration = (videoUrl) => {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.preload = 'auto';
        v.src = videoUrl;
        v.onloadedmetadata = () => resolve(v.duration && !isNaN(v.duration) && v.duration !== Infinity ? v.duration : 15);
        v.onerror = () => resolve(15);
        setTimeout(() => resolve(15), 2500);
      });
    };

    function App() {
      const [currentPage, setCurrentPage] = useState('home');

      const [videoClips, setVideoClips] = useState([]);
      const [activeClipId, setActiveClipId] = useState(null);
      const [currentTime, setCurrentTime] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const [selectedRatio, setSelectedRatio] = useState(ASPECT_RATIOS[0]);
      const [fitMode, setFitMode] = useState('fit');

      const [masterVolume, setMasterVolume] = useState(1.0);
      const [audioClips, setAudioClips] = useState([]);
      const [activeAudioClipId, setActiveAudioClipId] = useState(null);
      const [showAddMusicModal, setShowAddMusicModal] = useState(false);
      const [ytLinkInput, setYtLinkInput] = useState('');
      const [isProcessingAudio, setIsProcessingAudio] = useState(false);

      const [subtitles, setSubtitles] = useState([]);
      const [activeSubId, setActiveSubId] = useState(null);
      const [newSubText, setNewSubText] = useState('Highlight Matrix WW');
      const [draggingSubId, setDraggingSubId] = useState(null);

      // Tab điều khiển
      const [activeInspectorTab, setActiveInspectorTab] = useState('clip');
      const [showMobileToolDrawer, setShowMobileToolDrawer] = useState(false);
      const [historyStack, setHistoryStack] = useState([]);
      const [showTemplateModal, setShowTemplateModal] = useState(false);
      const [selectedStyleId, setSelectedStyleId] = useState('crisp');
      const [autoScoreLoop, setAutoScoreLoop] = useState(true);

      const [draggedClipIndex, setDraggedClipIndex] = useState(null);
      const [dragOverIndex, setDragOverIndex] = useState(null);

      const [showScorePickerModal, setShowScorePickerModal] = useState(false);
      const [previewScoreTime, setPreviewScoreTime] = useState(0);
      const [isPickerPlaying, setIsPickerPlaying] = useState(false);

      const [isExporting, setIsExporting] = useState(false);
      const [exportProgress, setExportProgress] = useState(0);

      // Core Refs
      const canvasRef = useRef(null);
      const hiddenVideoRef = useRef(null);
      const bgmAudioRef = useRef(null);
      const pickerVideoRef = useRef(null);
      const trackAreaRef = useRef(null);
      const playheadRef = useRef(null);
      const currentTimeRef = useRef(0);
      const activeClipIdRef = useRef(null);
      const isPlayingRef = useRef(false);
      const isScrubbingRef = useRef(false);
      const animationFrameRef = useRef(null);
      const lastUiUpdateRef = useRef(0);

      const activeClip = useMemo(() => {
        return videoClips.find((c) => c.id === activeClipId) || videoClips[0] || null;
      }, [videoClips, activeClipId]);

      const activeAudioClip = useMemo(() => {
        return audioClips.find((a) => a.id === activeAudioClipId) || audioClips[0] || null;
      }, [audioClips, activeAudioClipId]);

      const activeSub = useMemo(() => {
        return subtitles.find((s) => s.id === activeSubId) || subtitles[0] || null;
      }, [subtitles, activeSubId]);

      const scoreClipObj = useMemo(() => {
        return videoClips.find((c) => c.isScoreClip) || videoClips[0] || null;
      }, [videoClips]);

      const scoreSourceDuration = scoreClipObj?.sourceDuration || 60;
      const minScoreWindow = Math.max(0, scoreSourceDuration - 15);
      const maxScoreWindow = Math.max(minScoreWindow, scoreSourceDuration - 2.0);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      };

      const pushToHistory = useCallback(() => {
        setHistoryStack((prev) => [
          ...prev.slice(-10),
          JSON.parse(JSON.stringify({ videoClips, audioClips, subtitles }))
        ]);
      }, [videoClips, audioClips, subtitles]);

      const handleUndo = () => {
        if (historyStack.length === 0) {
          showToast('Không còn thao tác để hoàn tác');
          return;
        }
        playNekoSound('click');
        const previous = historyStack[historyStack.length - 1];
        setHistoryStack((prev) => prev.slice(0, -1));
        if (previous.videoClips) setVideoClips(previous.videoClips);
        if (previous.audioClips) setAudioClips(previous.audioClips);
        if (previous.subtitles) setSubtitles(previous.subtitles);
        showToast('Đã hoàn tác (Undo)');
      };

      const totalDuration = useMemo(() => {
        return videoClips.reduce((sum, c) => sum + (c.duration / (c.speed || 1.0)), 0);
      }, [videoClips]);

      useEffect(() => {
        activeClipIdRef.current = activeClipId;
      }, [activeClipId]);

      const getCurrentClipInfo = useCallback(
        (time) => {
          let acc = 0;
          for (let i = 0; i < videoClips.length; i++) {
            const c = videoClips[i];
            const spd = c.speed || 1.0;
            const effectiveDur = c.duration / spd;

            if (time >= acc && time < acc + effectiveDur) {
              const timelineOffset = time - acc;
              const sourceOffset = timelineOffset * spd;
              return {
                clip: c,
                clipIndex: i,
                clipStartTime: acc,
                clipOffsetTime: timelineOffset,
                effectiveDuration: effectiveDur,
                mediaSourceTime: c.trimStart + sourceOffset
              };
            }
            acc += effectiveDur;
          }
          if (videoClips.length > 0) {
            const last = videoClips[videoClips.length - 1];
            const spd = last.speed || 1.0;
            const effDur = last.duration / spd;
            const lastStart = Math.max(0, acc - effDur);
            const timelineOffset = Math.min(effDur, Math.max(0, time - lastStart));
            return {
              clip: last,
              clipIndex: videoClips.length - 1,
              clipStartTime: lastStart,
              clipOffsetTime: timelineOffset,
              effectiveDuration: effDur,
              mediaSourceTime: last.trimStart + (timelineOffset * spd)
            };
          }
          return null;
        },
        [videoClips]
      );

      const getCurrentAudioClipInfo = useCallback(
        (time) => {
          let acc = 0;
          for (let i = 0; i < audioClips.length; i++) {
            const a = audioClips[i];
            if (time >= acc && time < acc + a.duration) {
              return {
                audio: a,
                index: i,
                startTime: acc,
                offsetTime: time - acc,
                mediaSourceTime: (a.trimStart || 0) + (time - acc)
              };
            }
            acc += a.duration;
          }
          return null;
        },
        [audioClips]
      );

      const updateRuntimeAudioVolumes = useCallback(() => {
        const vid = hiddenVideoRef.current;
        const bgm = bgmAudioRef.current;
        const curVid = getCurrentClipInfo(currentTimeRef.current);
        const curAud = getCurrentAudioClipInfo(currentTimeRef.current);

        if (vid && curVid) {
          vid.volume = isMuted ? 0 : Math.max(0, Math.min(1.0, (curVid.clip.volume ?? 1.0) * masterVolume));
        }

        if (bgm && curAud) {
          bgm.volume = (isMuted || curAud.audio.isMuted) ? 0 : Math.max(0, Math.min(1.0, (curAud.audio.volume ?? 1.0) * masterVolume));
        }
      }, [getCurrentClipInfo, getCurrentAudioClipInfo, isMuted, masterVolume]);

      useEffect(() => {
        updateRuntimeAudioVolumes();
      }, [masterVolume, isMuted, audioClips, videoClips, updateRuntimeAudioVolumes]);

      const drawFrameToContext = useCallback(
        (ctx, targetW, targetH, time) => {
          const vid = hiddenVideoRef.current;
          const clipInfo = getCurrentClipInfo(time);

          ctx.fillStyle = '#09090b';
          ctx.fillRect(0, 0, targetW, targetH);

          if (clipInfo && vid && vid.readyState >= 2) {
            const { clip, clipOffsetTime } = clipInfo;

            ctx.save();

            if (fitMode === 'blur') {
              ctx.save();
              ctx.filter = 'blur(25px) brightness(0.6)';
              const bScale = Math.max(targetW / vid.videoWidth, targetH / vid.videoHeight);
              const bW = vid.videoWidth * bScale;
              const bH = vid.videoHeight * bScale;
              ctx.drawImage(vid, (targetW - bW) / 2, (targetH - bH) / 2, bW, bH);
              ctx.restore();
            }

            const filterDef = FILTERS.find((f) => f.id === clip.colorFilter) || FILTERS[0];
            let activeCssFilter = filterDef.css !== 'none' ? filterDef.css : '';

            const sFactor = fitMode === 'cover'
              ? Math.max(targetW / vid.videoWidth, targetH / vid.videoHeight)
              : Math.min(targetW / vid.videoWidth, targetH / vid.videoHeight);

            const drawW = vid.videoWidth * sFactor;
            const drawH = vid.videoHeight * sFactor;
            const drawX = (targetW - drawW) / 2;
            const drawY = (targetH - drawH) / 2;

            const animDuration = clip.animInDuration || 0.45;
            const isInAnim = clip.animIn && clip.animIn !== 'none' && clipOffsetTime <= animDuration;

            if (isInAnim) {
              const prog = Math.min(1, Math.max(0, clipOffsetTime / animDuration));
              const easeOut = Math.sin((prog * Math.PI) / 2);

              if (clip.animIn === 'flash') {
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, 0.9 * (1 - prog))})`;
                ctx.fillRect(0, 0, targetW, targetH);
              } else if (clip.animIn === 'black_flash') {
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
                ctx.fillStyle = `rgba(0, 0, 0, ${Math.max(0, 1 - prog)})`;
                ctx.fillRect(0, 0, targetW, targetH);
              } else if (clip.animIn === 'whip') {
                const sc = 1.35 - 0.35 * easeOut;
                ctx.translate(targetW / 2, targetH / 2);
                ctx.scale(sc, sc);
                ctx.translate(-targetW / 2, -targetH / 2);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              } else if (clip.animIn === 'zoom_in') {
                const sc = 0.7 + 0.3 * easeOut;
                ctx.translate(targetW / 2, targetH / 2);
                ctx.scale(sc, sc);
                ctx.translate(-targetW / 2, -targetH / 2);
                ctx.globalAlpha = Math.min(1, prog * 1.3);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              } else if (clip.animIn === 'shake') {
                const amp = (1 - prog) * 16;
                const ox = Math.sin(prog * Math.PI * 10) * amp;
                const oy = Math.cos(prog * Math.PI * 8) * amp * 0.5;
                ctx.translate(ox, oy);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              } else {
                ctx.globalAlpha = Math.min(1, prog);
                ctx.filter = activeCssFilter || 'none';
                ctx.drawImage(vid, drawX, drawY, drawW, drawH);
              }
            } else {
              ctx.filter = activeCssFilter || 'none';
              ctx.drawImage(vid, drawX, drawY, drawW, drawH);
            }

            ctx.restore();

            if (clip.hasVignette) {
              ctx.save();
              const grad = ctx.createRadialGradient(
                targetW / 2, targetH / 2, targetW * 0.25,
                targetW / 2, targetH / 2, targetW * 0.68
              );
              grad.addColorStop(0, 'rgba(0,0,0,0)');
              grad.addColorStop(0.7, 'rgba(0,0,0,0.3)');
              grad.addColorStop(1, 'rgba(0,0,0,0.85)');
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, targetW, targetH);
              ctx.restore();
            }
          }

          // Subtitles rendering
          subtitles.forEach((sub) => {
            if (time >= sub.start && time <= sub.end) {
              ctx.save();
              const maxW = targetW * 0.85;
              const scaleRatio = targetW / 1920;
              let fontSize = Math.max(16, Math.floor((sub.fontSize || 36) * Math.max(0.6, scaleRatio)));
              const fontFam = sub.fontFamily || 'sans-serif';
              ctx.font = `bold ${fontSize}px ${fontFam}`;
              let metrics = ctx.measureText(sub.text);

              if (metrics.width > maxW) {
                fontSize = Math.max(12, Math.floor(fontSize * (maxW / metrics.width)));
                ctx.font = `bold ${fontSize}px ${fontFam}`;
                metrics = ctx.measureText(sub.text);
              }

              ctx.textAlign = 'center';
              const pX = (targetW * (sub.x !== undefined ? sub.x : 50)) / 100;
              const pY = (targetH * (sub.y !== undefined ? sub.y : 82)) / 100;

              if (sub.showBg) {
                const bgAlpha = sub.bgOpacity !== undefined ? sub.bgOpacity : 0.75;
                ctx.fillStyle = sub.id === activeSubId ? `rgba(236, 72, 153, ${bgAlpha})` : `rgba(0, 0, 0, ${bgAlpha})`;
                drawRoundedRect(ctx, pX - metrics.width / 2 - 14, pY - fontSize * 0.85, metrics.width + 28, fontSize * 1.3, 8);
                ctx.fill();
                if (sub.id === activeSubId) {
                  ctx.lineWidth = 2;
                  ctx.strokeStyle = '#fde047';
                  ctx.stroke();
                }
              }

              if (sub.strokeWidth && sub.strokeWidth > 0) {
                ctx.lineWidth = sub.strokeWidth * Math.max(0.6, scaleRatio);
                ctx.strokeStyle = sub.strokeColor || '#000000';
                ctx.strokeText(sub.text, pX, pY);
              }

              ctx.fillStyle = sub.color || '#ffffff';
              ctx.fillText(sub.text, pX, pY);
              ctx.restore();
            }
          });
        },
        [getCurrentClipInfo, subtitles, activeSubId, fitMode]
      );

      const renderCanvasFrame = useCallback(
        (time) => {
          const canvas = canvasRef.current;
          if (!canvas) return;

      const playVideo = () => {

            const curIdx = videoClips.findIndex((c) => c.id === currentClipId);
            const activeIdx = curIdx >= 0 ? curIdx : 0;
            const curClip = videoClips[activeIdx];

            if (vid && curClip) {
              const spd = curClip.speed || 1.0;
              const clipSourceEnd = curClip.trimStart + curClip.duration;
              const curSourceTime = vid.currentTime;

              if (curSourceTime >= clipSourceEnd - 0.04) {
                if (activeIdx < videoClips.length - 1) {

                  activeClipIdRef.current = nextClip.id;
                  setActiveClipId(nextClip.id);

                }

                const elapsedSourceInClip = Math.max(0, curSourceTime - curClip.trimStart);
                const exactTimelineTime = Math.min(totalDuration, clipStartTime + elapsedSourceInClip / spd);

                currentTimeRef.current = exactTimelineTime;

                if (playheadRef.current && totalDuration > 0) {

                if (now - lastUiUpdateRef.current > 35) {
                  setCurrentTime(exactTimelineTime);

                const audInfo = getCurrentAudioClipInfo(exactTimelineTime);
                if (audInfo && bgm) {
                  if (bgm.src !== audInfo.audio.url) bgm.src = audInfo.audio.url;
                  if (Math.abs(bgm.currentTime - audInfo.mediaSourceTime) > 0.18) {

                }

                renderCanvasFrame(exactTimelineTime);
              }
            } else {
              pauseVideo();
            }
          }
          animationFrameRef.current = requestAnimationFrame(loop);
        };

        animationFrameRef.current = requestAnimationFrame(loop);
        return () => {

      const seekToAndStop = useCallback((targetTime) => {

                exportBgmNode.gain.value = audioClips[0]?.volume ?? 1.0;
                bgmSource.connect(exportBgmNode);
                exportBgmNode.connect(masterGain);
                exportBgmEl.play().catch(() => {});
              }

              dest.stream.getAudioTracks().forEach((track) => stream.addTrack(track));
            }
          } catch (e) {}

          const mimeType = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')
            ? 'video/mp4;codecs=avc1'
            : MediaRecorder.isTypeSupported('video/mp4')
            ? 'video/mp4'
            : 'video/webm';

          const recorder = new MediaRecorder(stream, {
            mimeType,
            videoBitsPerSecond: 16000000
          });

          const chunks = [];
          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };

          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `NekoCut_${Date.now()}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
            setIsExporting(false);
            showToast('Xuất video thành công!');

            if (exportVidEl) exportVidEl.pause();
            if (exportBgmEl) exportBgmEl.pause();
            if (audioCtx) audioCtx.close();
            seekToAndStop(0);
          };

          recorder.start();

          const fps = 30;
          const totalSteps = Math.max(30, Math.round(totalDuration * fps));
          for (let i = 0; i <= totalSteps; i++) {
            const targetT = (i / totalSteps) * totalDuration;
            const info = getCurrentClipInfo(targetT);
            const audInfo = getCurrentAudioClipInfo(targetT);

            if (info) {
              if (vid.src !== info.clip.url) vid.src = info.clip.url;
              vid.currentTime = info.mediaSourceTime;

              if (exportVidEl) {
                if (exportVidEl.src !== info.clip.url) exportVidEl.src = info.clip.url;
                exportVidEl.currentTime = info.mediaSourceTime;
              }

              if (exportVidNode) exportVidNode.gain.value = info.clip.volume ?? 1.0;
              if (exportBgmEl && audInfo) {
                if (exportBgmEl.src !== audInfo.audio.url) exportBgmEl.src = audInfo.audio.url;
                exportBgmEl.currentTime = audInfo.mediaSourceTime;
              }

              await new Promise((res) => {
                const onSeek = () => {
                  drawFrameToContext(exportCtx, exportCanvas.width, exportCanvas.height, targetT);
                  vid.removeEventListener('seeked', onSeek);
                  res();
                };
                vid.addEventListener('seeked', onSeek);
                setTimeout(onSeek, 35);
              });
            }
            setExportProgress(Math.round((i / totalSteps) * 100));
          }

          recorder.stop();
        } catch (err) {
          setIsExporting(false);
          showToast('Có lỗi xảy ra khi xuất video');

                      <button
                        key={filt.id}
                        onClick={() => {
                          pushToHistory();
                          setVideoClips((prev) => prev.map((c) => (c.id === activeClip.id ? { ...c, colorFilter: filt.id } : c)));
                          renderCanvasFrame(currentTimeRef.current);
                        }}
                        className={`p-2.5 rounded-lg border text-left w-full flex items-center justify-between text-xs ${
                          activeClip.colorFilter === filt.id ? 'bg-pink-500/20 border-pink-400 text-pink-300 font-bold' : 'bg-zinc-800/60 border-white/[0.04] text-zinc-300'
                        }`}
                      >
                        <span>{filt.name}</span>
                        <span className="text-[9px] px-1.5 py-0.5 rounded bg-zinc-850 text-zinc-400">{filt.tag}</span>
                      </button>
                    ))}
                  </div>
                )}

                {/* Tab: Chữ */}
                {activeInspectorTab === 'text' && (
                  <div className="space-y-3 bg-zinc-900/60 p-3 rounded-xl border border-white/[0.06]">
                    <div className="space-y-1">
                      <input
                        type="text"
                        value={newSubText}
                        onChange={(e) => setNewSubText(e.target.value)}
                        className="w-full bg-zinc-950 border border-white/[0.08] rounded-lg px-2.5 py-1.5 text-xs text-white"
                        placeholder="Nội dung chữ..."
                      />
                      <button
                        onClick={() => {
                          const newSub = {
                            id: `sub_${Date.now()}`,
                            text: newSubText || 'Highlight WW',
                            start: currentTimeRef.current,
                            end: Math.min(totalDuration, currentTimeRef.current + 2.5),
                            fontFamily: "'Orbitron', sans-serif",
                            fontSize: 34,
                            color: '#fef08a',
                            strokeColor: '#000000',
                            strokeWidth: 3,
                            x: 50,
                            y: 80,
                            showBg: true,
                            bgOpacity: 0.75
                          };
                          setSubtitles((prev) => [...prev, newSub]);
                          setActiveSubId(newSub.id);
                          renderCanvasFrame(currentTimeRef.current);
                          showToast('Đã thêm chữ!');
                        }}
                        className="w-full py-2 bg-gradient-to-r from-pink-500 to-amber-400 text-zinc-950 font-black rounded-lg text-xs"
                      >
                        + Thêm Chữ Tại {currentTime.toFixed(1)}s
                      </button>
                    </div>

                    {activeSub && (
                      <div className="space-y-2 bg-zinc-950/70 p-2.5 rounded-lg border border-amber-500/20">
                        <select
                          value={activeSub.fontFamily || 'sans-serif'}
                          onChange={(e) => {
                            const f = e.target.value;
                            setSubtitles((prev) => prev.map((s) => (s.id === activeSub.id ? { ...s, fontFamily: f } : s)));
                            renderCanvasFrame(currentTimeRef.current);
                          }}
                          className="w-full bg-zinc-900 border border-white/[0.08] rounded p-1 text-xs text-white"
                        >
                          {FONTS.map((f) => (<option key={f.id} value={f.family}>{f.name}</option>))}
                        </select>
                      </div>
                    )}
                  </div>
                )}

                {/* Tab: Tỉ Lệ */}
                {activeInspectorTab === 'ratio' && (
                  <div className="space-y-3 bg-zinc-900/60 p-3 rounded-xl border border-white/[0.06]">
                    <div className="grid grid-cols-2 gap-2">
                      {ASPECT_RATIOS.map((r) => (
                        <button
                          key={r.id}
                          onClick={() => {
                            setSelectedRatio(r);
                            renderCanvasFrame(currentTimeRef.current);
                          }}
                          className={`p-2 rounded-lg border text-center text-xs font-bold ${
                            selectedRatio.id === r.id ? 'bg-pink-500/20 border-pink-400 text-pink-300' : 'bg-zinc-800/60 border-white/[0.04] text-zinc-400'
                          }`}
                        >
                          {r.label}
                        </button>
                      ))}
                    </div>

                    <div className="grid grid-cols-3 gap-1.5 pt-1">
                      {[{ id: 'fit', label: 'Vừa Khung' }, { id: 'cover', label: 'Tràn Viền' }, { id: 'blur', label: 'Nền Mờ' }].map((m) => (
                        <button
                          key={m.id}
                          onClick={() => {
                            setFitMode(m.id);
                            renderCanvasFrame(currentTimeRef.current);
                          }}
                          className={`py-1.5 rounded-lg border text-[10px] font-bold ${
                            fitMode === m.id ? 'bg-amber-500/20 border-amber-400 text-amber-300' : 'bg-zinc-800/50 border-white/[0.04] text-zinc-400'
                          }`}
                        >
                          {m.label}
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </aside>
          </div>

          {/* 3. DẢI TIMELINE DƯỚI CÙNG (CHIỀU CAO THU GỌN VỪA TẦM TAY TRÊN MOBILE) */}
          <footer className="h-44 sm:h-52 border-t border-white/[0.08] bg-[#09090d] flex flex-col shrink-0 p-2 sm:p-3 space-y-1.5 select-none relative z-10">
            <div className="flex items-center justify-between text-[11px] text-zinc-400 px-1">
              <span className="font-bold flex items-center gap-1 text-zinc-300">
                <CatPawSvg className="w-3 h-3 text-pink-400" />
                <span>Timeline</span>
              </span>
              <span className="font-mono text-pink-400 font-bold text-xs">{currentTime.toFixed(2)}s</span>
            </div>

            {/* TRACK VIDEO CHÍNH */}
            <div
              ref={trackAreaRef}
              onPointerDown={handleTimelinePointerDown}
              onPointerMove={handleTimelinePointerMove}
              onPointerUp={handleTimelinePointerUp}
              className="relative h-12 bg-zinc-950 rounded-xl border border-white/[0.08] p-1 flex items-center gap-1 cursor-pointer overflow-hidden shadow-inner touch-none"
            >
              {videoClips.map((clip, index) => {
                const effDur = clip.duration / (clip.speed || 1.0);
                const widthPercent = totalDuration > 0 ? (effDur / totalDuration) * 100 : 100;
                const isCurrent = activeClipId === clip.id;

                return (
                  <div
                    key={clip.id}
                    data-interactive="true"
                    onClick={(e) => {
                      e.stopPropagation();
                      handleClipBarClick(clip);
                    }}
                    style={{ width: `${Math.max(10, widthPercent)}%` }}
                    className={`h-full rounded-lg px-2 py-1 flex flex-col justify-between transition-all select-none text-left border ${
                      isCurrent
                        ? 'bg-gradient-to-r from-pink-500/30 to-amber-500/20 border-pink-400 text-white'
                        : 'bg-zinc-900/80 border-white/[0.06] text-zinc-300'
                    }`}
                  >
                    <div className="flex items-center justify-between w-full">
                      <span className="text-[10px] font-bold truncate">{clip.name}</span>
                      <span className="text-[9px] font-mono text-zinc-400">{effDur.toFixed(1)}s</span>
                    </div>
                    <div className="text-[8px] font-mono text-amber-400">
                      {clip.isScoreClip ? '⭐ 2s Điểm' : `${clip.speed || 1}x`}
                    </div>
                  </div>
                );
              })}

              {/* Kim phát */}
              {totalDuration > 0 && (
                <div
                  ref={playheadRef}
                  style={{ left: `${(currentTime / totalDuration) * 100}%`, transform: 'translateX(-50%)' }}
                  className="absolute top-0 bottom-0 w-0.5 bg-gradient-to-b from-pink-400 to-amber-300 pointer-events-none z-30"
                >
                  <div className="absolute -top-1 -left-1 w-2.5 h-2.5 rounded-full bg-pink-500 border border-white shadow"></div>
                </div>
              )}
            </div>

            {/* TRACK CHỮ (SUBTITLES) */}
            <div className="relative h-6 bg-zinc-950/80 rounded-lg border border-dashed border-amber-500/30 overflow-hidden flex items-center px-1">
              {subtitles.length === 0 ? (
                <span className="text-[9px] text-zinc-600 pl-1">Chưa có chữ</span>
              ) : (
                subtitles.map((sub) => {
                  const leftPercent = totalDuration > 0 ? (sub.start / totalDuration) * 100 : 0;
                  const widthPercent = totalDuration > 0 ? ((sub.end - sub.start) / totalDuration) * 100 : 10;
                  const isCurrent = activeSubId === sub.id;

                  return (
                    <div
                      key={sub.id}
                      data-interactive="true"
                      onClick={(e) => {
                        e.stopPropagation();
                        setActiveSubId(sub.id);
                        seekToAndStop(sub.start);
                      }}
                      style={{ left: `${Math.max(0, leftPercent)}%`, width: `${Math.max(6, widthPercent)}%` }}
                      className={`absolute top-0.5 bottom-0.5 rounded px-1 flex items-center justify-between text-[9px] font-bold border ${
                        isCurrent ? 'bg-amber-400 text-zinc-950 border-white' : 'bg-amber-500/30 text-amber-300 border-amber-500/50'
                      }`}
                    >
                      <span className="truncate">{sub.text}</span>
                    </div>
                  );
                })
              )}
            </div>

            {/* TRACK BGM AUDIO */}
            <div className="h-7 bg-zinc-950/80 rounded-lg border border-pink-500/20 px-2 flex items-center justify-between overflow-hidden">
              {audioClips.length === 0 ? (
                <div onClick={() => setShowAddMusicModal(true)} className="flex items-center justify-between w-full text-[10px] text-zinc-500 cursor-pointer">
                  <span>🎵 Thêm nhạc nền BGM</span>
                  <span className="text-pink-400 font-bold">+ Thêm</span>
                </div>
              ) : (
                audioClips.map((aud) => (
                  <div key={aud.id} className="h-full rounded px-2 flex items-center gap-1 bg-pink-500/20 border border-pink-400 text-pink-200 text-[10px] truncate">
                    <span>🎵</span>
                    <span className="truncate">{aud.name}</span>
                  </div>
                ))
              )}
            </div>
          </footer>

          {/* MODAL CHỌN ĐIỂM SỐ */}
          {showScorePickerModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-[#110f17] border-t sm:border border-white/[0.12] w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 space-y-3 shadow-2xl">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                  <h3 className="font-bold text-xs text-zinc-100">🎯 Chọn 2s Điểm Số Cuối</h3>
                  <button onClick={() => setShowScorePickerModal(false)} className="w-6 h-6 rounded-full bg-zinc-800 text-zinc-400">✕</button>
                </div>

                <div className="w-full aspect-video bg-black rounded-xl overflow-hidden relative">
                  <video
                    ref={pickerVideoRef}
                    src={scoreClipObj?.url}
                    preload="auto"
                    muted
                    playsInline
                    className="w-full h-full object-contain"
                  />
                  <button
                    type="button"
                    onClick={() => {
                      const v = pickerVideoRef.current;
                      if (!v) return;
                      if (isPickerPlaying) {
                        v.pause();
                        v.currentTime = previewScoreTime;
                        setIsPickerPlaying(false);
                      } else {
                        v.currentTime = previewScoreTime;
                        v.play().then(() => setIsPickerPlaying(true)).catch(() => {});
                      }
                    }}
                    className="absolute bottom-2 right-2 px-2.5 py-1 rounded-lg bg-zinc-900/90 text-white text-[10px] font-bold"
                  >
                    {isPickerPlaying ? '⏸ Dừng' : '▶ Xem Thử 2s'}
                  </button>
                </div>

                <input
                  type="range"
                  min={minScoreWindow}
                  max={maxScoreWindow}
                  step={0.05}
                  value={previewScoreTime}
                  onChange={(e) => {
                    const val = parseFloat(e.target.value);
                    setPreviewScoreTime(val);
                    const v = pickerVideoRef.current;
                    if (v) {
                      if (isPickerPlaying) {
                        v.pause();
                        setIsPickerPlaying(false);
                      }
                      v.currentTime = val;
                    }
                  }}
                  className="w-full accent-amber-400 h-1.5 bg-zinc-800 rounded"
                />

                <button
                  type="button"
                  onClick={() => applySelectedScoreTime(previewScoreTime)}
                  className="w-full py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-amber-400 text-zinc-950 font-black text-xs"
                >
                  Xác Nhận Lấy 2 Giây Này
                </button>
              </div>
            </div>
          )}

          {/* MODAL THÊM NHẠC */}
          {showAddMusicModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-[#110f17] border-t sm:border border-white/[0.12] w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 space-y-3 shadow-2xl">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                  <h3 className="font-bold text-xs text-zinc-100 flex items-center gap-1.5">
                    <MusicIcon className="w-3.5 h-3.5 text-pink-400" />
                    <span>Thêm Âm Nhạc BGM</span>
                  </h3>
                  <button onClick={() => setShowAddMusicModal(false)} className="w-6 h-6 rounded-full bg-zinc-800 text-zinc-400">✕</button>
                </div>

                <label className="w-full py-3 rounded-xl bg-zinc-800 text-zinc-200 text-xs font-bold flex items-center justify-center cursor-pointer">
                  <span>Chọn tệp MP3, WAV từ máy</span>
                  <input
                    type="file"
                    accept="audio/*,video/*"
                    onChange={(e) => {
                      const file = e.target.files?.[0];
                      if (file) handleAddMusicFromFile(file);
                    }}
                    className="hidden"
                  />
                </label>
              </div>
            </div>
          )}

          {/* POPUP TIẾN TRÌNH XUẤT VIDEO */}
          {isExporting && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#110f17] border border-white/[0.12] w-64 rounded-3xl p-5 flex flex-col items-center justify-center space-y-3 shadow-2xl">
                <CatPawSvg className="w-10 h-10 text-pink-400 animate-bounce" />
                <div className="text-xs font-bold text-zinc-100">Đang xuất video...</div>
                <div className="w-full bg-zinc-800 h-2 rounded-full overflow-hidden">
                  <div style={{ width: `${exportProgress}%` }} className="h-full bg-gradient-to-r from-pink-500 to-amber-400" />
                </div>
                <span className="text-xs font-mono font-bold text-pink-400">{exportProgress}%</span>
              </div>
            </div>
          )}

          {/* THÔNG BÁO TOAST */}
          {toastMsg && (
            <div className="fixed bottom-20 sm:bottom-6 right-1/2 translate-x-1/2 sm:translate-x-0 sm:right-6 z-50 bg-zinc-950/95 border border-pink-500/40 text-pink-200 px-3.5 py-1.5 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-1.5 backdrop-blur-md whitespace-nowrap">
              <CatPawSvg className="w-3.5 h-3.5 text-pink-400" />
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Đăng ký Service Worker cho PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('PWA Service Worker ready:', reg.scope))
          .catch((err) => console.warn('PWA Service Worker error:', err));
      });
    }
  </script>
</body>
</html>
